name: CI

# Chaque arbre n'est validé qu'une fois : les jobs tournent sur les PR vers develop et sur les push de
# develop et de main. Une PR develop → main n'ouvre aucun run ici — elle porte l'arbre que la CI de develop
# vient de valider, et la promotion vérifie que la branche n'a pas bougé depuis. Le flux de branches est
# gardé par gardien.yml.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # lecture seule : la CI ne publie rien

env:
  NODE_VERSION: "22"
  # Nombre de lots de tests du backend. Doit valoir la longueur de « strategy.matrix.lot » ci-dessous :
  # un workflow ne peut pas construire sa matrice depuis env, et le job de couverture, qui tourne
  # ailleurs, n'a pas acces a « strategy.job-total ». L'accord des trois est verifie par
  # test_lots_de_tests.py, pour qu'un ecart ne puisse pas laisser un lot entier hors de la mesure.
  LOTS: "3"
  # versions épinglées, identiques à docker/Dockerfile
  FRAPPE_REF: v15.123.1
  PAYMENTS_REF: 9885a6e500104f1f160add47d55b370773e67a81
  LMS_REF: aa8b53b0a7e940871cdb006962a212daccb52a09

jobs:
  # ==========================================================================
  # Frontend (écrans d'évaluation) — lint, types, tests et couverture, build
  # ==========================================================================
  frontend:
    name: Frontend — lint, type, tests, build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/openlab_academy/frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/openlab_academy/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Type check (vue-tsc)
        run: npm run typecheck

      # seuils : 100 % sur domaine, application et infrastructure, 90 % sur l'interface (vite.config.ts)
      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: espace
          path: apps/openlab_academy/openlab_academy/public/espace
          retention-days: 7

  # ==========================================================================
  # Backend (app Frappe) — tests sur un site réel, couverture ≥ 99 %
  # ==========================================================================
  backend:
    name: Backend — tests Frappe (lot ${{ matrix.lot }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # un lot tient en une trentaine de minutes ; au-dela, c'est une derive a regarder, pas a absorber
    timeout-minutes: 50

    strategy:
      # un lot rouge ne doit pas annuler l'autre : on veut les deux verdicts du meme coup
      fail-fast: false
      matrix:
        lot: [1, 2, 3]

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis-cache:
        image: redis:7.4-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7.4-alpine
        ports: ["11000:6379"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # les schémas livrés doivent être ceux que le script rend : une figure corrigée dans le code et
      # oubliée dans le dépôt se verrait sinon seulement à la relecture de la leçon
      - name: Schémas SVG à jour
        run: python docs/Ressources/construire_schemas.py --verifier

      # même règle pour les archives du fil rouge : l'archive livrée doit être celle que le
      # script rend à partir du parcours, sinon un carnet servirait du code déjà corrigé
      - name: Archives du fil rouge à jour
        run: |
          pip install --quiet pyyaml
          python docs/Ressources/construire_notebooks.py --verifier

      # les labs de cybersécurité : l'archive doit être celle que le script rend, et surtout les tests
      # livrés doivent être rouges sur le squelette et verts sur le corrigé — un lab dont les tests
      # passent déjà ne demande rien, un lab dont le corrigé échoue ne peut pas se rendre
      - name: Labs de cybersécurité à jour et éprouvés
        run: |
          pip install --quiet pytest
          python docs/Ressources/construire_labs.py --verifier --eprouver

      # les deux dernières archives que personne ne vérifiait. Elles avaient dérivé en silence : le socle
      # livrait encore l'ancienne progression, et quatre dépôts Python livraient les mots de passe en dur
      # retirés de leur source. Rien ne l'a signalé pendant des semaines, parce que rien ne les relisait.
      - name: Socle et dépôts Python à jour
        run: |
          python docs/Ressources/construire_archive_socle.py --verifier
          python docs/Ressources/construire_depots_python.py --verifier

      # le découpage de la suite décide de ce qui est exercé : un module laissé hors des lots rend la
      # chaîne verte sur du code que plus personne n'exécute. Ses tests passent donc avant les siens.
      - name: Répartiteur des lots de tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }} # LMS exige Node >= 22

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          pip install -q frappe-bench

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Init bench (Frappe, payments, LMS)
        working-directory: /home/runner
        run: |
          bench init --frappe-branch "$FRAPPE_REF" --skip-redis-config-generation --skip-assets \
            --python "$(which python)" frappe-bench
          cd frappe-bench
          bench get-app --skip-assets payments --branch version-15
          (cd apps/payments && git fetch --depth 1 upstream "$PAYMENTS_REF" && git checkout -q -f "$PAYMENTS_REF")
          bench get-app --skip-assets lms --branch main
          (cd apps/lms && git fetch --depth 1 upstream "$LMS_REF" && git checkout -q -f "$LMS_REF")
          # get-app installe les dépendances de la branche, pas celles du commit figé : on les réinstalle
          ./env/bin/pip install -q -e apps/payments -e apps/lms

      - name: Install openlab_academy and create test site
        working-directory: /home/runner/frappe-bench
        run: |
          cp -r "$GITHUB_WORKSPACE/apps/openlab_academy" apps/openlab_academy
          rm -rf apps/openlab_academy/frontend
          ./env/bin/pip install -q -e apps/openlab_academy
          printf "frappe\npayments\nlms\nopenlab_academy" > sites/apps.txt
          bench new-site test_site --db-root-password root --admin-password admin \
            --mariadb-user-host-login-scope='%'
          for app in payments lms openlab_academy; do bench --site test_site install-app "$app"; done
          bench --site test_site set-config allow_tests true
          # assets non compilés (--skip-assets) : sans manifeste, Frappe échoue en mettant en forme le HTML des
          # e-mails (bundled_asset sur un manifeste absent) ; un manifeste vide suffit, le CSS absent est ignoré
          mkdir -p sites/assets && [ -f sites/assets/assets.json ] || echo '{}' > sites/assets/assets.json

      # même commande que docker/dev-test.sh, mais module par module : run-tests ne prend qu'un module
      # à la fois, et c'est le seul découpage que frappe offre. Le surcoût est d'environ six secondes
      # d'amorçage par module, soit quatre minutes sur le lot : le prix de la certitude, car ce chemin
      # est celui qu'utilise déjà le script local.
      - name: Tests du lot ${{ matrix.lot }} avec couverture
        working-directory: /home/runner/frappe-bench/sites
        env:
          TESTS: ${{ github.workspace }}/apps/openlab_academy/openlab_academy/tests
          REPARTITEUR: ${{ github.workspace }}/.github/scripts/lots_de_tests.py
        run: |
          ../env/bin/pip install -q coverage
          modules=$(python "$REPARTITEUR" "$TESTS" --lot ${{ matrix.lot }} --sur "$LOTS")
          attendus=$(python "$REPARTITEUR" "$TESTS" --lot ${{ matrix.lot }} --sur "$LOTS" --compter)
          echo "lot ${{ matrix.lot }} : $(echo "$modules" | wc -l) modules, $attendus tests attendus"
          status=0
          executes=0
          # jeton de neutralisation : la sortie d'un test ne doit pas pouvoir se faire lire comme une
          # commande de workflow quand son journal est verse plus bas
          jeton="journal-$(date +%s%N)"
          for module in $modules; do
            if ../env/bin/coverage run -a --branch --source=../apps/openlab_academy/openlab_academy \
                 --omit='*/tests/*,*/hooks.py' -m frappe.utils.bench_helper frappe --site test_site \
                 run-tests --skip-before-tests --module "$module" > "/tmp/$module.log" 2>&1; then
              code=0
            else
              code=$?
              status=$code
            fi
            # « || true » tient meme si pipefail est actif : un module en erreur n'imprime aucun
            # compteur, et c'est precisement la que le diagnostic ci-dessous est le plus utile
            n=$(grep -oE '^Ran [0-9]+ test' "/tmp/$module.log" | grep -oE '[0-9]+' | head -1 || true)
            executes=$(( executes + ${n:-0} ))
            # un module qui n'exécute rien est le pire défaut d'une suite découpée : il passe pour vert
            if [ "${n:-0}" -eq 0 ]; then
              echo "::error::$module n'a exécuté aucun test"
              status=1
            fi
            grep -E '^(FAIL|ERROR):|^FAILED|^Ran ' "/tmp/$module.log" | sed "s|^|[$module] |" || true
            # un module fautif verse son journal : sans la trace, diagnostiquer coute une execution de plus
            if [ "$code" -ne 0 ] || [ "${n:-0}" -eq 0 ]; then
              echo "::group::journal de $module"
              echo "::stop-commands::$jeton"
              tail -120 "/tmp/$module.log"
              echo "::$jeton::"
              echo "::endgroup::"
            fi
          done
          echo "tests exécutés : $executes, attendus : $attendus"
          if [ "$executes" -lt "$attendus" ]; then
            echo "::error::$(( attendus - executes )) test(s) du lot n'ont pas été exécutés"
            status=1
          fi
          exit $status

      # la barrière de couverture porte sur les lots réunis : seule, la couverture d'un lot est
      # forcément sous le seuil, puisqu'il n'exerce qu'une fraction du code
      # « always » : la mesure d'un lot rouge est valable, et le cumul doit pouvoir conclure. Sans cela,
      # GitHub saute cette etape des qu'un test echoue, et le job de couverture ne recoit qu'une mesure.
      - name: Garder la couverture du lot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: couverture-lot-${{ matrix.lot }}
          path: /home/runner/frappe-bench/sites/.coverage
          include-hidden-files: true # « .coverage » commence par un point
          retention-days: 1
          if-no-files-found: error

  # ==========================================================================
  # Couverture cumulée des lots — la barrière des 99 % s'applique ici
  # ==========================================================================
  couverture:
    name: Backend — couverture cumulée ≥ 99 %
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: backend
    # les lots peuvent être rouges : on veut quand même savoir où en est la couverture
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          pattern: couverture-lot-*
          path: /tmp/couverture

      # les lots ont mesuré l'app installée dans le banc : coverage a retenu ces chemins absolus. On les
      # recrée, sinon le rapport ne retrouve pas les sources et ne peut plus dire quelles lignes manquent.
      - name: Cumuler et appliquer la barrière
        run: |
          pip install -q coverage
          mkdir -p /home/runner/frappe-bench/apps /home/runner/frappe-bench/sites
          cp -r "$GITHUB_WORKSPACE/apps/openlab_academy" /home/runner/frappe-bench/apps/openlab_academy
          cd /home/runner/frappe-bench/sites
          lots=0
          for fichier in /tmp/couverture/couverture-lot-*/.coverage; do
            lots=$(( lots + 1 ))
            cp "$fichier" ".coverage.lot$lots"
          done
          if [ "$lots" -ne "$LOTS" ]; then
            echo "::error::$lots fichier(s) de couverture au lieu de $LOTS : un lot n'a rien rendu"
            exit 1
          fi
          coverage combine
          coverage report -m --skip-covered --omit='*/tests/*,*/hooks.py' --fail-under=99

  # ==========================================================================
  # Sécurité — analyse statique, secrets, dépendances du front
  # ==========================================================================
  securite:
    name: Sécurité — SAST, secrets, dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks a besoin de l'historique

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install -q semgrep

      # SAST : règles publiques Python/JS plus la recherche de secrets ; seules les erreurs bloquent
      - name: Semgrep (SAST)
        run: |
          semgrep scan --error --severity=ERROR --metrics=off             --config=p/python --config=p/javascript --config=p/secrets             --exclude='apps/openlab_academy/openlab_academy/public/espace'             --exclude='**/node_modules/**' .

      # secrets : aucun identifiant ne doit entrer dans l'historique (credentials-local.md et .env* sont ignorés)
      # version figée : une règle ajoutée en amont ne doit pas faire échouer une PR sans changement de code
      - name: Gitleaks (secrets dans l'historique)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1             detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --exit-code 1

      # le backend n'a aucune dépendance Python propre (pyproject : dependencies = []) : seul le front en a
      # un avis de sévérité haute sans correctif publié en amont est toléré s'il est inscrit,
      # justifié et daté dans exceptions-audit.json ; tout le reste fait échouer la chaîne
      - name: npm audit (dépendances de production du front)
        run: python .github/scripts/audit_front.py apps/openlab_academy/frontend
