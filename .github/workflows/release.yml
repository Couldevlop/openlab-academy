# Après une fusion dans main : étiqueter la version livrée, puis ramener main dans develop.
#
# `workflow_call` est le chemin normal : la promotion fusionne avec GITHUB_TOKEN, et un push effectué avec ce
# jeton ne déclenche aucun workflow — garde-fou anti-récursion de GitHub. La promotion appelle donc ce
# workflow directement. Le déclencheur `push` ne sert qu'aux fusions faites à la main.
name: Release

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # étiquette, release et réalignement de develop ; aucune PR n'est ouverte ici

jobs:
  etiqueter:
    name: Étiqueter la version et publier la release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # appelé depuis la promotion, le commit par défaut serait celui de develop
          fetch-depth: 0

      # version lue dans l'app : la source de vérité reste le code, pas un numéro saisi à la main
      - name: Déterminer la version
        id: version
        run: |
          version=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' \
            apps/openlab_academy/openlab_academy/__init__.py | head -1)
          if [ -z "$version" ]; then
            echo "::error::Version absente de openlab_academy/__init__.py (__version__)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version : $version"

      - name: Étiqueter si la version est nouvelle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # L'étiquette va sur le commit d'où la version vient d'être lue, et non sur $GITHUB_SHA.
          # Appelé par la promotion (`workflow_call` depuis un `workflow_run`), le contexte github est
          # celui de l'appelant : $GITHUB_SHA y vaut la tête de main *avant* la fusion, tandis que le
          # `checkout ref: main` ci-dessus rapporte la tête d'après. Les étiquettes v0.1.1 et v0.2.0
          # désignent ainsi un arbre qui porte le numéro précédent.
          cible=$(git rev-parse HEAD)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION existe déjà : rien à publier. Incrémentez __version__ pour une livraison."
            exit 0
          fi
          gh release create "v$VERSION" --target "$cible" --title "v$VERSION" --generate-notes

  realigner:
    name: Ramener main dans develop
    runs-on: ubuntu-24.04
    needs: etiqueter
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # appelé depuis la promotion, le commit par défaut serait celui de develop
          fetch-depth: 0

      # main porte les commits de fusion : sans ce retour, develop divergerait livraison après livraison.
      # La promotion vient de fusionner develop dans main : main descend donc de develop, et le retour est
      # une avance rapide — aucun contenu n'est réécrit, aucune PR n'est nécessaire. Un push fait avec
      # GITHUB_TOKEN ne déclenche aucun workflow : develop ne rejoue pas la CI sur un arbre déjà validé.
      - name: Ramener main dans develop en avance rapide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout ne configure le refspec que de la branche extraite : viser la reference explicitement
          git fetch --quiet origin +refs/heads/develop:refs/remotes/origin/develop
          if [ -z "$(git log --oneline origin/develop..HEAD)" ]; then
            echo "develop contient déjà main : aucun réalignement nécessaire."
            exit 0
          fi
          if [ -n "$(git log --oneline HEAD..origin/develop)" ]; then
            echo "::warning::develop a avancé depuis la promotion : réalignement laissé à la prochaine livraison."
            exit 0
          fi
          git push origin "HEAD:refs/heads/develop"
          echo "develop réalignée sur main ($(git rev-parse HEAD))."
