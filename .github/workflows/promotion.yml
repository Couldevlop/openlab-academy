# Promotion de develop vers main.
#
# L'auto-merge de GitHub n'est pas disponible ici : il exige des contrôles requis, donc une protection de
# branche, refusée aux dépôts privés en plan gratuit (voir docs/flux-git.md). La promotion est donc déclenchée
# par la *réussite* de la CI sur develop : le commit promu est exactement celui que la CI vient de valider.
#
# Rappel : un workflow `workflow_run` n'est pris en compte que dans sa version présente sur la branche par
# défaut (main). La première promotion doit donc être lancée à la main (`workflow_dispatch`).
name: Promotion vers main

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: promotion
  cancel-in-progress: false # ne jamais interrompre une promotion en cours

permissions:
  contents: write
  pull-requests: write

jobs:
  promouvoir:
    name: Promouvoir develop dans main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # une CI en échec, ou annulée, ne promeut rien
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Vérifier que la CI a validé ce commit de develop
        env:
          VALIDE: ${{ github.event.workflow_run.head_sha }}
        run: |
          tete=$(git rev-parse HEAD)
          if [ -n "$VALIDE" ] && [ "$VALIDE" != "$tete" ]; then
            echo "::notice::develop a avancé depuis la CI validée ($VALIDE) ; la promotion attendra sa propre CI."
            exit 1
          fi
          echo "Commit promu : $tete"

      - name: Y a-t-il quelque chose à promouvoir ?
        id: ecart
        run: |
          # checkout ne configure le refspec que de la branche extraite : viser la reference explicitement
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
            echo "promouvoir=false" >> "$GITHUB_OUTPUT"
            echo "main est déjà à jour : rien à promouvoir."
          else
            echo "promouvoir=true" >> "$GITHUB_OUTPUT"
            git log --reverse --pretty='- %s (%h)' origin/main..HEAD > /tmp/journal.md
          fi

      - name: Ouvrir la PR puis fusionner
        if: steps.ecart.outputs.promouvoir == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          corps=$(printf 'Promotion automatique de `develop` vers `main`, déclenchée par la réussite de la CI sur ce commit (front, backend et couverture 99 %%, sécurité, architecture).\n\n## Commits promus\n\n%s\n' "$(cat /tmp/journal.md)")
          numero=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh pr edit "$numero" --title 'Promotion vers main' --body "$corps"
          else
            numero=$(gh pr create --base main --head develop --title 'Promotion vers main' --body "$corps" \
              | grep -oE '[0-9]+$')
          fi
          echo "PR #$numero"
          # Pendant l'attente qui suit, develop peut recevoir un commit que la CI n'a pas encore validé :
          # la tête de la PR ne serait plus celle qu'on a vérifiée. GitHub refuse la fusion si elle a bougé.
          tete=$(git rev-parse HEAD)

          # Le gardien ne peut pas contrôler cette PR. Elle est ouverte avec GITHUB_TOKEN, et GitHub
          # crée alors une exécution qu'il ne distribue jamais : six fois de suite, aucun job, conclusion
          # « failure », et une croix rouge sur la promotion qui ne dit rien de l'état du code. Attendre
          # cette exécution ne faisait donc que retarder la livraison de deux minutes avant de passer
          # outre -- c'est ce que faisait la version précédente, avertissement compris.
          #
          # La règle est donc vérifiée ici, et pour la première fois réellement : sur la branche source que
          # le serveur rapporte, non sur l'intention du workflow. Le gardien garde son rôle pour la PR
          # humaine, qu'aucun garde-fou n'empêche de déclencher.
          source=$(gh pr view "$numero" --json headRefName --jq .headRefName)
          if [ "$source" != "develop" ]; then
            echo "::error::main ne reçoit que des PR venues de develop ; #$numero vient de '$source'."
            exit 1
          fi
          echo "Source de #$numero : $source — conforme."

          # la PR porte le commit que la CI vient de valider : fusion sans écraser l'historique
          gh pr merge "$numero" --merge --match-head-commit "$tete"

  # la fusion ci-dessus est faite avec GITHUB_TOKEN : elle ne declenchera ni la CI de main, ni la release.
  # L'arbre fusionne est celui que la CI de develop vient de valider ; la livraison est donc appelee ici.
  livrer:
    name: Livrer (etiquette et realignement)
    needs: promouvoir
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
