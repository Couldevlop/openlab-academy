# Garde le flux de branches : main ne reçoit que des PR venues de develop.
#
# Ce workflow contrôle la règle sur la PR *humaine*, et sur elle seule.
#
# Sur la PR que la promotion ouvre avec GITHUB_TOKEN, il ne peut rien contrôler : GitHub crée une exécution
# qu'il ne distribue jamais, et elle conclut « failure » sans aucun job. La croix rouge qui en découle sur une
# promotion ne dit donc rien de l'état du code, et il ne faut pas la lire comme un échec. Cette règle est
# vérifiée là où elle peut l'être, dans promotion.yml, qui relit la branche source de sa propre PR avant de
# fusionner. Une PR humaine, elle, n'est soumise à aucun garde-fou de ce genre : ce contrôle s'y exécute.
name: Gardien

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flux:
    name: main ne reçoit que develop
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Vérifier la branche source
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE" != "develop" ]; then
            echo "::error::main ne reçoit que des PR venues de develop ; celle-ci vient de '$SOURCE'." \
                 "Ouvrez la PR vers develop, la promotion vers main est automatique."
            exit 1
          fi
          echo "Source : develop — conforme."
