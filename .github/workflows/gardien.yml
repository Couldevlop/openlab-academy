# Garde le flux de branches : main ne reçoit que des PR venues de develop.
#
# GitHub n'autorise aucune protection de branche sur un dépôt privé en plan gratuit (voir docs/flux-git.md) :
# ce workflow est le seul contrôle automatique de la règle, côté serveur. Il vise la PR *humaine*, mais il se
# déclenche aussi sur celle que la promotion ouvre avec GITHUB_TOKEN — parfois en attente d'approbation,
# parfois exécutée. Cette PR-là vient de develop par construction : elle passe. La promotion attend que ce
# contrôle conclue avant de fusionner, faute de quoi l'exécution se retrouve sans commit à lire et échoue au
# démarrage (voir le commentaire correspondant dans promotion.yml).
name: Gardien

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flux:
    name: main ne reçoit que develop
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Vérifier la branche source
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE" != "develop" ]; then
            echo "::error::main ne reçoit que des PR venues de develop ; celle-ci vient de '$SOURCE'." \
                 "Ouvrez la PR vers develop, la promotion vers main est automatique."
            exit 1
          fi
          echo "Source : develop — conforme."
