# =====================================================================================
# MODÈLE — Parcours Ingénieur Cybersécurité I (à compléter par l'équipe pédagogique)
# Destination une fois rempli : apps/openlab_academy/openlab_academy/data/parcours/04-cybersecurite-i.yaml
# Publication : bench --site <site> execute openlab_academy.entrypoints.seed.run
#
# Calibrage : 12 modules × 8 h + 10 projets × 15 h + capstone 60 h = 306 h
#   → 26 semaines au rythme standard (12 h), ~20 semaines en intensif (16 h).
#   Parcours I + II ≈ 52 semaines, soit 1 an au rythme standard.
#
# Règles vérifiées au chargement (fichier refusé sinon) :
#   - 10 projets dans « portfolio » + 1 « capstone » ; apres_module = numéro d'un module existant
#   - niveau ∈ guide | semi-guide | autonome ; duree_h entier > 0 ; titres ≤ 120 caractères
#   - listes non vides (exigences_specifiques peut valoir []) ; éléments contenant « : » entre guillemets
# Exigences qualité communes et barème /20 ajoutés automatiquement à chaque énoncé.
# Rappel légal : pratique offensive uniquement sur labs fournis ou avec autorisation écrite.
#
# Modules du catalogue actuel, à répartir entre les parcours I et II puis à compléter :
#   - 01 Réseaux TCP/IP
#   - 02 Linux
#   - 03 Python sécurité
#   - 04 OWASP Top 10
#   - 05 Nmap
#   - 06 Wireshark
#   - 07 Burp Suite
#   - 08 Pentest
#   - 09 Active Directory
#   - 10 SIEM
#   - 11 Cloud Security
#   - 12 Réponse à incident
# =====================================================================================

title: Ingénieur Cybersécurité I
short_introduction: >-
  Parcours Cybersécurité I — à compléter (une phrase d'accroche, sans rémunération).
description: >-
  <p><b>Prérequis :</b> aisance avec un ordinateur et la ligne de commande.</p>
  <p><b>Format :</b> modules hebdomadaires en labs isolés, un livrable par module, 10 semaines projet
  intercalées et un capstone devant jury.</p>
  <p><b>Suite :</b> le parcours Ingénieur Cybersécurité II prolonge celui-ci.</p>
  <p><b>Cadre légal :</b> toute pratique offensive se fait uniquement sur les labs fournis ou sur des
  systèmes dont on a l'autorisation écrite (loi ivoirienne n° 2013-451 relative à la cybercriminalité).</p>
  <p><b>Évaluation :</b> livrables hebdomadaires 20 %, portfolio 40 %, capstone 40 %.</p>
tags: [Cybersécurité]
card_gradient: Red

