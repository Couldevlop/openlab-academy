# =====================================================================================
# MODÈLE — Parcours IV · Ingénieur Cybersécurité
# À compléter par l'équipe pédagogique, puis copier dans :
#   apps/openlab_academy/openlab_academy/data/parcours/04-cybersecurite.yaml
# Publication : bench --site <site> execute openlab_academy.entrypoints.seed.run
#
# Règles vérifiées automatiquement au chargement (le fichier est refusé sinon) :
#   - exactement 10 projets dans « portfolio » + 1 « capstone »
#   - chaque projet : apres_module = numéro d'un module existant ("01" à "12")
#   - niveau ∈ guide | semi-guide | autonome ; duree_h = entier > 0
#   - titres ≤ 120 caractères ; listes non vides (sauf exigences_specifiques, qui peut valoir [])
#   - tout élément de liste contenant « : » doit être entre guillemets
#   - aucune rémunération en k€ dans title / short_introduction / description
# Progression conseillée : projets 1–3 guide, 4–7 semi-guide, 8–10 autonome ; capstone autonome ~60 h.
# Les exigences qualité communes (README, tests ≥ 70 %, CI, Docker, OWASP, ADR…) et le barème /20
# sont ajoutés automatiquement à chaque énoncé : ne pas les recopier ici.
# Rappel : toute pratique offensive se fait uniquement sur les labs fournis ou avec autorisation écrite.
# =====================================================================================

title: Ingénieur Cybersécurité
short_introduction: >-
  Parcours IV · sécurité offensive et défensive — réseaux, OWASP, pentest, Active Directory, SOC,
  cloud et réponse à incident, en labs isolés.
description: >-
  <p><b>Prérequis :</b> aisance avec un ordinateur et la ligne de commande.</p>
  <p><b>Format :</b> modules hebdomadaires en labs isolés, un livrable par module, 10 semaines projet
  intercalées et un capstone devant jury.</p>
  <p><b>Cadre légal :</b> toute technique offensive se pratique uniquement sur les labs fournis ou sur des
  systèmes dont on a l'autorisation écrite (loi ivoirienne n° 2013-451 relative à la cybercriminalité).</p>
  <p><b>Évaluation :</b> livrables hebdomadaires 20 %, portfolio 40 %, capstone 40 %.</p>
tags: [Cybersécurité, OWASP, SOC, SIEM, Cloud, Réponse à incident]
card_gradient: Red          # couleur de la carte LMS : Red | Blue | Green | Amber | Purple …

blocs:
  - title: "Bloc 1 — Fondations (S1–S3)"
    modules:
      - num: "01"
        title: "Réseaux TCP/IP"
        contenu: "Modèles OSI et TCP/IP, adressage et sous-réseaux, routage, DNS, HTTP(S), TLS, VPN, segmentation."
        livrable: "Schéma réseau d'une PME avec plan de segmentation."
      - num: "02"
        title: "Linux"
        contenu: "Système de fichiers, permissions, processus, services, journaux, durcissement, scripts Bash."
        livrable: "Checklist de durcissement appliquée à un serveur."
      - num: "03"
        title: "Python sécurité"
        contenu: "Automatisation, sockets, requêtes HTTP, analyse de journaux, scripts d'audit."
        livrable: "Outil d'analyse de journaux d'authentification."
  - title: "Bloc 2 — Offensif & sécurité applicative (S4–S8)"
    modules:
      - num: "04"
        title: "OWASP Top 10"
        contenu: "Contrôle d'accès défaillant, injections, XSS, SSRF, mauvaises configurations, défaillances cryptographiques, avec remédiation pour chaque faille."
        livrable: "Rapport de vulnérabilités sur une application de lab."
      - num: "05"
        title: "Nmap"
        contenu: "Découverte d'hôtes, scans de ports et de services, détection de versions, scripts NSE, cadre légal du scan."
        livrable: "Cartographie d'un réseau de lab."
      - num: "06"
        title: "Wireshark"
        contenu: "Capture et filtrage, analyse de protocoles, détection d'anomalies, reconstruction de sessions."
        livrable: "Analyse forensique d'une capture réseau."
      - num: "07"
        title: "Burp Suite"
        contenu: "Proxy, Repeater, Intruder, scanner, tests d'authentification et de sessions."
        livrable: "Audit web complet sur une application de lab."
      - num: "08"
        title: "Pentest"
        contenu: "Méthodologie (PTES, OSSTMM), cadrage et autorisation, reconnaissance, exploitation en lab, élévation de privilèges, rédaction du rapport."
        livrable: "Rapport de pentest professionnel (synthèse dirigeants et détail technique)."
  - title: "Bloc 3 — Défensif & entreprise (S9–S12)"
    modules:
      - num: "09"
        title: "Active Directory"
        contenu: "Architecture (domaines, forêts, GPO), Kerberos, attaques courantes et durcissement, modèle de tiering."
        livrable: "Audit et plan de durcissement d'un AD de lab."
      - num: "10"
        title: "SIEM"
        contenu: "Ingestion de journaux, règles de corrélation, tableaux de bord, MITRE ATT&CK."
        livrable: "10 règles de détection mappées sur ATT&CK."
      - num: "11"
        title: "Cloud Security"
        contenu: "Responsabilité partagée, IAM et moindre privilège, sécurité réseau cloud, gestion des secrets, CSPM, référentiels CIS."
        livrable: "Audit de configuration d'un compte cloud."
      - num: "12"
        title: "Réponse à incident"
        contenu: "Cycle NIST (préparation, détection, confinement, éradication, retour à la normale), forensique de base, communication de crise, obligations de notification."
        livrable: "Playbook d'incident et exercice sur table."

