[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlab-agentic-lab"
version = "0.3.0"
description = "Socle pédagogique OpenLab Academy pour comprendre et tester les agents IA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.7,<3.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.5,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
