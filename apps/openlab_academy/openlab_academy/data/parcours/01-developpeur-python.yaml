title: Développeur Python
short_introduction: >-
  Parcours I · de la base au niveau confirmé, orienté data : un code testé, packagé et conteneurisé,
  prêt pour les parcours AI Engineer et Data Engineer.
description: >-
  <p><b>Prérequis :</b> aucun. Le parcours démarre au niveau zéro.</p>
  <p><b>Format :</b> 1 module par semaine (~8 h), un livrable par module, 10 semaines projet intercalées
  et un capstone devant jury.</p>
  <p><b>Trajectoire :</b> de la syntaxe de base jusqu'à un code confirmé, testé et packagé.</p>
  <p><b>Évaluation :</b> livrables hebdomadaires 20 %, portfolio 40 %, capstone 40 %.</p>
couverture: couverture-developpeur-python.jpg
tags: [Python, Tests, Packaging, API, SQL]

blocs:
  - title: "Bloc 1 — Bases du langage (S1–S3)"
    modules:
      - num: "01"
        title: Premiers pas
        contenu: >-
          Installation (uv), interpréteur, variables, types, opérateurs, entrées/sorties, premiers scripts.
          Pensée algorithmique.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous installez Python sur votre machine et vous vérifiez sa version
              sans hésiter, vous écrivez un fichier et vous l'exécutez depuis un terminal, vous manipulez les
              quatre types de base sans les confondre, vous lisez une saisie clavier et vous la validez avant
              de l'utiliser, et surtout vous lisez une trace d'erreur de bas en haut au lieu de la refermer.

              Ces capacités se vérifient, elles ne se croient pas. En fin de semaine, un formateur doit
              pouvoir vous poser devant une machine vierge, vous donner un énoncé de deux lignes, et vous voir
              produire un programme qui tourne en dix minutes, erreurs de frappe comprises.

              Ce module est le plus important du parcours, parce qu'il installe deux réflexes dont tout le
              reste dépend : exécuter souvent, et lire l'erreur avant de la corriger. Un développeur qui lit
              ses erreurs apprend seul ; un développeur qui les devine reste dépendant toute sa carrière.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : quand vous tapez une commande qui lance un fichier Python, qu'est-ce qui
              s'exécute au juste, et où ce programme cherche-t-il votre fichier ? Beaucoup de débutants
              perdent une heure sur un fichier introuvable parce qu'ils n'ont jamais posé cette question.

              Deuxième question : si vous demandez à l'utilisateur le nombre de sacs livrés et qu'il tape 14,
              que vaut exactement ce que Python vous rend ? Un nombre, ou autre chose qui lui ressemble ?

              Troisième question : votre programme s'arrête avec dix lignes rouges. Par quelle extrémité
              commencez-vous la lecture, et pourquoi ? Gardez vos réponses de côté : vous les confronterez au
              module en fin de semaine, et l'écart mesurera ce que vous avez appris.
          - titre: "Le problème d'abord"
            texte: >-
              La coopérative de Divo collecte le cacao de quatre-vingt-douze producteurs. Chaque livraison est
              notée dans un cahier : le nom, le nombre de sacs, le poids total pesé à la bascule, et la
              qualité. Le vendredi, le gérant calcule les paiements à la calculatrice, et il passe cinq heures
              dessus. Deux fois cette année, une erreur de multiplication a coûté plus de cent mille francs à
              la coopérative.

              Le besoin n'est pas un logiciel complet : c'est un programme de vingt lignes qui prend un nombre
              de sacs et une qualité, et qui rend un montant juste, toujours le même pour les mêmes entrées.
              Ce que la calculatrice ne garantit pas, le programme le garantit.

              Vous allez écrire ce programme cette semaine. Il sera laid, il sera court, et il sera correct.
              C'est l'ordre dans lequel les choses se font : correct d'abord, élégant ensuite.
            figures:
              - nom: devpy-m01-a.jpg
                legende: "Le cahier de pesée de la coopérative, point de départ de votre premier programme"
          - titre: "La notion : ce qui se passe quand vous lancez un fichier Python"
            texte: >-
              Python est un interpréteur : un programme déjà installé sur votre machine qui lit votre fichier
              ligne par ligne et exécute chaque instruction dans l'ordre. Il n'y a pas d'étape de compilation
              visible, pas de fichier exécutable à produire. Vous écrivez du texte, vous le donnez à
              l'interpréteur, il agit.

              Quand vous tapez la commande qui lance un fichier, trois choses se produisent. Le terminal
              cherche le programme python dans les dossiers listés par la variable PATH. L'interpréteur trouvé
              ouvre le fichier dont vous donnez le chemin, relatif au dossier courant du terminal. Puis il
              exécute, de haut en bas, jusqu'à la dernière ligne ou jusqu'à la première erreur.

              Trois conséquences pratiques découlent de ce mécanisme. Un fichier introuvable est presque
              toujours un problème de dossier courant, pas de nom. Une erreur arrête tout ce qui suit, donc
              les lignes après l'erreur n'ont jamais tourné. Et un fichier qui ne contient que des définitions
              ne fait rien de visible : il faut appeler.

              L'interpréteur s'utilise aussi en mode interactif, sans fichier. Ce mode est un bac à sable
              précieux pour vérifier une idée en trois secondes, mais rien n'y est conservé : tout travail
              destiné à durer va dans un fichier.
          - titre: "Le geste technique : installer Python et exécuter un premier fichier"
            texte: >-
              Installez la version 3.12 ou plus récente depuis le site officiel, et vérifiez toujours la
              version après installation : c'est le seul moyen de savoir ce que vous avez réellement. Sur
              certaines machines la commande s'appelle python, sur d'autres python3 ; les deux existent
              parfois avec des versions différentes, ce qui explique bien des mystères.

              Créez ensuite un dossier par projet, et placez-vous dedans avant de lancer quoi que ce soit. Le
              dossier courant du terminal est la référence de tous les chemins relatifs : c'est la première
              chose à vérifier quand un fichier reste introuvable.
            code:
              - titre: Les six commandes de la première heure
                langage: bash
                source: |
                  python --version
                  python3 --version

                  mkdir carnet-pesee
                  cd carnet-pesee

                  pwd
                  ls

                  printf 'print("Bonjour la cooperative")\n' > pesee.py
                  python pesee.py
          - titre: "Lire le code ligne à ligne : votre premier programme utile"
            texte: >-
              Voici le calcul de la coopérative dans sa forme la plus simple. Lisez-le une fois en entier,
              puis reprenez-le ligne par ligne avec les explications qui suivent.

              Les deux premières affectations sont des constantes : des valeurs qui ne changent pas pendant
              l'exécution. Elles sont écrites en majuscules par convention, pour signaler au lecteur qu'on n'y
              touche pas, et elles sont nommées, ce qui évite de retrouver le nombre 1200 perdu au milieu d'un
              calcul trois mois plus tard.

              La ligne suivante crée une variable ordinaire. Le signe égal n'est pas une égalité mathématique
              : il range une valeur dans un nom. Puis deux calculs enchaînés, chacun rangé dans un nom qui dit
              ce qu'il contient. Écrire le calcul en deux étapes nommées plutôt qu'en une seule expression
              longue coûte une ligne et fait gagner une heure de relecture.

              Les trois dernières lignes affichent. Notez que print ne rend rien d'utilisable : il écrit sur
              la sortie. C'est une erreur fréquente que de croire qu'un print remplace un résultat ; nous y
              reviendrons au module des fonctions.
            code:
              - titre: "pesee.py, le calcul de la coopérative"
                langage: python
                source: |
                  # pesee.py : calcul du montant du pour une livraison de cacao
                  POIDS_SAC_KG = 65
                  PRIX_KG_FCFA = 1200

                  nombre_de_sacs = 14
                  poids_total_kg = nombre_de_sacs * POIDS_SAC_KG
                  montant_fcfa = poids_total_kg * PRIX_KG_FCFA

                  print("Sacs livres    :", nombre_de_sacs)
                  print("Poids total kg :", poids_total_kg)
                  print("Montant FCFA   :", montant_fcfa)
          - titre: "La notion : quatre types de base, et le piège des montants"
            texte: >-
              Python manipule des valeurs typées. Quatre types suffisent à presque tout cette semaine. Le type
              entier représente un nombre sans partie décimale, et il n'a pas de limite de taille en Python.
              Le type flottant représente un nombre à virgule, en base deux, avec une précision approchée. Le
              type chaîne représente du texte. Le type booléen ne prend que deux valeurs, vrai ou faux.

              Le piège des montants mérite une semaine à lui seul, et nous le réglons tout de suite. Le franc
              CFA n'a pas de subdivision en circulation : un montant est un entier. Si vous calculez des
              montants en flottants, vous obtiendrez un jour un total de 129 999,999999 francs, et vous ne
              saurez pas d'où vient la poussière. La règle du parcours est simple : les montants sont des
              entiers, et les taux s'appliquent avec un arrondi explicite au franc.

              Un type n'est pas une décoration : il décide de ce que les opérateurs font. Le signe plus
              additionne deux entiers et concatène deux chaînes ; appliqué à un entier et à une chaîne, il
              échoue. Cette rigueur est une protection : elle transforme en erreur immédiate ce qui, dans
              d'autres langages, devient un résultat absurde découvert six mois plus tard.
            figures:
              - nom: python-arrondi-fcfa.svg
                legende: "Un montant en francs est un entier ; l'arrondi se décide, il ne se subit pas"
          - titre: "Le geste technique : lire une saisie et la valider avant de l'utiliser"
            texte: >-
              La fonction de saisie rend toujours une chaîne, même quand l'utilisateur tape des chiffres. Il
              faut convertir, et la conversion peut échouer : une virgule, un espace, un mot. Un programme qui
              convertit sans vérifier plante au premier utilisateur distrait.

              Le motif ci-dessous est à retenir tel quel : on boucle tant que la saisie n'est pas valide, on
              explique ce qui ne va pas, et on ne sort qu'avec une valeur utilisable. Validez au plus près de
              l'entrée : une donnée qui franchit cette frontière sans contrôle contaminera tout le reste du
              programme.
            code:
              - titre: "saisie.py, une entrée validée avant tout calcul"
                langage: python
                source: |
                  def demander_entier(question: str, minimum: int = 0) -> int:
                      while True:
                          saisie = input(question).strip()
                          if not saisie.isdigit():
                              print("Entrez un nombre entier, sans espace ni virgule.")
                              continue
                          valeur = int(saisie)
                          if valeur < minimum:
                              print(f"La valeur doit etre superieure ou egale a {minimum}.")
                              continue
                          return valeur


                  sacs = demander_entier("Nombre de sacs livres : ", minimum=1)
                  montant_fcfa = sacs * 65 * 1200
                  print(f"Montant du : {montant_fcfa} FCFA")
          - titre: "À la main : le carnet de pesée en quinze minutes"
            texte: >-
              Premier temps, créez le dossier et le fichier, et exécutez-le avec un simple affichage. Tant que
              cette boucle ne tourne pas, rien d'autre ne sert : vous devez pouvoir modifier et relancer en
              moins de cinq secondes.

              Deuxième temps, posez les constantes nommées, puis le calcul en étapes. Exécutez après chaque
              ajout de deux ou trois lignes. Un débutant qui écrit quarante lignes avant de lancer passera
              vingt minutes à chercher laquelle est fautive ; celui qui lance toutes les trois lignes le sait
              immédiatement.

              Troisième temps, remplacez la valeur écrite en dur par une saisie validée. Testez trois cas :
              une saisie correcte, une saisie avec une virgule, une saisie vide. Un programme n'est pas
              terminé quand il marche avec la bonne entrée ; il est terminé quand il résiste à la mauvaise.

              Quatrième temps, ajoutez la qualité, qui change le prix au kilo. Vous aurez besoin d'un test
              conditionnel. Écrivez-le d'abord avec deux qualités, vérifiez, puis ajoutez la troisième.
            figures:
              - nom: devpy-m01-b.jpg
                legende: "Quinze minutes de terminal valent mieux qu'une heure de lecture passive"
          - titre: "La notion : lire une trace d'erreur de bas en haut"
            texte: >-
              Quand Python s'arrête, il écrit une trace. Cette trace n'est pas une punition : c'est le rapport
              le plus précis que vous recevrez jamais sur votre programme. Elle se lit par la fin.

              La dernière ligne donne le type de l'erreur et son message. Le type dit la famille du problème :
              un nom inconnu, un type incompatible, une valeur impossible, un fichier absent. Le message donne
              le détail, souvent avec la valeur fautive entre guillemets.

              L'avant-dernier bloc donne le fichier, le numéro de ligne et le code de l'endroit où tout s'est
              arrêté. C'est là que vous allez regarder en premier. Les blocs au-dessus racontent le chemin
              parcouru : qui a appelé quoi. Quand votre programme est court, ce chemin tient en un bloc ;
              quand il grandira, il deviendra votre meilleur outil de diagnostic.

              Un réflexe à prendre dès maintenant : quand le message ne vous dit rien, recopiez sa dernière
              ligne dans un moteur de recherche. Les erreurs de Python sont les mêmes pour tout le monde
              depuis trente ans, et la réponse existe déjà.
            figures:
              - nom: python-trace-erreur.svg
                legende: "Une trace se lit du bas vers le haut : le type, le message, puis l'endroit"
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Voici les six traces que rencontre tout débutant la première semaine, avec leur traduction et le
              geste qui les corrige. Lisez ce tableau maintenant, et relisez-le chaque fois que vous bloquez :
              la plupart de vos arrêts de programme seront dans cette liste pendant un mois.

              Notez la différence entre une erreur de syntaxe, détectée avant toute exécution, et une erreur
              d'exécution, qui survient en cours de route. La première interdit au fichier de démarrer, la
              seconde interrompt au milieu, en laissant parfois un travail à moitié fait.
            tableaux:
              - titre: "Six traces, leur sens et le geste qui corrige"
                entetes: [Dernière ligne de la trace, "Ce qu'elle dit", Le geste]
                lignes:
                  - ["NameError: name 'poid_total' is not defined", un nom employé mais jamais créé, corriger la faute de frappe]
                  - ["TypeError: can only concatenate str (not int) to str", une chaîne additionnée à un entier, convertir avec int ou formater]
                  - ["ValueError: invalid literal for int() with base 10: '12,5'", une virgule décimale dans une conversion, valider la saisie avant de convertir]
                  - ["IndentationError: unexpected indent", un espace en trop en début de ligne, aligner sur quatre espaces exactement]
                  - ["ZeroDivisionError: division by zero", "un diviseur nul, souvent un effectif vide", tester le diviseur avant de diviser]
                  - ["FileNotFoundError: No such file or directory: 'pesee.py'", "le terminal n'est pas dans le bon dossier", vérifier le dossier courant]
          - titre: "Le geste technique : déboguer sans outil, puis avec le débogueur"
            texte: >-
              Le premier outil de diagnostic est l'affichage intercalé. Avant la ligne qui échoue, affichez la
              valeur et le type de chaque variable qui entre dans le calcul. Dans neuf cas sur dix, le type
              n'est pas celui que vous croyiez.

              Le second outil est intégré à Python et personne ne l'enseigne aux débutants, à tort. Une seule
              ligne posée dans votre code suspend l'exécution à cet endroit et ouvre une invite où vous
              inspectez les variables, avancez d'une ligne, ou poursuivez. Apprenez trois commandes cette
              semaine : afficher une expression, avancer d'une ligne, continuer.
            code:
              - titre: "diagnostic.py, afficher le type puis suspendre"
                langage: python
                source: |
                  saisie = input("Nombre de sacs : ")

                  print("valeur :", repr(saisie), "type :", type(saisie))

                  # Suspend l'execution ici et ouvre une invite de debogage.
                  # Commandes utiles : p <expression>, n (ligne suivante), c (continuer), q (quitter).
                  breakpoint()

                  total = int(saisie) * 65
                  print(total)
          - titre: "La notion : le coût d'un programme se compte, il ne se devine pas"
            texte: >-
              Votre programme de pesée tourne en un clin d'oeil sur les trente lignes du cahier de la
              coopérative. Le jour où le gérant vous donne le fichier des trois dernières campagnes, deux cent
              mille lignes, le même programme met quatre minutes. Rien n'a changé dans le code : seule la
              quantité de données a changé.

              Un programme a un coût, et ce coût se compte en nombre d'opérations, pas en secondes. Les
              secondes dépendent de la machine, de l'humeur du disque et de ce qui tourne à côté. Le nombre
              d'opérations, lui, ne dépend que de ce que vous avez écrit. C'est pour cela qu'on le compte.

              La question à se poser devant une boucle est toujours la même : si je double la quantité de
              données, combien de fois de plus ce bloc sera-t-il exécuté ? Si la réponse est deux fois, le
              programme tiendra la montée en charge. Si la réponse est quatre fois, il se dégradera vite. Si
              c'est pire encore, il ne finira jamais sur un vrai fichier.

              Une boucle dans une boucle est le signal d'alarme le plus fiable du métier. Chaque fois que vous
              parcourez une liste à l'intérieur d'un parcours de la même liste, vous multipliez le travail par
              lui-même. Trente lignes donnent neuf cents passages, ce qui ne se voit pas. Deux cent mille
              lignes donnent quarante milliards de passages, ce qui ne finit pas.
            figures:
              - nom: python-effet-du-cache.svg
                legende: "Le même travail, deux organisations : la différence se lit en barres, pas en impressions"
              - nom: devpy-m01-c.jpg
                legende: "Ce qui se mesure se discute, ce qui se devine se dispute"
          - titre: "Le geste technique : chronométrer la même tâche sur 10, 1 000 puis 100 000 éléments"
            texte: >-
              Mesurer ne demande ni outil ni bibliothèque : l'horloge de performance de Python suffit. Vous
              écrivez la tâche, vous la lancez sur des tailles qui grandissent, et vous regardez comment le
              temps grandit avec elles.

              Lancez le programme ci-dessous. Sur dix références, les deux versions semblent identiques. Sur
              mille, un écart apparaît. Sur cent mille, la première version devient inutilisable pendant que
              la seconde répond encore tout de suite. C'est la même tâche et le même résultat : seule
              l'organisation des données diffère.

              Lisez le tableau de mesures dans ce sens : ce qui compte n'est pas le temps d'une ligne, c'est
              le rapport entre deux lignes successives. Multipliez la taille par dix, et observez. La version
              qui parcourt la liste voit son temps multiplié par cent, parce qu'elle fait dix fois plus de
              tours et que chaque tour coûte dix fois plus cher. La version qui interroge un dictionnaire voit
              son temps multiplié par dix seulement, parce que chaque recherche reste au même prix.

              Notez enfin pourquoi doubler les données ne double pas toujours le temps, dans les deux sens. En
              dessous d'un millier d'éléments, le coût de démarrage de l'interpréteur domine et masque tout.
              Au-delà d'un certain volume, la mémoire se remplit, la machine échange avec le disque, et le
              temps explose plus vite que le calcul. Mesurez toujours sur au moins trois tailles, jamais sur
              une seule.
            tableaux:
              - titre: "Lire un tableau de mesures : le rapport compte, pas la seconde"
                entetes: [Taille, Ce que fait le parcours, "Ce que fait l'index", Ce que vous en concluez]
                lignes:
                  - [10, quelques opérations, quelques opérations, les deux conviennent]
                  - [1 000, cent fois plus de travail, dix fois plus de travail, "l'écart se voit"]
                  - [100 000, le temps devient inacceptable, le temps reste stable, "l'index s'impose"]
                  - [Rapport attendu, temps multiplié par cent, temps multiplié par dix, la forme de la courbe]
            code:
              - titre: "mesurer.py, la même question posée à deux organisations"
                langage: python
                source: |
                  import random
                  import time

                  def chercher_par_parcours(references: list[tuple[str, int]], voulue: str) -> int:
                      for code, prix_fcfa in references:
                          if code == voulue:
                              return prix_fcfa
                      return 0

                  def chercher_par_index(index: dict[str, int], voulue: str) -> int:
                      return index.get(voulue, 0)

                  for taille in (10, 1_000, 100_000):
                      references = [(f"REF{numero:06d}", random.randint(500, 20_000)) for numero in range(taille)]
                      index = dict(references)
                      demandes = [f"REF{random.randrange(taille):06d}" for _ in range(1_000)]

                      depart = time.perf_counter()
                      for demande in demandes:
                          chercher_par_parcours(references, demande)
                      par_parcours = time.perf_counter() - depart

                      depart = time.perf_counter()
                      for demande in demandes:
                          chercher_par_index(index, demande)
                      par_index = time.perf_counter() - depart

                      print(f"{taille:>7} references | parcours {par_parcours:8.4f} s | index {par_index:8.4f} s")
          - titre: "À la main : votre tableau de mesures, et la décision qu'il justifie"
            texte: >-
              Reprenez le programme de pesée que vous avez écrit cette semaine et produisez-en trois versions
              qui donnent exactement le même résultat. La première parcourt la liste à chaque recherche. La
              deuxième construit un dictionnaire une fois, puis l'interroge. La troisième trie la liste une
              fois, puis cherche par moitiés successives, si vous voulez pousser plus loin.

              Mesurez les trois sur dix, mille et cent mille lignes, avec le même jeu de demandes. Reportez
              les neuf mesures dans un tableau, en ajoutant pour chaque colonne le rapport entre une taille et
              la suivante. Un tableau sans ces rapports ne prouve rien.

              Terminez par trois lignes de justification : quelle version vous retenez, à partir de quel
              volume elle devient nécessaire, et ce qu'elle coûte en mémoire. Une décision technique se défend
              avec des chiffres que votre voisin peut reproduire sur sa machine. C'est ce tableau, et non
              votre impression, qui entre dans le livrable de la semaine.
          - titre: Entraînement gradué
            texte: >-
              Premier exercice, imiter. Reprenez le programme de pesée et ajoutez une remise de deux pour cent
              appliquée au-delà de vingt sacs. Résultat attendu pour vingt-cinq sacs de qualité courante : le
              montant plein moins deux pour cent, arrondi au franc entier.

              Deuxième exercice, varier. Transformez le programme pour qu'il traite trois livraisons saisies
              l'une après l'autre et affiche le total général ainsi que la moyenne par livraison. Attention au
              diviseur nul si aucune livraison n'est saisie.

              Troisième exercice, créer. Écrivez un convertisseur de monnaie entre le franc CFA et l'euro, au
              taux fixe de 655,957 francs pour un euro. Le montant en francs est un entier, le montant en
              euros s'affiche avec deux décimales, et une saisie invalide ne doit jamais faire planter le
              programme. Vérifiez vous-même : cent mille francs valent 152,45 euros.
          - titre: Aller plus loin cette semaine
            texte: >-
              Si vous avez terminé les trois exercices, explorez deux sujets qui seront repris plus tard.
              Premier sujet, le formatage des nombres à l'affichage : Python sait écrire un entier avec des
              séparateurs de milliers, ce qui rend un montant en francs immédiatement lisible.

              Second sujet, la lecture d'arguments en ligne de commande. Un programme qui reçoit ses valeurs
              au lancement plutôt que par saisie interactive devient automatisable, et c'est la première
              marche vers l'outillage professionnel, que nous construirons au module des environnements.

              Ce que ce module ne couvre pas volontairement : les boucles sur des collections, qui arrivent au
              module suivant, et la lecture de fichiers, qui attend le module cinq. Résistez à la tentation de
              tout apprendre d'un coup : la profondeur bat la surface.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est le fichier nommé comme un module de Python. Un fichier appelé math point py
              ou random point py dans votre dossier de travail empêchera l'import de la vraie bibliothèque, et
              l'erreur obtenue sera incompréhensible. Nommez vos fichiers d'après votre métier.

              Le deuxième piège est la confusion entre afficher et rendre. Un print montre une valeur à
              l'écran ; il ne la donne pas au reste du programme. Tant que ce n'est pas clair, le module des
              fonctions sera douloureux.

              Le troisième piège est le copier-coller de code non compris, trouvé en ligne. Il fonctionne
              parfois, et il vous laisse sans rien quand il échoue. La règle du parcours : vous ne gardez dans
              votre fichier que des lignes dont vous pouvez expliquer le rôle à voix haute.
          - titre: Le mémo de la semaine
            texte: >-
              Gardez cette table sous les yeux pendant les trois premières semaines. Elle réunit ce que vous
              taperez le plus souvent et le piège attaché à chaque geste.
            tableaux:
              - titre: Aide-mémoire de la première semaine
                entetes: [Écriture, "Ce qu'elle fait", Le piège]
                lignes:
                  - [python fichier.py, exécute un fichier, dépend du dossier courant]
                  - [nom = valeur, range une valeur dans un nom, "ce n'est pas une égalité"]
                  - ["print(a, b)", affiche sur la sortie, "n'apporte rien au programme"]
                  - [input(question), lit une saisie, rend toujours une chaîne]
                  - [int(texte), convertit en entier, échoue sur une virgule ou un vide]
                  - ["une f-chaine, prefixee par f", compose un message, oublier le f laisse les accolades]
                  - [breakpoint(), suspend et inspecte, à retirer avant de livrer]
          - titre: "Vous savez faire, si vous cochez ces six cases"
            texte: >-
              Cochez honnêtement. Vous savez installer Python et dire quelle version répond à la commande que
              vous tapez. Vous créez un dossier, vous vous y placez, vous y créez un fichier et vous
              l'exécutez sans aide. Vous nommez vos variables en français métier et vos constantes en
              majuscules. Vous validez une saisie avant de la convertir. Vous lisez une trace par la fin et
              vous nommez le type d'erreur avant de toucher au code. Vous savez suspendre l'exécution et
              inspecter une variable.

              Question de transfert, à traiter par écrit en cinq lignes : un collègue vous envoie un programme
              qui calcule des montants en flottants et qui affiche parfois un centime de trop. Sans voir son
              code, que lui demandez-vous de changer, et comment vérifierez-vous que c'est corrigé ?

              Si trois cases ne sont pas cochées, refaites l'atelier avant d'aborder le module suivant. Le
              parcours est cumulatif : une semaine sautée se paie trois semaines plus tard, au triple.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un programme en ligne de commande qui calcule le montant dû pour une livraison de cacao :
              saisie validée du nombre de sacs et de la qualité, prix au kilo dépendant de la qualité, remise
              au-delà d'un seuil, affichage lisible du détail et du total en francs entiers.

              Joignez un fichier de notes de dix lignes qui liste les trois erreurs qui vous ont le plus
              retenu cette semaine, avec leur trace exacte et ce qui les a corrigées. Ce fichier vaut autant
              que le programme : il prouve que vous avez lu vos erreurs au lieu de les subir.

              Critères d'acceptation : le programme ne plante sur aucune saisie, y compris vide ou avec une
              virgule ; aucun nombre magique ne traîne dans le calcul ; les montants sont des entiers ; et le
              fichier s'exécute sur une machine qui n'a que Python installé.
            tableaux:
              - titre: "Grille d'évaluation du livrable"
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Robustesse, plante sur une saisie vide, aucune saisie ne fait planter, les refus expliquent quoi corriger]
                  - [Nommage, "des noms d'une lettre", des noms métier explicites, constantes nommées et regroupées]
                  - [Montants, des flottants, des entiers de francs, arrondi explicite et commenté]
                  - ["Notes d'erreurs", absentes, trois traces et leur correction, "le diagnostic est expliqué, pas seulement la correction"]
        livrable: Suite de petits programmes (calculs, conditions, boucles).
        mise_en_situation: "Un commerçant veut un petit programme qui demande le prix unitaire et la quantité d'un article puis affiche le total en FCFA, avec une remise de 5 % au-delà de 50 000 FCFA. Écrivez le programme et décrivez les cas que vous testez."
        quiz:
          - question: "Que renvoie input() ?"
            options: ["Toujours une chaîne de caractères", "Un entier si l'utilisateur tape un nombre", "Un booléen", "None"]
            bonnes: [1]
            explication: "Il faut convertir explicitement avec int() ou float()."
          - question: "Que vaut 7 // 2 en Python ?"
            options: ["3.5", "3", "4", "1"]
            bonnes: [2]
            explication: "// est la division entière."
          - question: "Votre traitement passe de 1 000 à 10 000 éléments, et son temps de 0,2 s à 20 s. Qu'en déduisez-vous ?"
            options: ["Le temps croît comme le carré de la quantité", "Le temps croît proportionnellement à la quantité", "La machine était occupée pendant la mesure", "Rien : il aurait fallu mesurer en millisecondes"]
            bonnes: [1]
            explication: "La quantité est multipliée par 10, le temps par 100. C'est le rapport entre deux mesures qui renseigne, jamais une mesure seule."
          - question: "Quel mot-clé introduit une condition alternative ?"
            options: ["elif", "elseif", "else if", "case"]
            bonnes: [1]
            explication: "Python utilise if / elif / else."
          - question: "Combien de fois s'exécute for i in range(3) ?"
            options: ["3", "2", "4", "Indéfiniment"]
            bonnes: [1]
            explication: "range(3) produit 0, 1 et 2."
      - num: "02"
        title: Structures de données
        contenu: Listes, tuples, dictionnaires, sets, compréhensions, slicing, manipulation de chaînes.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous choisissez la structure de données adaptée à un problème au lieu
              de tout mettre dans des listes, vous parcourez et transformez une collection avec une
              compréhension, vous découpez des chaînes et vous les normalisez, et vous agrégez des données en
              mémoire sans écrire de boucles imbriquées.

              Le choix de structure est le premier geste d'ingénieur du parcours. Un mauvais choix se paie en
              lignes de code, en lenteur et en bugs, et aucune astuce ultérieure ne le rattrape. Un bon choix
              fait disparaître la moitié du problème avant même d'écrire la première boucle.

              À la fin de la semaine, devant un énoncé, vous devez pouvoir annoncer en trente secondes la
              structure que vous allez employer et justifier ce choix en une phrase. C'est exactement ce qu'on
              vous demandera en entretien technique.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : vous avez quinze mille lignes de ventes et vous voulez le total par produit.
              Combien de fois allez-vous parcourir la liste des ventes si vous employez une liste pour stocker
              les totaux, et combien de fois avec un dictionnaire ?

              Deuxième question : vous copiez une liste dans une autre variable, puis vous modifiez la copie.
              L'originale change-t-elle ? Votre réponse spontanée est probablement fausse, et cette erreur est
              responsable de bugs que des professionnels mettent des heures à comprendre.

              Troisième question : les noms de produits saisis par six pharmaciens différents comportent des
              majuscules, des espaces en trop et des accents variables. Combien de produits distincts votre
              programme comptera-t-il, et qu'est-ce qui le détermine ?
          - titre: "Le problème d'abord"
            texte: >-
              La pharmacie du Plateau sort chaque soir un relevé des ventes de la journée : une longue liste
              de couples, le libellé du produit et la quantité, dans l'ordre où les tickets ont été encaissés.
              Quatre cents lignes par jour, parfois le même produit douze fois.

              On vous demande trois choses : la quantité totale vendue par produit, les cinq produits les plus
              vendus, et la liste des produits vendus aujourd'hui mais pas hier. Chacune de ces questions
              appelle une structure différente, et c'est précisément la leçon de la semaine.

              Avec une seule liste et des boucles imbriquées, vous écrirez trente lignes lentes et fragiles.
              Avec le dictionnaire pour l'agrégation et l'ensemble pour la comparaison, vous en écrirez six,
              rapides et lisibles. La différence ne tient pas à votre habileté, elle tient au choix initial.
            figures:
              - nom: python-liste-ou-dictionnaire.svg
                legende: "La liste garde l'ordre, le dictionnaire répond à la question combien pour ce produit"
          - titre: "La notion : quatre structures, quatre usages"
            texte: >-
              La liste est une suite ordonnée et modifiable, qui accepte les doublons. Elle convient quand
              l'ordre compte ou quand vous accumulez des éléments au fil de l'eau. Chercher un élément par sa
              valeur dans une liste impose de la parcourir : coûteux dès que la liste grandit.

              Le tuple est une suite ordonnée mais figée. Il sert à représenter une petite structure fixe, un
              couple de coordonnées, une ligne de relevé, et il peut servir de clé de dictionnaire, ce qu'une
              liste ne peut pas faire. Son immuabilité est une garantie, pas une limitation.

              Le dictionnaire associe une clé à une valeur et répond instantanément à la question : quelle
              valeur pour cette clé. C'est la structure de l'agrégation, du comptage, de l'index. Depuis
              Python 3.7, il conserve l'ordre d'insertion, ce qui enlève la dernière raison de l'éviter.

              L'ensemble ne retient que des valeurs uniques et répond instantanément à la question : cet
              élément est-il présent. Il excelle pour dédoublonner, pour comparer deux populations, pour
              tester une appartenance dans une boucle. Il ne conserve pas l'ordre.
          - titre: "Le geste technique : accéder, trancher, parcourir"
            texte: >-
              L'accès par index part de zéro, et un index négatif compte depuis la fin. Le découpage par
              tranche rend une nouvelle liste et n'inclut jamais la borne de fin : c'est la source d'erreur la
              plus fréquente du langage, et la seule façon de s'en débarrasser est de l'écrire dix fois.

              Parcourez toujours les éléments directement. Vous n'avez besoin de l'index que si vous
              l'utilisez vraiment, et dans ce cas une fonction dédiée vous rend le rang et l'élément ensemble.
              Pour parcourir deux collections en parallèle, une autre fonction les apparie deux à deux.
            figures:
              - nom: python-tranches-liste.svg
                legende: "Une tranche part de la borne de début et s'arrête avant la borne de fin"
            code:
              - titre: "tranches.py, index, bornes et parcours"
                langage: python
                source: |
                  ventes = ["paracetamol", "amoxicilline", "serum", "paracetamol", "compresses"]

                  print(ventes[0])      # paracetamol, le premier
                  print(ventes[-1])     # compresses, le dernier
                  print(ventes[1:3])    # amoxicilline, serum : la borne 3 est exclue
                  print(ventes[:2])     # les deux premiers
                  print(ventes[-2:])    # les deux derniers

                  for rang, produit in enumerate(ventes, start=1):
                      print(rang, produit)

                  quantites = [2, 1, 4, 3, 10]
                  for produit, quantite in zip(ventes, quantites):
                      print(produit, quantite)
          - titre: "Lire le code ligne à ligne : le comptage par dictionnaire"
            texte: >-
              Voici le cœur de la semaine : agréger un relevé en six lignes. Lisez d'abord, puis suivez le
              commentaire.

              La première ligne crée un dictionnaire vide qui recevra les totaux. La boucle parcourt les
              couples du relevé et dépaquette chacun en deux noms d'un coup : c'est le dépaquetage de tuple,
              beaucoup plus lisible qu'un accès par index.

              La ligne centrale mérite votre attention. La méthode interrogée rend la valeur associée à la clé
              si elle existe, et la valeur de repli sinon. Elle évite le test d'existence et la double
              recherche, et elle rend la ligne lisible comme une phrase : le nouveau total vaut l'ancien, ou
              zéro s'il n'y en avait pas, plus la quantité.

              Les deux dernières lignes trient. La fonction de tri accepte une clé de tri, ici la valeur de
              chaque couple, et le tri décroissant se demande par un argument nommé. La tranche garde les cinq
              premiers. Remarquez qu'aucune boucle imbriquée n'apparaît : c'est la marque d'un bon choix de
              structure.
            code:
              - titre: "agregation.py, totaux par produit et palmarès"
                langage: python
                source: |
                  releve = [("paracetamol", 2), ("serum", 1), ("paracetamol", 3), ("compresses", 4)]

                  totaux = {}
                  for produit, quantite in releve:
                      totaux[produit] = totaux.get(produit, 0) + quantite

                  palmares = sorted(totaux.items(), key=lambda couple: couple[1], reverse=True)

                  print(totaux)
                  print(palmares[:5])
          - titre: "La notion : le dictionnaire comme index de travail"
            texte: >-
              Au-delà du comptage, le dictionnaire sert d'index : il transforme une recherche coûteuse en
              accès immédiat. Si vous devez retrouver mille fois le libellé d'un produit à partir de son code,
              construisez une fois le dictionnaire code vers libellé, puis interrogez-le mille fois.

              Ce geste porte un nom dans le métier : construire un index avant la boucle. Il transforme une
              opération en carré, qui s'effondre quand le volume grandit, en une opération linéaire, qui tient
              la charge. C'est la même idée que l'index d'une base de données, sujet du module dix.

              Trois méthodes complètent votre outillage. L'une rend la valeur ou un repli sans lever d'erreur.
              Une autre installe une valeur par défaut si la clé manque. La troisième parcourt les couples clé
              et valeur ensemble, ce qui évite de rechercher la valeur à chaque tour.
            figures:
              - nom: devpy-m02-a.jpg
                legende: "Un index transforme une recherche dans tout le rayon en un accès direct au bon tiroir"
          - titre: "La notion : ce qu'il y a sous le dictionnaire, la table de hachage"
            texte: >-
              Vous avez employé le dictionnaire toute la semaine comme un index : vous donnez un code produit,
              il rend le prix immédiatement, que le fichier compte cent ou cent mille entrées. Ce comportement
              n'a rien de magique, et comprendre son mécanisme vous évitera trois erreurs courantes.

              Imaginez les casiers numérotés d'un bureau de poste. Pour ranger une lettre, l'employé applique
              une règle de calcul au nom du destinataire et obtient un numéro de casier. Pour la retrouver, il
              applique la même règle et va directement au bon casier, sans ouvrir les autres. La règle de
              calcul s'appelle une fonction de hachage, et les casiers s'appellent des seaux.

              Deux noms différents peuvent donner le même numéro de casier : c'est une collision. Le casier
              contient alors plusieurs lettres, et l'employé compare les noms un par un, mais seulement à
              l'intérieur de ce casier. Tant que les collisions restent rares, la recherche reste quasi
              immédiate, quel que soit le nombre total de lettres.

              De là vient la règle qui surprend les débutants : une clé de dictionnaire doit être immuable. Si
              vous rangiez une lettre sous un nom, puis que ce nom changeait tout seul, le calcul donnerait un
              autre casier et la lettre serait introuvable alors qu'elle est bien là. C'est pourquoi une
              chaîne, un nombre ou un tuple peuvent servir de clé, et pourquoi une liste ne le peut pas.

              Retenez aussi ce que la table de hachage ne sait pas faire. Elle ne conserve aucun ordre utile :
              demander la plus petite clé ou les clés comprises entre deux bornes l'oblige à tout parcourir.
              Pour ces questions, il faut une structure triée, que vous verrez avec les index de base de
              données.
            figures:
              - nom: python-liste-ou-dictionnaire.svg
                legende: "Parcourir tous les rayons, ou aller directement au bon casier"
              - nom: devpy-m02-c.jpg
                legende: "Des casiers numérotés : la clé donne le numéro, et le casier répond tout de suite"
          - titre: "Le geste technique : écrire une mini table de hachage à la main"
            texte: >-
              Le meilleur moyen de comprendre un mécanisme est de l'écrire en petit. Quarante lignes suffisent
              pour une table de hachage qui range, retrouve et gère les collisions. Vous n'écrirez jamais cela
              en production, puisque le dictionnaire de Python fait mieux ; vous l'écrivez une fois pour ne
              plus jamais traiter le dictionnaire comme une boîte noire.

              La fonction hash intégrée transforme une valeur immuable en un entier. Le reste de la division
              de cet entier par le nombre de seaux donne le numéro du seau. Chaque seau est une petite liste
              de paires, parcourue seulement quand il y a collision.

              Exécutez le programme, puis réduisez le nombre de seaux à deux et observez : les listes
              s'allongent, les collisions deviennent la règle, et la recherche redevient un parcours. C'est
              exactement ce qui arrive à une vraie table quand elle est trop pleine, et c'est pourquoi le
              dictionnaire de Python s'agrandit tout seul au fil des insertions.

              Vérifiez enfin ce que vous avez construit avec trois assertions : une clé rangée se retrouve,
              une clé absente ne lève pas d'erreur mais rend la valeur par défaut, et deux clés qui tombent
              dans le même seau se distinguent correctement. Ces trois assertions sont votre preuve, et elles
              entrent dans votre rendu.
            tableaux:
              - titre: "Ce que la table de hachage sait faire, et ce qu'elle ne sait pas"
                entetes: [Question posée, Coût, Pourquoi]
                lignes:
                  - [Quel est le prix de cette référence, immédiat, un calcul donne le seau]
                  - [Cette référence existe-t-elle, immédiat, même mécanisme]
                  - [Quelle est la plus petite clé, parcours complet, les seaux ne sont pas ordonnés]
                  - [Quelles clés entre deux bornes, parcours complet, il faut une structure triée]
                  - [Ranger une liste comme clé, refusé, une clé doit être immuable]
            code:
              - titre: "table_simple.py, le dictionnaire demonte en quarante lignes"
                langage: python
                source: |
                  class TableSimple:
                      """Une table de hachage minimale, pour comprendre ce que fait un dictionnaire."""

                      def __init__(self, nombre_de_seaux: int = 8) -> None:
                          self.seaux: list[list[tuple[object, object]]] = [[] for _ in range(nombre_de_seaux)]

                      def _numero_de_seau(self, cle: object) -> int:
                          return hash(cle) % len(self.seaux)

                      def ranger(self, cle: object, valeur: object) -> None:
                          seau = self.seaux[self._numero_de_seau(cle)]
                          for position, (cle_rangee, _) in enumerate(seau):
                              if cle_rangee == cle:
                                  seau[position] = (cle, valeur)
                                  return
                          seau.append((cle, valeur))

                      def lire(self, cle: object, defaut: object = None) -> object:
                          for cle_rangee, valeur in self.seaux[self._numero_de_seau(cle)]:
                              if cle_rangee == cle:
                                  return valeur
                          return defaut

                      def remplissage(self) -> list[int]:
                          return [len(seau) for seau in self.seaux]


                  table = TableSimple()
                  for code, prix_fcfa in [("CACAO-A", 1200), ("CACAO-B", 950), ("CAFE-A", 1800)]:
                      table.ranger(code, prix_fcfa)

                  assert table.lire("CACAO-B") == 950
                  assert table.lire("INCONNU", 0) == 0
                  print(table.remplissage())
          - titre: "Le geste technique : les compréhensions, et leur limite"
            texte: >-
              Une compréhension transforme une collection en une autre en une ligne lisible. Elle remplace la
              boucle qui ne fait qu'accumuler, et elle se lit dans l'ordre : ce que je garde, pour chaque
              élément, sous quelle condition.

              Elle a deux limites qu'il faut connaître avant d'en abuser. Une compréhension qui tient sur
              trois lignes imbriquées devient moins claire que la boucle qu'elle remplace : redevenez
              explicite. Et une compréhension construit toute la collection en mémoire ; pour un très gros
              volume, le générateur du module six sera préférable.
            code:
              - titre: "comprehensions.py, filtrer, transformer, indexer"
                langage: python
                source: |
                  releve = [("paracetamol", 2), ("serum", 1), ("paracetamol", 3), ("compresses", 4)]

                  grosses_lignes = [produit for produit, quantite in releve if quantite >= 3]

                  libelles = {code: libelle.title() for code, libelle in [("PARA", "paracetamol"), ("SER", "serum")]}

                  produits_distincts = {produit for produit, _ in releve}

                  print(grosses_lignes)
                  print(libelles)
                  print(produits_distincts)
          - titre: "La notion : immuabilité, copie et référence"
            texte: >-
              Une variable ne contient pas une liste : elle désigne une liste. Affecter une variable à une
              autre fait deux noms pour le même objet. Modifier par l'un se voit par l'autre, et ce
              comportement surprend tous les débutants au moins une fois.

              Pour obtenir un objet séparé, il faut copier explicitement. Une copie de surface duplique la
              liste mais pas les objets qu'elle contient : si la liste contient des listes, les sous-listes
              restent partagées. Une copie profonde duplique tout, à un coût plus élevé.

              L'immuabilité est la parade. Un tuple ne peut pas être modifié, donc il ne peut pas être modifié
              dans votre dos par une fonction appelée. Dans un programme qui grandit, préférer l'immuable par
              défaut supprime une famille entière de bugs, et le module quatre reprendra cette idée avec les
              dataclasses figées.
            figures:
              - nom: python-copie-liste.svg
                legende: "Deux noms pour une même liste : modifier par l'un se voit par l'autre"
          - titre: "La notion : un nom n'est pas une boîte, c'est une étiquette"
            texte: >-
              En Python, un nom ne contient pas une valeur : il désigne un objet. Quand vous écrivez une
              affectation, vous ne recopiez rien, vous collez une étiquette de plus sur un objet qui existe
              déjà. Deux noms peuvent donc désigner le même objet, et c'est la source de bugs la plus
              silencieuse du langage, parce qu'elle ne lève aucune erreur.

              Pour les nombres, les chaînes et les tuples, cela ne se voit jamais : ces objets sont immuables,
              personne ne peut les modifier, et deux étiquettes sur le même objet sont indiscernables de deux
              copies. Pour les listes, les dictionnaires et les ensembles, cela change tout : modifier l'objet
              par une étiquette le modifie pour toutes les autres.

              Le mot technique est l'aliasing : deux noms, un seul objet. Le symptôme, en production, est une
              liste qui change toute seule. Vous avez passé le relevé de la pharmacie à une fonction qui
              devait le nettoyer sans y toucher, et votre relevé d'origine revient amputé de trois lignes.

              Une copie de surface crée un nouvel objet, mais ses éléments restent les mêmes objets. Copier
              une liste de listes de cette façon protège la liste extérieure et laisse les listes intérieures
              partagées. Une copie profonde recopie tout l'arbre des objets, ce qui coûte du temps et de la
              mémoire : employez-la en connaissance de cause, pas par réflexe.

              La règle de métier qui en découle est simple et vous servira dix ans : une fonction qui reçoit
              une structure modifiable soit la modifie et le dit dans son nom, soit n'y touche pas et rend une
              structure neuve. Les fonctions qui font les deux sans prévenir sont celles que personne n'ose
              plus appeler.
            figures:
              - nom: python-copie-liste.svg
                legende: "Deux étiquettes sur le même objet, ou deux objets distincts"
          - titre: "Le geste technique : prédire la sortie avant de l'exécuter"
            texte: >-
              Le seul exercice qui ancre durablement cette notion consiste à prédire par écrit ce qu'un
              programme affichera, puis à le lancer. Tant que vous n'avez pas écrit votre prédiction, vous
              n'apprenez rien : vous lisez une explication et vous êtes d'accord avec elle, ce qui n'est pas
              la même chose.

              Prenez le programme ci-dessous et notez sur une feuille les cinq lignes qu'il affiche, dans
              l'ordre, avant de l'exécuter. Puis lancez-le et comparez. Chaque écart entre votre feuille et la
              sortie réelle désigne précisément ce que vous croyiez savoir et que vous ne saviez pas.

              Le dernier cas mérite une attention particulière : la valeur par défaut d'un paramètre est
              évaluée une seule fois, à la définition de la fonction, et non à chaque appel. Une liste donnée
              en valeur par défaut est donc partagée par tous les appels, et elle grossit d'appel en appel. La
              correction tient en une ligne : mettre None par défaut et créer la liste dans le corps de la
              fonction.
            tableaux:
              - titre: "Cinq cas, et la règle qui les explique"
                entetes: [Cas, Ce que beaucoup prédisent, Ce qui se passe vraiment]
                lignes:
                  - [Affectation simple, une copie est faite, une étiquette de plus sur le même objet]
                  - [Appel de copy, rien ne change, la liste extérieure est bien protégée]
                  - [Liste de listes copiée, tout est protégé, les listes intérieures restent partagées]
                  - [Copie profonde, identique à copy, "tout l'arbre est recopié, à son coût"]
                  - [Liste en valeur par défaut, une liste neuve par appel, une seule liste pour tous les appels]
            code:
              - titre: "predire.py, cinq sorties a ecrire avant de lancer"
                langage: python
                source: |
                  # 1
                  releve = ["CACAO-A", "CACAO-B"]
                  copie_etiquette = releve
                  copie_etiquette.append("CAFE-A")
                  print(releve)

                  # 2
                  copie_reelle = releve.copy()
                  copie_reelle.append("THE-A")
                  print(releve)

                  # 3
                  par_officine = [["CACAO-A"], ["CAFE-A"]]
                  copie_de_surface = par_officine.copy()
                  copie_de_surface[0].append("CACAO-B")
                  print(par_officine)

                  # 4
                  import copy
                  copie_profonde = copy.deepcopy(par_officine)
                  copie_profonde[1].append("CAFE-B")
                  print(par_officine)

                  # 5
                  def ajouter(code, panier=[]):
                      panier.append(code)
                      return panier

                  print(ajouter("CACAO-A"), ajouter("CAFE-A"))
          - titre: "À la main : rendre une fonction honnête avec ce qu'elle reçoit"
            texte: >-
              Reprenez une fonction de votre relevé de la pharmacie qui reçoit une liste et la trie, la filtre
              ou la complète. Écrivez d'abord un test qui prouve que la liste d'origine n'est pas modifiée par
              l'appel : construire la liste, en garder une copie, appeler la fonction, comparer. Ce test doit
              échouer si votre fonction modifie son entrée.

              Corrigez ensuite la fonction de la seule façon acceptable : travailler sur une copie et rendre
              un résultat neuf. Vérifiez que le test passe, puis relisez la signature et le nom de la
              fonction. Un nom comme nettoyer_le_releve annonce un résultat ; un nom comme vider_le_releve
              annonce une modification. Le nom doit dire ce que le code fait.

              Rendez les deux fichiers, le test et la fonction corrigée. Le correcteur regardera une seule
              chose : le test échoue-t-il bien sur la version d'origine. Un test qui passe dans les deux cas
              ne prouve rien du tout.
          - titre: "Le geste technique : normaliser les chaînes avant de comparer"
            texte: >-
              Un libellé saisi par six personnes différentes n'est jamais le même texte. Majuscules, espaces
              avant ou après, double espace au milieu, parfois un accent manquant. Comparer ces chaînes sans
              les normaliser produit des comptages faux, et personne ne s'en aperçoit avant le bilan mensuel.

              La normalisation est une fonction courte appliquée à l'entrée des données, au même endroit que
              la validation. Décidez une forme canonique une fois pour toutes, par exemple minuscules et
              espaces réduits, documentez-la, et appliquez-la partout.
            figures:
              - nom: python-normaliser-chaine.svg
                legende: "Une forme canonique décidée une fois évite six variantes du même produit"
            code:
              - titre: "normaliser.py, une forme canonique pour les libellés"
                langage: python
                source: |
                  import unicodedata


                  def normaliser(libelle: str) -> str:
                      sans_accent = unicodedata.normalize("NFKD", libelle)
                      sans_accent = "".join(c for c in sans_accent if not unicodedata.combining(c))
                      return " ".join(sans_accent.lower().split())


                  saisies = ["  Paracetamol ", "PARACETAMOL", "paracetamol", "Paracétamol"]
                  print({normaliser(s) for s in saisies})
          - titre: "À la main : le relevé de la pharmacie"
            texte: >-
              Premier temps, construisez le relevé à partir d'une liste de couples écrite en dur, et affichez
              les totaux par produit. Vérifiez à la main sur cinq lignes avant de passer à l'échelle.

              Deuxième temps, normalisez les libellés à l'entrée et constatez la différence de comptage. Notez
              le nombre de produits distincts avant et après : c'est l'argument que vous présenterez au
              pharmacien.

              Troisième temps, calculez les cinq meilleures ventes, puis la liste des produits vendus
              aujourd'hui et pas hier à l'aide de deux ensembles. Comparez la longueur de votre solution avec
              celle d'un camarade qui n'aurait employé que des listes.

              Quatrième temps, mesurez. Multipliez le relevé par mille et chronométrez les deux approches.
              L'écart que vous constaterez est la meilleure leçon de la semaine, et il ne s'oublie pas.
            figures:
              - nom: devpy-m02-b.jpg
                legende: "Le relevé du soir, quatre cents lignes et douze fois le même produit"
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Ces cinq erreurs appartiennent en propre aux structures de données. Les deux dernières ne
              provoquent aucune trace : elles produisent un résultat faux, ce qui est bien plus dangereux.
            tableaux:
              - titre: "Cinq pièges de collection, dont deux silencieux"
                entetes: [Symptôme, Cause, Le geste]
                lignes:
                  - ["KeyError: 'serum'", clé absente du dictionnaire, employer get avec un repli]
                  - ["IndexError: list index out of range", index au-delà du dernier, parcourir sans index]
                  - ["TypeError: unhashable type: 'list'", une liste employée comme clé, employer un tuple]
                  - ["Un total trop élevé, sans erreur", la liste modifiée était partagée, copier explicitement]
                  - [Deux fois le même produit au palmarès, libellés non normalisés, "normaliser à l'entrée"]
          - titre: Entraînement gradué
            texte: >-
              Premier exercice, imiter. Reprenez l'agrégation et rendez le chiffre d'affaires par produit au
              lieu des quantités, en ajoutant un prix unitaire à chaque ligne de relevé.

              Deuxième exercice, varier. Groupez les ventes par jour puis par produit, c'est-à-dire un
              dictionnaire dont les valeurs sont des dictionnaires, et affichez le produit le plus vendu de
              chaque jour. Attendez-vous à une ligne de création de sous-dictionnaire : c'est exactement le
              cas d'usage de la méthode qui installe une valeur par défaut.

              Troisième exercice, créer. Écrivez un détecteur de ruptures : à partir du relevé de ventes et
              d'un stock initial par produit, rendez la liste des produits dont le stock passera sous le seuil
              d'alerte avant la fin de la semaine, triés du plus urgent au moins urgent. Justifiez par écrit
              chaque structure choisie.
          - titre: Aller plus loin cette semaine
            texte: >-
              Deux outils de la bibliothèque standard méritent un détour une fois les exercices faits. Le
              premier est un compteur tout fait, qui réalise l'agrégation de la semaine en une ligne et sait
              rendre directement le palmarès. Employez-le après avoir écrit la version à la main, jamais avant
              : on ne comprend un raccourci qu'après avoir parcouru le chemin.

              Le second est un dictionnaire à valeur par défaut automatique, pratique pour les regroupements à
              deux niveaux de l'exercice deux.

              Ce module ne couvre pas la lecture de ces données depuis un fichier, qui arrive au module cinq,
              ni leur stockage durable, qui arrive au module dix. Pour l'instant, vos données vivent en
              mémoire, le temps de l'exécution.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est la modification d'une liste pendant qu'on la parcourt. Les éléments se
              décalent, le parcours saute des valeurs, et aucune erreur ne vous prévient. Construisez une
              nouvelle liste plutôt que de modifier celle que vous parcourez.

              Le deuxième piège est la recherche répétée dans une liste. Une appartenance testée dans une
              boucle sur une liste de dix mille éléments donne cent millions de comparaisons ; le même test
              sur un ensemble en donne dix mille.

              Le troisième piège est la clé de dictionnaire non normalisée, déjà vue, mais il faut l'entendre
              deux fois : c'est la première cause de chiffres faux dans les rapports d'entreprise.
          - titre: Le mémo de la semaine
            texte: >-
              Cette table répond à la question que vous vous poserez chaque jour : quelle structure, pour quel
              besoin, et à quel coût.
            tableaux:
              - titre: Choisir sa structure en une ligne
                entetes: [Besoin, Structure, Coût de la recherche, Piège]
                lignes:
                  - ["accumuler dans l'ordre", liste, parcours complet, recherche lente]
                  - [une petite structure figée, tuple, sans objet, "non modifiable, par choix"]
                  - ["compter, indexer, agréger", dictionnaire, accès immédiat, clé absente]
                  - ["dédoublonner, comparer", ensemble, accès immédiat, "l'ordre est perdu"]
                  - [transformer une collection, compréhension, sans objet, illisible au-delà de deux niveaux]
          - titre: "Vous savez faire, si vous cochez ces six cases"
            texte: >-
              Vous annoncez la structure avant d'écrire la boucle, et vous savez la justifier. Vous découpez
              une liste par tranche sans vous tromper de borne. Vous agrégez un relevé en moins de dix lignes
              sans boucle imbriquée. Vous expliquez pourquoi deux variables peuvent désigner la même liste.
              Vous normalisez les libellés avant de les comparer. Vous savez dire ce qui change quand une
              liste passe de cent à cent mille éléments.

              Question de transfert : on vous donne deux fichiers de clients, l'un de ce mois, l'autre du mois
              dernier, et on vous demande les nouveaux clients, les partants et les fidèles. Quelle structure
              employez-vous, et combien de parcours de chaque fichier votre solution exige-t-elle ?
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un programme de traitement de données en mémoire qui lit un relevé de ventes écrit dans
              le code, normalise les libellés, calcule les totaux par produit, le palmarès des cinq meilleures
              ventes, et la comparaison avec le relevé de la veille.

              Joignez une note d'une page qui justifie chaque structure de données choisie, en une phrase
              chacune, et qui donne le nombre de parcours effectués sur le relevé. Cette note est la partie
              notée en entretien : le code se vérifie en dix secondes, le raisonnement se discute.

              Critères d'acceptation : aucune boucle imbriquée sur le relevé, aucune recherche par valeur dans
              une liste à l'intérieur d'une boucle, les libellés sont normalisés à l'entrée, et le programme
              donne le même résultat quel que soit l'ordre des lignes du relevé.
            tableaux:
              - titre: "Grille d'évaluation du livrable"
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Choix de structure, tout en listes, structure adaptée par besoin, choix justifié par le coût]
                  - [Complexité, boucles imbriquées, un seul parcours par question, index construit une fois et réutilisé]
                  - [Normalisation, absente, "appliquée à l'entrée", forme canonique documentée]
                  - [Note de justification, absente, une phrase par structure, "mesure chiffrée à l'appui"]
        livrable: Programme de traitement de données en mémoire.
        mise_en_situation: "Vous recevez une liste de ventes (produit, quantité). Proposez la structure de données la plus adaptée pour obtenir rapidement la quantité totale vendue par produit, et écrivez le code correspondant."
        quiz:
          - question: "Quelle structure est non modifiable ?"
            options: ["tuple", "list", "dict", "set"]
            bonnes: [1]
            explication: "Un tuple ne peut pas être modifié après sa création."
          - question: "Que renvoie [x * 2 for x in range(3)] ?"
            options: ["[0, 2, 4]", "[2, 4, 6]", "[0, 1, 2]", "6"]
            bonnes: [1]
            explication: "La compréhension double chaque élément de 0, 1, 2."
          - question: "Quelle structure supprime automatiquement les doublons ?"
            options: ["set", "list", "tuple", "str"]
            bonnes: [1]
            explication: "Un ensemble ne contient que des éléments uniques."
          - question: "Pourquoi une liste ne peut-elle pas servir de clé de dictionnaire ?"
            options: ["Parce qu'elle est modifiable : sa valeur de hachage changerait et la clé deviendrait introuvable", "Parce qu'elle peut contenir des doublons", "Parce qu'elle n'est pas ordonnée", "Parce qu'elle occupe trop de mémoire"]
            bonnes: [1]
            explication: "Le dictionnaire range la clé dans un seau calculé depuis son hachage. Une clé qui change de valeur change de seau : elle resterait introuvable là où elle a été rangée."
          - question: "Comment lire une clé absente d'un dict sans provoquer d'erreur ?"
            options: ["d.get('cle', 0)", "d['cle']", "d.cle", "d.read('cle')"]
            bonnes: [1]
            explication: "get renvoie une valeur par défaut si la clé n'existe pas."
      - num: "03"
        title: Fonctions & modularité
        contenu: Fonctions, portée, arguments, *args/**kwargs, modules, imports, organisation d'un projet.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous découpez un programme en fonctions courtes qui rendent des
              valeurs au lieu d'afficher, vous maîtrisez les paramètres et leurs valeurs par défaut, vous
              annotez vos signatures, vous documentez ce que fait chaque fonction en une phrase, et vous
              répartissez votre code en modules importables.

              C'est la semaine qui sépare le script du programme. Un script se lit de haut en bas et sert une
              fois. Un programme expose des fonctions nommées que l'on appelle depuis plusieurs endroits, que
              l'on teste séparément, et que l'on remplace sans tout casser.

              Le critère de réussite est brutal et simple : chaque fonction que vous écrivez doit pouvoir être
              testée avec une seule ligne d'appel et comparée à un résultat attendu. Une fonction qui ne peut
              pas l'être est une fonction mal découpée.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : quelle différence y a-t-il entre une fonction qui affiche un tarif et une
              fonction qui le rend ? Si vous répondez aucune, cette semaine va changer votre façon d'écrire.

              Deuxième question : vous écrivez une fonction dont un paramètre vaut par défaut une liste vide.
              Vous l'appelez trois fois sans donner ce paramètre. Les trois appels partagent-ils la même liste
              ? La réponse est le piège le plus célèbre du langage, et il figure dans les entretiens.

              Troisième question : votre fichier de calculs affiche un résultat de test quand un autre fichier
              l'importe. D'où vient ce comportement et comment l'empêcher ?
          - titre: "Le problème d'abord"
            texte: >-
              Une compagnie de transport interurbain relie Abidjan à Bouaké, Korhogo et San Pedro. Le tarif
              dépend de la distance, de la classe, de la saison, et une réduction s'applique aux étudiants et
              aux plus de soixante-cinq ans. Le calcul se trouve aujourd'hui recopié à cinq endroits : le
              guichet, le site, l'application, le fichier de réservation de groupe, et un tableur.

              Quand la direction change la réduction étudiante, quatre endroits sur cinq sont mis à jour. Le
              cinquième vend pendant trois semaines à l'ancien tarif, et personne ne le voit avant le bilan.

              Une seule fonction, appelée par les cinq points d'entrée, supprime la question. C'est la notion
              la plus rentable de toute l'informatique, et elle porte un nom simple : ne vous répétez pas.
            figures:
              - nom: devpy-m03-a.jpg
                legende: "Cinq guichets, un seul tarif : la règle ne doit exister qu'à un endroit"
          - titre: "La notion : une fonction rend, elle n'affiche pas"
            texte: >-
              Une fonction prend des valeurs en entrée, les transforme, et rend un résultat. Ce résultat peut
              être affiché par l'appelant, écrit dans un fichier, envoyé à une interface web, ou comparé à une
              valeur attendue par un test. Une fonction qui affiche elle-même ne peut rien faire de tout cela.

              La règle du parcours : les fonctions de calcul rendent, les fonctions d'affichage affichent, et
              on ne mélange pas les deux. Cette séparation est la version simple de ce qu'on appellera plus
              tard une architecture : le cœur métier au centre, les entrées et sorties au bord.

              Une bonne fonction est courte, fait une chose, et porte un nom qui dit cette chose. Si vous ne
              pouvez pas nommer une fonction sans employer le mot et, elle en fait deux et doit être coupée.

              Enfin, une fonction ne doit pas dépendre d'un état caché. Si son résultat dépend d'une variable
              globale, elle devient imprévisible, et deux appels identiques pourront donner deux réponses
              différentes.
            figures:
              - nom: python-fonction-entree-sortie.svg
                legende: "Des entrées, une transformation, une sortie : rien ne sort par la fenêtre"
          - titre: "Le geste technique : paramètres, défauts et arguments nommés"
            texte: >-
              Les paramètres positionnels se donnent dans l'ordre, les paramètres nommés se donnent par leur
              nom. Au-delà de deux paramètres, l'appel nommé rend le code lisible : on voit au point d'appel
              ce que signifie chaque valeur, sans aller lire la définition.

              Les valeurs par défaut servent à couvrir le cas courant sans alourdir les appels. Elles doivent
              être immuables : jamais une liste, jamais un dictionnaire, jamais un objet modifiable. La valeur
              par défaut est évaluée une seule fois, à la définition, et elle serait partagée par tous les
              appels.

              Vous pouvez forcer l'appel nommé pour les paramètres qui prêtent à confusion, ce qui interdit
              les appels illisibles où trois nombres se suivent sans qu'on sache lequel est lequel.
            code:
              - titre: "tarif.py, une signature qui se lit au point d'appel"
                langage: python
                source: |
                  TARIF_KM_FCFA = 32
                  SUPPLEMENT_VIP_FCFA = 3000
                  REDUCTIONS = {"etudiant": 0.20, "senior": 0.15, "aucune": 0.0}


                  def tarif_fcfa(distance_km: int, *, classe: str = "standard", reduction: str = "aucune") -> int:
                      if distance_km <= 0:
                          raise ValueError("la distance doit etre strictement positive")
                      if reduction not in REDUCTIONS:
                          raise ValueError(f"reduction inconnue : {reduction}")
                      base = distance_km * TARIF_KM_FCFA
                      if classe == "vip":
                          base += SUPPLEMENT_VIP_FCFA
                      return round(base * (1 - REDUCTIONS[reduction]))


                  print(tarif_fcfa(350, classe="vip", reduction="etudiant"))
          - titre: "Lire le code ligne à ligne : anatomie d'une fonction défendable"
            texte: >-
              Reprenez la fonction précédente. La signature annonce trois choses : les noms des paramètres,
              leurs types attendus, et le type du résultat. Les annotations ne sont pas vérifiées à
              l'exécution, mais elles documentent, et un outil d'analyse les vérifiera pour vous au module
              huit.

              L'étoile isolée dans la signature impose l'appel nommé pour tout ce qui la suit. Un appel qui
              donnerait trois valeurs à la file serait refusé, ce qui évite d'inverser la classe et la
              réduction sans s'en apercevoir.

              Les deux premières instructions valident les entrées et refusent explicitement ce qui n'a pas de
              sens. Un refus clair au bon endroit vaut mieux qu'un résultat absurde propagé dans tout le
              programme. Notez que la fonction lève une erreur au lieu de rendre une valeur spéciale : rendre
              moins un pour signaler une erreur est une mauvaise habitude héritée d'autres langages.

              Le calcul tient en trois lignes, et la dernière arrondit explicitement au franc entier. Le
              résultat sort par la seule porte prévue : l'instruction de retour.
          - titre: "La notion : portée des noms et effets de bord"
            texte: >-
              Un nom créé dans une fonction n'existe que pendant son exécution. Il ne se voit pas depuis
              l'extérieur, et il disparaît au retour. C'est une protection : deux fonctions peuvent employer
              le même nom de variable sans interférer.

              Depuis une fonction, vous pouvez lire une variable définie à l'extérieur, mais pas la modifier
              sans une déclaration explicite que nous vous déconseillons d'employer. Si une fonction a besoin
              d'une valeur, donnez-la lui en paramètre : c'est plus long à écrire et infiniment plus simple à
              comprendre six mois plus tard.

              Un effet de bord est toute modification visible hors de la fonction : écrire dans un fichier,
              modifier une liste reçue en paramètre, changer une variable globale. Les effets de bord ne sont
              pas interdits, ils doivent être volontaires et annoncés par le nom. Une fonction nommée calculer
              ne doit rien modifier ; une fonction nommée enregistrer, oui.
          - titre: "Le geste technique : annoter, documenter, refuser"
            texte: >-
              Trois gestes font la différence entre une fonction amateur et une fonction professionnelle.
              Annoter les types, pour que l'appelant sache ce qu'il doit donner. Documenter en une phrase ce
              que la fonction rend, pas comment elle s'y prend. Et refuser explicitement les entrées
              invalides, avec un message qui dit ce qui est attendu.

              La documentation en une phrase est un test de conception. Si vous n'arrivez pas à décrire la
              fonction sans énumérer ses étapes, elle en fait trop.
            code:
              - titre: "documentation.py, signature, phrase et refus"
                langage: python
                source: |
                  def repartir_places(total: int, groupes: list[int]) -> list[int]:
                      """Rend le nombre de places attribuees a chaque groupe, au prorata de sa taille."""
                      if total < 0:
                          raise ValueError("le total de places ne peut pas etre negatif")
                      if not groupes or any(taille <= 0 for taille in groupes):
                          raise ValueError("chaque groupe doit avoir une taille strictement positive")

                      somme = sum(groupes)
                      parts = [total * taille // somme for taille in groupes]
                      reste = total - sum(parts)
                      for i in range(reste):
                          parts[i] += 1
                      return parts


                  print(repartir_places(50, [12, 25, 8]))
          - titre: "La notion : la récursivité, se définir en fonction de soi"
            texte: >-
              Certaines données ne sont pas plates. Le dossier d'une campagne contient des dossiers
              d'officines, qui contiennent des dossiers de mois, qui contiennent des fichiers. La réponse d'un
              service de cotation contient des objets qui contiennent des listes qui contiennent d'autres
              objets. Vous ne savez pas à l'avance combien de niveaux il y aura, et une boucle sait mal
              traiter ce que l'on ne sait pas compter d'avance.

              Une fonction récursive est une fonction qui s'appelle elle-même sur une partie plus petite du
              problème. Elle tient en deux morceaux, et seulement deux. Le cas de base décrit la situation la
              plus simple, celle où la réponse est immédiate et où l'on ne rappelle plus rien. Le cas récursif
              traite un niveau, puis délègue le reste à la fonction elle-même.

              Écrivez toujours le cas de base en premier. Une fonction récursive sans cas de base ne s'arrête
              jamais, et Python finit par refuser d'aller plus loin : la profondeur maximale est fixée autour
              de mille appels, et le dépassement lève une erreur dont vous reconnaîtrez désormais la cause.

              Chaque appel en attente occupe une place dans la pile d'appels, cette pile d'assiettes que vous
              avez vue en lisant les traces d'erreur. Elle s'empile tant que les appels se créent, puis elle
              se dépile quand les réponses remontent. Comprendre la récursivité, c'est voir cette pile monter
              et redescendre.

              La récursivité est le bon outil quand la donnée elle-même est imbriquée et de profondeur
              inconnue. Elle est le mauvais outil quand vous parcourez une suite plate de deux cent mille
              lignes : la boucle est alors plus simple, plus rapide et sans limite de profondeur. Le critère
              n'est pas l'élégance, c'est la forme de la donnée.
            figures:
              - nom: python-modules-arborescence.svg
                legende: "Un dossier contient des dossiers : le même geste, à un niveau plus bas"
              - nom: devpy-m03-c.jpg
                legende: "Une poupée contient une poupée : le même geste, à une taille plus petite"
          - titre: "Le geste technique : aplatir une structure imbriquée à profondeur quelconque"
            texte: >-
              L'exercice de référence est l'aplatissement. On vous donne une structure faite de listes dans
              des listes, sans savoir jusqu'où elle descend, et vous devez rendre la suite plate de ses
              valeurs, dans l'ordre.

              Lisez la fonction dans l'ordre où Python l'exécute. Elle parcourt les éléments du niveau
              courant. Pour chaque élément, elle pose une question unique : est-ce encore une liste. Si oui,
              elle se rappelle sur cet élément et étend le résultat avec ce que l'appel lui rend. Si non, elle
              ajoute la valeur. Il n'y a rien d'autre, et c'est ce dépouillement qui fait la force du procédé.

              Le cas de base n'est pas écrit explicitement ici, et c'est fréquent : quand la liste du niveau
              courant est vide, la boucle ne s'exécute pas, la fonction rend une liste vide et la remontée
              commence. Sachez le reconnaître, car un correcteur vous demandera où est votre cas de base.

              Déroulez ensuite le même raisonnement sur une arborescence de fichiers avec pathlib. La
              structure change, le squelette reste identique : traiter ce niveau, se rappeler sur les niveaux
              inférieurs, remonter le résultat. Quand vous verrez ce squelette dans les deux cas, la
              récursivité sera acquise.
            tableaux:
              - titre: "Boucle ou récursivité : le critère est la forme de la donnée"
                entetes: [Situation, Le bon outil, Pourquoi]
                lignes:
                  - [Relevé de 200 000 lignes, boucle, "la donnée est plate, et la pile est limitée"]
                  - [Réponse JSON profondément imbriquée, récursivité, la profondeur est inconnue]
                  - [Arborescence de dossiers, récursivité, un dossier contient des dossiers]
                  - ["Somme d'une colonne", boucle ou somme intégrée, aucun niveau à descendre]
                  - [Même calcul répété sur les mêmes entrées, mémoire de calcul, la récursion nue recalcule tout]
            code:
              - titre: "aplatir.py, le meme squelette sur deux structures"
                langage: python
                source: |
                  from pathlib import Path


                  def aplatir(structure: list) -> list:
                      valeurs = []
                      for element in structure:
                          if isinstance(element, list):
                              valeurs.extend(aplatir(element))
                          else:
                              valeurs.append(element)
                      return valeurs


                  def peser_le_dossier(dossier: Path) -> int:
                      """Taille totale en octets, dossiers imbriques compris."""
                      total = 0
                      for entree in dossier.iterdir():
                          if entree.is_dir():
                              total += peser_le_dossier(entree)
                          else:
                              total += entree.stat().st_size
                      return total


                  livraisons = [["CACAO-A", 120], [["CACAO-B", 80], [["CAFE-A", 45]]]]
                  assert aplatir(livraisons) == ["CACAO-A", 120, "CACAO-B", 80, "CAFE-A", 45]
                  print(peser_le_dossier(Path(".")), "octets")
          - titre: "La notion : modules, imports et le garde du point d'entrée"
            texte: >-
              Un module est simplement un fichier Python. L'importer exécute son contenu une première fois et
              met ses noms à votre disposition. Un paquet est un dossier de modules, reconnaissable à son
              fichier d'initialisation.

              Importez des noms précis plutôt que tout le contenu d'un module : le lecteur voit d'où vient
              chaque fonction, et vous évitez les collisions de noms. Évitez l'import qui aspire tout : il
              rend impossible de savoir qui définit quoi.

              Tout fichier exécute son code de haut en bas quand on l'importe. Si votre fichier de calculs
              contient des appels de démonstration, ces appels se déclencheront chez celui qui l'importe. Le
              garde du point d'entrée résout cela : le bloc qu'il protège ne s'exécute que si le fichier est
              lancé directement, jamais s'il est importé.

              Organisez vos fichiers par responsabilité, pas par type technique. Un fichier pour les règles de
              tarification, un pour la lecture des données, un pour l'interface en ligne de commande. Cette
              organisation préfigure celle que vous emploierez sur de vrais projets.
            figures:
              - nom: python-modules-arborescence.svg
                legende: "Un dossier par responsabilité : les règles, les données, l'interface"
          - titre: "Le geste technique : organiser le paquet et protéger le point d'entrée"
            texte: >-
              Voici l'arborescence minimale d'un projet à plusieurs fichiers, et le garde qui empêche le code
              de démonstration de s'exécuter à l'import. Prenez cette structure comme modèle : elle vous
              servira jusqu'au projet final.
            code:
              - titre: "Arborescence et point d'entrée protégé"
                langage: bash
                source: |
                  transport/
                    __init__.py
                    tarifs.py          # les regles metier, aucune entree-sortie
                    lecture.py         # chargement des trajets
                    cli.py             # interface en ligne de commande

                  # Dans cli.py, le garde du point d'entree :
                  #
                  #   from transport.tarifs import tarif_fcfa
                  #
                  #   def principal() -> None:
                  #       print(tarif_fcfa(350, classe="vip"))
                  #
                  #   if __name__ == "__main__":
                  #       principal()

                  python -m transport.cli
          - titre: "La notion : abstraction et décomposition, décider où couper"
            texte: >-
              Abstraire, c'est séparer ce que fait une chose de la manière dont elle le fait. Le chauffeur du
              car sait que la pédale freine ; il ignore le circuit hydraulique, et c'est précisément ce qui
              lui permet de conduire. Une fonction bien écrite offre la même promesse : son nom et ses
              paramètres disent ce qu'elle fait, son corps est votre affaire et peut changer demain.

              Cette séparation porte un nom en deux mots que vous entendrez toute votre carrière. L'interface
              est le contrat visible : le nom, les paramètres, ce qui est rendu, ce qui est refusé.
              L'implémentation est le moyen choisi aujourd'hui : la boucle, le dictionnaire, la bibliothèque
              appelée. Le contrat engage les autres, le moyen n'engage que vous.

              Décomposer, c'est découper un problème en morceaux dont chacun a un contrat clair. Le bon
              critère de découpe n'est pas le nombre de lignes : c'est la phrase. Si vous pouvez décrire ce
              que fait un morceau en une phrase sans employer le mot et puis, la découpe est bonne. Si votre
              phrase contient trois et puis, vous avez un morceau qui en cache trois.

              Un deuxième critère se vérifie sans discussion : les choses qui changent ensemble vivent
              ensemble, les choses qui changent pour des raisons différentes vivent séparément. Le calcul du
              tarif change quand la direction change ses prix ; l'affichage du tarif change quand le guichet
              change de formulaire. Ce sont deux raisons différentes, donc deux endroits différents.

              Une abstraction réussie se reconnaît à un test simple, et c'est celui que vous allez faire :
              vous changez complètement l'intérieur, et personne autour n'a besoin d'être prévenu. Si le
              changement oblige à modifier les appelants ou les tests, l'abstraction fuit, et le contrat était
              mal posé.
            figures:
              - nom: python-fonction-entree-sortie.svg
                legende: "Le contrat visible d'un côté, le moyen choisi de l'autre"
          - titre: "Le geste technique : changer l'implémentation sans toucher aux appelants ni aux tests"
            texte: >-
              Voici l'exercice qui prouve une abstraction. Vous disposez d'une fonction qui donne le tarif
              d'un trajet, d'un appelant qui l'utilise, et de tests qui décrivent les règles commerciales. La
              première implémentation parcourt une liste de tarifs : elle est lente et personne ne s'en plaint
              encore.

              Remplacez-la par une implémentation qui construit un index une fois pour toutes. Vous n'avez le
              droit de toucher ni à l'appelant, ni aux tests, ni à la signature de la fonction. Si vous y
              parvenez, votre contrat était juste. Si vous devez modifier un test parce qu'il vérifiait un
              détail interne, ce test vérifiait l'implémentation et non la règle : c'est lui qu'il faut
              corriger, et la leçon est encore plus précieuse.

              Observez dans le code que le changement reste entièrement enfermé derrière une seule ligne de
              contrat. Le module expose tarif_fcfa ; qu'il y ait derrière une liste parcourue, un dictionnaire
              ou, demain, une requête vers une base, l'appelant l'ignore et continue de fonctionner.

              Rendez les deux versions, les tests inchangés qui passent sur l'une comme sur l'autre, et trois
              lignes qui nomment ce qui était l'interface et ce qui était l'implémentation. Cette distinction,
              posée dès maintenant, est exactement ce qui rendra lisible l'architecture en couches de la
              dernière semaine du parcours.
            tableaux:
              - titre: "Interface ou implémentation : qui a le droit de changer"
                entetes: [Élément, Nature, Qui est prévenu si cela change]
                lignes:
                  - [Le nom de la fonction, interface, tous les appelants]
                  - [Les paramètres et leur ordre, interface, tous les appelants]
                  - [Le type rendu et les refus, interface, tous les appelants]
                  - [La boucle ou le dictionnaire, implémentation, personne]
                  - ["Le nom d'une variable interne", implémentation, personne]
            code:
              - titre: "tarifs.py, un contrat stable sur deux implementations"
                langage: python
                source: |
                  GRILLE = [
                      ("Abidjan", "Bouake", 7_000),
                      ("Abidjan", "Korhogo", 12_500),
                      ("Bouake", "Korhogo", 6_000),
                  ]


                  # Premiere implementation : on parcourt la grille a chaque demande.
                  def tarif_fcfa(depart: str, arrivee: str) -> int:
                      for ville_depart, ville_arrivee, prix_fcfa in GRILLE:
                          if (ville_depart, ville_arrivee) == (depart, arrivee):
                              return prix_fcfa
                      raise ValueError(f"aucun tarif pour {depart} vers {arrivee}")


                  # Deuxieme implementation : on construit l'index une fois. Meme contrat, meme nom.
                  _INDEX = {(depart, arrivee): prix for depart, arrivee, prix in GRILLE}


                  def tarif_fcfa(depart: str, arrivee: str) -> int:  # noqa: F811
                      try:
                          return _INDEX[(depart, arrivee)]
                      except KeyError:
                          raise ValueError(f"aucun tarif pour {depart} vers {arrivee}") from None


                  # L'appelant et les tests ne changent pas d'une ligne.
                  assert tarif_fcfa("Abidjan", "Bouake") == 7_000
                  try:
                      tarif_fcfa("Abidjan", "Daloa")
                  except ValueError as refus:
                      print(refus)
          - titre: "À la main : le tarificateur de la compagnie"
            texte: >-
              Premier temps, écrivez la fonction de tarif avec ses validations, et appelez-la depuis le même
              fichier avec cinq jeux de valeurs dont deux invalides. Vérifiez que les refus sont clairs.

              Deuxième temps, sortez la fonction dans un module dédié et importez-la depuis un fichier
              d'interface. Constatez que le module de règles ne contient plus aucun affichage.

              Troisième temps, ajoutez une deuxième règle, la majoration de saison, dans une fonction séparée,
              puis composez les deux. Résistez à la tentation d'ajouter un paramètre de plus à la première
              fonction : une fonction qui prend sept paramètres est un signal d'alarme.

              Quatrième temps, écrivez cinq appels de vérification avec leur résultat attendu, en commentaire.
              Au module huit, ces cinq lignes deviendront vos premiers tests automatiques, presque sans
              modification.
            figures:
              - nom: devpy-m03-b.jpg
                legende: "Le guichet, la gare routière et le site vendent le même trajet au même prix"
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Les trois premières lignes de ce tableau produisent une trace. Les deux dernières ne produisent
              rien du tout : elles donnent un résultat faux ou un comportement surprenant, et c'est pour cela
              qu'elles méritent votre attention.
            tableaux:
              - titre: Cinq erreurs de fonction et de module
                entetes: [Symptôme, Cause, Le geste]
                lignes:
                  - ["TypeError: tarif_fcfa() missing 1 required positional argument", un paramètre obligatoire oublié, "lire la signature, nommer les arguments"]
                  - ["ImportError: cannot import name 'tarif_fcfa'", "le nom n'existe pas dans le module visé", "vérifier le fichier et l'orthographe"]
                  - ["ModuleNotFoundError: No module named 'transport'", "le dossier courant n'est pas la racine du paquet", "lancer avec l'option de module"]
                  - [La valeur par défaut se souvient du dernier appel, un objet modifiable en valeur par défaut, employer None puis créer dans le corps]
                  - ["Un affichage parasite à l'import", du code de démonstration non protégé, "poser le garde du point d'entrée"]
          - titre: Entraînement gradué
            texte: >-
              Premier exercice, imiter. Écrivez une fonction qui rend le montant d'un billet aller-retour avec
              une remise de dix pour cent sur le retour, en réutilisant la fonction de tarif simple, sans
              recopier son calcul.

              Deuxième exercice, varier. Écrivez une fonction qui prend une liste de trajets et rend le
              chiffre d'affaires total ainsi que le trajet le plus rentable. Elle ne doit rien afficher, et
              elle doit tenir en moins de quinze lignes.

              Troisième exercice, créer. Construisez un petit paquet de trois modules : les règles, la lecture
              des trajets depuis une liste en mémoire, et une interface en ligne de commande qui accepte une
              distance et une classe en arguments. Aucune fonction de règle ne doit contenir d'affichage, et
              le module de règles doit pouvoir être importé sans rien exécuter.
          - titre: Aller plus loin cette semaine
            texte: >-
              Deux prolongements utiles. Le premier est le paramétrage par liste d'arguments variable, qui
              permet d'écrire une fonction acceptant un nombre quelconque de valeurs. Employez-le avec
              parcimonie : il rend la signature moins informative.

              Le second est la fonction comme valeur. En Python, une fonction peut être rangée dans une
              variable, passée en paramètre, ou rendue par une autre fonction. C'est la base des décorateurs
              du module six et des clés de tri que vous avez déjà employées.

              Ce module ne traite pas des exceptions personnalisées, qui arrivent au module cinq, ni des tests
              automatiques, qui arrivent au module huit. Vos cinq appels de vérification en commentaire sont
              une préparation volontaire à ce module.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est la valeur par défaut modifiable, déjà citée et jamais assez. Écrivez None
              comme valeur par défaut et créez la liste dans le corps de la fonction.

              Le deuxième piège est la fonction qui affiche au lieu de rendre. Elle paraît commode le premier
              jour, elle rend le code intestable le dixième.

              Le troisième piège est l'import circulaire : deux modules qui s'importent mutuellement. Le
              symptôme est un nom partiellement initialisé, le remède est de déplacer la règle commune dans un
              troisième module que les deux importent.
          - titre: Le mémo de la semaine
            texte: >-
              Cette table réunit les écritures de la semaine et ce qu'elles coûtent quand on les emploie mal.
            tableaux:
              - titre: Aide-mémoire des fonctions et des modules
                entetes: [Écriture, "Ce qu'elle fait", Le piège]
                lignes:
                  - ["def f(a, b=2)", paramètre avec valeur par défaut, jamais une liste en défaut]
                  - ["def f(a, *, b)", "force l'appel nommé pour b", appel positionnel refusé]
                  - [return valeur, rend le résultat, "ce n'est pas un print"]
                  - [raise ValueError(message), refuse une entrée invalide, ne jamais rendre moins un à la place]
                  - [from module import nom, importe un nom précis, "l'import total masque l'origine"]
                  - ["if __name__ == '__main__':", "protège le point d'entrée", "sans lui, l'import exécute tout"]
          - titre: "Vous savez faire, si vous cochez ces six cases"
            texte: >-
              Vos fonctions de calcul ne contiennent aucun affichage. Vous nommez vos paramètres à l'appel
              quand ils sont plus de deux. Vous refusez explicitement les entrées invalides avec un message
              utile. Vous annotez vos signatures et vous documentez en une phrase. Vous savez expliquer
              pourquoi une liste en valeur par défaut est dangereuse. Vous organisez vos fichiers par
              responsabilité et vous protégez votre point d'entrée.

              Question de transfert : on vous confie un fichier de huit cents lignes sans aucune fonction. Par
              quoi commencez-vous, et comment vous assurez-vous de ne rien casser pendant le découpage,
              sachant que vous n'avez pas encore de tests automatiques ?
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un paquet de trois modules au minimum, qui calcule des tarifs de transport : un module de
              règles sans aucune entrée-sortie, un module de données, et une interface en ligne de commande
              protégée par le garde du point d'entrée.

              Joignez dix appels de vérification avec leur résultat attendu, et une note d'une demi-page qui
              explique votre découpage : pourquoi ces modules, pourquoi ces fonctions, et ce que vous auriez
              fait différemment si la compagnie desservait trois cents destinations.

              Critères d'acceptation : aucune fonction de règle n'affiche quoi que ce soit, aucune valeur par
              défaut n'est modifiable, chaque fonction publique est annotée et documentée en une phrase,
              importer le module de règles n'exécute rien, et les dix vérifications passent.
            tableaux:
              - titre: "Grille d'évaluation du livrable"
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Séparation, les règles affichent, calcul et affichage séparés, "le module de règles n'importe aucune entrée-sortie"]
                  - [Signatures, aucune annotation, types et phrase de documentation, appels nommés imposés là où il faut]
                  - [Refus, valeurs spéciales en retour, erreurs levées avec message, messages qui disent quoi corriger]
                  - [Découpage, une fonction fourre-tout, "une fonction, une responsabilité", le découpage tient si le métier grossit]
        livrable: Petit utilitaire structuré en modules.
        mise_en_situation: "Un script de 300 lignes calcule des factures, envoie des SMS et écrit des fichiers, le tout dans une seule fonction. Proposez un découpage en fonctions et en modules, en justifiant vos choix."
        quiz:
          - question: "Que reçoit une fonction définie avec *args ?"
            options: ["Un tuple d'arguments positionnels", "Un dictionnaire", "Une liste obligatoire", "Rien"]
            bonnes: [1]
            explication: "*args regroupe les arguments positionnels supplémentaires dans un tuple."
          - question: "Qu'arrive-t-il à une fonction récursive dont le cas de base n'est jamais atteint ?"
            options: ["Elle empile les appels jusqu'à épuiser la pile et lève RecursionError", "Elle renvoie None", "Elle boucle sans jamais consommer de mémoire", "Python détecte le cycle et s'arrête proprement"]
            bonnes: [1]
            explication: "Chaque appel empile un contexte. Sans cas de base atteignable, la pile se remplit : l'arrêt vers mille appels est une protection, pas une solution."
          - question: "Une variable définie dans une fonction est par défaut :"
            options: ["locale à la fonction", "globale", "partagée entre modules", "constante"]
            bonnes: [1]
            explication: "Sa portée est limitée à la fonction."
          - question: "Pourquoi éviter un argument par défaut mutable comme def f(x=[]) ?"
            options: ["La même liste est partagée entre les appels", "Python l'interdit", "C'est plus lent", "Cela crée une copie à chaque appel"]
            bonnes: [1]
            explication: "La valeur par défaut est évaluée une seule fois, à la définition."
          - question: "Que permet if __name__ == '__main__': ?"
            options: ["Exécuter du code seulement quand le fichier est lancé directement", "Importer un module", "Déclarer une classe", "Gérer une exception"]
            bonnes: [1]
            explication: "Le bloc ne s'exécute pas quand le module est importé."
  - title: "Bloc 2 — Python intermédiaire (S4–S7)"
    modules:
      - num: "04"
        title: Programmation orientée objet
        contenu: >-
          Classes, objets, attributs, méthodes, héritage, composition, encapsulation, dataclasses,
          méthodes spéciales (dunder).
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous modélisez un domaine métier avec des classes qui portent leurs
              règles, vous employez les dataclasses pour les structures de données, vous rendez immuable ce
              qui doit l'être, vous implémentez les méthodes spéciales utiles, et vous savez choisir entre
              composition et héritage au lieu de subir ce choix.

              L'objectif n'est pas d'empiler des classes. C'est de faire en sorte qu'un lecteur retrouve dans
              votre code les mots qu'emploie le gérant de la coopérative : producteur, lot, qualité, pénalité,
              paiement. Un code qui parle le métier se discute avec le métier.

              Critère de réussite : devant votre modèle, une personne qui connaît le métier mais pas Python
              doit pouvoir dire si une règle est juste ou fausse.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : quelle différence y a-t-il entre une classe et un dictionnaire ? Si votre
              classe ne contient que des attributs et aucune règle, la question mérite une vraie réponse.

              Deuxième question : deux objets représentant le même lot sont-ils égaux ? Qu'est-ce qui décide,
              et que se passe-t-il si vous ne décidez rien ?

              Troisième question : un paiement par mobile money et un paiement en espèces partagent-ils assez
              de choses pour qu'une classe hérite de l'autre, ou faut-il une autre forme de parenté ? Votre
              réponse d'aujourd'hui sera confrontée à celle de vendredi.
          - titre: "Le problème d'abord"
            texte: >-
              La coopérative suit quatre-vingt-douze producteurs. Chacun livre plusieurs lots, chaque lot a un
              poids, une qualité et un taux d'humidité. Le prix dépend de la qualité ; une pénalité de dix
              pour cent frappe les lots humides, sauf en qualité supérieure. Les paiements se font en espèces,
              par mobile money, ou par virement, avec des frais différents.

              Modélisé en dictionnaires imbriqués, ce domaine devient une suite d'accès par clé que personne
              ne relit. Une faute de frappe sur une clé ne se voit qu'à l'exécution, et seulement si le code
              passe par là. Les règles se dispersent dans des fonctions utilitaires qui finissent par se
              contredire.

              Avec des classes, chaque concept porte un nom, chaque règle vit près des données qu'elle
              concerne, et une faute de frappe sur un attribut échoue immédiatement, souvent dès l'analyse
              statique du module huit.
            figures:
              - nom: devpy-m04-a.jpg
                legende: "Producteurs, lots, qualités : le vocabulaire du métier devient le vocabulaire du code"
          - titre: "La notion : une classe nomme un concept et porte ses règles"
            texte: >-
              Une classe réunit des données et les opérations qui les concernent. Le constructeur reçoit tout
              ce qu'il faut pour que l'objet soit valide dès sa naissance. Un objet à moitié construit, dont
              on complète les attributs après coup, est une source inépuisable de bugs.

              Les méthodes expriment des règles métier, pas des manipulations techniques. Le prix d'un lot se
              calcule dans le lot, parce que cette règle ne concerne que lui. Le total dû à un producteur se
              calcule dans le producteur, parce qu'il concerne l'ensemble de ses lots.

              Une classe sans comportement est un signal : soit vous rapatriez les règles qui la concernent,
              soit vous assumez une simple structure de données et des fonctions. Le pire des deux mondes est
              l'objet anémique entouré de fonctions utilitaires qui le manipulent de l'extérieur.

              Attention enfin à la classe fourre-tout, qui grossit jusqu'à mille lignes parce qu'on y ajoute
              tout ce qui touche au sujet. Dès que deux groupes de méthodes ne partagent aucun attribut, vous
              avez deux classes.
            figures:
              - nom: python-objet-ou-composition.svg
                legende: "La règle vit près des données ; la composition avant l'héritage"
          - titre: "Le geste technique : la classe, son constructeur et ses invariants"
            texte: >-
              Le constructeur n'est pas qu'une distribution d'attributs : c'est le gardien des invariants, ces
              propriétés qui doivent rester vraies pendant toute la vie de l'objet. Un lot de poids négatif ne
              doit jamais exister ; refuser sa construction vaut mieux que corriger ses effets plus tard.

              Validez dans le constructeur, et laissez le reste du code faire confiance à l'objet. C'est la
              traduction, à l'échelle d'une classe, de la règle de validation aux frontières vue au module un.
            code:
              - titre: "domaine.py, un objet valide dès sa naissance"
                langage: python
                source: |
                  PRIX_PAR_QUALITE_FCFA = {"superieure": 1400, "courante": 1100, "limite": 800}
                  PENALITE_HUMIDITE = 0.10


                  class Lot:
                      def __init__(self, poids_kg: int, qualite: str, humide: bool = False) -> None:
                          if poids_kg <= 0:
                              raise ValueError("le poids d'un lot est strictement positif")
                          if qualite not in PRIX_PAR_QUALITE_FCFA:
                              raise ValueError(f"qualite inconnue : {qualite}")
                          self.poids_kg = poids_kg
                          self.qualite = qualite
                          self.humide = humide

                      def prix_fcfa(self) -> int:
                          base = self.poids_kg * PRIX_PAR_QUALITE_FCFA[self.qualite]
                          if self.humide and self.qualite != "superieure":
                              return round(base * (1 - PENALITE_HUMIDITE))
                          return base


                  print(Lot(100, "courante", humide=True).prix_fcfa())
          - titre: "Lire le code ligne à ligne : ce que fait le premier paramètre"
            texte: >-
              Le premier paramètre de chaque méthode désigne l'objet sur lequel la méthode est appelée. Il
              n'est pas magique : c'est une convention explicite, et c'est ce qui rend Python lisible. Quand
              vous écrivez un appel de méthode, l'objet placé avant le point devient ce premier paramètre.

              Les affectations du constructeur créent les attributs de l'instance. Chaque objet a les siens :
              deux lots construits séparément ne partagent rien. C'est différent d'un attribut déclaré au
              niveau de la classe, qui est commun à toutes les instances, et qui doit donc rester une
              constante.

              La méthode de prix ne reçoit aucun paramètre en plus de l'objet : tout ce dont elle a besoin est
              déjà dans l'objet. C'est le signe d'un bon découpage. Si une méthode a besoin de trois
              paramètres extérieurs, elle appartient peut-être ailleurs.

              Remarquez enfin que la règle de pénalité est écrite une fois, à l'endroit où elle a du sens. Le
              jour où la direction exemptera aussi la qualité courante, une seule ligne changera, et tout le
              programme en bénéficiera.
          - titre: "La notion : la dataclass, et la force de l'immuable"
            texte: >-
              Pour une structure de données, écrire à la main le constructeur, l'égalité et la représentation
              est du travail perdu. La dataclass les engendre à partir des attributs annotés, et le code se
              réduit à ce qui compte.

              Une dataclass figée refuse toute modification après construction. Cette contrainte paraît
              gênante et elle est libératrice : un objet immuable peut être partagé sans précaution, employé
              comme clé de dictionnaire, et il ne changera jamais dans votre dos à cause d'une fonction
              lointaine.

              Attention aux attributs modifiables : une liste déclarée comme valeur par défaut serait partagée
              par toutes les instances, exactement comme la valeur par défaut d'une fonction. La dataclass
              impose d'employer une fabrique de valeur par défaut, ce qui transforme le piège en erreur
              immédiate.

              Règle du parcours : immuable par défaut, modifiable quand c'est justifié et documenté.
            figures:
              - nom: devpy-m04-b.jpg
                legende: "Ce qui est scellé ne se modifie pas en route : la même garantie en code"
          - titre: "Le geste technique : dataclass, champ et fabrique"
            texte: >-
              Voici le même domaine en dataclasses. Comparez le volume de code avec la version précédente,
              puis regardez ce que vous obtenez en plus : une égalité par valeur, une représentation lisible,
              et le refus des modifications.

              La méthode de validation après construction permet de garder les invariants, même avec une
              dataclass figée : elle s'exécute une fois, juste après la construction.
            code:
              - titre: "domaine_dataclass.py, moins de code, plus de garanties"
                langage: python
                source: |
                  from dataclasses import dataclass, field

                  PRIX_PAR_QUALITE_FCFA = {"superieure": 1400, "courante": 1100, "limite": 800}


                  @dataclass(frozen=True)
                  class Lot:
                      poids_kg: int
                      qualite: str
                      humide: bool = False

                      def __post_init__(self) -> None:
                          if self.poids_kg <= 0:
                              raise ValueError("le poids d'un lot est strictement positif")

                      def prix_fcfa(self) -> int:
                          base = self.poids_kg * PRIX_PAR_QUALITE_FCFA[self.qualite]
                          return round(base * 0.9) if self.humide and self.qualite != "superieure" else base


                  @dataclass
                  class Producteur:
                      nom: str
                      lots: list[Lot] = field(default_factory=list)

                      def total_fcfa(self) -> int:
                          return sum(lot.prix_fcfa() for lot in self.lots)


                  print(Lot(100, "courante") == Lot(100, "courante"))
          - titre: "La notion : les méthodes spéciales qui servent vraiment"
            texte: >-
              Python s'appuie sur des méthodes à nom encadré pour faire fonctionner ses opérateurs. Vous
              n'avez pas besoin de les connaître toutes : quatre suffisent dans la vie professionnelle
              courante.

              La représentation lisible décide de ce qu'affiche un print sur votre objet. Sans elle, vous
              verrez une adresse mémoire inutile dans tous vos journaux et toutes vos traces d'erreur. C'est
              le premier geste de confort, et il se paie en heures gagnées au débogage.

              L'égalité décide de ce que signifie comparer deux objets. Par défaut, deux objets distincts ne
              sont jamais égaux, même avec les mêmes valeurs. Les dataclasses l'engendrent par valeur, ce qui
              correspond presque toujours à l'intention.

              L'ordre permet le tri. Déclaré sur une dataclass, il compare les attributs dans l'ordre de
              déclaration, ce qui n'est pas toujours ce que vous voulez : donnez plutôt une clé de tri
              explicite quand le critère est métier. Enfin, la longueur et l'appartenance rendent vos objets
              conteneurs utilisables avec les constructions du langage.
          - titre: "La notion : composition, héritage, et contrat de service"
            texte: >-
              L'héritage sert quand un objet est vraiment un cas particulier d'un autre et que tout ce qui est
              vrai du parent reste vrai de l'enfant. Dans la pratique professionnelle, ce cas est rare, et
              trois niveaux d'héritage signalent presque toujours une erreur de conception.

              La composition est le cas courant : un objet en contient un autre et lui délègue ce qui le
              concerne. Un producteur contient ses lots ; il n'est pas une sorte de lot. Cette relation se
              modifie sans rien casser, là où une hiérarchie d'héritage se fige.

              Quand plusieurs classes doivent offrir le même service sans partager de code, décrivez le
              contrat plutôt que de forcer une parenté. Python vérifie les contrats à l'usage : tout objet qui
              a les bonnes méthodes convient. Un protocole déclaré rend ce contrat explicite et vérifiable par
              l'analyse statique, sans imposer d'héritage.

              Pour vos trois moyens de paiement, le bon modèle n'est donc pas une classe mère Paiement dont
              tout hérite, mais un contrat Paiement que chaque moyen remplit à sa façon.
            figures:
              - nom: python-frontiere-validation.svg
                legende: "Un contrat explicite à la frontière vaut mieux qu'une parenté imposée"
          - titre: "Le geste technique : un contrat de paiement, trois mises en oeuvre"
            texte: >-
              Le protocole décrit ce qu'une classe doit savoir faire. Aucune des trois classes de paiement
              n'hérite de quoi que ce soit, et pourtant la fonction d'encaissement les accepte toutes les
              trois. Ajouter un quatrième moyen de paiement demain ne touchera aucune ligne existante.

              C'est la forme la plus simple du principe d'ouverture et de fermeture : ouvert à l'extension,
              fermé à la modification. Nous y reviendrons lors des projets.
            code:
              - titre: "paiements.py, un contrat, trois classes, aucune hiérarchie"
                langage: python
                source: |
                  from dataclasses import dataclass
                  from typing import Protocol


                  class Paiement(Protocol):
                      def frais_fcfa(self, montant_fcfa: int) -> int: ...


                  @dataclass(frozen=True)
                  class Especes:
                      def frais_fcfa(self, montant_fcfa: int) -> int:
                          return 0


                  @dataclass(frozen=True)
                  class MobileMoney:
                      taux: float = 0.01

                      def frais_fcfa(self, montant_fcfa: int) -> int:
                          return max(100, round(montant_fcfa * self.taux))


                  @dataclass(frozen=True)
                  class Virement:
                      def frais_fcfa(self, montant_fcfa: int) -> int:
                          return 1500


                  def net_a_payer_fcfa(montant_fcfa: int, moyen: Paiement) -> int:
                      return montant_fcfa - moyen.frais_fcfa(montant_fcfa)


                  print(net_a_payer_fcfa(250_000, MobileMoney()))
          - titre: "À la main : le domaine de la coopérative"
            texte: >-
              Premier temps, écrivez les classes Lot et Producteur en dataclasses, avec les validations dans
              la méthode d'après construction. Construisez trois lots et vérifiez les prix à la main avant de
              continuer.

              Deuxième temps, ajoutez la règle de pénalité et son exemption. Écrivez d'abord le cas qui échoue
              selon vous, exécutez, et constatez. Cette habitude prépare le module des tests.

              Troisième temps, ajoutez les trois moyens de paiement derrière un protocole, puis la fonction
              qui calcule le net à payer. Vérifiez qu'aucune de vos classes de paiement n'hérite d'une autre.

              Quatrième temps, écrivez la représentation lisible de vos objets et affichez un producteur avec
              ses lots. Le résultat doit se lire comme une ligne de registre de la coopérative, pas comme une
              adresse mémoire.
          - titre: "La notion : sous la liste et le dictionnaire, quatre structures à connaître"
            texte: >-
              Vous employez depuis trois semaines des listes et des dictionnaires sans savoir ce qu'il y a
              dessous. Cette semaine, vous avez appris à écrire des classes : c'est le moment de construire
              vous-même les quatre structures que tout développeur doit savoir reconnaître, parce qu'elles
              décrivent des situations que vous rencontrerez toutes les semaines.

              La pile sert quand le dernier arrivé doit être le premier servi. Annuler la dernière saisie du
              guichet, remonter une suite d'appels de fonctions, fermer des balises dans l'ordre inverse de
              leur ouverture : toutes ces situations sont des piles.

              La file sert quand le premier arrivé doit être le premier servi. La file d'attente du guichet de
              la coopérative de Gagnoa, les messages à traiter dans l'ordre d'arrivée, les tâches d'un
              traitement par lots : ce sont des files.

              La liste chaînée relie des maillons, chacun pointant vers le suivant. Elle vous apprend ce qu'un
              tableau n'est pas : insérer au milieu d'une liste chaînée ne coûte rien, mais atteindre le
              millième élément coûte mille pas, là où la liste Python y accède d'un seul coup.

              L'arbre décrit une hiérarchie : les catégories de produits d'une pharmacie, l'organigramme d'une
              coopérative, les dossiers d'un disque. Dès qu'une chose contient des choses de même nature, vous
              avez un arbre, et les structures imbriquées des fichiers JSON en sont.
            figures:
              - nom: python-liste-ou-dictionnaire.svg
                legende: "Chaque structure répond à une question : que faut-il retrouver, et dans quel ordre"
            tableaux:
              - titre: "Le coût de chaque opération, selon la structure"
                entetes: [Structure, Ajouter, Retirer, Chercher une valeur, Situation type]
                lignes:
                  - [Pile, constant, constant au sommet, linéaire, annuler la dernière action]
                  - [File, constant, constant en tête, linéaire, "servir dans l'ordre d'arrivée"]
                  - [Liste chaînée, constant en tête, constant si on tient le maillon, linéaire, insérer souvent au milieu]
                  - [Arbre, selon la profondeur, selon la profondeur, parcours complet, hiérarchie de catégories]
                  - [Dictionnaire Python, constant, constant, constant, retrouver par identifiant]
          - titre: "Le geste technique : la pile et la file, écrites avec vos classes"
            texte: >-
              Les deux structures tiennent en une vingtaine de lignes chacune. Remarquez que l'attribut qui
              porte les éléments commence par un souligné : il est interne, personne ne doit y toucher de
              l'extérieur. C'est l'encapsulation de cette semaine appliquée à une structure réelle.

              Remarquez aussi que la pile refuse de dépiler quand elle est vide, en levant une erreur claire,
              plutôt que de rendre une valeur vide qui ferait planter le programme trois fonctions plus loin.
              La file s'appuie sur deque, parce que retirer en tête d'une liste Python oblige la machine à
              décaler tous les éléments restants : un coût linéaire là où deque reste constant.

              La méthode spéciale de longueur, vue plus haut cette semaine, rend vos structures utilisables
              comme les types natifs : len fonctionne, et un objet vide est reconnu comme faux dans un test.
            code:
              - titre: "structures.py, la pile et la file"
                langage: python
                source: |
                  from collections import deque


                  class Pile:
                      """Dernier arrive, premier servi : annuler la derniere saisie du guichet."""

                      def __init__(self) -> None:
                          self._elements: list = []

                      def empiler(self, element) -> None:
                          self._elements.append(element)

                      def depiler(self):
                          if not self._elements:
                              raise IndexError("pile vide : rien a annuler")
                          return self._elements.pop()

                      def sommet(self):
                          return self._elements[-1] if self._elements else None

                      def __len__(self) -> int:
                          return len(self._elements)


                  class File:
                      """Premier arrive, premier servi : la file d'attente du guichet de Gagnoa."""

                      def __init__(self) -> None:
                          self._elements: deque = deque()

                      def enfiler(self, element) -> None:
                          self._elements.append(element)

                      def defiler(self):
                          if not self._elements:
                              raise IndexError("file vide : aucun producteur en attente")
                          return self._elements.popleft()

                      def __len__(self) -> int:
                          return len(self._elements)
          - titre: "Le geste technique : la liste chaînée, pour comprendre ce qu'un tableau n'est pas"
            texte: >-
              La liste chaînée ne range pas ses éléments côte à côte en mémoire : chaque maillon tient sa
              valeur et l'adresse du maillon suivant. Ajouter en tête revient à créer un maillon qui pointe
              vers l'ancienne tête : trois lignes, un coût constant, quelle que soit la taille.

              Le revers est immédiat : il n'existe pas d'accès direct au centième élément. Pour l'atteindre,
              il faut suivre cent flèches. C'est exactement pour cela que les listes Python, elles, rangent
              leurs éléments côte à côte et vous donnent le centième sans détour.

              La méthode de parcours emploie le mot clé yield, vu la semaine prochaine : elle rend les valeurs
              une par une, sans jamais construire de liste intermédiaire. Écrire soi-même cette structure est
              la façon la plus rapide de comprendre pourquoi certaines opérations sont gratuites et d'autres
              coûteuses.
            code:
              - titre: "structures.py, la liste chaînée"
                langage: python
                source: |
                  from dataclasses import dataclass


                  @dataclass
                  class Maillon:
                      valeur: object
                      suivant: "Maillon | None" = None


                  class ListeChainee:
                      """Une suite de maillons : insertion en tete gratuite, acces par rang couteux."""

                      def __init__(self) -> None:
                          self.tete: Maillon | None = None

                      def ajouter_en_tete(self, valeur) -> None:
                          self.tete = Maillon(valeur, self.tete)

                      def __iter__(self):
                          courant = self.tete
                          while courant is not None:
                              yield courant.valeur
                              courant = courant.suivant

                      def __len__(self) -> int:
                          return sum(1 for _ in self)


                  chaine = ListeChainee()
                  for lot in ("LOT-003", "LOT-002", "LOT-001"):
                      chaine.ajouter_en_tete(lot)
                  print(list(chaine))   # ['LOT-001', 'LOT-002', 'LOT-003']
          - titre: "Le geste technique : l'arbre des catégories, et le parcours qui s'appelle lui-même"
            texte: >-
              La pharmacie range ses produits en catégories, qui contiennent des sous-catégories, qui
              contiennent elles-mêmes des sous-catégories. Aucune boucle simple ne sait compter les produits
              d'une telle structure, parce que personne ne connaît à l'avance le nombre de niveaux.

              La solution tient en une idée : le total d'une catégorie, c'est ses propres produits plus le
              total de chacune de ses sous-catégories. La méthode s'appelle elle-même, et s'arrête d'elle-même
              quand une catégorie n'a plus de sous-catégorie. C'est la récursivité, et un arbre est l'endroit
              où elle devient évidente plutôt qu'acrobatique.

              Le parcours rend chaque catégorie avec sa profondeur, ce qui suffit à afficher l'arbre indenté,
              à l'exporter, ou à chercher dedans. Le mot clé yield from passe la main à l'appel suivant : la
              chaîne de parcours se construit toute seule.
            figures:
              - nom: devpy-m04-c.jpg
                legende: "Une hiérarchie de rayons : chaque niveau contient des niveaux de même nature"
            code:
              - titre: "structures.py, l'arbre des catégories"
                langage: python
                source: |
                  from dataclasses import dataclass, field


                  @dataclass
                  class Categorie:
                      nom: str
                      produits: int = 0
                      sous_categories: list["Categorie"] = field(default_factory=list)

                      def total_produits(self) -> int:
                          return self.produits + sum(s.total_produits() for s in self.sous_categories)

                      def parcourir(self, profondeur: int = 0):
                          yield profondeur, self
                          for sous in self.sous_categories:
                              yield from sous.parcourir(profondeur + 1)


                  rayon = Categorie("Pharmacie", sous_categories=[
                      Categorie("Antipaludiques", produits=42),
                      Categorie("Hygiene", sous_categories=[
                          Categorie("Savons", produits=18),
                          Categorie("Pansements", produits=25),
                      ]),
                  ])

                  print(rayon.total_produits())               # 85
                  for profondeur, categorie in rayon.parcourir():
                      print("  " * profondeur + categorie.nom)
          - titre: "À la main : structures.py, testé et chiffré"
            texte: >-
              Premier temps : rassemblez les quatre structures dans un seul fichier structures.py, chacune
              avec sa docstring qui dit en une phrase à quoi elle sert et dans quelle situation la choisir.

              Deuxième temps : écrivez pour chacune au moins trois tests. Le cas nominal, le cas vide qui doit
              lever une erreur nommée, et un cas de bord : dépiler après avoir tout dépilé, défiler une file à
              un seul élément, parcourir un arbre sans sous-catégorie.

              Troisième temps : mesurez. Construisez une liste chaînée de dix mille maillons et chronométrez
              l'accès au dernier élément, puis faites la même mesure sur une liste Python. Notez les deux
              chiffres. Vous venez de rendre visible la différence entre un coût constant et un coût linéaire,
              et la semaine 06 vous donnera le vocabulaire pour la nommer.

              Quatrième temps : complétez le tableau des coûts de cette semaine avec vos propres mesures, et
              ajoutez une ligne par structure disant la situation métier où vous la choisiriez.
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Les trois premières produisent une trace immédiate. La quatrième et la cinquième sont
              silencieuses, et ce sont celles qui coûtent des journées entières.
            tableaux:
              - titre: Cinq erreurs de modélisation objet
                entetes: [Symptôme, Cause, Le geste]
                lignes:
                  - ["TypeError: __init__() missing 1 required positional argument: 'qualite'", un attribut obligatoire non donné, respecter la signature du constructeur]
                  - ["AttributeError: 'Lot' object has no attribute 'poid_kg'", faute de frappe sur un attribut, "corriger, et laisser l'analyse statique aider"]
                  - ["FrozenInstanceError: cannot assign to field 'poids_kg'", "modification d'un objet figé", construire un nouvel objet plutôt que modifier]
                  - [Deux objets identiques ne sont pas égaux, aucune égalité définie, "employer une dataclass ou définir l'égalité"]
                  - [Toutes les instances partagent la même liste, une liste en attribut de classe, employer une fabrique de valeur par défaut]
          - titre: Entraînement gradué
            texte: >-
              Premier exercice, imiter. Ajoutez une classe Livraison qui réunit un producteur, une date et une
              liste de lots, et qui rend le montant total et le poids total. Aucune de ces deux valeurs ne
              doit être stockée : elles se calculent.

              Deuxième exercice, varier. Transformez vos classes pour qu'un lot puisse être comparé et trié
              par prix décroissant, puis affichez les cinq lots les plus chers d'une livraison. Employez une
              clé de tri explicite plutôt qu'un ordre total imposé.

              Troisième exercice, créer. Modélisez un domaine de votre choix, étranger au cacao : une
              pharmacie, une école, une flotte de taxis. Au moins trois classes, au moins une immuable, au
              moins un protocole, et aucune hiérarchie d'héritage de plus d'un niveau. Écrivez en une page
              pourquoi vous avez choisi la composition là où vous l'avez choisie.
          - titre: Aller plus loin cette semaine
            texte: >-
              Trois prolongements, à explorer seulement une fois les exercices rendus. Les propriétés, qui
              permettent d'exposer un calcul comme s'il s'agissait d'un attribut, utiles pour les valeurs
              dérivées. Les énumérations, qui remplacent avantageusement les chaînes de qualité par des
              valeurs contrôlées, et qui suppriment une famille entière de fautes de frappe. Les classes
              abstraites, qui imposent la présence de méthodes, à employer quand le protocole ne suffit pas.

              Ce module ne traite pas de la persistance des objets, qui arrive au module dix avec les bases de
              données, ni de leur sérialisation, abordée au module neuf avec les interfaces de programmation.
              Un objet bien modélisé rend ces deux étapes faciles ; un objet mal modélisé les rend
              douloureuses.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est l'attribut modifiable partagé, déclaré au niveau de la classe. Toutes les
              instances le partagent, et le bug se manifeste au deuxième objet construit.

              Le deuxième piège est la hiérarchie d'héritage construite par anticipation, pour des cas qui
              n'existent pas encore. Chaque niveau ajouté coûte à chaque lecture, pour toujours.

              Le troisième piège est l'objet qui connaît trop de monde. Si votre classe de lot importe la base
              de données, l'interface web et le service de paiement, le cœur métier n'est plus au centre, et
              vous ne pourrez plus le tester seul.
          - titre: Le mémo de la semaine
            texte: >-
              Cette table dit quand employer quoi. Lisez-la avant chaque nouvelle classe que vous écrirez
              jusqu'à la fin du parcours.
            tableaux:
              - titre: "Classe, dataclass, protocole ou fonction"
                entetes: [Besoin, Le bon outil, Pourquoi]
                lignes:
                  - [grouper des valeurs liées, dataclass, ni constructeur ni égalité à écrire]
                  - [une règle métier sur ces valeurs, méthode de la classe, la règle vit près des données]
                  - [une valeur qui ne doit jamais changer, dataclass figée, partage sans risque]
                  - ["plusieurs mises en oeuvre d'un service", protocole, pas de parenté imposée]
                  - [un calcul isolé sans état, fonction, une classe sans attribut est une fonction]
                  - [un cas particulier strict, héritage, "tout ce qui vaut du parent vaut de l'enfant"]
          - titre: "Vous savez faire, si vous cochez ces six cases"
            texte: >-
              Vous écrivez une classe dont le constructeur refuse un objet invalide. Vous employez une
              dataclass quand il s'agit d'une structure de données, et vous savez la figer. Vous savez
              expliquer pourquoi deux objets aux mêmes valeurs peuvent ne pas être égaux. Vous donnez une
              représentation lisible à vos objets. Vous choisissez la composition et vous savez dire en une
              phrase pourquoi l'héritage ne convenait pas. Vous décrivez un contrat avec un protocole sans
              imposer de parenté.

              Question de transfert : votre modèle de coopérative doit accueillir demain un deuxième produit,
              le café, avec d'autres qualités et d'autres pénalités. Quelles classes changent, lesquelles ne
              changent pas, et qu'est-ce que cela dit de votre découpage actuel ?
          - titre: Le livrable de la semaine
            texte: >-
              Rendez la modélisation objet d'un domaine métier : au moins quatre classes dont une immuable, au
              moins un protocole avec deux mises en oeuvre, les règles métier portées par les objets, et un
              programme court qui construit un cas réel et affiche un résultat lisible.

              Joignez un schéma d'une page, fait à la main ou à l'ordinateur, qui montre les classes et leurs
              relations, en distinguant la composition de l'héritage. Joignez aussi dix appels de vérification
              avec leur résultat attendu.

              Critères d'acceptation : aucun attribut modifiable partagé, aucune classe sans comportement,
              aucune hiérarchie de plus d'un niveau, les objets refusent les états invalides dès la
              construction, et un lecteur du métier reconnaît ses mots dans vos noms de classes et de
              méthodes.
            tableaux:
              - titre: "Grille d'évaluation du livrable"
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Vocabulaire, des noms techniques, les mots du métier, un expert métier relit et corrige une règle]
                  - [Invariants, objets modifiables sans contrôle, validation à la construction, immuabilité partout où elle est possible]
                  - [Parenté, héritage par commodité, composition justifiée, protocole explicite et extensible]
                  - [Lisibilité, "adresses mémoire à l'affichage", représentation lisible, la sortie se lit comme un registre métier]
        livrable: Modélisation objet d'un domaine métier.
        mise_en_situation: "Modélisez en classes une pharmacie de quartier : médicaments, stock, ventes et ordonnances. Indiquez quelles règles métier chaque classe protège et où vous utilisez la composition plutôt que l'héritage."
        quiz:
          - question: "À quoi sert __init__ ?"
            options: ["Initialiser un nouvel objet", "Détruire un objet", "Importer une classe", "Afficher un objet"]
            bonnes: [1]
            explication: "C'est le constructeur appelé à la création de l'instance."
          - question: "L'encapsulation consiste à :"
            options: ["protéger l'état interne d'un objet derrière ses méthodes", "copier un objet", "hériter de plusieurs classes", "convertir un objet en texte"]
            bonnes: [1]
            explication: "On empêche les modifications incohérentes de l'état."
          - question: "Vous insérez sans cesse en tête d'une collection. Quelle structure choisissez-vous, et pourquoi ?"
            options: ["Une liste chaînée ou une file à deux bouts : l'insertion en tête y coûte un temps constant", "Une liste Python : insert(0, x) est aussi rapide qu'append", "Un dictionnaire, puisqu'il garde l'ordre d'insertion", "Un ensemble, le plus rapide des quatre"]
            bonnes: [1]
            explication: "insert(0, x) décale tous les éléments déjà présents : son coût croît avec la taille. Une liste chaînée ou un deque insère en tête à coût constant."
          - question: "« Une voiture a un moteur » se modélise plutôt par :"
            options: ["la composition", "l'héritage", "une variable globale", "un décorateur"]
            bonnes: [1]
            explication: "La relation « a un » appelle la composition ; « est un » appelle l'héritage."
          - question: "Que permet super().__init__() dans une sous-classe ?"
            options: ["Appeler le constructeur de la classe parente", "Créer une nouvelle classe", "Supprimer l'héritage", "Rendre la classe abstraite"]
            bonnes: [1]
            explication: "Cela réutilise l'initialisation de la classe parente."
      - num: "05"
        title: Gestion des erreurs & fichiers
        contenu: >-
          Exceptions, try/except, context managers, lecture/écriture (texte, CSV, JSON), pathlib et OS.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous écrivez des programmes qui survivent aux données réelles. Vous
              lisez une trace d'erreur en dix secondes et vous nommez la ligne fautive. Vous attrapez les
              exceptions que vous savez traiter, vous laissez remonter les autres, et vous inventez vos
              propres exceptions quand le métier le demande.

              Vous savez aussi ouvrir un fichier sans jamais le laisser ouvert, déclarer un encodage, lire un
              CSV de cent mille lignes sans saturer la machine, écrire du JSON relisible, et journaliser ce
              qui s'est passé sans jamais recopier un numéro de téléphone ou un jeton dans un journal.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : quand votre programme rencontre une ligne qu'il ne sait pas lire, que fait-
              il aujourd'hui ? S'il s'arrête, il perd le travail déjà fait. S'il continue en silence, il ment
              sur ses résultats. Aucune des deux réponses n'est acceptable.

              Deuxième question : si on vous donne une trace d'erreur de quinze lignes, par quelle extrémité
              la lisez-vous ? Troisième question : où écrivez-vous ce que votre programme a fait, et qui le
              lira à trois heures du matin ? Gardez vos réponses, vous les relirez vendredi.
          - titre: "Le problème d'abord : trois mille lignes et une virgule de trop"
            texte: >-
              La coopérative de Gagnoa reçoit chaque lundi le relevé mobile money de ses paiements : environ
              trois mille lignes, un export du fournisseur. Les montants sont parfois notés 125 000, parfois
              125000, parfois vides. Les dates arrivent en trois formats. Deux cents lignes portent un numéro
              de téléphone mal saisi.

              Le script actuel s'arrête à la ligne 412 avec une erreur de conversion, après avoir traité
              quatre cents lignes sans rien enregistrer. La trésorière recommence à la main. Le programme que
              vous écrirez cette semaine traitera les lignes valides, rejettera les autres avec leur numéro et
              leur raison, et rendra un compte rendu que la trésorière peut corriger dans son tableur.
            figures:
              - nom: devpy-m05-a.jpg
                legende: "Un relevé que personne ne sait relire coûte plus cher qu'un relevé absent"
          - titre: "La notion : une exception est un chemin prévu, pas un accident"
            texte: >-
              Quand Python ne peut pas poursuivre, il lève une exception : il interrompt le fil courant et
              cherche, en remontant les appels, quelqu'un qui sache quoi faire. Si personne ne se déclare, le
              programme s'arrête et imprime la trace. L'exception n'est donc pas un bug : c'est un mécanisme
              de transmission de responsabilité.

              Cela change la façon d'écrire. Vous n'avez pas à tester toutes les conditions avant d'agir :
              vous tentez, et vous traitez l'échec là où vous savez quoi en faire. Une fonction de bas niveau
              signale le problème ; une fonction de haut niveau décide d'abandonner, de passer à la ligne
              suivante ou de demander à l'utilisateur.
            figures:
              - nom: python-trace-erreur.svg
                legende: "La trace se lit du bas vers le haut : le type, puis le lieu, puis la cause"
          - titre: "Le geste technique : lire une trace de bas en haut"
            texte: >-
              Une trace d'erreur se lit par la fin. La dernière ligne donne le type de l'exception et son
              message : c'est le quoi. Juste au-dessus se trouve la ligne de votre code qui a échoué : c'est
              le où. Les lignes précédentes racontent le chemin d'appels : c'est le comment on en est arrivé
              là.

              Dans la trace ci-dessous, le quoi est une conversion impossible, le où est la ligne 14 de
              lecture.py, et le comment dit que l'appel venait du traitement de la ligne 412. Trois
              informations, trois secondes de lecture, et vous savez quoi corriger.
            code:
              - titre: "Une trace réelle, annotée par la lecture"
                langage: text
                source: |
                  Traceback (most recent call last):
                    File "traiter.py", line 31, in <module>
                      releve = lire_fichier("releve-2026-11.csv")
                    File "traiter.py", line 22, in lire_fichier
                      paiements.append(lire_paiement(ligne))
                    File "lecture.py", line 14, in lire_paiement
                      montant = int(ligne["montant"])
                  ValueError: invalid literal for int() with base 10: '125 000'
          - titre: "Lire le code ligne à ligne : ce que la trace vous apprend"
            texte: >-
              La dernière ligne nomme ValueError et montre la valeur fautive entre apostrophes : 125 000, avec
              une espace insécable de séparation des milliers. Le problème n'est donc pas la ligne 412 du
              fichier en général, c'est la façon dont le fournisseur écrit ses montants.

              La ligne juste au-dessus montre le coupable : int appliqué directement à une chaîne venue de
              l'extérieur. La correction ne consiste pas à entourer l'appel d'un filet, mais à nettoyer la
              chaîne avant de convertir, puis à traiter proprement le cas où le nettoyage ne suffit pas. Un
              filet posé sans comprendre la cause déplace le problème au lieu de le résoudre.
            code:
              - titre: "Nettoyer avant de convertir, puis traiter l'échec"
                langage: python
                source: |
                  def lire_montant(valeur: str) -> int:
                      # les espaces normales, insecables et fines servent de separateur de milliers
                      nettoyee = valeur.replace("\u00a0", "").replace("\u202f", "").replace(" ", "")
                      nettoyee = nettoyee.replace(",", ".")
                      if not nettoyee:
                          raise LigneInvalide("montant vide")
                      try:
                          return round(float(nettoyee))
                      except ValueError as erreur:
                          raise LigneInvalide(f"montant illisible : {valeur!r}") from erreur
          - titre: "La notion : attraper ce que l'on sait traiter, laisser remonter le reste"
            texte: >-
              La règle tient en une phrase : n'attrapez une exception que si vous savez quoi faire ensuite.
              Attraper pour écrire pass, c'est transformer un incident visible en comportement inexplicable
              trois semaines plus tard.

              Attrapez au plus près, et nommez l'exception précisément. Un except nu, ou un except Exception
              posé par confort, avale aussi vos propres fautes de frappe, les interruptions clavier et les
              arrêts demandés par le système. Le programme paraît robuste et il est devenu aveugle.
            tableaux:
              - titre: "Attraper, ou laisser remonter"
                entetes: [Situation, Le geste juste, Pourquoi]
                lignes:
                  - [Fichier absent, "attraper, expliquer, sortir", "l'utilisateur peut corriger le chemin"]
                  - [Ligne mal formée, "attraper, consigner, continuer", les autres lignes restent traitables]
                  - [Clé absente dans votre dictionnaire, laisser remonter, "c'est un bug, il doit se voir"]
                  - [Mémoire insuffisante, laisser remonter, rien de sensé à tenter à ce niveau]
                  - [Interruption clavier, laisser remonter, "l'utilisateur a demandé l'arrêt"]
          - titre: "Le geste technique : des exceptions métier qui portent un nom du métier"
            texte: >-
              Les exceptions de la bibliothèque standard décrivent des accidents techniques : une conversion
              impossible, une clé absente. Votre programme, lui, a des refus métier : un montant négatif, un
              numéro de téléphone hors format ivoirien, un paiement en double.

              Donnez-leur une classe et un nom. L'appelant peut alors distinguer ce qui relève de la donnée de
              ce qui relève du code, et votre message d'erreur devient compréhensible par la trésorière. Une
              hiérarchie à deux niveaux suffit presque toujours : une exception racine pour le domaine,
              quelques filles pour les cas que l'on traite différemment.
            figures:
              - nom: python-erreur-metier.svg
                legende: "Une erreur métier porte un nom du métier, pas un nom de bibliothèque"
            code:
              - titre: "Une hiérarchie d'exceptions métier, courte et nommée"
                langage: python
                source: |
                  class ErreurReleve(Exception):
                      # racine du domaine : tout ce que ce module peut refuser
                      pass


                  class LigneInvalide(ErreurReleve):
                      # la ligne ne peut pas devenir un paiement
                      pass


                  class PaiementEnDouble(ErreurReleve):
                      def __init__(self, reference: str) -> None:
                          super().__init__(f"paiement deja enregistre : {reference}")
                          self.reference = reference
          - titre: "La notion : toute ressource ouverte doit se refermer"
            texte: >-
              Un fichier ouvert consomme un descripteur du système, et le contenu écrit n'est pas forcément
              sur le disque tant qu'il n'est pas fermé. Un programme qui ouvre sans fermer finit par échouer
              avec une erreur obscure de descripteurs épuisés, souvent en production, rarement sur votre
              poste.

              Le mot-clé with règle la question définitivement : à la sortie du bloc, par retour normal ou par
              exception, la ressource est libérée. La même construction sert pour les connexions, les verrous
              et les dossiers temporaires. Écrivez open sans with, et vous écrivez un bug différé.
          - titre: "Le geste technique : pathlib, with, et les trois paramètres qui comptent"
            texte: >-
              Trois paramètres évitent les trois quarts des mauvaises surprises. L'encodage, toujours déclaré,
              en utf-8 par défaut. Le paramètre newline laissé vide pour les CSV, faute de quoi Windows insère
              une ligne vide entre chaque ligne. Et le mode d'ouverture, choisi explicitement.

              Construisez les chemins avec pathlib plutôt qu'avec des chaînes : l'opérateur de division
              assemble les segments, et le même code fonctionne sur Windows comme sur le serveur Linux. Le
              chemin d'un dossier de données se déduit de l'emplacement du fichier source, jamais d'un chemin
              absolu écrit en dur.
            code:
              - titre: "Ouvrir proprement, écrire proprement"
                langage: python
                source: |
                  import csv
                  from pathlib import Path

                  DOSSIER = Path(__file__).resolve().parent / "donnees"


                  def ecrire_rejets(rejets: list[str]) -> Path:
                      cible = DOSSIER / "rejets.csv"
                      cible.parent.mkdir(parents=True, exist_ok=True)
                      with cible.open("w", encoding="utf-8", newline="") as fichier:
                          redacteur = csv.writer(fichier)
                          redacteur.writerow(["ligne", "raison"])
                          for rejet in rejets:
                              numero, _, raison = rejet.partition(" : ")
                              redacteur.writerow([numero, raison])
                      return cible
          - titre: "La notion : l'encodage, ou le caractère qui devient trois"
            texte: >-
              Un fichier texte n'est qu'une suite d'octets. L'encodage dit comment ces octets deviennent des
              caractères. En utf-8, le é occupe deux octets ; lu comme du latin-1, il devient deux caractères
              bizarres. Personne ne vous préviendra : le programme ne plante pas, il abîme vos données
              silencieusement.

              Les exports des logiciels de gestion ivoiriens arrivent souvent en windows-1252, parfois avec un
              marqueur d'ordre des octets en tête de fichier. Déclarez utf-8-sig à la lecture quand ce
              marqueur est possible, et écrivez toujours en utf-8. En cas de doute, regardez les octets avant
              de deviner.
            figures:
              - nom: python-csv-encodage.svg
                legende: "Les mêmes octets, lus avec deux encodages : un seul donne du texte"
              - nom: devpy-m05-b.jpg
                legende: "Le relevé du fournisseur arrive comme il arrive, votre programme s'y adapte"
          - titre: "À la main : le lecteur de relevés qui tient debout"
            texte: >-
              Étape 1, écrivez la fonction qui transforme une ligne en paiement et qui lève LigneInvalide,
              sans rien afficher. Étape 2, écrivez la boucle qui numérote les lignes à partir de 2, puisque la
              première est l'en-tête, et qui sépare les paiements des rejets. Étape 3, écrivez l'appelant qui
              décide quoi faire des rejets.

              Étape 4, vérifiez les trois cas limites : fichier vide, fichier sans en-tête, fichier dont
              toutes les lignes sont rejetées. Étape 5, mesurez : votre programme doit traiter trois mille
              lignes en moins d'une seconde et ne jamais charger le fichier entier en mémoire.
            code:
              - titre: "Le lecteur complet : valides d'un côté, rejets numérotés de l'autre"
                langage: python
                source: |
                  import csv
                  from pathlib import Path


                  def lire_paiement(ligne: dict[str, str]) -> dict[str, object]:
                      reference = (ligne.get("reference") or "").strip()
                      if not reference:
                          raise LigneInvalide("reference vide")
                      return {"reference": reference, "montant_fcfa": lire_montant(ligne.get("montant", ""))}


                  def lire_releve(chemin: Path) -> tuple[list[dict[str, object]], list[str]]:
                      paiements: list[dict[str, object]] = []
                      rejets: list[str] = []
                      with chemin.open(encoding="utf-8-sig", newline="") as fichier:
                          for numero, ligne in enumerate(csv.DictReader(fichier), start=2):
                              try:
                                  paiements.append(lire_paiement(ligne))
                              except LigneInvalide as refus:
                                  rejets.append(f"{numero} : {refus}")
                      return paiements, rejets
          - titre: "Le geste technique : journaliser sans trahir"
            texte: >-
              Un journal sert à celui qui arrive après vous. Il dit ce qui a été tenté, sur quel objet, et ce
              qui s'est passé. Il ne dit jamais ce qui ne le regarde pas : un numéro de téléphone complet, un
              jeton d'accès, un mot de passe, un identifiant national. Écrire ces valeurs dans un journal les
              recopie sur le disque, dans les sauvegardes et parfois dans un service tiers.

              Employez le module logging plutôt que print : vous choisissez le niveau, le format et la
              destination sans toucher au code métier. Masquez les données sensibles au moment de les écrire,
              pas plus tard. Une donnée masquée à l'affichage mais écrite en clair dans le journal n'est pas
              protégée.
            code:
              - titre: "Journaliser l'utile, masquer le sensible"
                langage: python
                source: |
                  import logging

                  journal = logging.getLogger("releve")


                  def masquer_numero(numero: str) -> str:
                      chiffres = "".join(c for c in numero if c.isdigit())
                      return "*" * max(0, len(chiffres) - 4) + chiffres[-4:]


                  def enregistrer(paiement: dict[str, object]) -> None:
                      journal.info(
                          "paiement accepte reference=%s montant=%s telephone=%s",
                          paiement["reference"],
                          paiement["montant_fcfa"],
                          masquer_numero(str(paiement.get("telephone", ""))),
                      )
          - titre: "La notion : les expressions régulières, et ce qu'elles ne doivent pas faire"
            texte: >-
              Un journal applicatif, un relevé d'opérateur mobile, un export de caisse : ces fichiers arrivent
              en texte brut, et chaque ligne suit une forme régulière sans être un vrai format structuré.
              L'expression régulière est l'outil fait pour cela : elle décrit une forme, et dit si une chaîne
              lui correspond, en extrayant les morceaux qui vous intéressent.

              Les briques tiennent en quelques signes. Une classe de caractères entre crochets accepte un
              caractère parmi plusieurs. Un quantificateur dit combien de fois. Un groupe entre parenthèses
              capture un morceau que vous récupérerez ensuite, et un groupe nommé lui donne un nom lisible
              plutôt qu'un numéro.

              Une expression régulière cherche une forme, jamais un sens. Elle ne doit donc jamais servir à
              analyser du HTML, du XML ou du JSON, qui sont des structures imbriquées : employez l'analyseur
              prévu pour chacun. Elle ne doit pas non plus servir à découper un CSV, où un point-virgule peut
              se trouver à l'intérieur d'un champ entre guillemets, et où le module csv fait le travail
              correctement.

              Dernier point, et il décide de la maintenabilité : une expression régulière écrite d'un seul
              bloc devient illisible en trois semaines. Le mode commenté permet de l'écrire sur plusieurs
              lignes, avec un commentaire par morceau. Un relecteur peut alors la corriger sans la réécrire.
            figures:
              - nom: python-normaliser-chaine.svg
                legende: "Décrire la forme attendue, puis extraire les morceaux utiles"
            tableaux:
              - titre: Les briques qui couvrent la plupart des besoins
                entetes: [Écriture, "Ce qu'elle accepte", Exemple ivoirien]
                lignes:
                  - ["'[0-9]{4}'", exactement quatre chiffres, "l'année 2026"]
                  - ["'[A-Z]{3}[0-9]{2}'", trois majuscules puis deux chiffres, le code agence GAG07]
                  - ["' +'", un ou plusieurs espaces, la séparation entre colonnes]
                  - ["'(?P<montant>[0-9]+)'", "un nombre, capturé sous un nom", le montant en FCFA]
                  - ["'(OK|REFUS)'", "l'un ou l'autre", "le statut d'une opération"]
                  - ["'^' et '$'", le début et la fin de la ligne, refuser une ligne tronquée]
          - titre: "Le geste technique : extraire les champs d'un journal brut vers un CSV"
            texte: >-
              L'expression est compilée une seule fois, hors de la boucle : la compiler à chaque ligne sur un
              fichier de cent mille lignes se paie cher. Elle est écrite en mode commenté, un morceau par
              ligne, avec le format attendu en commentaire.

              La fonction ne fait pas qu'extraire : elle compte ce qu'elle retient et ce qu'elle ignore, puis
              rend les deux chiffres. Sans ce comptage, un changement de format chez l'opérateur produirait un
              fichier vide sans que personne ne s'en aperçoive avant la fin du mois.

              Notez le geste de sécurité : les groupes nommés rendent le code lisible, et surtout la fonction
              n'écrit que les champs attendus. Recopier une ligne entière de journal dans un fichier de
              travail, c'est risquer d'y emporter un numéro de téléphone ou un identifiant de compte.
            code:
              - titre: "extraction.py, du journal brut au CSV"
                langage: python
                source: |
                  import csv
                  import re

                  LIGNE = re.compile(
                      r"""
                      ^(?P<date>\d{4}-\d{2}-\d{2})        # 2026-03-14
                      \s+(?P<heure>\d{2}:\d{2}:\d{2})     # 08:41:02
                      \s+(?P<agence>[A-Z]{3}\d{2})        # GAG07
                      \s+montant=(?P<montant>\d+)         # en FCFA, entier
                      \s+statut=(?P<statut>OK|REFUS)$
                      """,
                      re.VERBOSE,
                  )
                  COLONNES = ("date", "heure", "agence", "montant", "statut")


                  def extraire(journal: str, sortie_csv: str) -> tuple[int, int]:
                      retenues = ignorees = 0
                      with open(journal, encoding="utf-8") as entree, \
                           open(sortie_csv, "w", encoding="utf-8", newline="") as sortie:
                          plume = csv.writer(sortie)
                          plume.writerow(COLONNES)
                          for ligne in entree:
                              trouve = LIGNE.match(ligne.strip())
                              if trouve is None:
                                  ignorees += 1
                                  continue
                              plume.writerow([trouve.group(nom) for nom in COLONNES])
                              retenues += 1
                      return retenues, ignorees
          - titre: "La notion : assertions, invariants et contrats"
            texte: >-
              Un invariant est une phrase qui doit rester vraie pendant toute la vie d'un objet. Le solde d'un
              compte de coopérative n'est jamais négatif. Une pile contient zéro élément ou davantage, jamais
              moins. Un lot pesé a un poids strictement positif. Écrire ces phrases, puis les vérifier dans le
              code, transforme un bug silencieux en arrêt immédiat à l'endroit exact de la faute.

              L'assertion et l'exception métier ne jouent pas le même rôle, et les confondre crée une faille.
              L'exception métier traite une situation prévue, venue de l'extérieur : une saisie fausse, un
              fichier mal formé, un solde insuffisant. L'assertion vérifie une promesse interne que votre
              propre code doit tenir : si elle échoue, c'est un bug de programmation, pas une faute de
              l'utilisateur.

              La règle qui en découle est absolue : une assertion ne valide jamais une entrée utilisateur. Les
              assertions disparaissent quand l'interpréteur tourne en mode optimisé, avec l'option -O. Un
              contrôle de sécurité écrit avec assert disparaît donc en production, et c'est exactement ainsi
              que naissent des failles de validation.

              Où poser les contrôles ? Aux frontières. Vous validez une fois, à l'entrée, ce qui vient de
              l'extérieur, avec de vraies exceptions. À l'intérieur, vous posez des assertions là où une
              promesse doit tenir, et vous laissez le coeur du code travailler sur des données déjà sûres.
            figures:
              - nom: python-double-validation.svg
                legende: "L'extérieur se valide avec des exceptions, l'intérieur se vérifie avec des assertions"
            tableaux:
              - titre: "Assertion ou exception : le choix se décide en une question"
                entetes: [La situation, "L'outil", Pourquoi]
                lignes:
                  - [Un montant saisi est négatif, exception métier, "faute prévue, venue de l'extérieur"]
                  - [Un fichier reçu est mal formé, exception métier, le monde extérieur décide]
                  - ["Un droit d'accès à vérifier", "exception, jamais assert", une assertion disparaît en mode optimisé]
                  - [Le solde interne devient négatif, assertion, "promesse interne rompue, donc un bug"]
                  - ["Une liste triée cesse de l'être", assertion, "invariant d'algorithme"]
          - titre: "Le geste technique : poser un invariant là où il protège vraiment"
            texte: >-
              Le compte vérifie son invariant à la fin de chaque opération qui touche au solde. Si une
              évolution future introduit un chemin qui le rend négatif, le programme s'arrête à la ligne
              fautive, et non trois écrans plus loin dans un rapport comptable incompréhensible.

              Remarquez la répartition : le retrait refuse poliment, avec une exception métier nommée, quand
              le montant dépasse le solde, parce que c'est une situation normale de la vie de la coopérative.
              L'assertion, elle, ne parle qu'au développeur.

              Remarquez aussi le message de l'assertion. Une assertion nue vous donne seulement le numéro de
              ligne ; une assertion avec message vous donne la promesse rompue, ce qui divise par dix le temps
              de diagnostic.
            code:
              - titre: "compte.py, une exception dehors, une assertion dedans"
                langage: python
                source: |
                  class SoldeInsuffisant(Exception):
                      """Le retrait demande depasse le solde disponible du compte."""


                  class CompteCooperative:
                      def __init__(self, solde_fcfa: int) -> None:
                          if solde_fcfa < 0:
                              raise ValueError("un solde initial ne peut pas etre negatif")
                          self._solde_fcfa = solde_fcfa
                          self._verifier()

                      def deposer(self, montant_fcfa: int) -> None:
                          if montant_fcfa <= 0:
                              raise ValueError("un depot doit etre strictement positif")
                          self._solde_fcfa += montant_fcfa
                          self._verifier()

                      def retirer(self, montant_fcfa: int) -> None:
                          if montant_fcfa > self._solde_fcfa:
                              raise SoldeInsuffisant(
                                  f"retrait de {montant_fcfa} FCFA pour un solde de {self._solde_fcfa} FCFA"
                              )
                          self._solde_fcfa -= montant_fcfa
                          self._verifier()

                      def _verifier(self) -> None:
                          assert self._solde_fcfa >= 0, "invariant rompu : le solde est devenu negatif"
          - titre: "À la main : l'extracteur de journal et les invariants du domaine"
            texte: >-
              Premier temps : récupérez un journal brut, le vôtre ou celui fourni, et écrivez l'extracteur. Il
              doit rendre le nombre de lignes retenues et ignorées, et refuser silencieusement de produire un
              CSV vide : si plus de dix pour cent des lignes sont ignorées, il le signale sur la sortie
              d'erreur.

              Deuxième temps : écrivez l'expression régulière en mode commenté, avec un commentaire par
              morceau, et trois tests : une ligne conforme, une ligne tronquée, une ligne au format ancien.

              Troisième temps : reprenez les structures du module précédent et le domaine de la coopérative,
              et écrivez pour chaque classe la phrase de son invariant en français, dans la docstring, puis
              l'assertion qui la vérifie.

              Quatrième temps : la preuve par l'erreur. Cassez volontairement une règle dans votre code,
              constatez que l'assertion s'arrête au bon endroit, puis remettez le code en état. Une assertion
              qui n'a jamais échoué ne prouve rien.
            figures:
              - nom: devpy-m05-c.jpg
                legende: "Chercher une forme précise dans un texte brut, ligne après ligne"
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Ces cinq messages reviendront. Apprenez à les traduire immédiatement : le type nomme la famille
              du problème, le message nomme la valeur, et votre code nomme le lieu. Le réflexe à prendre est
              de lire la valeur citée dans le message avant de toucher au code.

              Un message que vous ne comprenez pas se recopie tel quel dans un moteur de recherche, sans vos
              noms de variables : la réponse existe presque toujours, et elle existe en anglais.
            tableaux:
              - titre: "Cinq traces, leur sens, leur correction"
                entetes: [Message, "Ce qu'il dit vraiment", La correction]
                lignes:
                  - ["ValueError: invalid literal for int()", "la chaîne n'est pas un entier", "nettoyer puis convertir, lever une erreur métier"]
                  - ["KeyError: 'montant'", "la colonne n'existe pas dans ce fichier", "vérifier l'en-tête, employer get avec un défaut"]
                  - [FileNotFoundError, le chemin ne mène à rien, construire le chemin avec pathlib depuis la racine du projet]
                  - ["UnicodeDecodeError: 'utf-8' codec", "le fichier n'est pas en utf-8", "ouvrir en utf-8-sig, ou demander l'encodage à l'émetteur"]
                  - [PermissionError, le fichier est ouvert ailleurs ou interdit, "fermer le tableur, vérifier les droits du dossier"]
          - titre: "Entraînement gradué : imiter, varier, créer"
            texte: >-
              Imiter : reprenez le lecteur de relevés et ajoutez une colonne date, lue en trois formats
              possibles, rejetée proprement si aucun ne convient. Vous ne changez pas la structure, vous
              ajoutez une conversion et son erreur métier.

              Varier : remplacez la source CSV par un fichier JSON du même fournisseur, sans toucher à la
              fonction qui valide un paiement. Si vous y arrivez sans rien modifier d'autre que la lecture,
              votre découpage est bon. Créer : écrivez l'outil qui compare deux relevés d'un même mois et
              signale les paiements présents dans l'un et absents dans l'autre, avec un rapport lisible.
          - titre: Aller plus loin cette semaine si vous avez le temps
            texte: >-
              Regardez contextlib.suppress, qui exprime en une ligne l'intention d'ignorer une exception
              précise, et contextlib.contextmanager, qui vous permet d'écrire vos propres gestionnaires de
              contexte : un chronomètre, un dossier temporaire, une connexion.

              Lisez aussi la différence entre raise et raise from. La seconde forme conserve la cause
              d'origine dans la trace, ce qui fait gagner un temps considérable en production. Enfin, essayez
              le module json avec ensure_ascii à faux : vos accents restent lisibles dans le fichier produit.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est l'except silencieux. Trois lignes qui attrapent tout et ne font rien
              transforment un incident en mystère. Si vous attrapez, vous consignez ou vous agissez.

              Le deuxième est le chemin écrit en dur avec des antislashs. Il fonctionne sur votre poste et
              casse sur le serveur. Le troisième est le fichier entièrement chargé en mémoire avec readlines
              ou read : agréable sur trois mille lignes, fatal sur trois millions. Lisez en parcourant.
          - titre: Le mémo de la semaine
            texte: >-
              Gardez ce tableau sous les yeux pendant l'atelier. Ces six gestes couvrent l'essentiel de ce que
              vous écrirez cette semaine, et ils reviendront dans tous les modules suivants.
            tableaux:
              - titre: Six gestes à connaître par coeur
                entetes: [Besoin, "L'écriture juste"]
                lignes:
                  - [Ouvrir un fichier texte, "with chemin.open(encoding='utf-8') as f"]
                  - [Lire un CSV, csv.DictReader avec newline vide]
                  - [Construire un chemin, "Path(__file__).parent / 'donnees' / 'x.csv'"]
                  - [Numéroter les lignes, "enumerate(lecteur, start=2)"]
                  - [Relancer en gardant la cause, raise Metier(...) from erreur]
                  - [Ignorer une erreur précise, "with suppress(FileNotFoundError):"]
          - titre: Vous savez faire si vous pouvez répondre à ceci
            texte: >-
              Première vérification : donnez une trace à un camarade et expliquez-lui en trois phrases le
              quoi, le où et le comment. Deuxième : citez une exception que vous ne devez jamais attraper et
              dites pourquoi. Troisième : expliquez ce que fait newline vide dans un open de CSV.

              Question de transfert, la plus importante : votre programme lit maintenant depuis une API au
              lieu d'un fichier, et l'API répond parfois par une erreur temporaire. Qu'est-ce qui change dans
              votre découpage, et qu'est-ce qui ne change pas ? Si votre réponse est que seule la fonction de
              lecture change, vous avez compris la semaine.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un outil de traitement de relevés robuste. Il lit un CSV fourni, écrit un fichier de
              résultats et un fichier de rejets numérotés avec leur raison, journalise son exécution, et rend
              un code de sortie non nul si le taux de rejet dépasse un seuil passé en paramètre.

              Accompagnez-le d'un LISEZ-MOI de dix lignes : la commande à lancer, le format d'entrée attendu,
              et ce que signifie chaque raison de rejet. La trésorière doit pouvoir s'en servir sans vous.
            tableaux:
              - titre: La grille qui servira à vous évaluer
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Gestion des erreurs, un except Exception global, exceptions métier nommées, "hiérarchie à deux niveaux, raise from partout"]
                  - [Fichiers, "chemins en dur, encodage implicite", pathlib et utf-8 déclaré, encodage détecté et documenté]
                  - [Rejets, "le programme s'arrête", rejets numérotés avec raison, fichier de rejets réinjectable après correction]
                  - [Journalisation, des print, logging avec niveaux, données sensibles masquées à la source]
                  - [Mémoire, fichier chargé en entier, lecture en parcourant, mesure du temps et de la mémoire dans le LISEZ-MOI]
        livrable: Outil de traitement de fichiers robuste.
        mise_en_situation: "Votre outil lit chaque nuit un fichier CSV déposé par un partenaire. Une nuit, le fichier est absent ; une autre, il est mal encodé. Décrivez comment votre code gère ces deux cas sans planter ni perdre de données."
        quiz:
          - question: "Quel bloc s'exécute toujours, qu'il y ait une exception ou non ?"
            options: ["finally", "except", "else", "raise"]
            bonnes: [1]
            explication: "finally sert au nettoyage (fermeture de ressources)."
          - question: "Quel est l'intérêt de with open(...) as f ?"
            options: ["Le fichier est fermé automatiquement", "Le fichier est chiffré", "La lecture est plus rapide", "Le fichier est copié"]
            bonnes: [1]
            explication: "Le gestionnaire de contexte garantit la fermeture, même en cas d'erreur."
          - question: "Pourquoi éviter un except: sans type d'exception ?"
            options: ["Il masque aussi les erreurs inattendues", "Il est plus lent", "Python l'interdit", "Il ferme le programme"]
            bonnes: [1]
            explication: "On capture précisément les erreurs que l'on sait traiter."
          - question: "Quel module de la bibliothèque standard manipule les chemins de façon portable ?"
            options: ["pathlib", "random", "math", "socket"]
            bonnes: [1]
            explication: "pathlib gère les chemins indépendamment du système d'exploitation."
          - question: "Pourquoi une assertion ne doit-elle jamais valider une donnée venue de l'utilisateur ?"
            options: ["Parce que python -O les supprime toutes : la vérification disparaîtrait en production", "Parce qu'elle est plus lente qu'un if", "Parce qu'elle ne peut pas porter de message", "Parce qu'elle ne fonctionne pas à l'intérieur d'une fonction"]
            bonnes: [1]
            explication: "assert vérifie ce que le programme croit de lui-même. Une donnée extérieure se valide par un test explicite qui lève une exception métier, car les assertions peuvent être désactivées."
      - num: "06"
        title: Python idiomatique
        contenu: >-
          Itérateurs, générateurs, décorateurs, lambda, typage statique (mypy/pyright), PEP 8, ruff.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, un développeur Python lit votre code sans effort. Vous parcourez les
              collections directement, vous employez enumerate et zip au lieu des index, vous écrivez des
              générateurs quand le volume l'exige, vous composez des compréhensions lisibles, et vous écrivez
              vos propres gestionnaires de contexte.

              Vous savez surtout reconnaître quand une construction élégante devient illisible, et revenir en
              arrière. Idiomatique ne veut pas dire astucieux : cela veut dire attendu. Le code attendu se
              relit en diagonale, le code astucieux se relit trois fois.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : dans votre dernier programme, combien de boucles commencent par for i in
              range(len(quelque_chose)) ? Chacune est une occasion manquée de dire ce que vous voulez plutôt
              que comment l'obtenir.

              Deuxième question : que se passe-t-il si vous parcourez deux fois le même générateur ? Troisième
              question : combien de lignes votre plus longue compréhension fait-elle, et combien de temps vous
              faut-il pour la relire ? Ces trois réponses dessinent votre marge de progression.
          - titre: "Le problème d'abord : six cents lignes que personne n'ose toucher"
            texte: >-
              Le script de rapprochement des paiements de la coopérative fait six cents lignes. Il fonctionne.
              Il contient des variables nommées tmp, data2 et flag, des boucles à index imbriquées sur trois
              niveaux, et un fichier ouvert à la ligne 40, fermé à la ligne 580, parfois. Son auteur est
              parti.

              On vous demande d'y ajouter une règle : exclure les paiements annulés. Réécrire de zéro ferait
              perdre les règles métier accumulées en deux ans. Votre travail est de le transformer par petits
              pas sûrs, chacun vérifiable, chacun réversible, sans jamais changer le comportement observable.
            figures:
              - nom: devpy-m06-a.jpg
                legende: "Un code hérité se range pièce par pièce, pas en vidant l'atelier"
          - titre: "La notion : parcourir ce que l'on veut, pas des positions"
            texte: >-
              Une boucle sur les index dit comment avancer dans une liste. Une boucle sur les éléments dit ce
              que l'on veut faire. La seconde formulation supprime l'index, donc supprime toute une famille de
              bugs : décalage d'un cran, index qui dépasse, oubli de la dernière ligne.

              Quand il vous faut le rang, enumerate vous le donne, avec son point de départ. Quand il vous
              faut avancer dans deux collections en parallèle, zip les apparie et s'arrête à la plus courte.
              Quand il vous faut la collection inverse ou triée, reversed et sorted s'en chargent sans
              recopier votre logique.
            code:
              - titre: Les quatre formes de parcours que vous écrirez tous les jours
                langage: python
                source: |
                  paiements = ["P-001", "P-002", "P-003"]
                  montants = [125000, 48000, 300000]

                  for paiement in paiements:
                      pass  # le cas courant : on veut l'element, pas sa position

                  for rang, paiement in enumerate(paiements, start=1):
                      print(f"{rang}. {paiement}")

                  for paiement, montant in zip(paiements, montants, strict=True):
                      print(paiement, montant)

                  for paiement in sorted(paiements, key=len, reverse=True):
                      print(paiement)
          - titre: "Lire le code ligne à ligne : pourquoi strict change tout"
            texte: >-
              Le paramètre strict de zip, disponible depuis Python 3.10, lève une erreur si les deux
              collections n'ont pas la même longueur. Sans lui, zip s'arrête silencieusement à la plus courte,
              et vous perdez des paiements sans le savoir.

              C'est le geste défensif de la semaine : préférer systématiquement l'option qui échoue bruyamment
              à celle qui continue en silence. Le même raisonnement vaut pour le paramètre start de enumerate,
              qui évite d'ajouter un à l'index au moment de l'affichage, source classique de rapports décalés
              d'une ligne.
          - titre: "La notion : produire au fil de l'eau plutôt que tout construire"
            texte: >-
              Une fonction qui construit une liste de résultats occupe la mémoire proportionnellement au
              nombre de résultats. Une fonction qui les produit un par un avec yield n'occupe presque rien :
              elle rend une valeur, suspend son exécution, et reprend exactement où elle s'était arrêtée quand
              on lui en demande une autre.

              Sur un relevé de trois millions de lignes, c'est la différence entre un programme qui tourne et
              un programme qui sature la machine. Les générateurs se composent aussi : chaque étape filtre ou
              transforme le flux sans jamais le matérialiser, et rien n'est calculé tant que personne ne
              consomme.
            figures:
              - nom: python-flux-ou-liste.svg
                legende: "Une liste occupe la mémoire, un générateur la traverse"
          - titre: "Le geste technique : une chaîne de générateurs qui se lit comme une phrase"
            texte: >-
              Chaque fonction ci-dessous prend un flux et rend un flux. Lues de haut en bas, elles décrivent
              le traitement : lire, écarter les annulés, convertir, ne garder que les gros montants. Aucune
              liste intermédiaire n'existe.

              Le coût de cette élégance est une discipline : un générateur ne se parcourt qu'une fois. Si vous
              devez le relire ou connaître sa longueur, matérialisez-le en liste explicitement, en sachant ce
              que vous payez.
            code:
              - titre: "Une chaîne de générateurs, sans aucune liste intermédiaire"
                langage: python
                source: |
                  from collections.abc import Iterator


                  def lignes_du_releve(chemin) -> Iterator[dict]:
                      import csv
                      with chemin.open(encoding="utf-8", newline="") as fichier:
                          yield from csv.DictReader(fichier)


                  def sans_annules(flux: Iterator[dict]) -> Iterator[dict]:
                      for ligne in flux:
                          if ligne.get("statut") != "ANNULE":
                              yield ligne


                  def montants_fcfa(flux: Iterator[dict]) -> Iterator[int]:
                      for ligne in flux:
                          yield int(ligne["montant"])


                  total = sum(m for m in montants_fcfa(sans_annules(lignes_du_releve(chemin))) if m > 100_000)
          - titre: "La notion : la compréhension, et la limite qu'il ne faut pas franchir"
            texte: >-
              Une compréhension exprime en une ligne une transformation ou un filtrage. Elle remplace
              avantageusement une boucle de trois lignes qui ne fait qu'accumuler. Elle existe aussi pour les
              dictionnaires et les ensembles, et avec des parenthèses elle devient un générateur.

              La limite est la lisibilité. Deux boucles imbriquées et un filtre dans une seule compréhension
              dépassent ce qu'un lecteur absorbe d'un coup. Dès qu'une compréhension demande un effort,
              redevenez explicite : la clarté passe avant la concision, toujours.
            code:
              - titre: "Les trois compréhensions utiles, et celle à ne pas écrire"
                langage: python
                source: |
                  references = [p["reference"] for p in paiements]
                  par_reference = {p["reference"]: p for p in paiements}
                  quartiers = {p["quartier"] for p in paiements}
                  flux = (p for p in paiements if p["montant"] > 100_000)

                  # a ne pas ecrire : deux boucles et un filtre, illisible en relecture
                  # resultat = [t for o in officines for t in o.tickets if t.valide and t.montant > 1000]
          - titre: "Le geste technique : vos propres gestionnaires de contexte"
            texte: >-
              Le mot-clé with ne sert pas qu'aux fichiers. Tout ce qui s'ouvre et se ferme, se prend et se
              rend, se démarre et s'arrête mérite un gestionnaire de contexte : une connexion, un verrou, un
              chronomètre, un dossier temporaire, une transaction.

              Le décorateur contextmanager transforme une fonction génératrice en gestionnaire : ce qui
              précède yield est l'entrée, ce qui suit est la sortie. Placez la sortie dans un finally, sinon
              une exception à l'intérieur du bloc sauterait votre nettoyage, ce qui était précisément le
              problème à résoudre.
            code:
              - titre: Un chronomètre réutilisable en huit lignes
                langage: python
                source: |
                  import time
                  from contextlib import contextmanager


                  @contextmanager
                  def chronometre(etiquette: str):
                      debut = time.perf_counter()
                      try:
                          yield
                      finally:
                          duree = time.perf_counter() - debut
                          print(f"{etiquette} : {duree:.3f} s")


                  with chronometre("rapprochement"):
                      rapprocher(paiements, factures)
          - titre: "La notion : un décorateur se mérite"
            texte: >-
              Un décorateur enveloppe une fonction pour lui ajouter un comportement : mesurer, réessayer,
              mettre en cache, vérifier un droit. Il s'écrit une fois et s'applique partout, ce qui est sa
              force et son danger.

              Chaque décorateur ajoute un niveau d'indirection : le lecteur doit aller voir ailleurs pour
              comprendre ce qui se passe. Il se justifie quand la même enveloppe reviendrait dix fois dans le
              code, jamais pour une fonction unique. Et il doit toujours employer functools.wraps, sinon le
              nom et la documentation de la fonction d'origine disparaissent des traces et de l'aide.
            code:
              - titre: "Un décorateur honnête : il préserve ce qu'il enveloppe"
                langage: python
                source: |
                  import functools
                  import logging

                  journal = logging.getLogger(__name__)


                  def trace_les_refus(fonction):
                      @functools.wraps(fonction)
                      def enveloppe(*args, **kwargs):
                          try:
                              return fonction(*args, **kwargs)
                          except ErreurReleve as refus:
                              journal.warning("%s a refuse : %s", fonction.__name__, refus)
                              raise
                      return enveloppe
          - titre: "À la main : transformer le script hérité, un pas à la fois"
            texte: >-
              Étape 1, écrivez un test de caractérisation : lancez le script sur un jeu de données figé et
              enregistrez sa sortie. C'est votre filet, et il doit rester vert après chaque pas.

              Étape 2, remplacez une seule boucle à index par une boucle sur les éléments, lancez le test,
              faites un commit. Étape 3, extrayez une fonction nommée depuis le plus gros bloc. Étape 4,
              entourez l'ouverture du fichier d'un with. Étape 5, remplacez la liste intermédiaire la plus
              grosse par un générateur. Un pas, un test, un commit : jamais deux transformations à la fois.
            code:
              - titre: "Avant et après, la même règle métier"
                langage: python
                source: |
                  # avant : des index, un accumulateur, l'intention noyee
                  total = 0
                  for i in range(len(paiements)):
                      if paiements[i]["statut"] != "ANNULE":
                          if paiements[i]["montant"] > 100000:
                              total = total + paiements[i]["montant"]

                  # apres : un generateur nomme et une somme
                  def gros_paiements(lignes, seuil=100_000):
                      for ligne in lignes:
                          if ligne["statut"] != "ANNULE" and ligne["montant"] > seuil:
                              yield ligne["montant"]

                  total = sum(gros_paiements(paiements))
          - titre: "La notion : le grand O, ou comment nommer le coût d'un programme"
            texte: >-
              En semaine 01, vous avez chronométré trois versions d'un même calcul. En semaine 02, vous avez
              vu qu'un ensemble répond instantanément là où une liste cherche élément par élément. En semaine
              04, vous avez mesuré l'accès au dernier maillon d'une liste chaînée. Il est temps de donner un
              nom à ce que vous avez observé.

              Le grand O décrit la façon dont le temps grandit quand les données grandissent. Il ne mesure pas
              des secondes, qui dépendent de la machine : il mesure une forme de croissance. Dire qu'un
              traitement est linéaire, c'est dire que doubler les données double le temps. Dire qu'il est
              quadratique, c'est dire que doubler les données multiplie le temps par quatre.

              La différence devient brutale avec le volume. Sur mille lignes, un traitement quadratique passe
              inaperçu. Sur cinq cent mille lignes de ventes, il ne finit pas de la journée, pendant que la
              version linéaire rend la main en une seconde. Le code est pourtant presque identique, et c'est
              bien pour cela qu'il faut savoir lire le coût au lieu de l'essayer.

              Une dernière précision, qui évite beaucoup d'erreurs de jugement : le grand O ignore les
              constantes et les termes secondaires. Un traitement en deux parcours reste linéaire. Entre deux
              algorithmes de même classe, c'est la mesure, et elle seule, qui tranche.
            figures:
              - nom: python-boucle-for.svg
                legende: "Une boucle dans une boucle : le nombre de tours se multiplie, pas s'additionne"
            tableaux:
              - titre: "Les six classes à reconnaître, et ce qu'elles donnent sur 500 000 lignes"
                entetes: [Classe, Nom courant, Exemple typique, Ordre de grandeur du temps]
                lignes:
                  - [O(1), constant, "lire une clé d'un dictionnaire", immédiat]
                  - [O(log n), logarithmique, "recherche dichotomique, index de base", "immédiat, environ 19 étapes"]
                  - [O(n), linéaire, parcourir un fichier une fois, "moins d'une seconde"]
                  - [O(n log n), quasi linéaire, trier une liste, quelques secondes]
                  - [O(n au carré), quadratique, une boucle dans une boucle, plusieurs jours]
                  - [O(2 puissance n), exponentiel, essayer toutes les combinaisons, hors de portée]
          - titre: "Le geste technique : reconnaître une boucle dans une boucle, même déguisée"
            texte: >-
              La forme visible est facile : deux for imbriqués. La forme déguisée est celle qui fait tomber la
              plupart des programmes en production, parce que la deuxième boucle est cachée dans une opération
              qui a l'air gratuite.

              Dans la version lente ci-dessous, il n'y a qu'un seul for. Mais le test d'appartenance à une
              liste parcourt cette liste élément par élément : c'est la deuxième boucle, invisible. Le coût
              total est quadratique. Dans la version rapide, le même test porte sur un ensemble, qui répond
              par hachage en temps constant, et le coût redevient linéaire.

              Les autres déguisements à connaître se repèrent au même raisonnement : construire une chaîne en
              la concaténant dans une boucle recopie tout le texte à chaque tour ; retirer en tête d'une liste
              décale tous les éléments restants ; trier à l'intérieur d'une boucle trie n fois.
            code:
              - titre: "doublons.py, la même règle, deux coûts"
                langage: python
                source: |
                  def doublons_lent(codes: list[str]) -> list[str]:
                      vus: list[str] = []
                      doublons: list[str] = []
                      for code in codes:            # n tours
                          if code in vus:           # parcours de vus : jusqu'a n comparaisons
                              doublons.append(code)
                          else:
                              vus.append(code)
                      return doublons               # cout total : n au carre


                  def doublons_rapide(codes: list[str]) -> list[str]:
                      vus: set[str] = set()
                      doublons: list[str] = []
                      for code in codes:            # n tours
                          if code in vus:           # test par hachage : cout constant
                              doublons.append(code)
                          else:
                              vus.add(code)
                      return doublons               # cout total : n
          - titre: "Le geste technique : mesurer d'abord, nommer ensuite"
            texte: >-
              La bonne méthode tient en trois temps. Mesurez sur trois tailles, par exemple mille, dix mille
              et cent mille. Regardez comment le temps grandit quand la taille est multipliée par dix. Puis
              nommez : un temps multiplié par dix est linéaire, un temps multiplié par cent est quadratique,
              un temps à peine changé est logarithmique ou constant.

              Ce protocole vous évite deux erreurs opposées. La première est d'optimiser un code dont personne
              n'a mesuré le coût, au détriment de la lisibilité. La seconde est de croire qu'un programme
              rapide sur un échantillon le restera sur la vraie base.

              Le tableau de mesures se conserve dans le dépôt, à côté du code. Le jour où un collègue
              proposera une optimisation, la discussion portera sur des chiffres.
            figures:
              - nom: devpy-m06-c.jpg
                legende: "Doubler le volume ne double pas toujours le temps : il faut mesurer pour le savoir"
            code:
              - titre: "mesure.py, trois tailles, une conclusion"
                langage: python
                source: |
                  import random
                  import string
                  import timeit

                  from doublons import doublons_lent, doublons_rapide


                  def echantillon(taille: int) -> list[str]:
                      return ["".join(random.choices(string.ascii_uppercase, k=6)) for _ in range(taille)]


                  for taille in (1_000, 10_000, 100_000):
                      codes = echantillon(taille)
                      rapide = timeit.timeit(lambda: doublons_rapide(codes), number=1)
                      print(f"{taille:>7} lignes  rapide : {rapide:.4f} s")

                  for taille in (1_000, 10_000):
                      codes = echantillon(taille)
                      lent = timeit.timeit(lambda: doublons_lent(codes), number=1)
                      print(f"{taille:>7} lignes  lent   : {lent:.4f} s")
          - titre: "À la main : annoter les coûts, puis corriger la seule fonction trop lente"
            texte: >-
              Premier temps : prenez la base de code fournie, six fonctions qui traitent le relevé de ventes.
              Lisez-les sans les exécuter et annotez chacune d'un commentaire qui donne sa classe de coût et
              la phrase qui le justifie, par exemple un parcours du relevé pour chaque produit du catalogue.

              Deuxième temps : mesurez sur mille, dix mille et cent mille lignes. Comparez vos annotations aux
              mesures. Si une mesure contredit votre lecture, c'est votre lecture qui doit changer, et vous
              devez savoir dire pourquoi.

              Troisième temps : une seule des six fonctions est quadratique. Corrigez-la, sans toucher aux
              autres, et sans changer son comportement : les tests existants doivent rester verts.

              Quatrième temps : remesurez et consignez le gain. Un rapport de trois lignes suffit : coût
              avant, coût après, et ce que cela change sur la vraie base de cinq cent mille lignes.
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Les erreurs idiomatiques sont sournoises : la plupart ne lèvent aucune exception. Un générateur
              vide la deuxième fois, une liste modifiée pendant qu'on la parcourt, un zip qui tronque. Le
              programme ne plante pas, il donne un résultat faux.

              Apprenez donc à les reconnaître à leurs symptômes plutôt qu'à leur message. Le tableau donne les
              quatre signatures les plus fréquentes.
            tableaux:
              - titre: Quatre symptômes idiomatiques et leur cause
                entetes: [Symptôme observé, Cause probable, Correction]
                lignes:
                  - [Un total correct puis nul au second appel, générateur déjà consommé, matérialiser en liste si relecture nécessaire]
                  - [Des lignes sautées sans erreur, suppression pendant le parcours, "parcourir une copie, ou construire une nouvelle liste"]
                  - [Des données perdues en fin de fichier, zip sans strict, "zip(..., strict=True)"]
                  - ["TypeError: 'generator' has no len()", len sur un générateur, "compter avec sum(1 for _ in flux), en connaissance de cause"]
          - titre: "Entraînement gradué : imiter, varier, créer"
            texte: >-
              Imiter : reprenez la chaîne de générateurs et ajoutez une étape qui normalise les références en
              majuscules. Une fonction, trois lignes, et la chaîne reste lisible.

              Varier : écrivez un gestionnaire de contexte qui ouvre un dossier temporaire, y travaille, et le
              supprime à la sortie même en cas d'erreur. Créer : prenez un de vos anciens scripts, écrivez-lui
              un test de caractérisation, puis transformez-le en cinq commits dont chacun porte un nom de
              transformation précis. Le résultat doit se lire comme une recette.
          - titre: Aller plus loin cette semaine si vous avez le temps
            texte: >-
              Explorez itertools : islice découpe un flux, groupby regroupe des éléments consécutifs, chain
              enchaîne des sources, et batched, apparu en Python 3.12, découpe un flux en paquets de taille
              fixe pour les envois par lots.

              Regardez aussi functools.cache, qui mémorise les résultats d'une fonction pure, et
              collections.Counter, qui compte les occurrences en une ligne. Ces outils sont la bibliothèque
              standard : ils n'ajoutent aucune dépendance et sont déjà testés par des millions d'usages.
            figures:
              - nom: python-effet-du-cache.svg
                legende: "Mémoriser un résultat déjà calculé change l'ordre de grandeur du temps"
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est le générateur consommé deux fois. Il ne lève rien : il rend simplement un
              résultat vide, et votre total devient zéro.

              Le deuxième est le décorateur écrit pour le plaisir, qui rend le code plus difficile à suivre
              qu'une ligne répétée deux fois. Le troisième est la compréhension à trois étages, écrite dans
              l'enthousiasme et incompréhensible le lendemain, y compris par son auteur.
            figures:
              - nom: devpy-m06-b.jpg
                legende: "Un outil bien rangé se reprend sans réfléchir, un outil astucieux se redécouvre"
          - titre: Le mémo de la semaine
            texte: >-
              Ce tableau est votre table de conversion entre le code que vous écriviez et celui qu'on attend
              de vous. Appliquez-le mécaniquement pendant un mois, il deviendra un réflexe.
            tableaux:
              - titre: "Au lieu de, écrivez"
                entetes: [Au lieu de, Écrivez, Gain]
                lignes:
                  - [for i in range(len(x)), for element in x, "l'index disparaît"]
                  - [un compteur manuel, "enumerate(x, start=1)", une variable de moins]
                  - [deux parcours en parallèle, "zip(a, b, strict=True)", aucune perte silencieuse]
                  - [une liste intermédiaire, un générateur, la mémoire ne grandit plus]
                  - [open puis close, with open(...), fermeture garantie]
                  - [un drapeau booléen, une sortie anticipée, "un niveau d'indentation de moins"]
          - titre: Vous savez faire si vous pouvez répondre à ceci
            texte: >-
              Première vérification : expliquez en deux phrases pourquoi un générateur ne se parcourt qu'une
              fois. Deuxième : citez une situation où une liste vaut mieux qu'un générateur. Troisième :
              donnez un cas où un décorateur est justifié et un cas où il ne l'est pas.

              Question de transfert : votre chaîne de générateurs doit maintenant écrire les lignes rejetées
              dans un fichier au passage. Où insérez-vous cette écriture sans casser la composition, et
              pourquoi pas dans la fonction qui filtre ? La bonne réponse tient dans une seule idée : une
              fonction fait une chose.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez la refactorisation d'un code existant, accompagnée d'une note qui liste chaque
              transformation et ce qu'elle apporte. Le code de départ est fourni ou vient de vos propres
              travaux des semaines précédentes.

              Le comportement doit rester strictement identique : c'est le test de caractérisation qui
              l'atteste, et il est rendu avec le reste. Une refactorisation qui change un résultat est une
              correction de bug déguisée, et elle doit être annoncée comme telle.
            tableaux:
              - titre: La grille qui servira à vous évaluer
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Comportement, la sortie a changé, test de caractérisation vert, test rejoué à chaque commit]
                  - [Parcours, des boucles à index subsistent, parcours directs partout, enumerate et zip strict employés à bon escient]
                  - [Mémoire, tout en listes, générateurs sur les gros flux, mesure avant et après dans la note]
                  - [Ressources, open sans with, with partout, un gestionnaire de contexte écrit pour le projet]
                  - [Historique, un commit géant, un commit par transformation, chaque message nomme la transformation appliquée]
        livrable: Refactorisation d'un code existant en style idiomatique.
        mise_en_situation: "On vous confie une fonction qui charge un fichier de 2 Go en mémoire pour compter des lignes. Réécrivez-la de manière idiomatique avec un générateur et ajoutez les annotations de type."
        quiz:
          - question: "Quel mot-clé transforme une fonction en générateur ?"
            options: ["yield", "return", "async", "lambda"]
            bonnes: [1]
            explication: "yield produit les valeurs une à une, à la demande."
          - question: "L'intérêt principal d'un générateur est :"
            options: ["une consommation mémoire réduite", "un code plus long", "un typage obligatoire", "l'exécution parallèle"]
            bonnes: [1]
            explication: "Les éléments ne sont pas tous stockés en mémoire."
          - question: "Un décorateur est :"
            options: ["une fonction qui enveloppe une autre fonction", "un commentaire", "un type de variable", "une classe abstraite"]
            bonnes: [1]
            explication: "Il ajoute un comportement sans modifier la fonction d'origine."
          - question: "Que vérifie un outil comme mypy ou pyright ?"
            options: ["La cohérence des types annotés", "La vitesse du code", "Les fautes d'orthographe", "La sécurité réseau"]
            bonnes: [1]
            explication: "Ils détectent des erreurs de type avant l'exécution."
          - question: "Vous testez des milliers de fois la présence d'une valeur dans une collection de cent mille éléments. Quel coût sépare une liste d'un ensemble ?"
            options: ["O(n) pour la liste, O(1) en moyenne pour l'ensemble", "O(1) pour les deux", "O(log n) pour la liste, O(n) pour l'ensemble", "Aucun : « in » va aussi vite sur les deux"]
            bonnes: [1]
            explication: "« in » parcourt une liste élément par élément ; sur un ensemble ou un dictionnaire, il calcule un hachage et va droit au seau. C'est la boucle cachée la plus coûteuse des programmes débutants."
      - num: "07"
        title: Environnements & packaging
        contenu: >-
          uv, pyproject.toml, dépendances verrouillées, structure d'un package, publication interne, pre-commit.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, la phrase chez moi ça marche disparaît de votre vocabulaire. Vous
              isolez chaque projet dans son environnement, vous déclarez vos dépendances avec des bornes
              raisonnées, vous figez les versions exactes dans un fichier de verrouillage versionné, et vous
              livrez un paquet installable avec une commande en ligne de commande.

              Vous savez aussi où vivent les secrets : dans l'environnement d'exécution, jamais dans le dépôt,
              jamais dans une image, jamais dans un journal. C'est la semaine la moins spectaculaire du
              parcours et celle qui vous fera gagner le plus de temps sur cinq ans.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : si votre machine tombait en panne ce soir, combien de temps faudrait-il pour
              remettre votre projet en état de marche sur une machine neuve ? Si la réponse dépasse dix
              minutes, votre projet n'est pas livrable.

              Deuxième question : savez-vous quelles versions exactes de bibliothèques tournent dans votre
              projet actuel ? Troisième question : où se trouve la clé d'API de votre dernier projet, et
              combien de copies en existe-t-il ? Ces trois réponses mesurent la distance qui vous sépare d'un
              projet professionnel.
          - titre: "Le problème d'abord : le projet qui ne s'installe que sur un poste"
            texte: >-
              Votre outil de rapprochement fonctionne. Vous l'envoyez au développeur du cabinet comptable. Il
              obtient une erreur d'import, installe une bibliothèque au hasard, obtient une erreur de version
              incompatible, installe une version antérieure, casse un autre de ses projets, puis abandonne et
              vous renvoie le fichier.

              Trois heures perdues des deux côtés, et le code n'était pas en cause. Ce qui manquait tient en
              trois fichiers : un qui déclare ce que le projet exige, un qui fige ce qui a été vérifié, et un
              qui explique comment démarrer.
            figures:
              - nom: devpy-m07-a.jpg
                legende: "Un paquet livrable se transporte sans qu'on ait à le remonter à l'arrivée"
          - titre: "La notion : un environnement par projet, et pourquoi"
            texte: >-
              Un environnement virtuel est un dossier contenant un interpréteur et les bibliothèques d'un seul
              projet. Deux projets peuvent ainsi exiger deux versions incompatibles de la même bibliothèque
              sans se gêner, et l'interpréteur du système reste intact.

              Installer avec pip sans environnement actif est le geste qui ruine une machine de développement.
              Au troisième projet, les versions se contredisent, et la réinstallation complète du système
              devient la solution la plus rapide. Un environnement se crée en une seconde et se jette sans
              regret : il ne contient rien d'irremplaçable.
          - titre: "Le geste technique : créer, activer, installer, vérifier"
            texte: >-
              L'outil uv fait tout cela plus vite que les outils historiques, et il écrit le fichier de
              verrouillage sans qu'on le lui demande. Les commandes ci-dessous sont celles que vous taperez au
              début de chaque projet, dans cet ordre.

              Vérifiez toujours où pointe votre interpréteur avant d'installer quoi que ce soit : la commande
              qui affiche le chemin de Python doit montrer le dossier du projet, pas celui du système. Ce
              contrôle de cinq secondes évite des heures de confusion.
            code:
              - titre: "Les six commandes de démarrage d'un projet"
                langage: bash
                source: |
                  uv init rapprochement-cooperative
                  cd rapprochement-cooperative

                  uv venv
                  uv add "httpx>=0.27,<1.0" "pandas>=2.2,<3.0"
                  uv add --dev pytest ruff

                  uv run python -c "import sys; print(sys.executable)"
          - titre: "Lire le code ligne à ligne : ce que fait chaque commande"
            texte: >-
              La première crée le squelette du projet avec son pyproject.toml. La deuxième crée
              l'environnement isolé dans un dossier .venv, qui ne sera jamais versionné. Les deux suivantes
              ajoutent les dépendances : celles dont le code a besoin pour fonctionner, puis celles qui ne
              servent qu'au développement, tests et analyse statique.

              La distinction compte : l'image de production n'installera pas pytest, ce qui la rend plus
              petite et réduit sa surface d'attaque. La dernière commande vérifie que l'interpréteur employé
              est bien celui du projet. Si elle affiche un chemin système, tout ce que vous installerez ira au
              mauvais endroit.
          - titre: "La notion : déclarer des bornes, figer des versions"
            texte: >-
              Deux fichiers se complètent et ne disent pas la même chose. Le pyproject.toml déclare ce que
              votre code exige : des bornes, par exemple au moins la version 0.27 et strictement moins que la
              1.0. Le fichier de verrouillage dit ce qui a été installé et vérifié : des versions exactes, y
              compris celles des dépendances de vos dépendances.

              Les deux sont versionnés. Le premier exprime une intention et autorise les corrections de
              sécurité ; le second garantit que votre collègue, votre serveur d'intégration et votre
              production installent exactement la même chose. Épingler une version exacte dans le pyproject
              est une erreur fréquente : elle vous prive des correctifs sans rien garantir de plus.
            code:
              - titre: "pyproject.toml, la carte d'identité du projet"
                langage: text
                source: |
                  [project]
                  name = "rapprochement-cooperative"
                  version = "0.1.0"
                  description = "Rapproche les releves mobile money et les factures de la cooperative"
                  requires-python = ">=3.12"
                  dependencies = [
                    "httpx>=0.27,<1.0",
                    "pandas>=2.2,<3.0",
                  ]

                  [project.scripts]
                  rapprocher = "rapprochement.cli:principal"

                  [build-system]
                  requires = ["hatchling"]
                  build-backend = "hatchling.build"
          - titre: "Le geste technique : un point d'entrée en ligne de commande"
            texte: >-
              La section des scripts transforme une fonction Python en commande du terminal. Après
              installation, votre utilisateur tape rapprocher et non python -m quelque_chose, depuis n'importe
              quel dossier.

              La fonction visée ne fait presque rien : elle lit les arguments, appelle le coeur métier, et
              rend un code de sortie. Zéro signifie succès, toute autre valeur signifie échec, et c'est ce
              code qu'une tâche planifiée ou un serveur d'intégration regardera. Un programme qui réussit
              toujours, même quand il échoue, ne peut pas être automatisé.
            figures:
              - nom: python-coeur-partage.svg
                legende: "Une règle métier, plusieurs portes d'entrée : la ligne de commande n'est qu'une porte"
            code:
              - titre: "Un point d'entrée honnête, qui rend un code de sortie"
                langage: python
                source: |
                  import argparse
                  import sys
                  from pathlib import Path


                  def principal(argv: list[str] | None = None) -> int:
                      analyseur = argparse.ArgumentParser(prog="rapprocher")
                      analyseur.add_argument("releve", type=Path)
                      analyseur.add_argument("--seuil-rejets", type=float, default=0.05)
                      options = analyseur.parse_args(argv)

                      paiements, rejets = lire_releve(options.releve)
                      taux = len(rejets) / max(1, len(paiements) + len(rejets))
                      print(f"{len(paiements)} paiements, {len(rejets)} rejets ({taux:.1%})")
                      return 1 if taux > options.seuil_rejets else 0


                  if __name__ == "__main__":
                      sys.exit(principal())
          - titre: "La notion : un secret ne vit jamais dans le dépôt"
            texte: >-
              Une clé d'API, un mot de passe de base, un jeton de paiement mobile : ces valeurs changent d'un
              environnement à l'autre et ne doivent exister nulle part dans le code. Le code lit une variable
              d'environnement ; la valeur est fournie au lancement par le système, par le fichier local de
              développement ou par le gestionnaire de secrets du serveur.

              Un secret commité reste dans l'histoire du dépôt même après suppression du fichier : la seule
              réponse correcte est de révoquer la clé, puis de nettoyer. Le fichier .env est exclu du dépôt
              dès la première minute, et un fichier .env.exemple, lui versionné, liste les noms des variables
              sans leurs valeurs.
            figures:
              - nom: python-secrets-hors-du-code.svg
                legende: "Où vit un secret, et où il ne vit jamais"
              - nom: devpy-m07-b.jpg
                legende: "Une clé se range dans un endroit prévu pour elle, pas dans le dossier du projet"
          - titre: "Le geste technique : lire la configuration sans la deviner"
            texte: >-
              La fonction de configuration lit l'environnement, valide ce qu'elle trouve, et échoue tout de
              suite si une valeur obligatoire manque. Échouer au démarrage vaut infiniment mieux qu'échouer au
              milieu d'un traitement, trois heures plus tard, sur un appel distant.

              Ne donnez jamais de valeur par défaut à un secret. Un mot de passe par défaut finit toujours par
              tourner en production. Donnez en revanche des valeurs par défaut aux réglages inoffensifs :
              délais, tailles de lot, niveau de journalisation.
            code:
              - titre: Une configuration validée au démarrage
                langage: python
                source: |
                  import os
                  from dataclasses import dataclass


                  class ConfigurationManquante(RuntimeError):
                      pass


                  def _obligatoire(nom: str) -> str:
                      valeur = os.environ.get(nom)
                      if not valeur:
                          raise ConfigurationManquante(f"variable d'environnement absente : {nom}")
                      return valeur


                  @dataclass(frozen=True)
                  class Configuration:
                      cle_api: str
                      base_url: str
                      delai_s: float = 5.0

                      @classmethod
                      def depuis_environnement(cls) -> "Configuration":
                          return cls(
                              cle_api=_obligatoire("COOP_CLE_API"),
                              base_url=os.environ.get("COOP_BASE_URL", "https://api.exemple.test"),
                              delai_s=float(os.environ.get("COOP_DELAI_S", "5")),
                          )
          - titre: "La notion : un programme vit dans un système, pas dans un éditeur"
            texte: >-
              Votre outil ne tournera pas toujours dans votre éditeur. Il tournera dans un terminal, lancé par
              un collègue, par une tâche programmée de nuit, ou par une chaîne d'intégration. Dans tous ces
              cas, trois choses décident de son comportement, et aucune n'est dans votre code.

              Les chemins d'abord. Un chemin absolu part de la racine du disque et désigne toujours le même
              endroit. Un chemin relatif part du dossier courant, celui où la commande a été lancée, qui n'est
              presque jamais celui où vit votre fichier. C'est la première cause de l'erreur de fichier
              introuvable qui n'apparaît que sur le serveur.

              Les variables d'environnement ensuite. Ce sont des valeurs que le système transmet au programme
              au moment de son lancement : le chemin des exécutables, la langue, et vos propres réglages.
              C'est par elles que passent les secrets, comme vous l'avez vu plus haut cette semaine, parce
              qu'elles ne laissent aucune trace dans le dépôt.

              Le processus enfin. Chaque programme lancé reçoit un dossier courant, un environnement, trois
              canaux, et rend un code de retour en s'arrêtant. Ce contrat minimal est le même pour tous les
              outils du système, et c'est précisément ce qui permet de les assembler.
            tableaux:
              - titre: Le contrat que tout programme de ligne de commande doit respecter
                entetes: [Élément, À quoi il sert, La faute à ne pas commettre]
                lignes:
                  - [Entrée standard, "recevoir des données d'un autre outil", "n'accepter qu'un chemin de fichier"]
                  - [Sortie standard, "produire le résultat, et lui seul", "y mélanger des messages d'avancement"]
                  - ["Sortie d'erreur", "messages, avertissements, diagnostics", écrire les erreurs sur la sortie standard]
                  - [Code de retour, "dire si tout s'est bien passé", "rendre toujours zéro, même après un échec"]
                  - ["Variables d'environnement", configurer sans recompiler, mettre la configuration en dur dans le code]
                  - [Arguments, "dire quoi faire, sur quoi", poser des questions interactives dans un script]
          - titre: "Le geste technique : parler par l'entrée et la sortie standard"
            texte: >-
              L'outil ci-dessous lit des montants sur l'entrée standard, un par ligne, écrit le total sur la
              sortie standard, et met ses messages d'erreur sur la sortie d'erreur. Il rend zéro si tout va
              bien, un s'il n'a rien reçu, deux s'il a rencontré une ligne illisible.

              Cette répartition n'est pas une convention décorative. Elle permet à un collègue de récupérer le
              total dans un fichier sans y trouver vos messages, et à une tâche programmée de savoir si elle
              doit alerter. Un outil qui écrit ses avertissements sur la sortie standard pollue le résultat de
              tous ceux qui l'utiliseront après lui.

              Le point d'entrée déclaré dans le pyproject, vu plus haut cette semaine, transforme cette
              fonction en commande du système. L'appel à SystemExit transmet le code de retour, qui est le
              seul moyen qu'a votre programme de dire non à celui qui l'a lancé.
            figures:
              - nom: python-flux-ou-liste.svg
                legende: "Lire au fil de l'eau permet de brancher l'outil derrière n'importe quel autre"
            code:
              - titre: "ventes/cli.py, un outil qui s'intègre partout"
                langage: python
                source: |
                  import os
                  import sys


                  def principal() -> int:
                      devise = os.environ.get("VENTES_DEVISE", "FCFA")
                      total = 0
                      lignes = 0
                      for brute in sys.stdin:
                          ligne = brute.strip()
                          if not ligne:
                              continue
                          try:
                              total += int(ligne)
                          except ValueError:
                              print(f"ligne illisible : {ligne}", file=sys.stderr)
                              return 2
                          lignes += 1
                      if lignes == 0:
                          print("aucun montant recu", file=sys.stderr)
                          return 1
                      print(f"{total} {devise}")
                      return 0


                  if __name__ == "__main__":
                      raise SystemExit(principal())
          - titre: "Le geste technique : tubes, redirections, codes de retour et exécution à distance"
            texte: >-
              Le tube branche la sortie d'un outil sur l'entrée du suivant. Chacun ignore tout de l'autre, et
              c'est ce qui fait leur force : votre outil de totalisation se branche derrière n'importe quelle
              source de montants, aujourd'hui un fichier, demain une requête, sans une ligne de code de plus.

              La redirection envoie la sortie dans un fichier, et sépare le résultat des messages. Le code de
              retour se lit juste après l'exécution ; il vaut zéro quand tout va bien, et c'est lui que
              regardent les tâches programmées et les chaînes d'intégration pour décider d'alerter.

              L'exécution à distance par SSH applique exactement le même contrat sur une autre machine. Si
              votre outil respecte l'entrée, la sortie et le code de retour, il tourne sur le serveur de la
              coopérative sans rien changer, et son résultat revient sur votre terminal.
            code:
              - titre: "La même commande, quatre usages"
                langage: bash
                source: |
                  # 1. un tube : extraire la colonne des montants, puis totaliser
                  cut -d';' -f4 ventes.csv | tail -n +2 | ventes-total

                  # 2. une redirection : le resultat dans un fichier, les messages dans un autre
                  ventes-total < montants.txt > total.txt 2> erreurs.txt

                  # 3. le code de retour : zero si tout va bien, deux si une ligne est illisible
                  ventes-total < montants.txt
                  echo "code de retour : $?"

                  # 4. une variable d'environnement, puis la meme commande sur le serveur
                  VENTES_DEVISE=XOF ventes-total < montants.txt
                  ssh collecte@serveur-cooperative 'ventes-total < /var/data/montants.txt'
          - titre: "Le geste technique : vérifier le code de retour par un test"
            texte: >-
              Un comportement que personne ne teste finit par disparaître. Le code de retour est le premier à
              se perdre, parce qu'il ne se voit pas quand on lance l'outil à la main.

              Le test lance le programme comme le ferait le système, lui donne son entrée, et vérifie les
              trois choses qui comptent : ce qui sort sur la sortie standard, ce qui sort sur la sortie
              d'erreur, et le code de retour. Rien n'est simulé, c'est le vrai contrat qui est vérifié.

              Remarquez l'emploi de l'interpréteur courant plutôt que du mot python : sur la machine d'un
              collègue ou dans la chaîne d'intégration, la commande python peut désigner un autre
              interpréteur, et le test échouerait pour une mauvaise raison.
            figures:
              - nom: devpy-m07-c.jpg
                legende: "Un tube relie deux outils qui ne se connaissent pas et n'ont pas à se connaître"
            code:
              - titre: "tests/test_cli.py, le contrat vérifié"
                langage: python
                source: |
                  import subprocess
                  import sys


                  def executer(entree: str) -> subprocess.CompletedProcess:
                      return subprocess.run(
                          [sys.executable, "-m", "ventes.cli"],
                          input=entree, capture_output=True, text=True,
                      )


                  def test_le_total_part_sur_la_sortie_standard():
                      resultat = executer("1500\n2300\n")
                      assert resultat.stdout.strip() == "3800 FCFA"
                      assert resultat.returncode == 0


                  def test_une_entree_vide_donne_le_code_un():
                      resultat = executer("")
                      assert resultat.returncode == 1
                      assert "aucun montant" in resultat.stderr


                  def test_une_ligne_illisible_donne_le_code_deux():
                      resultat = executer("1500\nabc\n")
                      assert resultat.returncode == 2
                      assert "illisible" in resultat.stderr
          - titre: "À la main : du dossier au paquet installable"
            texte: >-
              Étape 1, rangez votre code sous un dossier src contenant un paquet au nom du projet. Étape 2,
              complétez le pyproject avec le nom, la version, les bornes et le point d'entrée. Étape 3,
              installez le projet en mode modifiable et vérifiez que la commande répond depuis un autre
              dossier.

              Étape 4, construisez les archives de distribution et regardez leur contenu : aucun fichier de
              test, aucun .env, aucun jeu de données. Étape 5, créez un environnement neuf, installez
              l'archive, et exécutez la commande. Si cette dernière étape réussit sur une machine propre,
              votre projet est livrable.
            figures:
              - nom: python-modules-arborescence.svg
                legende: "Un paquet est une arborescence : le nom importé est le nom du dossier"
            code:
              - titre: "Construire, inspecter, installer ailleurs"
                langage: bash
                source: |
                  uv build
                  tar -tzf dist/rapprochement_cooperative-0.1.0.tar.gz | head -20

                  uv venv /tmp/essai
                  /tmp/essai/bin/python -m pip install dist/rapprochement_cooperative-0.1.0-py3-none-any.whl
                  /tmp/essai/bin/rapprocher releve-2026-11.csv
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Les erreurs d'environnement se ressemblent toutes : Python ne trouve pas ce que vous croyez
              avoir installé. Dans neuf cas sur dix, la cause est que l'interpréteur actif n'est pas celui de
              l'environnement du projet.

              Prenez le réflexe d'afficher le chemin de l'interpréteur avant de chercher plus loin. Le tableau
              donne les quatre messages les plus fréquents et le geste qui les résout.
            tableaux:
              - titre: "Quatre messages d'environnement et leur cause réelle"
                entetes: [Message, "Ce qu'il dit vraiment", La correction]
                lignes:
                  - ["ModuleNotFoundError: No module named 'httpx'", installé ailleurs que dans cet environnement, "vérifier l'interpréteur, réinstaller avec uv add"]
                  - ["ImportError: cannot import name 'X'", version incompatible installée, "lire les bornes, régénérer le verrouillage"]
                  - ["command not found: rapprocher", "le paquet n'est pas installé dans cet environnement", "installer le projet, pas seulement ses dépendances"]
                  - [externally-managed-environment, "pip refuse d'abîmer le Python du système", "créer un environnement, ne jamais forcer"]
          - titre: "Entraînement gradué : imiter, varier, créer"
            texte: >-
              Imiter : transformez un de vos scripts des semaines précédentes en paquet installable, avec une
              commande et un argument. Rien d'autre ne change.

              Varier : ajoutez une seconde commande au même paquet, par exemple une commande de vérification
              qui ne fait que valider le fichier sans rien écrire. Créer : écrivez le LISEZ-MOI, donnez le
              dépôt à quelqu'un qui ne connaît pas le projet, restez silencieux, et notez chaque question
              qu'il pose. Chaque question est un défaut de votre documentation.
          - titre: Aller plus loin cette semaine si vous avez le temps
            texte: >-
              Regardez les versions dynamiques, qui lisent le numéro depuis le code plutôt que de le dupliquer
              dans le pyproject, et les groupes de dépendances optionnelles, qui permettent d'installer le
              projet avec ou sans sa partie analyse de données.

              Explorez aussi la publication sur un index privé, le fonctionnement des roues précompilées, et
              la commande qui vérifie les vulnérabilités connues de vos dépendances. Une dépendance épinglée
              et jamais mise à jour devient une faille de sécurité au bout de deux ans.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est l'installation globale sans environnement. Elle marche trois fois, puis
              elle rend la machine inexploitable.

              Le deuxième est le fichier de verrouillage ajouté au gitignore, souvent par imitation d'un
              exemple trouvé en ligne. Sans lui, personne n'installe la même chose que vous. Le troisième est
              le secret glissé dans le pyproject ou dans un fichier de configuration versionné : il est public
              dès le premier envoi, et aucune suppression ultérieure ne le reprend.
          - titre: Le mémo de la semaine
            texte: >-
              Ce tableau dit, pour chaque fichier d'un projet Python livrable, ce qu'il contient et s'il entre
              dans le dépôt. Appliquez-le à tous vos projets, y compris les plus petits.
            tableaux:
              - titre: "Les fichiers d'un projet livrable"
                entetes: [Fichier, "Ce qu'il dit", Versionné]
                lignes:
                  - [pyproject.toml, "ce que le code exige, en bornes", oui]
                  - [uv.lock, ce qui a été installé et vérifié, oui]
                  - [.env.exemple, les noms des variables attendues, oui]
                  - [.env, les valeurs secrètes de cette machine, "non, jamais"]
                  - [.venv/, "l'environnement reconstructible", non]
                  - [LISEZ-MOI.md, trois commandes pour démarrer, oui]
          - titre: Vous savez faire si vous pouvez répondre à ceci
            texte: >-
              Première vérification : expliquez la différence entre une dépendance déclarée et une version
              figée, en une phrase chacune. Deuxième : dites ce qu'il faut faire quand une clé d'API a été
              commitée par erreur, dans l'ordre. Troisième : citez deux raisons de séparer les dépendances de
              développement des dépendances d'exécution.

              Question de transfert : votre projet doit maintenant tourner à la fois sur votre poste, sur le
              serveur de la coopérative et dans l'intégration continue, avec trois bases différentes. Combien
              de fichiers devez-vous modifier dans votre code pour que cela fonctionne ? La bonne réponse est
              zéro.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un paquet installable complet : arborescence sous src, pyproject renseigné, fichier de
              verrouillage versionné, point d'entrée en ligne de commande avec au moins une option,
              configuration lue depuis l'environnement, fichier d'exemple des variables, et LISEZ-MOI qui
              tient en une page.

              La démonstration se fait sur un environnement neuf : installation depuis l'archive, puis
              exécution de la commande sur un fichier d'exemple fourni dans le dépôt.
            tableaux:
              - titre: La grille qui servira à vous évaluer
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Installation, des étapes manuelles non écrites, trois commandes dans le LISEZ-MOI, réussie sur machine vierge sans aucune question]
                  - [Dépendances, aucune déclaration, bornes déclarées et verrou versionné, dépendances de développement séparées]
                  - [Secrets, une valeur en clair dans le dépôt, "lus depuis l'environnement", "validation au démarrage et fichier d'exemple fourni"]
                  - [Commande, un script lancé par chemin, "point d'entrée installé", code de sortie correct et option documentée]
                  - [Distribution, aucune archive produite, archive construite et testée, "contenu de l'archive vérifié, sans fichiers superflus"]
        livrable: Package installable avec ses dépendances.
        mise_en_situation: "Un collègue installe votre projet et obtient des erreurs de versions de bibliothèques. Expliquez comment rendre l'installation reproductible et ce que vous mettez dans le dépôt."
        quiz:
          - question: "Quel fichier décrit un projet Python moderne ?"
            options: ["pyproject.toml", "setup.exe", "package.json", "Makefile"]
            bonnes: [1]
            explication: "pyproject.toml regroupe métadonnées, dépendances et configuration des outils."
          - question: "À quoi sert un fichier de verrouillage (lock) ?"
            options: ["Figer les versions exactes des dépendances", "Chiffrer le code", "Empêcher les commits", "Accélérer Python"]
            bonnes: [1]
            explication: "Tout le monde installe exactement les mêmes versions."
          - question: "pre-commit permet :"
            options: ["d'exécuter des vérifications avant chaque commit", "de publier un package", "de créer une branche", "de déployer en production"]
            bonnes: [1]
            explication: "Lint, formatage ou tests rapides bloquent un commit non conforme."
          - question: "Votre programme est appelé depuis un enchaînement de commandes. Où écrivez-vous l'erreur, et que renvoyez-vous ?"
            options: ["Sur la sortie d'erreur, avec un code de retour différent de zéro", "Sur la sortie standard, avec un code de retour de zéro", "Sur la sortie standard, avec un code de retour différent de zéro", "Dans un fichier de journal ; le code de retour n'a pas d'importance"]
            bonnes: [1]
            explication: "La sortie standard porte le résultat, que la commande suivante consomme ; la sortie d'erreur porte les messages. Le code de retour est ce que teste le script appelant : zéro veut dire réussi."
          - question: "Que signifie un passage de 1.4.2 à 2.0.0 en versionnage sémantique ?"
            options: ["Une rupture de compatibilité", "Une correction de bug", "Une nouvelle fonction compatible", "Rien de particulier"]
            bonnes: [1]
            explication: "Le numéro majeur change quand l'API n'est plus compatible."
  - title: "Bloc 3 — Niveau confirmé & data (S8–S12)"
    modules:
      - num: "08"
        title: Tests & qualité
        contenu: >-
          pytest, fixtures, tests paramétrés, Hypothesis, couverture, linting, intégration continue
          (GitHub Actions).
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous modifiez du code sans peur. Vous écrivez un test avant le
              correctif et vous le regardez échouer, vous nommez vos tests d'après la règle qu'ils protègent,
              vous paramétrez plutôt que de recopier, vous isolez le réseau et l'horloge, et vous lisez un
              rapport de couverture comme un détecteur d'angles morts.

              Vous faites aussi tourner tout cela automatiquement à chaque envoi de code, avec l'analyse
              statique, de sorte qu'une erreur ne puisse plus atteindre la branche principale sans que
              quelqu'un l'ait vue.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : la dernière fois que vous avez modifié un code en service, combien de temps
              s'est écoulé avant de savoir que vous n'aviez rien cassé ? Si la réponse se compte en jours,
              c'est l'utilisateur qui testait à votre place.

              Deuxième question : un test qui n'a jamais échoué prouve-t-il quelque chose ? Troisième question
              : vos tests actuels passent-ils sur la machine d'un collègue, dans n'importe quel ordre, sans
              fichier préalable ? Ces réponses disent si vous avez un filet ou une décoration.
          - titre: "Le problème d'abord : la règle qui disparaît sans bruit"
            texte: >-
              L'outil de la coopérative calcule la prime de qualité des livraisons. On vous demande une
              exception : les lots de qualité A ne subissent plus la pénalité d'humidité. Vous modifiez le
              calcul, vous vérifiez sur un lot de qualité A, tout va bien, vous livrez.

              Trois jours plus tard, la trésorière constate que les lots de qualité C ne sont plus pénalisés
              non plus : votre condition a remplacé la règle au lieu de l'affiner. Quatre cent mille francs
              versés en trop, et personne ne savait que cette règle existait. Une suite de tests l'aurait dit
              en deux secondes, avant même l'envoi.
            figures:
              - nom: devpy-m08-a.jpg
                legende: "Le filet ne sert pas tous les jours, il sert le jour où l'on tombe"
          - titre: "La notion : rouge d'abord, et pourquoi cet ordre compte"
            texte: >-
              Écrivez le test avant le code qui le satisfait, et regardez-le échouer. Ce passage par le rouge
              est la seule preuve que le test vérifie réellement quelque chose. Un test écrit après le code
              peut parfaitement ne rien assertir et passer quand même, personne ne s'en apercevra.

              L'ordre apporte un second bénéfice, moins évident : écrire le test oblige à décider comment on
              appellera la fonction avant de l'écrire. L'interface se dessine depuis le point de vue de son
              utilisateur, et non depuis celui de son implémentation. Les fonctions pénibles à tester sont
              presque toujours des fonctions mal découpées.
            figures:
              - nom: python-rouge-puis-vert.svg
                legende: "Un test rougit d'abord, puis il verdit : c'est ainsi qu'il prouve quelque chose"
          - titre: "Le geste technique : préparer, exécuter, vérifier"
            texte: >-
              Un test suit trois temps séparés par une ligne vide. Préparer les données dont il a besoin,
              exécuter l'opération une seule fois, vérifier un seul résultat. Son nom décrit la règle
              protégée, pas la fonction appelée : il se lit comme une phrase du cahier des charges.

              Une seule règle par test. Un test qui vérifie cinq choses échoue sur la première et vous cache
              les quatre autres ; cinq tests vous disent exactement lesquelles sont cassées.
            code:
              - titre: "Trois tests nommés d'après les règles qu'ils protègent"
                langage: python
                source: |
                  from domaine import Lot


                  def test_un_lot_sec_n_est_jamais_penalise():
                      lot = Lot(poids_kg=100, qualite="B", humide=False)

                      prix = lot.prix_fcfa()

                      assert prix == 95_000


                  def test_un_lot_humide_de_qualite_b_subit_la_penalite():
                      lot = Lot(poids_kg=100, qualite="B", humide=True)

                      prix = lot.prix_fcfa()

                      assert prix == 85_500


                  def test_la_qualite_a_echappe_a_la_penalite_d_humidite():
                      lot = Lot(poids_kg=100, qualite="A", humide=True)

                      prix = lot.prix_fcfa()

                      assert prix == 120_000
          - titre: "Lire le code ligne à ligne : ce que ces trois tests verrouillent"
            texte: >-
              Le premier fixe le cas nominal : sans humidité, le prix est le prix de base. Le deuxième fixe la
              pénalité pour une qualité courante. Le troisième fixe l'exception demandée.

              Ensemble, ils rendent impossible le bug de l'introduction : si une modification future supprime
              la pénalité pour la qualité C, le deuxième test, décliné sur C, rougit immédiatement. Le coût
              d'écriture est de cinq minutes ; le coût du bug était de quatre cent mille francs et de la
              confiance de la trésorière.
          - titre: "Le geste technique : paramétrer au lieu de recopier"
            texte: >-
              Quand trois tests ne diffèrent que par leurs valeurs, la paramétrisation les réunit sans rien
              perdre : pytest exécute un cas par jeu de valeurs et nomme chaque échec séparément. Vous voyez
              donc toujours exactement quel cas est cassé.

              Attention à ne pas abuser : si les cas diffèrent par la règle et non par les valeurs, gardez des
              tests séparés avec des noms distincts. Un paramètre nommé cas_exceptionnel est le signe qu'il
              fallait deux tests.
            code:
              - titre: "Les bornes d'une règle, en un seul test paramétré"
                langage: python
                source: |
                  import pytest

                  from domaine import Lot


                  @pytest.mark.parametrize(
                      "qualite, attendu",
                      [("A", 120_000), ("B", 85_500), ("C", 63_000)],
                      ids=["qualite-a-exemptee", "qualite-b-penalisee", "qualite-c-penalisee"],
                  )
                  def test_penalite_humidite_par_qualite(qualite, attendu):
                      assert Lot(poids_kg=100, qualite=qualite, humide=True).prix_fcfa() == attendu


                  def test_une_qualite_inconnue_est_refusee():
                      with pytest.raises(QualiteInconnue):
                          Lot(poids_kg=100, qualite="Z", humide=False).prix_fcfa()
          - titre: "La notion : isoler ce qui n'est pas à vous"
            texte: >-
              Un test doit donner le même résultat aujourd'hui, demain, hors ligne et dans un autre fuseau
              horaire. Trois choses l'en empêchent : le réseau, l'horloge et le système de fichiers. Elles
              sont lentes, imprévisibles, et elles appartiennent à quelqu'un d'autre.

              La solution n'est pas de les simuler partout, mais de les isoler derrière une frontière étroite.
              Le coeur métier ne connaît ni HTTP ni horloge : il reçoit des données et une date en paramètre.
              Seule la mince couche qui touche l'extérieur a besoin de doublures, et elle se teste à part, une
              fois.
            figures:
              - nom: python-frontiere-validation.svg
                legende: "La frontière isole le coeur métier de ce qui vient de l'extérieur"
          - titre: "Le geste technique : des doublures honnêtes"
            texte: >-
              Une doublure remplace une dépendance lente ou imprévisible. La forme la plus simple est une
              fonction passée en paramètre, et elle suffit la plupart du temps. Les outils de simulation plus
              avancés servent quand on ne peut pas modifier le code appelé.

              Le danger des doublures est de tester votre simulation plutôt que votre code. Gardez-en peu,
              écrivez au moins un test qui parcourt la chaîne complète sur des données réelles mais figées, et
              méfiez-vous d'une suite où aucun test ne touche jamais du vrai code.
            code:
              - titre: "Injecter l'horloge et le client plutôt que de les simuler"
                langage: python
                source: |
                  from datetime import date


                  def facture_du_mois(paiements, aujourd_hui=date.today):
                      # l'horloge est un parametre : le test fournit une date figee
                      reference = aujourd_hui()
                      return [p for p in paiements if p.date.month == reference.month]


                  def test_la_facture_ne_retient_que_le_mois_courant():
                      paiements = [paiement(date(2026, 11, 3)), paiement(date(2026, 10, 30))]

                      retenus = facture_du_mois(paiements, aujourd_hui=lambda: date(2026, 11, 16))

                      assert len(retenus) == 1
          - titre: "La notion : la couverture est une carte, pas une note"
            texte: >-
              La couverture mesure les lignes exécutées pendant les tests. Elle ne dit rien de la qualité des
              vérifications : un test sans assertion couvre autant de lignes qu'un bon test. Lisez-la comme
              une carte des zones jamais visitées, et allez y voir.

              Viser cent pour cent coûte cher et pousse à écrire des tests décoratifs sur du code trivial.
              Quatre-vingts pour cent avec des vérifications sur les bornes et les cas d'erreur valent mieux.
              En revanche, une zone non couverte dans le calcul des montants ou dans la gestion des droits
              n'est pas acceptable : la criticité prime sur le pourcentage.
          - titre: "Le geste technique : l'analyse statique, ce relecteur qui ne dort jamais"
            texte: >-
              Un analyseur statique lit votre code sans l'exécuter et signale ce qui est douteux : import
              inutilisé, variable jamais lue, except nu, comparaison suspecte, ligne trop longue. Il attrape
              en une seconde ce qu'une relecture humaine laisse passer en vingt minutes.

              Configurez-le dans le pyproject, pas dans la mémoire de chacun, et faites-le échouer en
              intégration continue. Ajoutez le formateur automatique : les discussions sur les espaces et les
              virgules disparaissent définitivement, et les différences de code ne montrent plus que les
              changements de sens.
            code:
              - titre: "Lancer la suite, la couverture et l'analyse en trois commandes"
                langage: bash
                source: |
                  uv run pytest -q
                  uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
                  uv run ruff check . && uv run ruff format --check .
          - titre: "À la main : installer le filet sur un projet existant"
            texte: >-
              Étape 1, prenez un projet des semaines précédentes et écrivez un seul test, sur la règle métier
              la plus importante. Étape 2, cassez volontairement cette règle et vérifiez que le test rougit ;
              remettez-la. Étape 3, écrivez les tests des bornes et des cas d'erreur.

              Étape 4, lancez la couverture et ouvrez le rapport : notez les trois zones non couvertes les
              plus inquiétantes. Étape 5, ajoutez l'analyse statique et corrigez ce qu'elle signale. Étape 6,
              branchez le tout en intégration continue et faites échouer volontairement un envoi pour vérifier
              que la chaîne bloque bien.
            code:
              - titre: "Une chaîne d'intégration qui bloque ce qui est cassé"
                langage: yaml
                source: |
                  name: verification

                  on: [push, pull_request]

                  jobs:
                    tests:
                      runs-on: ubuntu-latest
                      steps:
                        - uses: actions/checkout@v4
                        - uses: astral-sh/setup-uv@v5
                        - run: uv sync --frozen
                        - run: uv run ruff check .
                        - run: uv run pytest --cov=src --cov-fail-under=80
          - titre: Les erreurs que vous allez voir cette semaine
            texte: >-
              Les échecs de tests sont les erreurs les plus utiles de votre carrière : elles arrivent avant
              les utilisateurs. Encore faut-il distinguer un test qui a raison d'un test mal écrit.

              La règle de décision est simple : avant de modifier un test qui échoue, demandez-vous si le
              comportement attendu a vraiment changé. Si oui, le test doit changer et le changement doit être
              expliqué dans le message de commit. Sinon, c'est le code qui doit changer.
            tableaux:
              - titre: "Quatre échecs typiques et ce qu'ils signifient"
                entetes: [Symptôme, Cause probable, Geste juste]
                lignes:
                  - [Le test passe seul et échoue dans la suite, état partagé entre tests, préparer les données dans chaque test]
                  - [Le test échoue un jour sur trente, "dépendance à l'horloge ou au hasard", "injecter la date, figer la graine aléatoire"]
                  - [La suite prend dix minutes, appels réseau ou base réelle, "isoler, et marquer les tests lents à part"]
                  - [Tout est vert mais le bug existe, assertions trop faibles, "vérifier la valeur attendue, pas seulement l'absence d'erreur"]
          - titre: "La notion : déboguer est une enquête, pas une inspiration"
            texte: >-
              Un test rouge vous dit qu'une règle est violée. Il ne vous dit pas où. Entre les deux, il y a
              une enquête, et cette enquête se mène toujours de la même façon, que le programme fasse cent
              lignes ou cent mille. Les développeurs qui paraissent rapides ne devinent pas mieux que les
              autres : ils éliminent plus vite.

              La méthode tient en six temps. Reproduire d'abord : tant que vous ne savez pas provoquer le bug
              à volonté, vous ne saurez jamais s'il est corrigé. Réduire ensuite : enlever tout ce qui n'est
              pas nécessaire à l'apparition du défaut, jusqu'à obtenir le plus petit cas qui échoue encore.
              Formuler alors une hypothèse falsifiable, c'est-à-dire une phrase qu'une expérience peut
              contredire : non pas il y a un problème dans le calcul, mais la pénalité est appliquée aux lots
              de qualité A alors qu'elle ne devrait pas l'être.

              Vient le test de l'hypothèse, une seule expérience à la fois, qui change une seule chose.
              Consigner son résultat, même quand il est négatif : une hypothèse écartée est un progrès, et
              c'est la seule façon de ne pas tourner en rond au bout d'une heure. Puis recommencer, en
              restreignant la zone de recherche à chaque tour. Une bonne enquête divise le territoire à chaque
              hypothèse, elle ne le balaie pas au hasard.

              La faute la plus courante n'est pas de mal chercher : c'est de corriger avant d'avoir compris.
              Un correctif posé sur une hypothèse non vérifiée déplace le bug au lieu de le supprimer, et
              ajoute une ligne que plus personne n'osera retirer.
            figures:
              - nom: python-trace-erreur.svg
                legende: "La trace se lit de bas en haut : la dernière ligne nomme le symptôme, les lignes du dessus donnent le chemin"
              - nom: devpy-m08-c.jpg
                legende: "Un diagnostic se mène instrument en main, une hypothèse à la fois"
            tableaux:
              - titre: "Les six temps de l'enquête, et ce qui va de travers sans eux"
                entetes: [Temps, Ce que vous faites, "Ce qui arrive si vous sautez l'étape"]
                lignes:
                  - [Reproduire, provoquer le bug à volonté, "vous ne saurez jamais s'il est corrigé"]
                  - [Réduire, le plus petit cas qui échoue, vous cherchez dans mille lignes au lieu de dix]
                  - [Formuler, "une phrase qu'un test peut démentir", vous lisez le code en espérant voir]
                  - [Tester, une seule chose à la fois, "deux changements, aucune conclusion"]
                  - [Consigner, "hypothèse, test, résultat", vous refaites trois fois la même expérience]
                  - [Recommencer, sur un territoire réduit, "l'enquête s'étire sans jamais se refermer"]
          - titre: "Le geste technique : le débogueur, les points d'arrêt conditionnels et l'inspection d'état"
            texte: >-
              L'affichage d'une variable rend service une fois, puis il pollue. Le débogueur fait mieux : il
              arrête le programme à l'endroit choisi et vous laisse interroger l'état réel, celui du moment,
              sans rien ajouter au code définitif.

              En Python, la fonction intégrée breakpoint ouvre le débogueur à la ligne où elle se trouve. Les
              commandes utiles tiennent sur une main : n exécute la ligne suivante, s entre dans la fonction
              appelée, c reprend jusqu'au prochain arrêt, p affiche une expression, l affiche le code autour,
              w affiche la pile d'appels, q sort.

              Le point d'arrêt conditionnel est le geste qui change tout quand le bug ne survient qu'à la
              trois mille deux cent dix-septième ligne du relevé. Plutôt que de passer trois mille fois par le
              même arrêt, vous demandez au débogueur de ne s'arrêter que si la condition est vraie.

              Prenez l'habitude d'inspecter l'état avant de conclure : le type d'une valeur autant que sa
              valeur, l'identité d'un objet quand vous soupçonnez un partage de référence, et la pile d'appels
              pour savoir qui vous a amené là. Quatre-vingts pour cent des bugs Python silencieux se voient
              dans le type ou dans l'identité, jamais dans la valeur affichée.
            code:
              - titre: "debogage.py, s'arrêter seulement quand cela devient intéressant"
                langage: python
                source: |
                  def prix_lot(lot: dict) -> int:
                      # arret conditionnel : on ne s'arrete que sur le cas suspect
                      if lot["qualite"] == "A" and lot["humide"]:
                          breakpoint()
                      base = lot["poids_kg"] * PRIX_PAR_QUALITE[lot["qualite"]]
                      return round(base * 0.90) if lot["humide"] else base


                  # dans le debogueur, les questions qui font avancer l'enquete :
                  #   p lot                 -> la valeur complete du dictionnaire
                  #   p type(lot["poids_kg"])  -> str au lieu de int explique bien des choses
                  #   p id(lot) == id(original) -> deux noms, un seul objet partage ?
                  #   w                     -> qui a appele cette fonction, et depuis ou
          - titre: "Le geste technique : la bissection, pour trouver le commit qui a cassé la règle"
            texte: >-
              Quand un comportement marchait la semaine dernière et ne marche plus, l'histoire du dépôt
              contient la réponse. La bissection est une recherche dichotomique dans cette histoire : à chaque
              essai, vous coupez en deux le nombre de commits suspects. Sur deux cents commits, sept essais
              suffisent.

              Vous avez besoin de deux repères et d'une commande de vérification. Le repère bon est un commit
              où le comportement attendu est présent, le repère mauvais est le commit actuel. La commande de
              vérification doit répondre par oui ou par non, sans vous : un test qui passe ou qui échoue.

              La version automatique est la plus honnête, parce qu'elle ne dépend pas de votre jugement à la
              quinzième minute. Elle rend le commit fautif, son auteur et son message, ce qui transforme une
              matinée d'hésitation en trois minutes de certitude.
            code:
              - titre: "bissection.sh, sept essais au lieu de deux cents"
                langage: bash
                source: |
                  # 1. on ouvre l'enquete sur l'histoire
                  git bisect start
                  git bisect bad                 # l'etat actuel est fautif
                  git bisect good v1.2.0         # cette version-la etait saine

                  # 2. on confie la verification a un test, qui ne se fatigue pas
                  git bisect run pytest tests/test_penalite.py -q

                  # 3. git nomme le commit fautif, puis on referme proprement
                  git bisect reset
          - titre: "À la main : tenir un journal de débogage"
            texte: >-
              Le journal de débogage est une feuille, un fichier texte, peu importe, où chaque ligne porte
              quatre colonnes : l'hypothèse, le test qui la met à l'épreuve, le résultat observé, et la suite
              décidée. Il vous coûte trente secondes par tour et vous fait gagner des heures.

              Il sert à trois choses. Il vous empêche de refaire deux fois la même expérience quand la fatigue
              arrive. Il rend votre enquête transmissible : un collègue reprend là où vous en êtes sans que
              vous ayez à tout raconter. Et il devient, une fois le bug corrigé, la matière du message de
              commit et du test de non-régression.

              Exercez-vous sur la base de code fournie, cinq cents à mille cinq cents lignes, dans laquelle
              trois défauts ont été introduits. Pour chaque défaut : reproduisez, réduisez, tenez le journal
              jusqu'à la cause, puis écrivez d'abord le test qui échoue, et seulement ensuite le correctif qui
              le fait passer.

              Ce travail est évaluable à la lecture du journal autant qu'à celle du correctif. Un journal où
              toutes les hypothèses sont vraies du premier coup est suspect : il a été écrit après coup.
            tableaux:
              - titre: "Un journal de débogage, tenu pendant l'enquête"
                entetes: [Hypothèse, Test mené, Résultat, Suite]
                lignes:
                  - ["La pénalité s'applique aux lots de qualité A", "un lot A humide, prix attendu 120 000", "obtenu 108 000, donc pénalisé", hypothèse retenue]
                  - [Le drapeau humide est mal lu depuis le CSV, afficher le type et la valeur lus, "booleen correct, True", "hypothèse écartée, on remonte d'un cran"]
                  - [La condition de qualité a été inversée au commit du 12, bissection sur les vingt derniers commits, commit 4f1c identifié, "lire le diff, écrire le test, corriger"]
          - titre: "La notion : entrer dans le code des autres sans tout casser"
            texte: >-
              Dans un premier emploi, vous écrirez beaucoup moins de code neuf que vous n'en lirez. On vous
              confiera une application que personne n'a documentée, dont les auteurs sont partis, et qui fait
              vivre une activité réelle. La compétence demandée n'est pas d'avoir des idées : c'est d'entrer
              sans rien casser.

              Commencez par le point d'entrée. Toute application en a un : le fichier lancé, la commande
              déclarée dans le projet, la fonction appelée par le serveur. Trouvez-le avant toute chose, car
              c'est le seul endroit dont vous êtes certain qu'il est exécuté.

              Suivez ensuite un seul chemin d'exécution, de bout en bout, pour un seul cas d'usage réel. Pas
              deux, pas le cas général : un. Le chemin complet d'une seule fonctionnalité vous apprend
              l'architecture mieux que la lecture de tous les fichiers dans l'ordre alphabétique.

              Cartographiez avant de modifier. Une page suffit : les quatre ou cinq zones du code, qui appelle
              qui, où vivent les règles métier, où vivent les accès au monde extérieur. Cette carte sera
              fausse sur les détails et juste sur l'essentiel, ce qui est exactement ce qu'il faut pour agir.

              Enfin, la règle qui protège les emplois : on ne réécrit pas. Le code existant contient des
              années de règles métier apprises dans la douleur, dont la moitié n'est écrite nulle part
              ailleurs. La réécriture complète jette ce savoir et recommence les mêmes erreurs. On transforme
              par petits pas sûrs, chacun vérifiable.
            figures:
              - nom: python-modules-arborescence.svg
                legende: "Avant de modifier, on dessine la carte : les zones du code et qui appelle qui"
          - titre: "Le geste technique : suivre un seul chemin d'exécution de bout en bout"
            texte: >-
              Trois outils suffisent pour tracer un chemin dans une base inconnue, et aucun ne demande de
              comprendre l'ensemble du projet.

              La recherche textuelle d'abord : cherchez une chaîne que vous voyez à l'écran ou dans un
              journal, par exemple un libellé ou un message d'erreur. Elle vous dépose directement dans la
              zone concernée, là où la lecture ordonnée vous aurait fait traverser quinze fichiers.

              La pile d'appels ensuite : provoquez volontairement une erreur au milieu du chemin, ou posez un
              arrêt, et lisez qui vous a amené là. La pile est la seule documentation qui ne ment jamais, car
              elle décrit l'exécution réelle et non les intentions.

              Le traçage enfin, quand le chemin traverse plusieurs modules : une poignée de journaux
              temporaires, posés aux frontières, vous donnent l'ordre réel des appels et les valeurs qui
              circulent. Vous les retirez avant de livrer.

              Terminez par un premier changement minuscule, dont vous pouvez prédire l'effet exact avant de le
              faire : renommer une variable locale, extraire une constante, corriger un libellé. S'il produit
              ce que vous aviez prédit, votre carte est juste. Sinon, votre carte est fausse, et il vaut mieux
              l'apprendre sur un changement sans conséquence que sur une règle de facturation.
            code:
              - titre: "explorer.sh, trouver la porte d'entrée et le chemin"
                langage: bash
                source: |
                  # 1. par ou le programme commence-t-il vraiment ?
                  grep -rn "def main\|if __name__\|\[project.scripts\]" --include="*.py" --include="*.toml" .

                  # 2. d'ou vient ce libelle que je vois a l'ecran ?
                  grep -rn "Penalite humidite" --include="*.py" .

                  # 3. qui appelle cette fonction, et depuis combien d'endroits ?
                  grep -rn "prix_lot(" --include="*.py" . | wc -l

                  # 4. le chemin reel, trace pendant une execution
                  python -m ventes.cli --releve releve-octobre.csv --trace 2>&1 | head -20
          - titre: "Entraînement gradué : imiter, varier, créer"
            texte: >-
              Imiter : écrivez cinq tests sur une règle métier existante, dont un par la méthode rouge puis
              vert, en partant d'un bug réel que vous avez déjà rencontré.

              Varier : transformez trois tests presque identiques en un test paramétré avec des identifiants
              lisibles. Créer : prenez un bug signalé dans un de vos anciens projets, écrivez d'abord le test
              qui le reproduit, corrigez ensuite, et gardez le test sous le nom de test de régression. Cette
              habitude seule change la vie d'une équipe.
          - titre: Aller plus loin cette semaine si vous avez le temps
            texte: >-
              Découvrez les fixtures de pytest, qui factorisent la préparation des données, et les bases de
              données jetables créées pour la durée d'un test. Regardez aussi les tests fondés sur des
              propriétés, qui engendrent des centaines de cas et trouvent des bornes auxquelles personne ne
              pense.

              Explorez enfin la mutation testing, qui modifie volontairement votre code pour vérifier que vos
              tests le détectent. C'est le seul outil qui mesure la qualité des tests plutôt que leur
              quantité, et il est souvent humiliant la première fois.
            figures:
              - nom: devpy-m08-b.jpg
                legende: "Vérifier avant de livrer coûte moins cher que réparer après"
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est le test qui dépend d'un autre : il passe dans l'ordre d'écriture et échoue
              dès qu'on lance la suite en parallèle ou en ordre aléatoire. Chaque test prépare ce dont il a
              besoin et ne laisse rien derrière lui.

              Le deuxième est le test qui appelle le réseau, lent et fragile. Le troisième est la suite lente
              qu'on finit par ne plus lancer : gardez les tests unitaires sous la seconde et reléguez les
              tests d'intégration dans une étape séparée, lancée moins souvent mais toujours avant livraison.
          - titre: Le mémo de la semaine
            texte: >-
              Quatre tests bien choisis protègent mieux qu'une centaine écrits par habitude. Ce tableau est la
              liste minimale pour toute règle métier que vous écrirez désormais.
            tableaux:
              - titre: Les quatre tests de toute règle métier
                entetes: [Cas, "Ce qu'il protège", Exemple sur la prime]
                lignes:
                  - [Nominal, la règle marche dans la vie courante, lot sec de qualité B]
                  - [Borne, le seuil est du bon côté, lot au poids minimal accepté]
                  - [Erreur, le refus est explicite et nommé, qualité inconnue refusée]
                  - [Régression, le bug corrigé ne revient pas, qualité A exemptée de pénalité]
          - titre: Vous savez faire si vous pouvez répondre à ceci
            texte: >-
              Première vérification : expliquez pourquoi un test doit d'abord échouer. Deuxième : citez deux
              raisons pour lesquelles un test ne doit pas appeler le réseau. Troisième : dites ce que mesure
              la couverture et ce qu'elle ne mesure pas.

              Question de transfert : un collègue vous dit que son module est trop difficile à tester parce
              qu'il appelle une API, lit un fichier et calcule au même endroit. Que lui proposez-vous, et
              pourquoi cette difficulté est-elle une information sur la conception plutôt que sur les tests ?
          - titre: Le livrable de la semaine
            texte: >-
              Rendez une suite de tests sur un projet existant, avec son exécution automatique : au moins
              quinze tests couvrant les quatre cas du mémo, un rapport de couverture, l'analyse statique
              configurée, et une chaîne d'intégration qui échoue si un test rougit.

              Joignez une note d'une page : la règle métier la plus critique du projet, les tests qui la
              protègent, et les zones que vous avez volontairement laissées non couvertes, avec la raison.
            tableaux:
              - titre: La grille qui servira à vous évaluer
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Nommage, test_fonction_1, le nom énonce la règle, la suite se lit comme le cahier des charges]
                  - [Isolation, "les tests dépendent de l'ordre", chaque test est autonome, suite verte en ordre aléatoire et en parallèle]
                  - [Couverture des cas, le seul cas nominal, "nominal, borne, erreur", "régression issue d'un vrai bug"]
                  - [Vitesse, plusieurs minutes, unitaires sous la seconde, tests lents isolés dans une étape séparée]
                  - [Automatisation, lancés à la main, chaîne qui bloque les envois cassés, analyse statique et couverture minimale imposées]
        livrable: Suite de tests sur un projet existant avec CI.
        mise_en_situation: "Une fonction de calcul de pénalités de retard n'a aucun test et a déjà causé une erreur de facturation. Listez les cas de test que vous écrivez (y compris les cas limites) et montrez deux d'entre eux en pytest."
        quiz:
          - question: "Avec pytest, une fixture sert à :"
            options: ["préparer des données ou ressources réutilisables par les tests", "accélérer Python", "remplacer les assertions", "publier le code"]
            bonnes: [1]
            explication: "Elle factorise la mise en place des tests."
          - question: "@pytest.mark.parametrize permet :"
            options: ["d'exécuter un même test avec plusieurs jeux de données", "d'ignorer un test", "de mesurer la couverture", "de déployer"]
            bonnes: [1]
            explication: "Un seul test couvre plusieurs cas."
          - question: "Une couverture de 100 % garantit :"
            options: ["que chaque ligne a été exécutée, pas que le code est correct", "l'absence totale de bug", "la sécurité du code", "la rapidité"]
            bonnes: [1]
            explication: "La couverture mesure l'exécution, pas la justesse des assertions."
          - question: "En TDD, on écrit d'abord :"
            options: ["un test qui échoue", "le code complet", "la documentation", "le déploiement"]
            bonnes: [1]
            explication: "Cycle rouge, vert, refactorisation."
          - question: "Un comportement correct hier est faux aujourd'hui, et cent commits séparent les deux états. Quel geste trouve le commit fautif le plus vite ?"
            options: ["git bisect, qui coupe l'intervalle en deux à chaque essai : sept essais pour cent commits", "Relire les cent commits dans l'ordre", "Revenir au dernier état correct et tout réécrire", "Ajouter des affichages partout, puis relancer"]
            bonnes: [1]
            explication: "La dichotomie est le seul geste dont le coût croît comme le logarithme du nombre de commits. Avec un test qui échoue, git bisect run l'automatise entièrement."
      - num: "09"
        title: Python asynchrone & API
        contenu: >-
          httpx, async/await, consommation d'API REST, limites de débit, pagination, reprises sur erreur.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous appelez une API distante sans jamais figer votre programme, vous
              traitez chaque code de retour pour ce qu'il dit, vous rejouez ce qui mérite de l'être et
              seulement cela, vous lancez des centaines d'appels concurrents sans écrouler le service d'en
              face, et vous exposez à votre tour une API authentifiée que d'autres consommeront.

              Vous saurez aussi dire, et c'est plus rare, quand l'asynchrone ne sert à rien. Un calcul qui
              occupe le processeur ne va pas plus vite parce qu'on écrit async devant la fonction ; il va
              simplement occuper le processeur en bloquant tout le reste.

              La semaine est dense parce qu'elle réunit deux métiers : consommer une API comme un client poli,
              et en offrir une comme un fournisseur sérieux. Les deux moitiés s'éclairent : on écrit mieux son
              API quand on a souffert de celle des autres.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : quand votre programme attend une réponse du réseau, que fait votre
              processeur pendant ce temps ? Si vous répondez « il attend », vous tenez déjà la raison d'être
              de l'asynchrone.

              Deuxième question : votre programme appelle un service qui renvoie une erreur. Faut-il réessayer
              ? Notez votre réponse. Elle est probablement « ça dépend », et la semaine consiste exactement à
              savoir de quoi.

              Troisième question : vous publiez une API qui renvoie la liste des producteurs d'une
              coopérative. Qu'est-ce qui empêche n'importe qui sur Internet de la lire ? Si rien ne vous
              vient, la section sur l'authentification vous attend.
            figures:
              - nom: devpy-m09-a.jpg
                legende: "Un service distant est une promesse : parfois tenue, parfois lente, parfois rompue"
          - titre: "Le problème d'abord"
            texte: >-
              La coopérative de Divo suit le cours du cacao pour quatre cents références de lots. Chaque matin
              à cinq heures, un programme interroge le service de cotation, une requête par référence. Chaque
              appel prend en moyenne deux cent cinquante millisecondes.

              En séquentiel, quatre cents appels font cent secondes, soit une minute quarante. Acceptable.
              Puis la coopérative passe à quatre mille références, et le programme met seize minutes, pendant
              lesquelles il est impossible de savoir s'il avance ou s'il est bloqué. Un matin, le service de
              cotation répond lentement : le programme attend indéfiniment, personne ne reçoit de prix, et la
              collecte du jour se fait au prix de la veille.

              Trois défauts se cachent dans ce récit, et il faut les séparer pour les traiter. L'attente, qui
              se résout par la concurrence. L'absence de délai maximal, qui se résout par un timeout. L'échec
              passager, qui se résout par une relance mesurée. Les confondre produit un programme qui martèle
              un service déjà en difficulté, ce qui est la meilleure façon de l'achever.
          - titre: "La notion : ce qui se passe réellement avant votre première ligne de Python"
            texte: >-
              Un appel HTTP qui prend deux cents millisecondes n'est pas une opération, c'est une chaîne de
              quatre étapes, et chacune peut échouer pour ses propres raisons. Tant que vous ne savez pas
              laquelle a échoué, vous corrigez au hasard.

              La résolution de nom vient en premier : le nom du service est transformé en adresse par le DNS.
              Si cette étape échoue, aucune connexion n'est tentée, et le message parle de nom introuvable,
              pas de serveur en panne. Sur un poste d'entreprise, c'est souvent un paramétrage de réseau, pas
              le service distant.

              L'établissement de la connexion vient ensuite : votre machine ouvre un canal TCP vers l'adresse
              et le port. Un échec ici, en particulier une attente qui se prolonge puis s'arrête, signale un
              pare-feu, un port fermé ou une machine injoignable. La distinction est nette : refus immédiat
              contre attente interminable, deux causes différentes.

              La poignée de main TLS vient en troisième : les deux parties s'accordent sur le chiffrement et
              votre machine vérifie le certificat du service. Les échecs de cette étape parlent de certificat
              expiré, de nom qui ne correspond pas, ou d'autorité inconnue. Ils n'ont rien à voir avec votre
              code, et tout à voir avec l'horloge de la machine ou le magasin de certificats.

              La requête HTTP n'arrive qu'en quatrième position. Les en-têtes y décrivent ce que vous envoyez
              et ce que vous acceptez, le corps porte les données, et le code de retour dit ce que le service
              a fait. Un code 401 ou 404 prouve, au passage, que les trois étapes précédentes ont réussi : le
              service vous a répondu. Dire le service est en panne devant un 404 est une faute de diagnostic.

              Sur un réseau mobile ivoirien, la latence de chaque étape augmente et la variabilité explose. Un
              appel qui tient en cent millisecondes au bureau peut demander deux secondes en déplacement : vos
              délais maximaux doivent être choisis pour le réseau réel de vos utilisateurs, pas pour le vôtre.
            figures:
              - nom: python-requete-reponse.svg
                legende: "La requête part, la réponse revient : entre les deux, quatre étapes qui peuvent échouer séparément"
              - nom: devpy-m09-c.jpg
                legende: "Entre votre programme et le service, il y a des noms à résoudre, des câbles et des poignées de main"
            tableaux:
              - titre: "Quatre étapes, quatre familles de pannes"
                entetes: [Étape, "Ce qu'elle fait", Symptôme typique, Où chercher]
                lignes:
                  - [Résolution DNS, nom vers adresse, nom introuvable, "réseau local, configuration"]
                  - [Connexion TCP, ouvrir le canal, refus immédiat ou attente qui expire, "pare-feu, port, machine"]
                  - [Poignée de main TLS, chiffrer et vérifier, certificat expiré ou non reconnu, "horloge, magasin de certificats"]
                  - [Échange HTTP, requête et réponse, code 4xx ou 5xx, "votre requête, puis le service"]
          - titre: "Le geste technique : observer un appel avec curl avant d'écrire la moindre ligne de Python"
            texte: >-
              Avant d'ouvrir un éditeur, ouvrez un terminal. Un appel observé en mode verbeux vous montre les
              quatre étapes, dans l'ordre, avec leurs durées. C'est la mesure que votre code ne vous donnera
              pas, parce qu'il vous rend une exception là où le réseau vous aurait montré une étape.

              Lisez la sortie comme un récit. Les lignes marquées d'un astérisque décrivent la mécanique :
              l'adresse choisie, la connexion établie, le certificat accepté. Les lignes précédées d'un
              chevron sortant sont ce que vous envoyez, celles précédées d'un chevron entrant sont ce que le
              service répond. Le bloc de durées, demandé par un format d'écriture, chiffre chaque étape.

              Ce chiffrage tranche les discussions. Si la résolution prend cinq cents millisecondes et le
              reste quarante, votre problème n'est pas le service : c'est votre DNS. Si la poignée de main
              occupe les deux tiers du temps, la bonne réponse est de réutiliser la connexion plutôt que d'en
              ouvrir une par requête, ce que fait un client HTTP persistant.
            code:
              - titre: "observer.sh, les quatre étapes chiffrées"
                langage: bash
                source: |
                  # le recit complet de l'appel, etape par etape
                  curl -v https://exemple.test/cours/cacao

                  # le meme appel, mais chiffre : ou passe le temps ?
                  curl -s -o /dev/null -w "dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s code=%{http_code}\n" \
                    https://exemple.test/cours/cacao

                  # est-ce le nom qui ne se resout pas, ou le port qui est ferme ?
                  getent hosts exemple.test
                  curl -sv --connect-timeout 3 https://exemple.test/ 2>&1 | head -5
          - titre: "À la main : diagnostiquer cinq appels défaillants"
            texte: >-
              On vous remet cinq appels qui échouent, chacun pour une raison différente, et une seule consigne
              : pour chacun, dire à quelle étape il échoue, pourquoi, et quel geste le corrige. Le code Python
              n'est pas la réponse attendue ; l'observation l'est.

              Procédez toujours dans le même ordre, du bas vers le haut de la chaîne. Le nom se résout-il ? Le
              port répond-il ? Le certificat est-il accepté ? Le service répond-il, et avec quel code ? La
              première étape qui échoue est la seule à traiter : tout ce qui suit est hors de cause.

              Rédigez le diagnostic en trois colonnes, comme un compte rendu d'astreinte, et terminez par la
              phrase qui engage : ce que vous changeriez, et pourquoi vous pensez que cela suffira. C'est
              exactement ce que l'on vous demandera un jour à trois heures du matin.
            tableaux:
              - titre: "Cinq pannes, cinq diagnostics attendus"
                entetes: [Observation, Étape en cause, Geste correcteur]
                lignes:
                  - [nom introuvable, résolution DNS, "corriger le nom ou le réseau, pas le code"]
                  - [attente puis expiration, connexion TCP, "pare-feu ou port, et poser un délai maximal"]
                  - [certificat non reconnu, poignée de main TLS, "horloge de la machine, magasin de certificats"]
                  - [code 401, échange HTTP, "clé absente ou expirée, jamais une relance"]
                  - [code 429, échange HTTP, "ralentir, respecter l'en-tête de réessai"]
          - titre: "La notion : une requête, une réponse, un contrat"
            texte: >-
              Un appel HTTP est un échange de messages écrits. Votre programme envoie une requête : un verbe
              qui dit l'intention, un chemin qui dit la ressource, des en-têtes qui disent le contexte, et
              parfois un corps qui porte les données. Le service renvoie une réponse : un code de trois
              chiffres qui dit comment cela s'est passé, des en-têtes, et un corps.

              Le verbe porte un sens que les deux parties doivent respecter. GET lit et ne modifie rien, on
              peut donc le rejouer sans danger. POST crée et peut produire un effet à chaque appel, on ne le
              rejoue pas à la légère. PUT remplace et donne le même résultat qu'on l'appelle une ou dix fois :
              on dit qu'il est idempotent. DELETE supprime, et une seconde suppression devrait répondre que la
              ressource n'existe plus, pas échouer.

              Cette grammaire n'est pas une politesse académique. Elle décide de ce que vous avez le droit de
              rejouer quand un appel échoue sans réponse claire, ce qui arrive plus souvent qu'on ne le croit.
            figures:
              - nom: python-requete-reponse.svg
                legende: "Un appel HTTP est un échange de messages : verbe, chemin, en-têtes, corps"
          - titre: "Le geste technique : un appel qui ne ment jamais"
            texte: >-
              Trois gestes rendent un appel honnête. Déclarer un délai maximal, parce qu'un service qui ne
              répond plus ne doit pas bloquer votre programme. Vérifier le code de retour, parce qu'une
              réponse en 500 est une réponse : elle arrive, elle a un corps, et sans vérification votre
              programme la traite comme un succès. Fermer le client, parce qu'une connexion laissée ouverte
              finit par épuiser les ressources du système.

              La bibliothèque httpx fait les trois proprement, en version synchrone comme en version
              asynchrone, avec la même écriture. C'est pour cela que nous l'employons plutôt que requests.
            code:
              - titre: "cotation.py, un appel borné et vérifié"
                langage: python
                source: |
                  import httpx

                  SERVICE = "https://cotation.exemple.test"


                  def lire_cours(reference: str) -> int:
                      with httpx.Client(base_url=SERVICE, timeout=httpx.Timeout(5.0, connect=2.0)) as client:
                          reponse = client.get(f"/cours/{reference}")
                          reponse.raise_for_status()
                          donnees = reponse.json()
                      return int(donnees["prix_fcfa_par_kg"])


                  if __name__ == "__main__":
                      print(lire_cours("CACAO-GRADE-A"))
          - titre: Lire le code ligne à ligne
            texte: >-
              Le gestionnaire de contexte sur le client garantit la fermeture des connexions, même si une
              exception traverse le bloc. Sans lui, un programme de longue durée accumule les sockets jusqu'à
              l'erreur système.

              Le délai est double, et c'est volontaire. Deux secondes pour établir la connexion, car un
              serveur injoignable se repère vite ; cinq secondes au total, car une réponse lente reste une
              réponse. Un timeout unique et large masque la différence entre un service mort et un service
              chargé.

              L'appel à raise_for_status transforme un code 4xx ou 5xx en exception. C'est le geste que les
              débutants oublient : sans lui, reponse.json() tente de lire une page d'erreur HTML et échoue
              trente lignes plus loin, avec un message qui ne dit rien du vrai problème.

              La conversion explicite en entier est une frontière. Ce qui vient du réseau est une donnée
              étrangère : on la convertit et on la valide avant de la laisser entrer dans le domaine métier.
          - titre: "Les codes de retour, et ce qu'ils vous demandent de faire"
            texte: >-
              Un code de retour n'est pas un verdict moral, c'est une instruction. Les 2xx disent que tout
              s'est passé comme prévu. Les 3xx disent que la ressource est ailleurs. Les 4xx disent que la
              requête est fautive : la rejouer à l'identique produira exactement la même erreur, et insister
              est une faute professionnelle. Les 5xx disent que le service a échoué de son côté : la même
              requête peut réussir dans dix secondes.

              Deux codes méritent une attention particulière. Le 429 annonce que vous appelez trop vite, et
              s'accompagne souvent d'un en-tête Retry-After qui dit combien de temps patienter : respectez-le
              au lieu de calculer votre propre délai. Le 401 et le 403 se confondent souvent : le premier dit
              que vous n'êtes pas identifié, le second que vous l'êtes mais que cela ne vous donne pas le
              droit.
            figures:
              - nom: python-codes-http.svg
                legende: "Le code de retour dit à l'appelant quoi faire ensuite"
            tableaux:
              - titre: Que faire selon le code reçu
                entetes: [Code, "Ce qu'il dit", Votre geste]
                lignes:
                  - [200, la requête a abouti, traiter la réponse]
                  - [400, la requête est mal formée, "corriger le code, jamais rejouer"]
                  - [401, "vous n'êtes pas identifié", "vérifier le jeton, ne pas boucler"]
                  - [403, identifié mais non autorisé, arrêter et signaler]
                  - [404, "la ressource n'existe pas", "traiter comme une absence, pas une panne"]
                  - [429, vous appelez trop vite, attendre le délai annoncé puis rejouer]
                  - [500 à 504, le service a échoué, "rejouer avec un délai croissant, trois fois"]
          - titre: "La notion : attendre à plusieurs sans noyer le service"
            texte: >-
              L'asynchrone sert quand le programme attend quelque chose d'extérieur : une réponse réseau, une
              lecture disque, une requête de base de données. Pendant qu'un appel attend, la boucle
              d'événements donne la main à un autre. Un seul fil d'exécution, des centaines d'attentes
              superposées.

              Ce n'est pas du parallélisme. Deux calculs ne s'exécutent jamais en même temps dans une boucle
              asyncio : si une fonction calcule pendant deux secondes sans jamais rendre la main, tout le
              reste attend deux secondes. Pour le calcul intensif, il faut des processus séparés.

              La concurrence doit être bornée. Lancer quatre mille requêtes simultanées contre un service
              public est la façon la plus rapide de se faire bannir, et accessoirement de saturer sa propre
              machine en connexions. Un sémaphore fixe le nombre d'appels en vol : dix suffisent presque
              toujours à diviser le temps par dix, et restent polis.
            figures:
              - nom: python-flux-ou-liste.svg
                legende: "Produire au fil de l'eau plutôt que tout construire d'un coup"
          - titre: "Le geste technique : concurrence limitée et relance mesurée"
            texte: >-
              La relance est une mécanique à trois réglages : quels codes se rejouent, combien de fois, et
              selon quel délai. Le délai double à chaque essai, ce qu'on appelle un retrait exponentiel, et on
              y ajoute un peu de hasard pour éviter que mille clients ne reviennent tous à la même seconde.

              Remarquez que la fonction ne rattrape pas les erreurs définitives : elle les laisse remonter
              immédiatement. Une requête mal formée ne devient pas correcte parce qu'on la répète.
            code:
              - titre: "client_cotation.py, dix appels en vol, trois essais au plus"
                langage: python
                source: |
                  import asyncio
                  import random

                  import httpx

                  REJOUABLES = {429, 500, 502, 503, 504}
                  ESSAIS = 3


                  async def lire_cours(client: httpx.AsyncClient, reference: str) -> dict:
                      for essai in range(ESSAIS):
                          reponse = await client.get(f"/cours/{reference}")
                          if reponse.status_code == 200:
                              return reponse.json()
                          if reponse.status_code not in REJOUABLES:
                              reponse.raise_for_status()
                          attente = reponse.headers.get("Retry-After")
                          delai = float(attente) if attente else (2 ** essai) + random.uniform(0, 0.5)
                          await asyncio.sleep(delai)
                      raise RuntimeError(f"service indisponible pour {reference}")


                  async def lire_tout(references: list[str], en_vol: int = 10) -> list[dict]:
                      limite = asyncio.Semaphore(en_vol)
                      async with httpx.AsyncClient(
                          base_url="https://cotation.exemple.test",
                          timeout=httpx.Timeout(5.0, connect=2.0),
                      ) as client:
                          async def une(reference: str) -> dict:
                              async with limite:
                                  return await lire_cours(client, reference)

                          return await asyncio.gather(*(une(r) for r in references))


                  if __name__ == "__main__":
                      cours = asyncio.run(lire_tout(["CACAO-GRADE-A", "CACAO-GRADE-B"]))
                      print(cours)
          - titre: "À la main : le client du cours du cacao en sept étapes"
            texte: >-
              Première étape, écrivez la version synchrone pour une seule référence, avec timeout et
              vérification du code. Mesurez sa durée. Deuxième étape, bouclez sur vingt références et mesurez
              de nouveau : vous obtenez la ligne de base à battre.

              Troisième étape, passez en asynchrone sans limiter la concurrence, sur les mêmes vingt
              références, et mesurez le gain. Quatrième étape, montez à quatre cents références sans limite :
              observez les erreurs de connexion qui apparaissent, et notez-les.

              Cinquième étape, ajoutez le sémaphore à dix et recommencez : les erreurs disparaissent, le temps
              reste bon. Sixième étape, ajoutez la relance et simulez une panne en pointant une référence vers
              un chemin qui renvoie 503. Septième étape, journalisez pour chaque référence le nombre d'essais
              et la durée totale, puis écrivez le compte rendu que recevra le responsable de la collecte.

              Conservez vos quatre mesures dans un tableau. C'est ce tableau, et non votre code, qui
              convaincra un employeur que vous savez de quoi vous parlez.
            figures:
              - nom: devpy-m09-b.jpg
                legende: "Mesurer avant d'optimiser : sans chiffre, une optimisation est une croyance"
          - titre: "La notion : exposer votre propre API"
            texte: >-
              Offrir une API, c'est publier un contrat. Les chemins, les formes attendues, les codes renvoyés
              et les règles d'autorisation deviennent des promesses que d'autres programmes vont croire.
              Changer une de ces promesses casse leur code à distance, parfois des mois plus tard.

              L'architecture reste celle de tout le parcours : le cœur métier ne sait pas qu'il est exposé par
              HTTP. La couche web traduit une requête en appel de fonction métier, puis traduit le résultat ou
              l'erreur métier en code de retour. Un refus métier devient un 409 ou un 422 ; une absence
              devient un 404 ; une erreur imprévue devient un 500 sans jamais montrer la trace à l'appelant.

              La validation des entrées se fait à cette frontière, et nulle part ailleurs. Tout ce qui vient
              du réseau est hostile jusqu'à preuve du contraire : un champ trop long, un nombre négatif, une
              chaîne qui contient des caractères de contrôle. Ce qui franchit la frontière est propre, typé,
              et le cœur n'a plus à se défendre.
            figures:
              - nom: python-api-autour-du-coeur.svg
                legende: "La couche web entoure le cœur métier : elle traduit, elle ne décide pas"
          - titre: "Le geste technique : une API authentifiée et bornée"
            texte: >-
              FastAPI construit la validation à partir des annotations de type et publie une documentation
              exécutable. Trois protections sont non négociables : une clé ou un jeton exigé sur toute route
              qui n'est pas publique, des bornes sur chaque champ numérique et chaque longueur de chaîne, et
              une pagination obligatoire sur toute route qui renvoie une liste.

              La comparaison de la clé se fait avec compare_digest, jamais avec l'opérateur d'égalité : la
              comparaison naïve s'arrête au premier caractère différent, ce qui laisse mesurer la clé par le
              temps de réponse. Le secret vient de l'environnement, jamais du code.
            code:
              - titre: "api.py, validation, clé exigée, pagination bornée"
                langage: python
                source: |
                  import os
                  from hmac import compare_digest

                  from fastapi import Depends, FastAPI, Header, HTTPException, Query
                  from pydantic import BaseModel, Field

                  CLE_ATTENDUE = os.environ["CLE_API_COLLECTE"]
                  app = FastAPI(title="Collecte cooperative")


                  def exiger_cle(x_cle_api: str = Header(default="")) -> None:
                      if not compare_digest(x_cle_api, CLE_ATTENDUE):
                          raise HTTPException(status_code=401, detail="cle absente ou invalide")


                  class Livraison(BaseModel):
                      producteur: str = Field(min_length=2, max_length=80)
                      poids_kg: int = Field(gt=0, le=20_000)
                      qualite: str = Field(pattern="^[ABC]$")


                  @app.post("/livraisons", status_code=201, dependencies=[Depends(exiger_cle)])
                  def enregistrer(livraison: Livraison) -> dict:
                      identifiant = service_collecte.enregistrer(livraison.model_dump())
                      return {"identifiant": identifiant}


                  @app.get("/livraisons", dependencies=[Depends(exiger_cle)])
                  def lister(page: int = Query(1, ge=1), taille: int = Query(50, ge=1, le=200)) -> dict:
                      lot, total = service_collecte.lister(page=page, taille=taille)
                      return {"elements": lot, "total": total, "page": page}
          - titre: Les erreurs que vous allez voir
            texte: >-
              Ces messages apparaîtront dans votre terminal cette semaine. Apprenez à les reconnaître : le
              diagnostic tient souvent dans le premier mot de l'erreur, et la correction est presque toujours
              un geste de la liste ci-dessus.

              Prenez l'habitude de lire la trace de bas en haut. La dernière ligne nomme l'erreur, les lignes
              au-dessus racontent comment on y est arrivé, et la ligne de votre propre code est généralement
              la plus basse qui porte un chemin de votre projet.
            tableaux:
              - titre: "Cinq messages, leur sens, leur correction"
                entetes: [Message, "Ce qui s'est passé", Correction]
                lignes:
                  - [httpx.ConnectTimeout, "le serveur n'a pas répondu à temps", "vérifier l'adresse, ajuster le délai de connexion"]
                  - ["RuntimeWarning: coroutine was never awaited", une fonction async appelée sans await, ajouter await ou asyncio.run]
                  - ["RuntimeError: asyncio.run() cannot be called from a running event loop", run appelé dans une boucle déjà active, await la coroutine directement]
                  - ["httpx.HTTPStatusError: 429 Too Many Requests", "trop d'appels en trop peu de temps", "limiter la concurrence, respecter Retry-After"]
                  - [422 Unprocessable Entity, le corps envoyé ne respecte pas le modèle, "lire le détail renvoyé, corriger le champ nommé"]
          - titre: "Entraînement gradué, et où aller ensuite"
            texte: >-
              Imiter : reprenez le client de cotation et faites-le fonctionner contre un service local que
              vous écrivez vous-même en FastAPI, avec une route qui répond parfois 503 au hasard. Vous
              maîtrisez les deux bouts de la conversation.

              Varier : remplacez le sémaphore par une limitation en nombre d'appels par seconde, puis comparez
              les deux stratégies sur quatre cents références. Ajoutez un en-tête de corrélation propagé du
              client vers l'API, et retrouvez une requête précise dans les journaux des deux côtés.

              Créer : exposez l'API de collecte de la coopérative avec trois routes, une authentification par
              clé, une pagination, et un client asynchrone qui l'alimente depuis un fichier de relevés. Faites
              tourner les deux en même temps et mesurez le débit.

              Pour aller plus loin, lisez la documentation des codes de retour HTTP dans la spécification,
              regardez comment une API publique que vous utilisez documente ses limites de débit, et
              intéressez-vous aux files d'attente : au-delà d'un certain volume, on ne rejoue plus en ligne,
              on empile et on traite plus tard.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est l'appel bloquant glissé dans une fonction asynchrone. Un time.sleep, une
              lecture de fichier volumineux ou une requête synchrone fige la boucle entière : vos quatre cents
              appels concurrents redeviennent séquentiels sans qu'aucune erreur ne le signale. Si une
              bibliothèque n'est pas asynchrone, exécutez-la dans un fil séparé.

              Le deuxième piège est la relance aveugle. Rejouer un POST qui a peut-être abouti crée deux
              livraisons au lieu d'une, et la coopérative paie deux fois. Ne rejouez que les opérations
              idempotentes, ou faites porter à la requête un identifiant unique que le serveur reconnaît.

              Le troisième piège est le secret dans le code ou dans le journal. Une clé d'API écrite en dur
              finit sur un dépôt public ; un journal qui affiche l'en-tête complet de la requête publie la
              même clé dans un fichier que tout le monde lit. Les secrets viennent de l'environnement et ne
              sont jamais journalisés.
          - titre: Le mémo de la semaine
            texte: >-
              Gardez ce tableau sous les yeux pendant les exercices. Chaque ligne est un réflexe que l'on
              attend d'un développeur confirmé, et leur absence se remarque immédiatement en revue de code.
            tableaux:
              - titre: "Les réflexes réseau, en une page"
                entetes: [Situation, Le réflexe]
                lignes:
                  - ["J'écris un appel HTTP", "je pose un délai maximal, toujours"]
                  - [Je reçois une réponse, je vérifie le code avant de lire le corps]
                  - ["L'appel échoue en 5xx", "je rejoue trois fois, avec un délai qui double"]
                  - ["L'appel échoue en 4xx", "je corrige, je ne rejoue pas"]
                  - ["Je lance beaucoup d'appels", je borne la concurrence par un sémaphore]
                  - ["J'expose une route", "je valide les entrées et j'exige un jeton"]
                  - [Je renvoie une liste, "je pagine, avec une taille maximale"]
                  - [Je journalise, "ni clé, ni jeton, ni donnée personnelle"]
          - titre: Vous savez faire si...
            texte: >-
              Vous savez expliquer en deux phrases pourquoi l'asynchrone accélère un programme qui appelle le
              réseau et n'accélère pas un programme qui calcule. Vous savez dire, pour chacun des codes 400,
              401, 404, 429 et 503, s'il faut rejouer et pourquoi. Vous savez poser un sémaphore et justifier
              sa valeur. Vous savez protéger une route par une clé comparée en temps constant.

              Question de transfert : votre API de collecte reçoit une requête de création de livraison, la
              traite, et la connexion se coupe avant que la réponse ne parte. Le client, n'ayant rien reçu,
              rejoue la requête. Que se passe-t-il dans la base de la coopérative, et comment auriez-vous
              conçu la route pour que cela ne pose aucun problème ?

              Si cette question vous met mal à l'aise, cherchez l'expression clé d'idempotence, et revenez sur
              votre code avant le livrable.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un client d'API résilient et l'API qu'il consomme. Côté client : concurrence bornée,
              délai maximal sur chaque appel, relance mesurée sur les seuls codes rejouables, et un compte
              rendu chiffré de la collecte. Côté serveur : trois routes au moins, validation des entrées par
              modèle, authentification par clé lue dans l'environnement, pagination bornée, et des tests qui
              simulent les réponses sans toucher au réseau.

              Joignez une page de mesures : temps en séquentiel, en concurrent non borné, en concurrent borné,
              et nombre d'erreurs dans chaque cas. C'est cette page qui transforme un exercice en preuve de
              compétence.
          - titre: "La grille d'évaluation du livrable"
            texte: >-
              Votre travail est noté sur quatre critères. Le niveau attendu est celui d'un développeur que
              l'on peut mettre en production ; le niveau remarquable est celui qui vous fait remarquer en
              entretien. Lisez la grille avant de commencer, pas après avoir rendu.
            tableaux:
              - titre: Comment votre livrable est évalué
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Robustesse, aucun délai maximal, "délais, relance sur 5xx et 429 seulement", idempotence assurée côté serveur]
                  - [Concurrence, appels séquentiels, sémaphore justifié et mesuré, comparaison de deux stratégies chiffrée]
                  - [Sécurité, clé en dur ou route ouverte, "clé en environnement, entrées validées, pagination", comparaison en temps constant et journaux nettoyés]
                  - [Preuve, aucune mesure, quatre mesures et un compte rendu, courbe du temps selon la concurrence]
        livrable: Client d'API résilient avec gestion d'erreurs.
        mise_en_situation: "Votre client d'API se fait bloquer (code 429) par le fournisseur après 100 requêtes. Expliquez la cause et décrivez la stratégie que vous mettez en place côté client."
        quiz:
          - question: "Le code HTTP 429 signifie :"
            options: ["Trop de requêtes", "Ressource introuvable", "Erreur serveur", "Non autorisé"]
            bonnes: [1]
            explication: "Le serveur limite le débit : il faut ralentir."
          - question: "Le backoff exponentiel consiste à :"
            options: ["augmenter progressivement l'attente entre les tentatives", "relancer immédiatement en boucle", "abandonner à la première erreur", "doubler les requêtes"]
            bonnes: [1]
            explication: "On laisse le temps au service de récupérer."
          - question: "await s'utilise :"
            options: ["dans une fonction déclarée async", "n'importe où", "uniquement dans une classe", "uniquement dans les tests"]
            bonnes: [1]
            explication: "await suspend une coroutine en attendant un résultat."
          - question: "Votre appel renvoie un code HTTP 404. Qu'est-ce que cela prouve déjà ?"
            options: ["Que la résolution DNS, la connexion TCP et la poignée de main TLS ont toutes réussi", "Que le serveur est en panne", "Que le certificat est invalide", "Que le nom de domaine n'existe pas"]
            bonnes: [1]
            explication: "Un code HTTP, même d'erreur, est une réponse applicative : elle n'a pu arriver que parce que les trois étapes en dessous ont abouti. On diagnostique du bas vers le haut."
          - question: "Pourquoi fixer un timeout sur chaque requête ?"
            options: ["Pour ne pas rester bloqué indéfiniment", "Pour accélérer le serveur", "Pour chiffrer la réponse", "Pour réduire le prix"]
            bonnes: [1]
            explication: "Sans délai maximal, un service lent peut figer l'application."
      - num: "10"
        title: Bases de données
        contenu: SQL depuis Python, SQLAlchemy 2, ORM vs requêtes, migrations Alembic, bonnes pratiques.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous modélisez un domaine en tables et en relations, vous écrivez du
              SQL lisible qui répond à une question métier en une requête, vous savez pourquoi un écran
              ralentit quand les données grossissent et comment y remédier, vous employez un ORM sans lui
              laisser écrire n'importe quoi, et vous faites évoluer un schéma en production sans perdre une
              ligne.

              Vous saurez aussi écrire une requête qui ne peut pas être détournée. L'injection SQL est la
              faille la plus ancienne et la plus répandue des applications ; elle se referme définitivement
              par un seul geste, et ce geste doit devenir un automatisme.

              La base de données survit à votre application. Les cadres changent, les langages passent, le
              schéma reste et se remplit. C'est la partie de votre travail qui mérite le plus de soin et qui
              en reçoit le moins.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : votre application affiche une liste de trois mille producteurs avec leur
              total livré. Combien de requêtes part-elle chercher dans la base ? Si vous répondez « une », la
              semaine va vous surprendre.

              Deuxième question : deux écritures doivent réussir ensemble, débiter un stock et enregistrer une
              vente. Que se passe-t-il si le courant saute entre les deux ? Votre réponse doit contenir le mot
              transaction.

              Troisième question : un champ de recherche laisse l'utilisateur taper le nom d'un produit, et
              votre code construit la requête en collant ce texte dans une chaîne. Que peut taper un
              utilisateur mal intentionné ? Si vous ne voyez pas, la section sur les requêtes paramétrées est
              la plus importante de votre semaine.
            figures:
              - nom: devpy-m10-a.jpg
                legende: "Les données vous survivront : elles méritent un schéma pensé, pas improvisé"
          - titre: "Le problème d'abord"
            texte: >-
              La chaîne de pharmacies gère douze officines, quarante mille références et trois millions de
              lignes de vente par an. L'écran qui liste les produits avec leur stock et leurs ventes du mois
              s'affiche en trois cents millisecondes sur le poste du développeur, qui a chargé deux cents
              produits de test.

              En production, le même écran met neuf secondes. Le serveur de base de données tourne à quatre
              vingts pour cent de charge processeur toute la journée. Personne ne comprend : le code n'a pas
              changé.

              Il n'a pas changé, mais les données ont grandi. Trois défauts se révèlent avec le volume, et
              aucun n'est visible sur un jeu de test. Une requête par ligne affichée, au lieu d'une seule
              requête. Un filtre sur une colonne sans index, qui oblige la base à parcourir trois millions de
              lignes. Une agrégation faite en Python après avoir tout rapatrié, au lieu d'être demandée à la
              base. Nous allons traiter les trois.
          - titre: "La notion : le schéma porte les règles que le code ne peut pas tenir"
            texte: >-
              Une table décrit une entité du métier : une officine, un produit, une vente. Une colonne porte
              un type, et ce type est une promesse : une quantité est un entier, une date est une date, un
              montant n'est pas un flottant mais un entier de francs ou un décimal exact.

              Une clé primaire identifie une ligne de manière unique et définitive. Une clé étrangère garantit
              qu'une vente ne peut pas référencer un produit inexistant. Une contrainte d'unicité garantit
              qu'une même référence n'est pas saisie deux fois. Une contrainte de validation garantit qu'une
              quantité reste positive.

              Ces garanties valent plus que le même contrôle écrit en Python, parce qu'elles tiennent quelle
              que soit la porte d'entrée : votre application, un script de reprise, un collègue dans un outil
              d'administration, un import de nuit. Le code protège une porte, le schéma protège la maison.
          - titre: "Le geste technique : un schéma avec ses contraintes"
            texte: >-
              Écrivez le schéma avant le code. Chaque ligne de la définition ci-dessous est une règle du
              métier rendue inviolable, et chacune vous évitera une journée d'enquête un jour.

              La clé étrangère sur le produit empêche les ventes orphelines. La contrainte d'unicité sur le
              couple officine et référence empêche le doublon de catalogue. La contrainte de validation sur la
              quantité empêche les quantités négatives, qui apparaissent toujours tôt ou tard par une erreur
              de signe. La valeur par défaut sur la date de création évite d'oublier de la renseigner.

              Le choix du type pour l'argent mérite une phrase. N'employez jamais un flottant pour des francs
              : un flottant ne représente pas exactement les décimales, et les totaux finissent par s'écarter
              d'un franc, ce qui fait perdre confiance dans toute l'application. Un entier de francs CFA, qui
              n'a pas de centimes, est la représentation la plus simple et la plus sûre.
            code:
              - titre: "schema.sql, des règles que le code ne peut pas contourner"
                langage: sql
                source: |
                  CREATE TABLE officine (
                      id          SERIAL PRIMARY KEY,
                      nom         TEXT NOT NULL,
                      quartier    TEXT NOT NULL
                  );

                  CREATE TABLE produit (
                      id          SERIAL PRIMARY KEY,
                      reference   TEXT NOT NULL,
                      libelle     TEXT NOT NULL,
                      UNIQUE (reference)
                  );

                  CREATE TABLE vente (
                      id            BIGSERIAL PRIMARY KEY,
                      officine_id   INTEGER NOT NULL REFERENCES officine (id),
                      produit_id    INTEGER NOT NULL REFERENCES produit (id),
                      quantite      INTEGER NOT NULL CHECK (quantite > 0),
                      prix_fcfa     INTEGER NOT NULL CHECK (prix_fcfa >= 0),
                      vendue_le     DATE NOT NULL DEFAULT CURRENT_DATE
                  );

                  CREATE INDEX vente_par_officine_et_date ON vente (officine_id, vendue_le);
          - titre: "La notion : l'ordre réel d'exécution d'une requête"
            texte: >-
              Une requête s'écrit dans un ordre et s'exécute dans un autre, et presque toutes les erreurs de
              débutant viennent de cet écart. Le serveur part des tables et des jointures, filtre les lignes,
              regroupe, filtre les groupes, puis sélectionne les colonnes, trie et limite.

              Cela explique pourquoi on ne peut pas filtrer sur une somme dans la clause WHERE : au moment où
              WHERE s'applique, la somme n'existe pas encore, il faut HAVING. Cela explique aussi pourquoi un
              alias défini dans le SELECT n'est pas toujours utilisable dans le WHERE, alors qu'il l'est dans
              le ORDER BY, qui vient après.

              Une jointure interne ne garde que les correspondances. Une jointure externe à gauche garde
              toutes les lignes de gauche et laisse des valeurs nulles à droite. Le choix change les
              effectifs, donc les totaux, donc les décisions. Vérifiez toujours le nombre de lignes avant et
              après une jointure.
          - titre: "Le geste technique : demander à la base, pas à Python"
            texte: >-
              Compter, additionner, moyenner et classer sont des opérations que la base fait mieux que vous,
              parce qu'elle travaille là où sont les données et qu'elle sait utiliser ses index. Rapatrier
              trois millions de lignes pour en faire douze totaux est un gaspillage de réseau, de mémoire et
              de temps.

              La requête ci-dessous répond en une passe à une question que l'on pose tous les mois. Lisez-la
              dans l'ordre d'exécution : les trois tables, le filtre de période et de quartier, le
              regroupement par libellé, le filtre sur les groupes, puis le tri et la limite.
            figures:
              - nom: python-masse-salariale-mois.svg
                legende: "Une agrégation demandée à la base renvoie douze lignes au lieu d'un million"
            code:
              - titre: "top_references.sql, une question métier en une requête"
                langage: sql
                source: |
                  SELECT p.libelle,
                         SUM(v.quantite)               AS unites,
                         SUM(v.quantite * v.prix_fcfa) AS chiffre_fcfa
                  FROM vente v
                  JOIN produit p  ON p.id = v.produit_id
                  JOIN officine o ON o.id = v.officine_id
                  WHERE v.vendue_le >= DATE '2026-10-01'
                    AND v.vendue_le <  DATE '2026-11-01'
                    AND o.quartier = 'Plateau'
                  GROUP BY p.libelle
                  HAVING SUM(v.quantite) > 50
                  ORDER BY chiffre_fcfa DESC
                  LIMIT 10;
          - titre: "La notion : l'index, ce qu'il accélère et ce qu'il coûte"
            texte: >-
              Sans index, répondre à un filtre oblige la base à lire toute la table. Avec un index sur la
              colonne filtrée, elle saute directement aux lignes concernées, comme on utilise l'index d'un
              livre au lieu de le lire en entier.

              Un index a un prix : il occupe de l'espace et il doit être mis à jour à chaque écriture. Indexer
              toutes les colonnes ralentit les insertions sans accélérer grand-chose. Indexez ce que vous
              filtrez souvent, ce sur quoi vous joignez, et ce sur quoi vous triez de gros résultats.

              L'ordre des colonnes dans un index composite compte. Un index sur officine puis date sert les
              requêtes qui filtrent sur l'officine seule ou sur les deux, mais pas celles qui filtrent sur la
              date seule. Pour savoir si un index est employé, demandez le plan d'exécution : la base vous dit
              exactement ce qu'elle a fait et combien de lignes elle a lues.
            figures:
              - nom: python-effet-du-cache.svg
                legende: "Le même écran, avant et après : la mesure décide, pas l'intuition"
          - titre: "La notion : pourquoi un index va vite, et ce qu'est un arbre de recherche"
            texte: >-
              Sans index, répondre à une question sur une colonne demande de lire toutes les lignes, une par
              une. Sur cinq cent mille lignes, cela se sent. Avec un index, la base lit quelques dizaines de
              pages et s'arrête. La différence n'est pas une astuce de moteur : c'est la différence entre
              chercher un nom en feuilletant tout l'annuaire et le chercher en ouvrant au milieu.

              La recherche séquentielle parcourt les éléments dans l'ordre : son coût grandit comme le nombre
              de lignes. Doubler la table double le temps. La recherche dichotomique, sur des données triées,
              coupe l'intervalle en deux à chaque essai : son coût grandit comme le logarithme du nombre de
              lignes. Doubler la table ajoute un essai, un seul.

              Un index est la version sur disque de cette idée : un arbre de recherche équilibré, dont chaque
              noeud oriente vers la moitié utile. Équilibré signifie que toutes les branches ont
              approximativement la même profondeur, sans quoi l'arbre dégénère en liste et le gain disparaît.
              Pour cinq cent mille lignes, la profondeur d'un tel arbre se compte en unités, pas en milliers.

              L'index a un prix. Chaque écriture doit maintenir l'arbre à jour, donc chaque insertion, chaque
              mise à jour et chaque suppression coûtent un peu plus cher, et l'index occupe de la place. On
              indexe ce que l'on filtre et ce sur quoi l'on joint, pas tout, et on vérifie après coup qu'un
              index ajouté sert vraiment.

              Dernier point, le plus souvent ignoré : un index ne sert que si la requête lui en laisse la
              possibilité. Une fonction appliquée à la colonne filtrée, un motif qui commence par un joker,
              une comparaison entre deux types différents : dans ces trois cas, la base ne peut plus utiliser
              l'arbre et retombe au parcours complet, sans vous prévenir.
            figures:
              - nom: devpy-m10-c.jpg
                legende: "Le fichier à tiroirs : on ne parcourt pas tous les dossiers, on va droit au bon tiroir"
            tableaux:
              - titre: Chercher dans cinq cent mille lignes
                entetes: [Méthode, Coût, Essais pour 500 000 lignes, Condition]
                lignes:
                  - [Parcours séquentiel, proportionnel au nombre de lignes, "jusqu'à 500 000", aucune]
                  - [Recherche dichotomique, logarithmique, environ 19, données triées]
                  - [Index arborescent, logarithmique, quelques pages lues, "requête compatible avec l'index"]
          - titre: "Le geste technique : lire un plan d'exécution et mesurer le gain d'un index"
            texte: >-
              Ne croyez jamais un index sur parole : demandez à la base ce qu'elle compte faire, et mesurez
              avant et après. Le plan d'exécution est la réponse officielle du moteur à la question comment
              vas-tu répondre à cette requête. Il nomme le parcours complet, l'usage d'un index, l'ordre des
              jointures et le nombre de lignes estimé.

              Le protocole de mesure tient en quatre temps. Peupler une table d'essai avec cinq cent mille
              lignes représentatives. Mesurer la requête sans index, plan à l'appui. Créer l'index, mettre à
              jour les statistiques, mesurer de nouveau. Puis mesurer le coût du côté des écritures, sans quoi
              le bilan est incomplet.

              Dans le plan, trois mots à reconnaître. Un balayage séquentiel sur une grande table, dans une
              requête qui filtre, est un signal d'alarme. Un parcours d'index suivi d'un accès à la table est
              le comportement attendu. Et un écart important entre les lignes estimées et les lignes réelles
              signale des statistiques périmées, qui font prendre au moteur de mauvaises décisions.
            code:
              - titre: "mesure_index.sql, avant et après, chiffres à l'appui"
                langage: sql
                source: |
                  -- 1. cinq cent mille ventes d'essai
                  INSERT INTO vente (officine_id, code_produit, quantite, prix_fcfa, date)
                  SELECT (random() * 12)::int + 1,
                         lpad((random() * 4000)::int::text, 6, '0'),
                         (random() * 20)::int + 1,
                         (random() * 25000)::int + 500,
                         DATE '2025-01-01' + (random() * 700)::int
                  FROM generate_series(1, 500000);

                  -- 2. sans index : que fait le moteur, et en combien de temps ?
                  EXPLAIN ANALYZE
                  SELECT SUM(quantite) FROM vente WHERE code_produit = '003421';

                  -- 3. on cree l'index, puis on rafraichit les statistiques
                  CREATE INDEX idx_vente_code_produit ON vente (code_produit);
                  ANALYZE vente;

                  -- 4. meme requete : le plan doit changer de balayage sequentiel a parcours d'index
                  EXPLAIN ANALYZE
                  SELECT SUM(quantite) FROM vente WHERE code_produit = '003421';

                  -- 5. le prix a payer : la meme insertion, index en place
                  EXPLAIN ANALYZE
                  INSERT INTO vente (officine_id, code_produit, quantite, prix_fcfa, date)
                  VALUES (3, '003421', 4, 12000, DATE '2026-11-16');
          - titre: "Les trois requêtes qui rendent un index inutile, et comment s'en apercevoir"
            texte: >-
              Un index présent n'est pas un index utilisé. Trois formulations très répandues l'écartent
              silencieusement, et la seule façon de s'en apercevoir est de lire le plan.

              La première est la fonction appliquée à la colonne filtrée. Si vous filtrez sur l'année extraite
              d'une date, l'index posé sur la date ne s'applique plus : la base devrait calculer la fonction
              pour chaque ligne. La parade consiste à filtrer sur un intervalle de dates, ou à créer un index
              sur l'expression elle-même.

              La deuxième est le motif qui commence par un joker. Un index trie les valeurs par leur début :
              chercher ce qui se termine par une chaîne ne peut pas s'appuyer sur ce tri. Selon le besoin, on
              passe par une recherche plein texte ou par une colonne dédiée.

              La troisième est la comparaison entre types différents, par exemple une colonne de type texte
              comparée à un nombre. La base convertit, donc applique une fonction, donc n'utilise plus
              l'index. C'est le piège classique des codes produit qui commencent par un zéro.

              Vérifiez vos trois requêtes les plus fréquentes avec cette grille, plan à l'appui, et corrigez
              celles qui retombent au parcours complet. Le gain se mesure en secondes gagnées sur chaque
              affichage d'écran, tous les jours.
            tableaux:
              - titre: "Trois formulations qui écartent l'index"
                entetes: [Écrit ainsi, Ce que fait la base, Écrire plutôt]
                lignes:
                  - [filtre sur une fonction de la colonne, parcours complet, "un intervalle, ou un index sur l'expression"]
                  - [motif commençant par un joker, parcours complet, recherche plein texte ou colonne dédiée]
                  - [colonne texte comparée à un nombre, conversion ligne à ligne, "comparer au bon type, zéro initial compris"]
          - titre: "À la main : du N plus un à la requête unique, en six étapes"
            texte: >-
              Première étape, activez la journalisation des requêtes en développement et ouvrez l'écran de
              liste des produits. Comptez les requêtes : le chiffre vous surprendra, et c'est le point de
              départ de la semaine.

              Deuxième étape, identifiez la boucle coupable dans votre code : une requête pour la liste, puis
              un accès à une relation à l'intérieur de la boucle d'affichage. Troisième étape, écrivez à la
              main, en SQL, la requête unique qui rend les mêmes données, avec jointure et agrégation.

              Quatrième étape, mesurez cette requête seule, puis ajoutez l'index manquant et mesurez de
              nouveau. Cinquième étape, remplacez la boucle par la requête dans l'application et vérifiez que
              l'écran affiche exactement la même chose, lignes et totaux compris.

              Sixième étape, consignez les quatre chiffres : nombre de requêtes avant et après, temps
              d'affichage avant et après. Gardez ce tableau : il est la démonstration la plus convaincante que
              vous présenterez en entretien.
            figures:
              - nom: devpy-m10-b.jpg
                legende: "Compter les requêtes avant d'optimiser : l'écran lent a presque toujours la même cause"
          - titre: "La notion : la transaction, ou le tout ou rien"
            texte: >-
              Une transaction regroupe plusieurs écritures en une opération indivisible. Soit tout est
              enregistré, soit rien ne l'est. Vendre un produit, c'est insérer une vente et décrémenter un
              stock : si la seconde écriture échoue, la première doit disparaître, sinon le stock de la
              pharmacie ment pour toujours.

              Une transaction isole aussi : pendant qu'elle travaille, les autres connexions ne voient pas son
              état intermédiaire. Cela évite qu'un écran de synthèse affiche une vente dont le stock n'a pas
              encore bougé.

              Gardez les transactions courtes. Une transaction ouverte pendant un appel réseau ou une attente
              utilisateur bloque des lignes et finit par bloquer toute l'application. Ouvrez, écrivez,
              validez, fermez.
          - titre: "Le geste technique : un ORM qui ne vous trahit pas, et des migrations"
            texte: >-
              Un ORM traduit vos objets en SQL. Il est commode, et il cache le coût : c'est son danger. Trois
              règles le rendent sûr. Demandez explicitement les relations que vous allez parcourir, sinon il
              les cherchera ligne par ligne. Demandez les agrégations à la base plutôt que de boucler en
              Python. Lisez le SQL qu'il produit, au moins une fois par écran, en l'affichant.

              Une migration est un changement de schéma versionné, écrit dans un fichier, appliqué dans
              l'ordre, et réversible autant que possible. Ajouter une colonne non nulle à une table remplie
              demande trois temps : ajouter la colonne avec une valeur par défaut, remplir l'existant, puis
              poser la contrainte. Sauter ces temps bloque la table et interrompt le service.
            figures:
              - nom: python-migrations.svg
                legende: "Une migration est un changement de schéma daté, appliqué dans l'ordre"
            code:
              - titre: "depot.py, charger les relations en une fois, écrire en transaction"
                langage: python
                source: |
                  from sqlalchemy import func, select
                  from sqlalchemy.orm import Session, selectinload


                  def totaux_par_produit(session: Session, officine_id: int) -> list[tuple[str, int]]:
                      requete = (
                          select(Produit.libelle, func.sum(Vente.quantite * Vente.prix_fcfa))
                          .join(Vente, Vente.produit_id == Produit.id)
                          .where(Vente.officine_id == officine_id)
                          .group_by(Produit.libelle)
                          .order_by(func.sum(Vente.quantite * Vente.prix_fcfa).desc())
                      )
                      return list(session.execute(requete).all())


                  def enregistrer_vente(session: Session, vente: Vente, stock: Stock) -> None:
                      with session.begin():
                          session.add(vente)
                          stock.quantite -= vente.quantite
                          if stock.quantite < 0:
                              raise StockInsuffisant(stock.produit_id)
          - titre: "Sécurité : l'injection SQL se referme en un geste"
            texte: >-
              Une requête construite en collant du texte dans une chaîne est une requête que l'utilisateur
              peut réécrire. Un champ de recherche contenant une apostrophe suivie d'une instruction, et votre
              requête ne fait plus ce que vous croyez : elle peut lire une autre table, effacer des données,
              ou renvoyer tous les comptes.

              La correction est unique et sans exception : passez les valeurs comme paramètres liés, jamais
              par concaténation ni par interpolation de chaîne. Le pilote envoie la requête et les valeurs
              séparément, et aucune valeur ne peut devenir du code. Cette règle vaut même pour une valeur qui
              vient de votre propre code : les exceptions d'aujourd'hui deviennent les failles de demain.

              Deux protections complètent le tableau. Le compte applicatif ne doit avoir que les droits dont
              il a besoin : lire et écrire les tables du métier, pas créer ni supprimer. Et les messages
              d'erreur renvoyés à l'utilisateur ne doivent jamais contenir le texte de la requête ni le nom
              des tables.
            tableaux:
              - titre: "Trois façons d'écrire la même requête, une seule acceptable"
                entetes: [Écriture, Verdict, Pourquoi]
                lignes:
                  - [f-string avec la valeur, interdit, "l'utilisateur écrit la requête"]
                  - [concaténation de chaînes, interdit, "même faille, autre syntaxe"]
                  - [paramètre lié, la seule correcte, la valeur ne peut pas devenir du code]
                  - [nom de table dynamique, à éviter, "si inévitable, comparer à une liste blanche"]
          - titre: "La notion : au-delà de l'injection, le moindre privilège et le transit chiffré"
            texte: >-
              La requête paramétrée ferme l'injection, et c'est le premier geste. Il ne suffit pas. Le
              classement OWASP place le contrôle d'accès défaillant en tête des risques applicatifs, devant
              les défauts cryptographiques et devant l'injection : autrement dit, la plupart des fuites
              réelles ne viennent pas d'une requête mal écrite, mais d'un compte qui pouvait trop et d'un
              canal qui protégeait mal.

              Le moindre privilège s'applique au compte que votre application utilise pour se connecter à la
              base. Ce compte n'a pas besoin de créer des tables, d'en supprimer, ni de lire les tables qui ne
              le concernent pas. Un compte applicatif restreint transforme une injection réussie en incident
              mineur au lieu d'une perte totale. Les migrations, elles, s'exécutent avec un autre compte, au
              moment du déploiement, et jamais depuis le code qui sert les utilisateurs.

              Le chiffrement en transit protège la liaison entre votre application et la base, et pas
              seulement entre le navigateur et votre application. Une base jointe sans chiffrement sur un
              réseau partagé expose, en clair, tout ce qui transite, identifiants compris.

              Restent les données personnelles. Un numéro de téléphone, un numéro de compte mobile money, un
              nom associé à une adresse sont des données qui engagent la responsabilité de votre employeur.
              Trois règles suffisent à éviter l'essentiel : ne collecter que ce qui sert, ne jamais écrire ces
              valeurs dans les journaux, et fixer une durée de conservation au-delà de laquelle elles sont
              effacées ou rendues anonymes.
            figures:
              - nom: python-roles-permissions.svg
                legende: "Chaque compte reçoit le strict nécessaire : ce qui n'est pas accordé ne peut pas être détourné"
            tableaux:
              - titre: "Quatre risques OWASP, quatre gestes dans ce module"
                entetes: [Risque, Ce qui arrive, Le geste]
                lignes:
                  - ["Contrôle d'accès défaillant", un compte qui peut tout, compte applicatif restreint]
                  - [Défaut cryptographique, transit en clair, liaison chiffrée vers la base]
                  - [Injection, requête détournée, "paramètres liés, jamais de concaténation"]
                  - [Journalisation exposante, données personnelles en clair, "masquer avant d'écrire"]
          - titre: "Le geste technique : un test qui verrouille l'injection, des journaux qui ne trahissent personne"
            texte: >-
              Une protection que rien ne vérifie finit par disparaître au détour d'une correction pressée. Le
              test d'injection est court, il se lit comme une démonstration, et il reste dans la suite pour
              toujours : une valeur hostile est fournie, et la table est encore là après. Il tourne sur une
              base en mémoire, sans serveur à installer : le marqueur de paramètre change d'un pilote à
              l'autre (« ? » pour SQLite, « %s » pour PostgreSQL), le principe ne change jamais.

              Le masquage des données personnelles se traite à un seul endroit, au moment d'écrire le journal,
              jamais à chaque appel. Une fonction de masquage et un filtre de journalisation suffisent : le
              reste du code continue d'écrire ce qu'il veut, et rien de sensible ne sort.

              Ajoutez enfin la durée de conservation sous forme de tâche, pas de bonne intention : une
              instruction datée qui efface ou anonymise ce qui a dépassé la durée annoncée. C'est ce que vous
              montrerez le jour où l'on vous demandera ce que devient la donnée d'un client parti.
            code:
              - titre: "test_securite.py, la démonstration qui reste dans la suite"
                langage: python
                source: |
                  import re
                  import sqlite3

                  import pytest

                  MASQUE = re.compile(r"\b(\d{2})\d{6}(\d{2})\b")   # 0748123456 -> 07******56


                  def masquer(message: str) -> str:
                      return MASQUE.sub(r"\1******\2", message)


                  @pytest.fixture
                  def connexion():
                      """Une base jetable, en memoire : la demonstration tourne partout, sans serveur a installer."""
                      base = sqlite3.connect(":memory:")
                      base.execute("CREATE TABLE vente (code_produit TEXT, quantite INTEGER)")
                      base.execute("INSERT INTO vente VALUES ('003421', 12)")
                      yield base
                      base.close()


                  def test_une_valeur_hostile_ne_detruit_pas_la_table(connexion):
                      hostile = "003421'); DROP TABLE vente; --"
                      # « ? » est le marqueur de sqlite, « %s » celui de psycopg : dans les deux cas ce
                      # n'est pas un format de chaine, c'est le pilote qui lie la valeur. Une
                      # concatenation, elle, aurait execute le DROP.
                      curseur = connexion.execute(
                          "SELECT SUM(quantite) FROM vente WHERE code_produit = ?", (hostile,)
                      )
                      assert curseur.fetchone()[0] is None
                      assert connexion.execute("SELECT COUNT(*) FROM vente").fetchone()[0] == 1


                  def test_le_journal_ne_contient_aucun_numero_en_clair():
                      assert masquer("paiement recu de 0748123456") == "paiement recu de 07******56"
          - titre: Les erreurs que vous allez voir
            texte: >-
              Ces messages sont ceux d'un serveur PostgreSQL et de SQLAlchemy. Ils sont précis : ils nomment
              la contrainte, la colonne ou la table en cause. Prenez l'habitude de lire la ligne DETAIL, qui
              donne souvent la valeur fautive.

              Une erreur de contrainte n'est pas une panne, c'est le schéma qui fait son travail. La bonne
              réaction est presque toujours de corriger la donnée ou la règle applicative, jamais de retirer
              la contrainte.
            tableaux:
              - titre: "Cinq messages, leur sens, leur correction"
                entetes: [Message, "Ce qui s'est passé", Correction]
                lignes:
                  - [duplicate key value violates unique constraint, une valeur déjà présente est réinsérée, "vérifier avant, ou traiter le conflit"]
                  - [insert or update violates foreign key constraint, "la ligne référencée n'existe pas", "créer le parent, ou corriger l'identifiant"]
                  - [column v.quantite must appear in the GROUP BY clause, une colonne non agrégée dans un regroupement, "agréger la colonne ou l'ajouter au GROUP BY"]
                  - [relation vente does not exist, "la migration n'a pas été appliquée", appliquer les migrations sur cette base]
                  - [PendingRollbackError, une erreur a laissé la session en échec, annuler la transaction avant de continuer]
          - titre: "Entraînement gradué, et où aller ensuite"
            texte: >-
              Imiter : reprenez le schéma de la pharmacie, chargez cent mille ventes générées, et retrouvez le
              top dix des références du mois. Vérifiez votre résultat par un comptage indépendant.

              Varier : supprimez l'index et mesurez, remettez-le et mesurez. Changez la jointure interne en
              jointure externe et expliquez l'écart d'effectif. Écrivez la même question avec l'ORM puis en
              SQL brut, et comparez le SQL produit.

              Créer : modélisez un domaine de votre choix en cinq tables au moins, écrivez ses migrations, une
              couche d'accès paramétrée, et trois écrans de liste sans aucun N plus un. Mesurez chaque écran
              et tenez un tableau de bord des requêtes.

              Pour aller plus loin, apprenez à lire un plan d'exécution en entier, regardez ce qu'est une
              transaction longue et pourquoi elle bloque, et renseignez-vous sur les niveaux d'isolation : le
              jour où deux utilisateurs écriront la même ligne en même temps, vous saurez de quoi on parle.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est le SELECT étoile. Il ramène toutes les colonnes, y compris celles qui sont
              volumineuses ou sensibles, il casse le code dès qu'une colonne est ajoutée, et il empêche la
              base d'utiliser certains index qui auraient suffi.

              Le deuxième piège est la transaction oubliée. Deux écritures liées sans transaction laissent la
              base dans un état incohérent dès la première panne, et personne ne s'en aperçoit avant
              l'inventaire.

              Le troisième piège est l'optimisation sans mesure. Ajouter des index au hasard ralentit les
              écritures et ne règle rien. Mesurez, lisez le plan, corrigez le vrai défaut, mesurez de nouveau.
          - titre: Le mémo de la semaine
            texte: >-
              Ce tableau réunit les réflexes attendus d'un développeur qui touche à une base de production.
              Leur absence se repère en trois minutes de revue de code, et leur présence rassure
              immédiatement.
            tableaux:
              - titre: "Les réflexes base de données, en une page"
                entetes: [Situation, Le réflexe]
                lignes:
                  - ["J'écris une requête avec une valeur", "paramètre lié, jamais de concaténation"]
                  - ["J'affiche une liste", "une seule requête, jointure et agrégation"]
                  - [Je filtre sur une colonne, "je vérifie qu'un index la couvre"]
                  - ["J'écris deux fois dans la même action", "j'ouvre une transaction"]
                  - [Je change le schéma, "j'écris une migration versionnée"]
                  - [Je lis des colonnes, "je nomme celles dont j'ai besoin"]
                  - [Une requête est lente, "je lis le plan d'exécution avant de toucher au code"]
                  - ["Je configure l'accès", le compte applicatif a le minimum de droits]
          - titre: Vous savez faire si...
            texte: >-
              Vous savez dessiner le schéma d'un petit domaine avec ses clés étrangères et ses contraintes, et
              justifier chacune en une phrase. Vous savez repérer un N plus un dans un journal de requêtes.
              Vous savez dire si un index servira une requête donnée. Vous savez expliquer pourquoi un
              paramètre lié ferme l'injection SQL, et pas l'échappement manuel.

              Question de transfert : la pharmacie veut un écran qui liste les produits en rupture dans au
              moins trois officines sur douze, trié par chiffre d'affaires du mois dernier. Écrivez la requête
              en une seule passe, dites quels index vous poseriez, et estimez le nombre de lignes lues.

              Si vous hésitez sur les index, écrivez la requête d'abord, demandez le plan, et laissez la base
              vous répondre : c'est exactement la méthode professionnelle.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez la couche d'accès aux données d'une application : schéma complet avec clés étrangères et
              contraintes de validation, migrations versionnées et rejouables, requêtes paramétrées sans
              exception, au moins une agrégation faite par la base, et des tests qui tournent sur une base
              jetable créée et détruite par la suite de tests.

              Joignez un rapport de performance : pour trois écrans, le nombre de requêtes et le temps avant
              et après vos corrections, avec le plan d'exécution de la requête la plus coûteuse.
          - titre: "La grille d'évaluation du livrable"
            texte: >-
              Les quatre critères ci-dessous sont ceux qu'un relecteur expérimenté vérifie en premier. Le
              critère de sécurité n'admet aucun compromis : une seule requête construite par concaténation
              fait basculer l'ensemble du livrable en insuffisant.
            tableaux:
              - titre: Comment votre livrable est évalué
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Modélisation, tables sans contraintes, "clés étrangères, unicité, validations", types et contraintes justifiés par le métier]
                  - [Sécurité, une requête concaténée, "tout est paramétré, droits minimaux", "erreurs nettoyées, schéma de droits documenté"]
                  - [Performance, N plus un sur les listes, "une requête par écran, index justifiés", "plans d'exécution lus et commentés"]
                  - [Migrations, schéma créé à la main, migrations versionnées et rejouables, ajout de colonne non bloquant en trois temps]
        livrable: Couche d'accès aux données d'une petite application.
        mise_en_situation: "Un formulaire de recherche construit la requête SQL avec f\"SELECT * FROM eleves WHERE nom = '{nom}'\". Expliquez le risque, montrez un exemple de saisie malveillante et réécrivez la requête de manière sûre."
        quiz:
          - question: "La meilleure protection contre l'injection SQL est :"
            options: ["les requêtes paramétrées", "masquer les erreurs", "un mot de passe long", "le HTTPS"]
            bonnes: [1]
            explication: "Les paramètres sont transmis séparément du texte de la requête."
          - question: "Un index existe sur la colonne « ville ». Laquelle de ces conditions ne pourra pas s'en servir ?"
            options: ["WHERE lower(ville) = 'abidjan'", "WHERE ville = 'Abidjan'", "WHERE ville LIKE 'Abi%'", "WHERE ville > 'M'"]
            bonnes: [1]
            explication: "L'index contient les valeurs de la colonne, pas le résultat d'une fonction appliquée dessus. Il faut écrire la condition sur la colonne nue, ou créer un index sur l'expression."
          - question: "À quoi sert une migration Alembic ?"
            options: ["Faire évoluer le schéma de base de façon versionnée", "Sauvegarder les données", "Déployer le front", "Tester l'API"]
            bonnes: [1]
            explication: "Chaque changement de schéma est rejouable dans l'ordre."
          - question: "Une transaction garantit que :"
            options: ["toutes ses opérations réussissent ou aucune n'est appliquée", "la requête est plus rapide", "la base est chiffrée", "les doublons sont supprimés"]
            bonnes: [1]
            explication: "C'est la propriété d'atomicité."
          - question: "Le problème N+1 désigne :"
            options: ["une requête par élément au lieu d'une requête groupée", "une erreur de syntaxe", "une table en trop", "un index manquant obligatoire"]
            bonnes: [1]
            explication: "On le corrige par chargement groupé (jointure ou eager loading)."
      - num: "11"
        title: Python pour la data
        contenu: >-
          NumPy, pandas et Polars, nettoyage, agrégations, Parquet et premières visualisations, le pont vers
          les parcours Data et AI.
        cours:
          - titre: La promesse de la semaine
            texte: >-
              À la fin de cette semaine, vous chargez un jeu de données sans en corrompre une seule valeur,
              vous le nettoyez en étapes nommées et comptées, vous le joignez à d'autres sources en vérifiant
              les effectifs, vous l'agrégez, vous le représentez honnêtement, et vous livrez un pipeline qui
              rejoue l'analyse entière d'une seule commande.

              Vous saurez aussi dire ce que vos données ne permettent pas de conclure. C'est la compétence qui
              distingue un analyste d'un producteur de graphiques, et c'est celle qui vous évitera de faire
              prendre une mauvaise décision à votre employeur.

              Cette semaine ouvre les spécialisations data et intelligence artificielle. Tout ce qui s'y
              construit commence par des données dont on connaît la provenance, les trous et les limites.
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : un fichier contient une colonne de codes de ligne comme 0450 et 0712. Que se
              passe-t-il si vous le chargez sans rien préciser ? Si vous ne voyez pas le problème, votre
              première analyse sera fausse sans que rien ne le signale.

              Deuxième question : une colonne contient trente pour cent de valeurs vides. Que faites-vous ?
              Notez votre réponse ; nous la reprendrons, car il y a trois réponses valides et une seule
              mauvaise, qui est de ne pas se poser la question.

              Troisième question : vous joignez les réservations et le référentiel des lignes, et le nombre de
              lignes passe de 80 000 à 95 000. Est-ce normal ? La réponse tient en un mot, et ce mot décide de
              la justesse de tous vos totaux.
            figures:
              - nom: devpy-m11-a.jpg
                legende: "Toute analyse commence par des données dont on connaît la provenance"
          - titre: "Le problème d'abord"
            texte: >-
              Une compagnie de transport interurbain relie Abidjan à Bouaké, Korhogo, San Pedro et Man. Elle
              veut savoir quelles liaisons remplir mieux, et à quelles heures ajouter des départs.

              Les données existent, et elles sont sales. Trois ans de réservations dans quatre exports, les
              colonnes nommées différemment d'un export à l'autre, des dates au format français ici et
              américain là, des noms de villes écrits de six façons dont deux avec une faute, des codes de
              ligne qui ont perdu leur zéro initial dans un tableur, et le mois de mars envoyé deux fois par
              une agence.

              Le travail d'analyse est pour un quart du calcul et pour trois quarts du nettoyage. Un résultat
              produit sur des données mal nettoyées est pire qu'une absence de résultat : il est cru, et il
              oriente des achats de cars à plusieurs centaines de millions de francs.
          - titre: "La notion : charger, c'est déjà décider"
            texte: >-
              Un DataFrame est un tableau nommé : des colonnes typées et un index. La bibliothèque pandas
              devine les types au chargement, et ses devinettes sont souvent mauvaises pour les données
              réelles.

              Déclarez les types. Un code de ligne est une chaîne, même composé de chiffres, sinon le zéro
              initial disparaît et deux lignes différentes se confondent. Une date est une date, sinon le tri
              devient alphabétique et décembre passe avant février. Un identifiant n'est jamais un flottant.

              Déclarez l'encodage. En Afrique de l'Ouest comme ailleurs, les exports de logiciels anciens sont
              souvent en windows-1252 et non en utf-8 : lus sans précaution, les accents deviennent des suites
              de caractères illisibles, et les noms de villes ne se joignent plus au référentiel.

              Déclarez enfin ce qui compte comme valeur manquante. Un fichier peut écrire une absence de six
              façons : vide, NA, N/A, point, tiret, ou le texte inconnu. Sans la liste, la colonne reste du
              texte et aucun calcul n'est possible.
          - titre: "Le geste technique : un chargement qui ne corrompt rien"
            texte: >-
              Le chargement ci-dessous est volontairement bavard : il dit tout ce qu'il attend. C'est une
              documentation exécutable du format d'entrée, et le jour où le fournisseur changera une colonne,
              l'erreur sera immédiate et claire au lieu d'être silencieuse et tardive.

              La vérification des colonnes attendues est le garde-fou le plus rentable du métier : trois
              lignes qui vous préviennent avant que l'analyse entière ne parte de travers.
            code:
              - titre: "chargement.py, tout est déclaré, rien n'est deviné"
                langage: python
                source: |
                  import pandas as pd

                  COLONNES = {"code_ligne", "date_depart", "ville_arrivee", "places_vendues", "prix_fcfa"}
                  ABSENCES = ["", "NA", "N/A", ".", "-", "inconnu"]


                  def charger(chemin: str) -> pd.DataFrame:
                      tableau = pd.read_csv(
                          chemin,
                          encoding="utf-8",
                          dtype={"code_ligne": "string", "ville_arrivee": "string"},
                          parse_dates=["date_depart"],
                          dayfirst=True,
                          na_values=ABSENCES,
                      )
                      manquantes = COLONNES - set(tableau.columns)
                      if manquantes:
                          raise ValueError(f"colonnes absentes du fichier {chemin} : {sorted(manquantes)}")
                      return tableau
          - titre: "La notion : nettoyer, c'est documenter ses décisions"
            texte: >-
              Le nettoyage se fait en étapes nommées, chacune testable seule, et chacune comptée. Normaliser
              les libellés, traiter les absences, écarter les doublons, contrôler les bornes. Comptez les
              lignes avant et après chaque étape, et conservez ces chiffres : le jour où un total surprendra,
              ils diront immédiatement quelle étape a trop supprimé.

              Les valeurs manquantes se traitent de trois façons, et le choix se justifie. Écarter la ligne,
              quand l'information est indispensable et l'absence rare. Imputer une valeur, quand l'absence est
              aléatoire et que la déformation reste acceptable, ce qui doit être écrit noir sur blanc. Garder
              l'absence comme information, quand elle est elle-même un signal : une agence qui ne renseigne
              jamais l'heure de départ a probablement un autre circuit de saisie.

              La quatrième façon, remplacer par zéro sans y penser, n'est pas une option. Un prix inconnu
              n'est pas un prix nul, et une moyenne calculée ainsi est fausse de plusieurs pour cent.
          - titre: "Le geste technique : un pipeline d'étapes courtes et comptées"
            texte: >-
              Chaque fonction prend un tableau et en rend un autre. Aucune ne modifie son entrée, ce qui rend
              l'ensemble rejouable et testable. Le journal des effectifs est produit par le pipeline lui-même,
              pas ajouté après coup.

              Remarquez la normalisation des villes : mettre en minuscules, retirer les espaces, retirer les
              accents. Sans elle, Bouaké et bouake sont deux villes différentes, et la compagnie croit
              desservir dix destinations au lieu de cinq.
            code:
              - titre: "nettoyage.py, quatre étapes nommées et mesurées"
                langage: python
                source: |
                  import unicodedata

                  import pandas as pd


                  def _sans_accent(serie: pd.Series) -> pd.Series:
                      brut = serie.fillna("").str.strip().str.lower()
                      return brut.map(lambda t: unicodedata.normalize("NFKD", t).encode("ascii", "ignore").decode())


                  def normaliser(tableau: pd.DataFrame) -> pd.DataFrame:
                      tableau = tableau.copy()
                      tableau["ville_arrivee"] = _sans_accent(tableau["ville_arrivee"])
                      tableau["code_ligne"] = tableau["code_ligne"].str.zfill(4)
                      return tableau


                  def dedoublonner(tableau: pd.DataFrame, journal: list[str]) -> pd.DataFrame:
                      cle = ["code_ligne", "date_depart", "ville_arrivee"]
                      avant = len(tableau)
                      tableau = tableau.drop_duplicates(subset=cle, keep="last")
                      journal.append(f"doublons retires : {avant - len(tableau)}")
                      return tableau


                  def ecarter_invalides(tableau: pd.DataFrame, journal: list[str]) -> pd.DataFrame:
                      valide = tableau["places_vendues"].between(0, 70) & tableau["prix_fcfa"].between(500, 50_000)
                      journal.append(f"lignes hors bornes : {int((~valide).sum())} sur {len(tableau)}")
                      return tableau[valide]
          - titre: "La notion : joindre sans perdre ni inventer de lignes"
            texte: >-
              Une jointure combine deux tables par une clé. Elle réussit silencieusement en faisant le
              contraire de ce que vous vouliez, et c'est pour cela qu'elle doit être vérifiée à chaque fois.

              Trois vérifications suffisent. La clé est-elle unique dans la table de droite ? Si non, chaque
              ligne de gauche sera dupliquée autant de fois, et vos totaux seront multipliés. Les types des
              clés coïncident-ils ? Une clé texte ne se joint pas à une clé entière, et pandas vous le dira,
              parfois. Combien de lignes n'ont pas trouvé de correspondance ? L'indicateur de provenance
              répond en une ligne.

              La règle d'or : notez l'effectif avant, l'effectif après, et exigez d'être capable d'expliquer
              la différence. Une jointure qui change le nombre de lignes sans explication est un bug.
            figures:
              - nom: python-flux-ou-liste.svg
                legende: "Traiter au fil de l'eau quand le fichier dépasse la mémoire disponible"
          - titre: "Le geste technique : agréger, pivoter, répondre"
            texte: >-
              Une agrégation résume par groupe, un pivot réorganise en tableau croisé. Ensemble, ils répondent
              à la plupart des questions d'analyse, y compris celles qu'on croit compliquées.

              Le taux de remplissage par liaison et par mois tient en trois lignes. Lisez-les comme une phrase
              : grouper par liaison et par mois, sommer les places vendues et les places offertes, diviser. Le
              résultat est un tableau de quelques dizaines de lignes, prêt à être représenté.
            code:
              - titre: "remplissage.py, du million de lignes au tableau lisible"
                langage: python
                source: |
                  import pandas as pd


                  def remplissage_mensuel(reservations: pd.DataFrame) -> pd.DataFrame:
                      par_mois = (
                          reservations.assign(mois=reservations["date_depart"].dt.to_period("M"))
                          .groupby(["ville_arrivee", "mois"], as_index=False)
                          .agg(vendues=("places_vendues", "sum"), offertes=("places_offertes", "sum"))
                      )
                      par_mois["taux"] = (par_mois["vendues"] / par_mois["offertes"]).round(3)
                      return par_mois.sort_values(["ville_arrivee", "mois"])


                  def tableau_croise(par_mois: pd.DataFrame) -> pd.DataFrame:
                      return par_mois.pivot(index="ville_arrivee", columns="mois", values="taux").fillna(0)
          - titre: "À la main : du fichier brut au constat, en huit étapes"
            texte: >-
              Première étape, chargez les quatre exports avec types et encodage déclarés, et consignez le
              nombre de lignes de chacun. Deuxième étape, harmonisez les noms de colonnes dans une table de
              correspondance écrite une fois pour toutes.

              Troisième étape, normalisez les villes et les codes de ligne, puis comptez les valeurs
              distinctes : vous devez retomber sur le nombre réel de destinations. Quatrième étape, traitez
              les absences colonne par colonne, et écrivez votre décision pour chacune.

              Cinquième étape, dédoublonnez sur la clé métier et expliquez les doublons trouvés. Sixième
              étape, joignez au référentiel des lignes et vérifiez les trois points de la section précédente.
              Septième étape, agrégez et produisez le taux de remplissage par liaison et par mois.

              Huitième étape, écrivez la conclusion en trois phrases, dont une qui dit ce que ces données ne
              permettent pas d'affirmer. Cette dernière phrase est la plus difficile et la plus précieuse.
            figures:
              - nom: devpy-m11-b.jpg
                legende: "Le constat se construit ligne à ligne, bien avant le premier graphique"
          - titre: "La notion : un graphique est un argument"
            texte: >-
              La forme suit la question. Comparer des catégories appelle des barres triées. Suivre une
              évolution appelle une courbe, le temps en abscisse. Montrer une répartition appelle un
              histogramme. Montrer une relation appelle un nuage de points.

              Trois règles rendent un graphique défendable. L'axe des barres part de zéro, sinon un écart de
              deux pour cent devient une montagne. Les unités sont nommées, parce qu'un nombre sans unité ne
              veut rien dire. Le titre énonce le constat et non les variables : « Korhogo se remplit deux fois
              moins que Bouaké » vaut mieux que « Taux par ville ».

              Et toujours l'effectif. Un taux de remplissage de quatre vingt dix pour cent calculé sur six
              départs ne vaut pas le même taux calculé sur six cents.
            figures:
              - nom: python-graphique-lisible.svg
                legende: "Axe à zéro, unité nommée, titre qui énonce le constat"
          - titre: "Le geste technique : du graphique par défaut au graphique publiable"
            texte: >-
              Prenez le graphique produit par défaut et appliquez cinq gestes : trier par valeur, nommer les
              axes avec leurs unités, porter l'axe à zéro, écrire le titre comme une phrase, retirer tout ce
              qui ne porte pas d'information.

              Puis faites-le lire à quelqu'un qui ne connaît pas le dossier, sans un mot d'explication. Ce
              qu'il comprend seul est ce que le graphique dit vraiment ; le reste est dans votre tête.
            figures:
              - nom: python-effectif-par-service.svg
                legende: "Des barres triées du plus grand au plus petit se lisent sans effort"
            tableaux:
              - titre: Choisir la forme en une ligne
                entetes: [La question posée, La forme, À éviter]
                lignes:
                  - [Quelle liaison remplit le mieux, barres triées, camembert]
                  - ["Comment cela évolue dans l'année", courbe, barres par mois]
                  - [Comment les taux se répartissent, histogramme, la seule moyenne]
                  - [Le prix influence-t-il le remplissage, nuage de points, deux courbes superposées]
                  - [Quelle part du chiffre par liaison, barres empilées à cent pour cent, camemberts multiples]
          - titre: "La notion : modéliser avec un graphe, quand le tableau ne suffit plus"
            texte: >-
              Un tableau décrit des lignes indépendantes. Dès que vos données décrivent des liens, le tableau
              ment par omission. Les villes desservies par une compagnie de cars, les tâches d'un pipeline qui
              doivent attendre d'autres tâches, les producteurs qui livrent à des centres de collecte qui
              livrent à une usine : ce sont des graphes, et les traiter comme des tableaux produit du code
              compliqué pour des questions simples.

              Un graphe se résume à deux mots. Les sommets sont les objets : une ville, une tâche, un centre
              de collecte. Les arêtes sont les liens : une liaison, une dépendance, une livraison. Un graphe
              est orienté quand le lien a un sens, comme la tâche B qui attend la tâche A, et non orienté
              quand il n'en a pas, comme une route parcourue dans les deux sens. Il est pondéré quand l'arête
              porte une valeur : une distance en kilomètres, un prix en FCFA, une durée en minutes.

              En Python, la représentation la plus pratique est le dictionnaire de listes d'adjacence : à
              chaque sommet, la liste de ses voisins. La matrice d'adjacence, un tableau de zéros et de uns,
              répond instantanément à la question « y a-t-il une arête entre ces deux sommets », mais occupe
              une place proportionnelle au carré du nombre de sommets. Pour un réseau de transport ivoirien de
              quelques dizaines de villes et de quelques centaines de liaisons, les listes d'adjacence gagnent
              sur les deux tableaux : moins de mémoire et un parcours des voisins immédiat.

              Retenez le critère de choix. Si vos sommets sont peu nombreux et vos arêtes nombreuses au point
              que presque tout est relié à tout, la matrice se défend. Dans tous les autres cas, et c'est la
              quasi-totalité des cas réels, prenez les listes d'adjacence.
            figures:
              - nom: devpy-m11-c.jpg
                legende: "Un carrefour est un sommet, les routes qui en partent sont ses arêtes"
              - nom: python-modules-arborescence.svg
                legende: "Une arborescence est un graphe orienté sans cycle, lu de haut en bas"
            tableaux:
              - titre: "Deux représentations d'un graphe, et quand les choisir"
                entetes: [Critère, "Listes d'adjacence", "Matrice d'adjacence"]
                lignes:
                  - [Mémoire occupée, proportionnelle aux arêtes, proportionnelle au carré des sommets]
                  - ["Parcourir les voisins d'un sommet", immédiat, il faut balayer toute une ligne]
                  - [Tester une arête précise, parcours de la liste des voisins, accès direct]
                  - ["Graphe creux, peu d'arêtes", le bon choix, gaspillage de mémoire]
                  - ["Graphe dense, tout relié à tout", acceptable, le bon choix]
                  - [Cas des réseaux réels, presque toujours ceci, rarement justifié]
          - titre: "Le geste technique : parcourir un graphe en largeur et en profondeur"
            texte: >-
              Deux parcours suffisent à répondre à la majorité des questions. Le parcours en largeur visite
              d'abord tous les voisins directs, puis leurs voisins, et ainsi de suite : il trouve le chemin
              comportant le moins d'étapes. Le parcours en profondeur s'enfonce dans une branche jusqu'au bout
              avant de revenir en arrière : il répond aux questions d'accessibilité et sert de base à la
              détection de cycle.

              Les deux algorithmes sont le même code à une ligne près. Le parcours en largeur prend le plus
              ancien élément en attente, avec une file ; le parcours en profondeur prend le plus récent, avec
              une pile. C'est la seule différence, et elle change tout le comportement.

              L'ensemble des sommets déjà vus n'est pas une précaution facultative. Sans lui, le premier cycle
              du graphe fait tourner votre programme indéfiniment. Marquez un sommet comme vu au moment où
              vous l'ajoutez en attente, et non quand vous le traitez, sinon il entre plusieurs fois dans la
              file.

              Notez que la fonction rend le chemin et non un affichage : elle reste utilisable par un autre
              programme, et surtout elle reste testable. La compagnie de cars veut savoir en combien de
              correspondances on relie Abidjan à Korhogo ; le parcours en largeur répond en une ligne.
            code:
              - titre: "reseau.py, le plus court trajet en nombre de correspondances"
                langage: python
                source: |
                  from collections import deque

                  RESEAU = {
                      "Abidjan": ["Yamoussoukro", "Abengourou", "San-Pedro"],
                      "Yamoussoukro": ["Abidjan", "Bouake", "Daloa"],
                      "Bouake": ["Yamoussoukro", "Korhogo"],
                      "Daloa": ["Yamoussoukro", "Man"],
                      "Korhogo": ["Bouake"],
                      "Man": ["Daloa"],
                      "Abengourou": ["Abidjan"],
                      "San-Pedro": ["Abidjan"],
                  }


                  def plus_court_trajet(reseau: dict[str, list[str]], depart: str, arrivee: str) -> list[str] | None:
                      """Parcours en largeur : le trajet comportant le moins de villes intermediaires."""
                      if depart not in reseau or arrivee not in reseau:
                          return None
                      attente = deque([[depart]])
                      vus = {depart}
                      while attente:
                          chemin = attente.popleft()
                          ville = chemin[-1]
                          if ville == arrivee:
                              return chemin
                          for voisine in reseau[ville]:
                              if voisine not in vus:
                                  vus.add(voisine)
                                  attente.append(chemin + [voisine])
                      return None


                  def villes_atteignables(reseau: dict[str, list[str]], depart: str) -> set[str]:
                      """Parcours en profondeur : tout ce que la compagnie dessert depuis cette ville."""
                      pile, vus = [depart], set()
                      while pile:
                          ville = pile.pop()
                          if ville in vus:
                              continue
                          vus.add(ville)
                          pile.extend(reseau.get(ville, ()))
                      return vus


                  print(plus_court_trajet(RESEAU, "Abidjan", "Korhogo"))
                  print(len(villes_atteignables(RESEAU, "Man")), "villes desservies depuis Man")
          - titre: "Le geste technique : détecter un cycle et ordonner des tâches"
            texte: >-
              Votre pipeline de données enchaîne des tâches : charger les ventes, charger le référentiel
              produits, nettoyer, joindre, agréger, publier le rapport. Chacune déclare ce qu'elle attend. La
              question est double : dans quel ordre les exécuter, et que faire si quelqu'un a écrit, par
              distraction, que la jointure attend l'agrégation qui attend la jointure.

              Le tri topologique répond aux deux d'un coup. On retire à chaque tour les tâches dont toutes les
              dépendances sont déjà satisfaites, et on les ajoute à l'ordre d'exécution. Si à un tour plus
              aucune tâche n'est prête alors qu'il en reste, c'est qu'elles s'attendent mutuellement : le
              graphe contient un cycle, et les tâches restantes le composent.

              L'exception porte ici un nom métier et transporte la liste des tâches fautives. C'est la
              différence entre un message qui dit « erreur dans le pipeline » et un message qui dit exactement
              quelles trois tâches forment la boucle. La personne d'astreinte, à trois heures du matin, ne
              lira pas votre code : elle lira ce message.

              Remarquez enfin le tri des tâches prêtes par ordre alphabétique. Il ne sert pas à l'algorithme,
              il sert à vous : il rend la sortie reproductible, donc testable. Deux exécutions sur les mêmes
              données donnent le même ordre, et un test peut l'affirmer.
            code:
              - titre: "ordonnanceur.py, l'ordre d'execution ou le cycle fautif"
                langage: python
                source: |
                  class CycleDetecte(Exception):
                      """Des taches s'attendent mutuellement : le pipeline ne peut pas demarrer."""

                      def __init__(self, taches: set[str]) -> None:
                          self.taches = taches
                          super().__init__("cycle de dependances entre : " + ", ".join(sorted(taches)))


                  def ordre_execution(taches: dict[str, list[str]]) -> list[str]:
                      """taches : nom -> noms des taches qui doivent etre terminees avant celle-ci."""
                      restantes = {nom: set(avant) for nom, avant in taches.items()}
                      ordre: list[str] = []
                      while restantes:
                          prets = sorted(nom for nom, avant in restantes.items() if not avant)
                          if not prets:
                              raise CycleDetecte(set(restantes))
                          for nom in prets:
                              del restantes[nom]
                              ordre.append(nom)
                          for avant in restantes.values():
                              avant.difference_update(prets)
                      return ordre


                  PIPELINE = {
                      "charger_ventes": [],
                      "charger_produits": [],
                      "nettoyer": ["charger_ventes"],
                      "joindre": ["nettoyer", "charger_produits"],
                      "agreger": ["joindre"],
                      "publier": ["agreger"],
                  }

                  print(ordre_execution(PIPELINE))
          - titre: "Entraînement : l'ordonnanceur de pipeline"
            texte: >-
              Premier temps, imiter. Reprenez le pipeline donné plus haut, exécutez l'ordonnanceur, et
              vérifiez que l'ordre obtenu respecte bien chaque dépendance déclarée. Écrivez le test qui
              l'affirme : pour chaque tâche, toutes ses dépendances apparaissent avant elle dans la liste.

              Deuxième temps, varier. Ajoutez volontairement une dépendance fautive, par exemple en déclarant
              que le nettoyage attend l'agrégation, et vérifiez que votre code lève bien l'exception de cycle
              avec les quatre tâches concernées, ni plus ni moins. Un test qui attend une exception sans
              vérifier son contenu ne prouve presque rien.

              Troisième temps, créer. Étendez l'ordonnanceur pour qu'il rende non pas une liste mais une liste
              de vagues : les tâches de la première vague n'attendent rien et peuvent s'exécuter en parallèle,
              celles de la deuxième n'attendent que la première, et ainsi de suite. Vous venez d'écrire le
              cœur d'un ordonnanceur de tâches, celui que l'on retrouve sous le capot des outils du parcours
              Data Engineer.

              Le livrable de cet entraînement est un module ordonnanceur.py accompagné de ses tests : ordre
              correct sur un pipeline valide, cycle correctement nommé sur un pipeline fautif, et vagues
              d'exécution justes sur un pipeline comportant deux branches indépendantes.
          - titre: Ce que les chiffres ne disent pas
            texte: >-
              Un pipeline qui tourne et un graphique bien dessiné produisent une impression de vérité que les
              données ne justifient presque jamais. Cette section ne traite pas de morale : elle traite de
              décisions professionnelles que vous prendrez cette année, et dont vous répondrez.

              Premier point, l'échantillon. Vos chiffres décrivent ce que vous avez mesuré, pas la réalité.
              Les ventes de votre base décrivent les clients qui ont acheté, jamais ceux qui sont repartis
              faute de stock. Ce biais de sélection ne se voit dans aucune colonne, et aucun calcul ne le
              corrigera : seule une phrase écrite noir sur blanc avertit le lecteur.

              Deuxième point, la mesure elle-même. Une donnée saisie à la main par une opératrice pressée, un
              capteur déréglé pendant trois semaines, un code produit réutilisé pour un autre article après un
              changement de fournisseur : chaque anomalie de terrain devient un chiffre parfaitement propre
              dans votre tableau. Allez voir comment la donnée naît avant d'affirmer ce qu'elle signifie.

              Troisième point, le lien entre deux séries. Les ventes de parapluies et celles de boissons
              chaudes montent ensemble ; aucune ne cause l'autre, c'est la saison des pluies qui cause les
              deux. Pour affirmer une cause, il faut autre chose qu'une corrélation : une expérience, une
              intervention, ou au minimum un mécanisme explicable.

              Quatrième point, le seuil choisi après coup. Si vous essayez dix découpages et que vous publiez
              celui qui donne le plus bel écart, vous ne décrivez plus vos données, vous décrivez votre
              recherche. Fixez vos seuils et vos regroupements avant de regarder les résultats, et dites-le.

              Cinquième point, les personnes derrière les lignes. Vos tableaux contiennent des noms, des
              numéros de téléphone, parfois des montants qui révèlent une situation personnelle. Ne gardez que
              ce dont l'analyse a besoin, masquez les identifiants dès le chargement, ne recopiez jamais un
              fichier de production sur votre poste, et demandez-vous à chaque export qui pourra le lire et
              pendant combien de temps.

              La règle de travail qui découle de tout cela tient en une ligne : écrivez la section des limites
              avant d'écrire les conclusions. Dans ce parcours, toute analyse rendue comporte cette section,
              et elle est notée sur son honnêteté, jamais sur la beauté du résultat.
            tableaux:
              - titre: Traduire une affirmation flatteuse en phrase défendable
                entetes: ["Ce qu'on a envie d'écrire", Ce qui manque, La phrase honnête]
                lignes:
                  - [Nos clients préfèrent le format familial, "ceux qui n'ont rien acheté ne sont pas dans la base", "parmi les clients ayant acheté en octobre, le format familial domine"]
                  - [La promotion a fait monter les ventes de 12 %, la promotion a eu lieu pendant la rentrée, "les ventes ont monté de 12 % pendant la promotion, qui coïncide avec la rentrée"]
                  - [Le quartier A est plus rentable, trois officines contre vingt-neuf ailleurs, "sur trois officines seulement, la marge observée est plus élevée"]
                  - [Le modèle prédit les ruptures à 97 %, il y a 97 % de jours sans rupture, le modèle fait aussi bien que la règle qui ne prédit jamais de rupture]
                  - [Les livraisons du lundi sont les plus lentes, seuil de lenteur choisi après lecture des résultats, "avec le seuil fixé à 48 heures, défini avant l'analyse, le lundi ressort"]
          - titre: Les erreurs que vous allez voir
            texte: >-
              Ces cinq messages sont le quotidien de l'analyste. Trois d'entre eux ne sont pas des erreurs
              mais des avertissements, et c'est précisément pour cela qu'ils sont dangereux : le programme
              continue et le résultat est faux.

              Le plus traître est l'avertissement sur la copie. Il signale que vous croyez modifier le tableau
              alors que vous modifiez une copie temporaire : votre nettoyage n'a servi à rien, et rien ne
              s'arrête.
            tableaux:
              - titre: "Cinq messages, leur sens, leur correction"
                entetes: [Message, "Ce qui s'est passé", Correction]
                lignes:
                  - [SettingWithCopyWarning, "modification d'une copie temporaire", "travailler sur un copy() explicite, ou utiliser loc"]
                  - ["KeyError: places_vendues", "la colonne n'a pas ce nom ici", harmoniser les noms au chargement]
                  - [You are trying to merge on object and int64 columns, "les clés de jointure n'ont pas le même type", convertir la clé avant la jointure]
                  - ["unsupported operand type(s) for +: int and str", une colonne numérique est restée du texte, déclarer le type ou convertir avec to_numeric]
                  - [MemoryError, le fichier ne tient pas en mémoire, "lire par morceaux avec chunksize, ou ne charger que les colonnes utiles"]
          - titre: "Entraînement gradué, et où aller ensuite"
            texte: >-
              Imiter : reprenez le pipeline des réservations et faites-le tourner sur un seul export. Vérifiez
              chaque étape par un comptage indépendant fait à la main sur dix lignes.

              Varier : ajoutez un deuxième export dont les colonnes diffèrent, et rendez le pipeline capable
              de traiter les deux sans condition dispersée dans le code. Changez une décision d'imputation et
              mesurez l'effet sur le résultat final : c'est l'exercice qui fait comprendre ce qu'une décision
              de nettoyage engage.

              Créer : prenez un jeu de données public, posez une question qui intéresserait un décideur, et
              livrez le pipeline, les graphiques et la note d'une page. Faites relire la note par quelqu'un du
              métier concerné.

              Pour aller plus loin, regardez les formats colonnes comme Parquet, qui lisent dix fois plus vite
              que le CSV et conservent les types, et intéressez-vous aux tests de qualité de données : des
              contrôles automatiques qui échouent quand un fichier d'entrée s'écarte de ce qui était convenu.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est le nettoyage fait à la main dans un tableur. Il n'est pas reproductible,
              personne ne sait ce qui a été modifié, et le mois prochain tout est à refaire. Tout nettoyage
              est du code.

              Le deuxième piège est le graphique à l'axe tronqué, volontaire ou non. Il exagère les écarts et
              suggère une conclusion que les données ne portent pas. Sur une courbe, un axe non nul se défend,
              à condition de le signaler.

              Le troisième piège est la conclusion qui dépasse les données. Vos chiffres disent que Korhogo se
              remplit moins ; ils ne disent pas pourquoi, et surtout pas que baisser le prix y changerait quoi
              que ce soit. La causalité se teste, elle ne se lit pas dans un tableau croisé.
          - titre: Le mémo de la semaine
            texte: >-
              Ce tableau est la liste de contrôle à parcourir avant de publier la moindre analyse. Chacune de
              ses lignes correspond à une erreur qui a déjà coûté cher à quelqu'un.
            tableaux:
              - titre: "Les réflexes de l'analyste, en une page"
                entetes: [Situation, Le réflexe]
                lignes:
                  - [Je charge un fichier, "types, encodage et absences déclarés"]
                  - [Je nettoie, "des étapes nommées, comptées, en code"]
                  - [Je joins deux tables, "unicité de la clé, types, effectifs avant et après"]
                  - [Je remplis une valeur manquante, "j'écris pourquoi, ou je m'abstiens"]
                  - ["J'agrège", je vérifie sur dix lignes à la main]
                  - [Je trace, "axe à zéro, unité, effectif, titre qui conclut"]
                  - [Je conclus, je dis aussi ce que les données ne montrent pas]
                  - [Je livre, "le pipeline se rejoue d'une commande"]
          - titre: Vous savez faire si...
            texte: >-
              Vous savez charger un fichier sans perdre un zéro initial ni un accent. Vous savez expliquer vos
              décisions d'imputation à un non-spécialiste. Vous savez vérifier une jointure en trois gestes.
              Vous savez dire d'un graphique s'il est honnête, et pourquoi.

              Question de transfert : la compagnie vous annonce que le taux de remplissage de San Pedro est
              passé de soixante à soixante dix sept pour cent après une campagne publicitaire. Quelles
              vérifications faites-vous avant de confirmer que la campagne a fonctionné ? Citez au moins
              quatre explications alternatives.

              Si vous n'en trouvez que deux, relisez la section sur les conclusions qui dépassent les données,
              et pensez à la saison, aux travaux sur la route, à un changement de tarif et à la suppression
              d'un départ concurrent.
          - titre: Le livrable de la semaine
            texte: >-
              Rendez un pipeline d'analyse de bout en bout : chargement des fichiers bruts avec types et
              encodage déclarés, nettoyage en étapes nommées, jointures vérifiées, agrégation, deux graphiques
              publiables, et une note d'une page qui répond à la question posée.

              Le pipeline doit se rejouer d'une seule commande sur les fichiers bruts et produire exactement
              les mêmes résultats. Joignez le journal des effectifs étape par étape et le dictionnaire des
              variables.
          - titre: "La grille d'évaluation du livrable"
            texte: >-
              Le critère d'honnêteté est celui qui départage les candidats en entretien. Produire un graphique
              est à la portée de tous ; dire ce que les données ne permettent pas d'affirmer, sans y être
              poussé, est rare et remarqué.
            tableaux:
              - titre: Comment votre livrable est évalué
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Reproductibilité, des étapes manuelles, une commande rejoue tout, les mêmes sorties vérifiées par un test]
                  - [Qualité des données, aucun contrôle, "effectifs comptés, jointures vérifiées", "contrôles automatiques qui échouent si l'entrée dérive"]
                  - [Restitution, graphiques par défaut, "axes, unités, titres qui concluent", "une note qu'un décideur comprend seul"]
                  - [Honnêteté, conclusions non étayées, limites écrites avant les conclusions, explications alternatives examinées et écartées]
        livrable: Pipeline d'analyse de données de bout en bout.
        mise_en_situation: "Le traitement pandas d'un fichier de 5 millions de lignes de transactions prend 20 minutes. Proposez au moins trois pistes pour l'accélérer et dites comment vous mesurez le gain."
        quiz:
          - question: "Quel format colonnes est plus compact et rapide que le CSV ?"
            options: ["Parquet", "TXT", "DOCX", "HTML"]
            bonnes: [1]
            explication: "Parquet est compressé, typé et lu colonne par colonne."
          - question: "Pourquoi éviter les boucles Python sur un DataFrame ?"
            options: ["Les opérations vectorisées sont beaucoup plus rapides", "Les boucles sont interdites", "Elles modifient les types", "Elles suppriment des lignes"]
            bonnes: [1]
            explication: "La vectorisation exécute le calcul en code compilé."
          - question: "Dans un graphe non pondéré, quel parcours donne le plus court chemin entre deux sommets ?"
            options: ["Le parcours en largeur, qui explore par cercles de distance croissante", "Le parcours en profondeur, qui descend d'abord au plus loin", "Les deux, indifféremment", "Aucun des deux : il faut l'algorithme de Dijkstra"]
            bonnes: [1]
            explication: "En largeur, tout sommet atteint au tour n est à n arêtes du départ : le premier chemin trouvé est donc le plus court. Dijkstra ne devient nécessaire que si les arêtes portent des poids."
          - question: "Quelle méthode donne un aperçu rapide des colonnes et des types ?"
            options: ["df.info()", "df.plot()", "df.to_csv()", "df.drop()"]
            bonnes: [1]
            explication: "info() résume types, nombre de valeurs et mémoire utilisée."
          - question: "Pour mesurer précisément le temps d'un traitement :"
            options: ["comparer avant et après sur les mêmes données", "estimer à l'œil", "regarder la taille du fichier", "compter les lignes de code"]
            bonnes: [1]
            explication: "Une mesure reproductible sur des données identiques est nécessaire."
      - num: "12"
        title: Projet & industrialisation
        contenu: >-
          Architecture d'un projet réel (hexagonale), logging structuré, configuration, Docker multi-stage,
          documentation.
        cours:
          - titre: La promesse des dernières semaines
            texte: >-
              À la fin de ce dernier module, vous ne livrez plus du code qui marche sur votre poste : vous
              livrez un logiciel qu'une autre personne installe, configure, exploite et dépanne sans vous.
              Configuration par l'environnement, journaux lisibles, image conteneur légère et sans privilège,
              chaîne d'intégration qui refuse ce qui est cassé, supervision minimale, et une soutenance qui
              tient en cinq minutes.

              C'est le passage du développeur au professionnel. Un jury, comme un employeur, regarde autant
              votre manière de livrer que votre manière de coder, parce que la première se voit en cinq
              minutes et prédit la seconde.

              Tout ce que vous avez appris depuis douze semaines se rassemble ici : le cœur métier testé, les
              frontières validées, la base de données contrainte, l'API authentifiée, le tout emballé et
              livrable.
            figures:
              - nom: python-sept-semaines.svg
                legende: "Les briques des semaines précédentes se rassemblent en un logiciel livrable"
          - titre: Trois questions avant de commencer
            texte: >-
              Première question : votre application tourne chez le client sur une autre base, avec d'autres
              secrets. Combien de fichiers faut-il modifier dans votre code pour cela ? La bonne réponse est
              zéro.

              Deuxième question : il est trois heures du matin, l'application a échoué, et la personne
              d'astreinte n'a pas écrit une ligne de votre code. Que lit-elle pour comprendre ? Si la réponse
              est « la trace Python », ce module va changer votre façon d'écrire des journaux.

              Troisième question : votre image conteneur fait neuf cents mégaoctets et tourne en
              administrateur. Qu'est-ce qui peut mal tourner ? Deux réponses au moins, l'une sur le temps de
              déploiement, l'autre sur la sécurité.
            figures:
              - nom: devpy-m12-a.jpg
                legende: "Livrer, ce n'est pas finir de coder : c'est rendre le logiciel exploitable par d'autres"
          - titre: "Le problème d'abord"
            texte: >-
              Votre application de collecte de la coopérative fonctionne. Vous l'envoyez au responsable
              informatique de Divo, qui doit l'installer sur le serveur de la coopérative.

              Il obtient une erreur d'import, installe une bibliothèque au hasard, obtient une autre erreur,
              trouve une adresse de base de données écrite en dur dans un fichier, la modifie, casse autre
              chose, et finit par vous appeler un samedi. Une semaine plus tard, l'application s'arrête à
              quatre heures du matin : personne ne sait pourquoi, parce que les seuls journaux sont des print
              qui ont disparu avec le terminal fermé.

              Rien de tout cela n'est un problème de code. Ce sont des problèmes de livraison, et ils se
              règlent par quatre gestes que nous allons installer : la configuration sort du code, les
              journaux deviennent lisibles, l'exécution est figée dans une image, et la chaîne vérifie tout
              avant que vous ne livriez.
          - titre: "La notion : la configuration vient de l'environnement"
            texte: >-
              Un même artefact doit tourner en développement, en recette et en production sans être
              reconstruit. Ce qui change entre ces environnements, adresse de base, clés, niveau de journal,
              adresses autorisées, vient de variables d'environnement lues au démarrage.

              Lisez la configuration une fois, au démarrage, dans un objet typé et validé, puis passez cet
              objet là où il faut. Une application qui lit des variables d'environnement au milieu de son code
              métier est impossible à tester et pleine de surprises.

              Échouez vite. Si une variable obligatoire manque, l'application doit refuser de démarrer avec un
              message qui nomme la variable, et non démarrer puis échouer au premier appel, deux heures plus
              tard, avec un message incompréhensible.

              Les secrets ne sont jamais versionnés, jamais écrits dans l'image, jamais journalisés. Le dépôt
              contient un fichier d'exemple qui liste les noms des variables, avec des valeurs factices et un
              commentaire pour chacune.
            figures:
              - nom: python-secrets-hors-du-code.svg
                legende: "Où vit un secret, et où il ne vit jamais"
          - titre: "Le geste technique : une configuration validée au démarrage"
            texte: >-
              Vingt lignes suffisent. L'objet est immuable, construit une fois, et il porte ses propres
              contrôles. Remarquez le message d'erreur : il nomme la variable manquante, ce qui transforme un
              incident de mise en service de deux heures en correction de trente secondes.

              La valeur par défaut est acceptable pour ce qui n'est pas sensible, comme le niveau de journal.
              Elle ne l'est jamais pour un secret : une clé par défaut finit toujours en production.
            code:
              - titre: "configuration.py, lue une fois, validée, immuable"
                langage: python
                source: |
                  import os
                  from dataclasses import dataclass


                  class ConfigurationIncomplete(RuntimeError):
                      """Une variable d'environnement obligatoire manque au demarrage."""


                  def _obligatoire(nom: str) -> str:
                      valeur = os.environ.get(nom)
                      if not valeur:
                          raise ConfigurationIncomplete(f"variable d'environnement obligatoire absente : {nom}")
                      return valeur


                  @dataclass(frozen=True)
                  class Configuration:
                      url_base: str
                      cle_api: str
                      niveau_journal: str = "INFO"
                      origines_autorisees: tuple[str, ...] = ()

                      @classmethod
                      def depuis_environnement(cls) -> "Configuration":
                          origines = os.environ.get("ORIGINES_AUTORISEES", "")
                          return cls(
                              url_base=_obligatoire("URL_BASE"),
                              cle_api=_obligatoire("CLE_API_COLLECTE"),
                              niveau_journal=os.environ.get("NIVEAU_JOURNAL", "INFO"),
                              origines_autorisees=tuple(o for o in origines.split(",") if o),
                          )
          - titre: "La notion : un journal s'écrit pour celui qui ne connaît pas le code"
            texte: >-
              Un print disparaît avec le terminal. Un journal porte un horodatage, un niveau, un message et du
              contexte, et il va là où l'exploitation sait le lire : la sortie standard, que le gestionnaire
              de conteneurs collecte.

              Quatre niveaux suffisent. DEBUG pour le développement, INFO pour les étapes normales qui
              intéressent l'exploitation, WARNING pour ce qui a été rattrapé mais mérite un regard, ERROR pour
              ce qui a échoué. Un journal où tout est ERROR ne sert à rien ; un journal où tout est INFO non
              plus.

              Un message utile dit trois choses : ce qui a été tenté, sur quel objet, et ce qui s'est passé. «
              Echec » ne vaut rien ; « enregistrement de la livraison refuse, producteur inconnu, identifiant
              4821 » permet d'agir sans ouvrir le code.

              Et jamais de donnée personnelle ni de secret. Ni mot de passe, ni jeton, ni numéro de téléphone
              complet, ni identifiant de paiement. Un journal est lu par des gens qui n'ont pas accès à la
              base, et il est souvent conservé des mois.
          - titre: "Le geste technique : des journaux structurés et un identifiant de corrélation"
            texte: >-
              Un identifiant de corrélation est un numéro attribué à chaque requête entrante, porté par tous
              les journaux qu'elle produit, et renvoyé dans la réponse. Quand un utilisateur signale un
              incident, il donne ce numéro et vous retrouvez en une recherche tout ce que l'application a fait
              pour lui.

              C'est le geste qui transforme une enquête d'une demi-journée en une requête de trente secondes,
              et il coûte quinze lignes.
            code:
              - titre: "journalisation.py, un identifiant par requête, aucun secret"
                langage: python
                source: |
                  import logging
                  import sys
                  import uuid
                  from contextvars import ContextVar

                  correlation = ContextVar("correlation", default="-")


                  class ContexteCorrelation(logging.Filter):
                      def filter(self, enregistrement: logging.LogRecord) -> bool:
                          enregistrement.correlation = correlation.get()
                          return True


                  def installer_journal(niveau: str = "INFO") -> None:
                      poignee = logging.StreamHandler(sys.stdout)
                      poignee.addFilter(ContexteCorrelation())
                      poignee.setFormatter(logging.Formatter(
                          "%(asctime)s %(levelname)s [%(correlation)s] %(name)s %(message)s"
                      ))
                      logging.basicConfig(level=niveau, handlers=[poignee])


                  def nouvelle_correlation() -> str:
                      valeur = uuid.uuid4().hex[:12]
                      correlation.set(valeur)
                      return valeur
          - titre: "La notion : l'image conteneur fige l'exécution"
            texte: >-
              Une image contient le système, l'interpréteur, les dépendances et votre code, figés ensemble.
              Elle démarre à l'identique sur votre poste, sur le serveur de la coopérative et dans la chaîne
              d'intégration. C'est la fin de la phrase « chez moi ça marche ».

              Construisez en deux étapes. La première installe les dépendances, la seconde ne garde que ce
              qu'il faut pour exécuter. L'image finale passe ainsi de neuf cents mégaoctets à moins de deux
              cents, ce qui change les temps de déploiement et la surface d'attaque.

              Trois exigences d'exploitation ne sont pas négociables. Un utilisateur non privilégié, parce
              qu'une faille applicative ne doit pas devenir une prise de contrôle de la machine. Un contrôle
              de santé, pour que l'orchestrateur sache si le service répond vraiment. Une image épinglée sur
              une version précise, pour que la reconstruction de la semaine prochaine donne la même chose.
            figures:
              - nom: python-coeur-partage.svg
                legende: "Une règle métier, plusieurs portes d'entrée, une seule image à livrer"
          - titre: "Le geste technique : une image en deux étapes, sans privilège"
            texte: >-
              Lisez ce fichier comme une recette dont l'ordre compte. Les dépendances sont copiées et
              installées avant le code, pour que la modification d'un fichier source ne provoque pas une
              réinstallation complète : c'est ce qui fait passer une construction de quatre minutes à vingt
              secondes.

              Aucun secret n'apparaît. Tout ce qui entre dans une couche d'image y reste, même supprimé dans
              une couche suivante : un secret copié puis effacé est toujours extractible. Les secrets se
              passent à l'exécution, par variables d'environnement ou par un gestionnaire dédié.
            code:
              - titre: "Dockerfile, deux etapes, utilisateur sans privilege"
                langage: bash
                source: |
                  FROM python:3.12-slim AS base
                  ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
                  WORKDIR /app

                  FROM base AS dependances
                  COPY pyproject.toml uv.lock ./
                  RUN pip install --no-cache-dir uv && uv sync --frozen --no-dev

                  FROM base AS execution
                  COPY --from=dependances /app/.venv /app/.venv
                  COPY src/ ./src/
                  ENV PATH="/app/.venv/bin:$PATH"
                  RUN useradd --create-home --uid 10001 application && chown -R application /app
                  USER application
                  EXPOSE 8000
                  HEALTHCHECK --interval=30s --timeout=3s CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"
                  CMD ["uvicorn", "collecte.api:app", "--host", "0.0.0.0", "--port", "8000"]
          - titre: "La notion : la chaîne refuse ce qui est cassé"
            texte: >-
              Une chaîne d'intégration exécute, à chaque envoi de code, ce que vous oublieriez de faire : le
              formatage, l'analyse statique, les tests, la mesure de couverture, la construction de l'image et
              l'analyse des dépendances vulnérables.

              Son rôle n'est pas de vous surveiller, c'est de vous permettre de modifier le code sans peur. Un
              changement qui casse quelque chose est signalé en trois minutes, au moment où vous avez encore
              le contexte en tête, et non trois semaines plus tard chez le client.

              Deux règles la rendent utile. Elle doit être rapide, sinon on cesse de l'attendre. Et elle doit
              bloquer, sinon elle ne sert à rien : une chaîne rouge que l'on fusionne quand même est une
              décoration.
            figures:
              - nom: python-rouge-puis-vert.svg
                legende: "Rouge, puis vert : la chaîne prouve que la correction corrige quelque chose"
          - titre: "Le geste technique : une chaîne qui tient en un fichier"
            texte: >-
              Cette chaîne fait quatre choses dans l'ordre du plus rapide au plus lent, pour échouer le plus
              tôt possible. Le formatage et l'analyse statique prennent quelques secondes, les tests une
              minute, la construction de l'image deux.

              L'étape des dépendances vulnérables est celle que l'on oublie et qui sauve. Les failles ne sont
              presque jamais dans votre code : elles arrivent par une bibliothèque que vous n'avez pas mise à
              jour depuis dix mois.
            code:
              - titre: "integration.yml, quatre etapes, de la plus rapide a la plus lente"
                langage: yaml
                source: |
                  name: integration
                  on: [push, pull_request]

                  jobs:
                    verifier:
                      runs-on: ubuntu-latest
                      steps:
                        - uses: actions/checkout@v4
                        - uses: astral-sh/setup-uv@v5
                        - run: uv sync --frozen
                        - name: Format et analyse statique
                          run: |
                            uv run ruff format --check .
                            uv run ruff check .
                        - name: Tests et couverture
                          run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=85
                        - name: Dependances vulnerables
                          run: uv run pip-audit
                        - name: Construction de l'image
                          run: docker build -t collecte:${{ github.sha }} .
          - titre: "À la main : rendre votre projet livrable, en neuf étapes"
            texte: >-
              Première étape, sortez toute valeur d'environnement du code et créez le fichier d'exemple qui
              liste les variables. Deuxième étape, remplacez chaque print par un appel au journal, avec le bon
              niveau.

              Troisième étape, ajoutez l'identifiant de corrélation et vérifiez qu'il apparaît dans tous les
              journaux d'une même requête. Quatrième étape, écrivez le Dockerfile en deux étapes et mesurez la
              taille de l'image.

              Cinquième étape, faites tourner l'image en passant la configuration par variables, contre une
              base lancée à côté. Sixième étape, ajoutez le contrôle de santé et vérifiez qu'un arrêt de la
              base le fait passer en échec.

              Septième étape, installez la chaîne et faites-la échouer volontairement, en cassant un test,
              pour vérifier qu'elle bloque. Huitième étape, écrivez le fichier d'installation en trois
              commandes et faites-le suivre par quelqu'un d'autre, sans intervenir. Neuvième étape, notez tout
              ce qu'il a dû vous demander : chacune de ces questions est une ligne manquante dans votre
              documentation.
            figures:
              - nom: devpy-m12-b.jpg
                legende: "Le test ultime : une autre personne installe et démarre sans vous poser de question"
          - titre: Les erreurs que vous allez voir
            texte: >-
              Les erreurs de cette semaine ne ressemblent pas à celles des précédentes : elles ne viennent pas
              de votre code mais de son environnement d'exécution. Elles sont déroutantes la première fois, et
              toujours les mêmes ensuite.

              Lisez-les littéralement. Un conteneur qui dit qu'un fichier n'existe pas a presque toujours
              raison : c'est votre copie, votre chemin ou votre image qui est en cause, pas le moteur.
            tableaux:
              - titre: "Cinq messages, leur sens, leur correction"
                entetes: [Message, "Ce qui s'est passé", Correction]
                lignes:
                  - ["KeyError: URL_BASE", une variable obligatoire manque, "la fournir, et vérifier le message d'échec au démarrage"]
                  - ["exec: uvicorn: not found", "l'exécutable n'est pas dans le chemin de l'image", "copier l'environnement virtuel et ajuster PATH"]
                  - ["PermissionError: [Errno 13]", "l'utilisateur non privilégié n'a pas les droits", "donner la propriété du dossier avant de changer d'utilisateur"]
                  - ["bind: address already in use", "le port est déjà pris sur l'hôte", "changer la correspondance de ports, ou arrêter l'autre service"]
                  - [container is unhealthy, le contrôle de santé échoue, vérifier la route de santé et ses dépendances]
          - titre: "Sécurité : ce qu'un relecteur vérifie avant de mettre en ligne"
            texte: >-
              La mise en service est le moment où les négligences deviennent des failles. Six points se
              vérifient en dix minutes et couvrent l'essentiel de ce qui arrive aux petites applications.

              Aucun secret dans le dépôt ni dans l'image. Conteneur sans privilège. Dépendances à jour et
              vérifiées. Entrées validées à la frontière. Journaux sans donnée personnelle. Et le compte de
              base de données limité à ce dont l'application a besoin.

              Ajoutez-y une habitude : la page d'erreur renvoyée à l'utilisateur ne doit jamais contenir de
              trace technique. La trace va dans le journal, avec l'identifiant de corrélation ; l'utilisateur
              reçoit un message sobre et ce même identifiant.
            tableaux:
              - titre: La liste de contrôle avant mise en service
                entetes: [Point, Preuve attendue]
                lignes:
                  - [Secrets, "aucun fichier .env versionné, aucun secret dans l'image"]
                  - [Privilèges, "l'image tourne avec un utilisateur dédié"]
                  - [Dépendances, "l'analyse des vulnérabilités passe dans la chaîne"]
                  - [Entrées, chaque route valide ses champs et borne ses tailles]
                  - [Journaux, "ni jeton, ni mot de passe, ni donnée personnelle"]
                  - [Base, "le compte applicatif n'a que lire et écrire"]
                  - [Erreurs, "aucune trace technique renvoyée à l'appelant"]
          - titre: "Travailler à plusieurs : branches, demandes de fusion et conflits"
            texte: >-
              Jusqu'ici vous avez versionné votre travail pour vous-même. En entreprise, le dépôt est un lieu
              partagé, et les gestes changent. Une branche par sujet : elle porte le nom de ce qu'elle fait,
              elle vit quelques jours au plus, et elle ne mélange pas deux intentions. Une branche qui vit
              trois semaines accumule des conflits que personne ne saura résoudre.

              Un commit raconte pourquoi, pas quoi. Le quoi est déjà dans le code, le lecteur le voit. Ce
              qu'il ne voit pas, c'est la raison : quel problème vous corrigez, quelle règle métier a changé,
              quelle solution vous avez écartée. Écrivez à l'impératif, en une ligne courte, et ajoutez un
              paragraphe quand la décision mérite d'être expliquée.

              Une demande de fusion se relit en vingt minutes. Au-delà de trois ou quatre cents lignes
              modifiées, la revue devient une formalité : le relecteur approuve sans comprendre, et le
              bénéfice disparaît. Découpez en plusieurs demandes successives plutôt que d'en livrer une
              énorme.

              Un conflit survient quand deux personnes ont modifié les mêmes lignes. Ce n'est ni une faute ni
              un accident rare : c'est le fonctionnement normal du travail à plusieurs. La seule règle qui
              compte est de ne jamais résoudre un conflit en supprimant le travail de l'autre sans l'avoir lu
              et compris. Si vous hésitez, allez lui demander ; trente secondes de conversation valent mieux
              qu'une demi-journée de régression.
            code:
              - titre: "Le cycle de travail d'une semaine, en huit commandes"
                langage: bash
                source: |
                  git switch main
                  git pull --rebase origin main

                  git switch -c correction-penalite-humidite
                  # ... vous modifiez le code et les tests ...
                  git add domaine.py tests/test_penalite.py
                  git commit -m "Exempter la qualite A de la penalite d'humidite"

                  git fetch origin
                  git rebase origin/main        # vous rejouez votre travail sur le dernier etat partage
                  # en cas de conflit : ouvrir le fichier, lire LES DEUX versions, choisir, puis
                  git add domaine.py
                  git rebase --continue

                  git push -u origin correction-penalite-humidite
                  # puis ouvrir la demande de fusion et demander une relecture
          - titre: "Relire le code d'un autre, et recevoir une relecture"
            texte: >-
              Une revue de code n'est pas un examen, c'est une deuxième paire d'yeux. Le relecteur regarde
              quatre choses, dans cet ordre. L'exactitude d'abord : le code fait-il ce que la demande annonce,
              et que se passe-t-il aux bornes, sur une liste vide, sur une valeur absente. La lisibilité
              ensuite : saurez-vous relire cela dans six mois, les noms disent-ils le métier. Les tests
              ensuite : la règle modifiée est-elle verrouillée par un test qui aurait échoué avant. La
              sécurité enfin : une requête construite par concaténation, un secret en clair, une donnée
              personnelle qui part dans un journal.

              La forme de la remarque décide de son sort. Une remarque utile désigne une ligne précise, dit ce
              qui vous gêne, et propose. Comparez « ce code est sale » et « ici, si la liste est vide, la
              division plante ; un test au début réglerait le cas ». La première déclenche une défense, la
              seconde déclenche un correctif. Distinguez aussi ce qui bloque la fusion de ce qui est un simple
              avis : annoncez-le explicitement, par exemple en préfixant vos remarques facultatives.

              Recevoir une revue s'apprend aussi. Les remarques portent sur le code, jamais sur vous. Répondez
              à chacune, en corrigeant ou en expliquant pourquoi vous ne corrigez pas ; une remarque laissée
              sans réponse est la seule vraie impolitesse. Et quand vous n'êtes pas d'accord, demandez le
              raisonnement de l'autre avant de défendre le vôtre : dans la moitié des cas, vous découvrirez
              une contrainte que vous ignoriez.

              Le livrable de cette section est double et il est noté deux fois. Chacun ouvre une demande de
              fusion sur le projet d'un camarade ou sur un dépôt commun, et chacun relit celle d'un autre. La
              relecture produite est évaluée au même titre que le code : des remarques précises, classées en
              bloquantes et facultatives, et une décision argumentée.
            figures:
              - nom: devpy-m12-c.jpg
                legende: "Une relecture se fait à deux, sur des lignes précises, pas sur des impressions"
            tableaux:
              - titre: "La grille de relecture, et ce qu'elle vous fait dire"
                entetes: [Ce que le relecteur regarde, La question posée, Une remarque utile]
                lignes:
                  - [Exactitude, que se passe-t-il aux bornes, "sur une liste vide, cette moyenne divise par zéro"]
                  - [Lisibilité, les noms disent-ils le métier, "tmp2 porte le total par producteur, le nom le dirait mieux"]
                  - [Tests, un test aurait-il échoué avant ce correctif, "le cas de la qualité A n'est verrouillé par aucun test"]
                  - [Sécurité, "entrées validées, secrets absents", "cette requête concatène le code saisi, à passer en paramètre lié"]
                  - [Taille, la revue tient-elle en vingt minutes, ces deux sujets gagneraient à être deux demandes]
                  - [Ton, la remarque désigne-t-elle le code, "dire ce qui gêne et proposer, jamais juger la personne"]
          - titre: "Entraînement gradué, et où aller ensuite"
            texte: >-
              Imiter : conteneurisez une des applications des semaines précédentes, avec configuration par
              environnement et contrôle de santé, et faites-la démarrer sur un autre poste que le vôtre.

              Varier : ajoutez une étape de chaîne qui publie l'image dans un registre, puis une seconde qui
              déploie sur une machine de recette. Faites échouer chaque étape volontairement pour vérifier
              qu'elle bloque bien la suite.

              Créer : reprenez votre projet et livrez-le complètement, de l'installation à la supervision,
              puis demandez à un camarade de l'installer sans votre aide en suivant seulement votre
              documentation. Son parcours est votre vraie note.

              Pour aller plus loin, intéressez-vous à la supervision par métriques, aux sauvegardes de base et
              à leur restauration réellement testée, et à la notion de déploiement progressif. Et retenez une
              règle : une sauvegarde qui n'a jamais été restaurée n'est pas une sauvegarde.
          - titre: Les pièges de la semaine
            texte: >-
              Le premier piège est le secret copié dans l'image. Les couches conservent tout ; un secret
              ajouté puis supprimé reste extractible par quiconque obtient l'image. Les secrets se passent à
              l'exécution.

              Le deuxième piège est le conteneur qui tourne en administrateur, souvent parce qu'une erreur de
              droits a été contournée ainsi. Une faille applicative devient alors une prise de contrôle de la
              machine hôte.

              Le troisième piège est la chaîne que l'on contourne quand elle gêne. Fusionner avec une chaîne
              rouge « juste cette fois » enseigne à toute l'équipe que la chaîne est optionnelle, et elle ne
              protège plus rien dès le lendemain.
          - titre: Le mémo de la semaine
            texte: >-
              Ce tableau est la différence entre un projet d'école et un logiciel livrable. Un recruteur
              parcourt exactement ces lignes quand il ouvre votre dépôt, souvent sans vous le dire.
            tableaux:
              - titre: "Les réflexes de livraison, en une page"
                entetes: [Situation, Le réflexe]
                lignes:
                  - ["Une valeur change selon l'environnement", "variable d'environnement, lue au démarrage"]
                  - [Une variable obligatoire manque, "refus de démarrer, message qui la nomme"]
                  - ["J'ai besoin de tracer", "un journal avec niveau et contexte, jamais un print"]
                  - [Une requête entre, "un identifiant de corrélation, porté partout"]
                  - [Je construis une image, "deux étapes, utilisateur dédié, version épinglée"]
                  - [Je livre, la chaîne a tout vérifié et peut bloquer]
                  - ["Une erreur remonte à l'utilisateur", "message sobre, trace dans le journal"]
                  - [Je documente, trois commandes suffisent à installer et démarrer]
          - titre: Vous savez faire si...
            texte: >-
              Vous savez démarrer votre application sur une machine vierge en trois commandes. Vous savez
              expliquer ce que contient votre image et pourquoi elle ne pèse pas un gigaoctet. Vous savez
              retrouver, à partir d'un identifiant donné par un utilisateur, toute la trace d'une requête.
              Vous savez dire ce qui se passe si la base de données devient indisponible.

              Question de transfert : la coopérative vous annonce qu'elle veut déployer la même application
              pour une seconde coopérative, avec sa propre base et ses propres clés, sur le même serveur. Que
              changez-vous dans votre code ? La réponse attendue est courte, et si elle est longue, votre
              configuration n'est pas encore sortie du code.

              Préparez aussi la version honnête de la question suivante : qu'est-ce qui, dans votre projet,
              n'est pas prêt pour la production, et qu'est-ce que vous feriez avec une semaine de plus ?
          - titre: Le livrable final du parcours
            texte: >-
              Rendez une application Python complète, testée, conteneurisée et documentée. Elle doit contenir
              un cœur métier testé, au moins une porte d'entrée, une base de données avec ses migrations, une
              configuration entièrement par l'environnement, des journaux structurés avec corrélation, une
              image en deux étapes sans privilège, une chaîne d'intégration qui bloque, et un fichier
              d'installation en trois commandes.

              Le sujet est libre, mais il doit résoudre un problème réel que vous pouvez expliquer à un non-
              informaticien en deux phrases. Les projets inventés pour l'exercice se reconnaissent
              immédiatement, et ils convainquent moins qu'une petite application vraiment utile à quelqu'un.

              Ajoutez une page d'architecture : un schéma des composants, et trois décisions techniques que
              vous avez prises, avec ce que vous avez écarté et pourquoi. Cette page vaut autant que le code.
          - titre: Préparer la soutenance devant jury
            texte: >-
              Vous disposez de cinq minutes de démonstration et de dix minutes de questions. Le plan qui
              fonctionne tient en quatre temps. Le problème, en une phrase que comprend un non-informaticien.
              La démonstration d'un cas qui réussit, en conditions réelles, sans diaporama. La démonstration
              d'un cas qui échoue proprement, avec le message et le journal qui permettent de comprendre. Et
              une décision technique défendue, avec l'option que vous avez écartée.

              Montrer un échec maîtrisé impressionne davantage qu'une démonstration parfaite. Tout jury sait
              que les logiciels échouent ; il veut savoir si le vôtre échoue bien.

              Préparez vos réponses aux cinq questions qui tombent toujours. Que se passe-t-il si la base est
              indisponible ? Comment déployez-vous une correction urgente ? Où sont vos secrets ? Comment
              savez-vous que votre application fonctionne en ce moment ? Qu'est-ce qui ne tiendrait pas avec
              dix fois plus d'utilisateurs ?

              Répétez une fois en conditions réelles, chronomètre en main, machine déconnectée du réseau de
              l'école. Les démonstrations qui échouent le jour J échouent presque toujours sur le réseau.
          - titre: "La grille d'évaluation du livrable final"
            texte: >-
              Cette grille est celle du jury. Lisez-la en commençant votre projet, pas la veille de la
              soutenance : chaque ligne demande du temps, et aucune ne se rattrape en une nuit.
            tableaux:
              - titre: Comment le livrable final est évalué
                entetes: [Critère, Insuffisant, Attendu, Remarquable]
                lignes:
                  - [Installation, des étapes manquantes, trois commandes sur une machine vierge, un camarade installe seul sans question]
                  - [Exploitation, des print et aucun journal, journaux structurés et contrôle de santé, corrélation de bout en bout et incident rejoué]
                  - [Sécurité, secrets versionnés ou conteneur privilégié, la liste de contrôle est entièrement verte, analyse des dépendances automatisée et documentée]
                  - [Chaîne, aucune vérification automatique, "tests, analyse statique et image construits", "la chaîne bloque et l'a déjà prouvé"]
                  - [Soutenance, lecture de diapositives, "un cas qui réussit, un qui échoue proprement", une décision technique défendue avec son alternative]
                  - [Relecture, des remarques vagues ou aucune relecture rendue, "des remarques précises, classées bloquantes ou facultatives, et une décision argumentée", votre relecture a fait corriger un défaut réel et l'échange est resté sur le code]
        livrable: >-
          Application Python complète, testée et conteneurisée ; et, notée au même titre, une demande de
          fusion ouverte sur le projet d'un camarade avec la relecture argumentée de celle d'un autre.
        mise_en_situation: "Votre application fonctionne sur votre poste mais pas sur le serveur de production. Décrivez comment la conteneurisation, la configuration par variables d'environnement et les journaux structurés auraient évité ce problème."
        quiz:
          - question: "Un Dockerfile multi-stage permet :"
            options: ["une image finale plus petite sans les outils de build", "plusieurs applications dans un conteneur", "de supprimer Docker", "de chiffrer l'image"]
            bonnes: [1]
            explication: "On compile dans une étape et on ne copie que le nécessaire dans l'image finale."
          - question: "Où placer les secrets d'une application ?"
            options: ["Dans des variables d'environnement ou un gestionnaire de secrets", "Dans le code source", "Dans le README", "Dans le nom des fichiers"]
            bonnes: [1]
            explication: "Un secret dans le dépôt est exposé à quiconque y a accès."
          - question: "Pourquoi un conteneur ne doit-il pas tourner en root ?"
            options: ["Pour limiter les dégâts en cas de compromission", "Pour accélérer le démarrage", "Parce que Docker l'interdit", "Pour économiser la mémoire"]
            bonnes: [1]
            explication: "C'est le principe du moindre privilège."
          - question: "Pourquoi limiter une demande de fusion à trois ou quatre cents lignes ?"
            options: ["Parce qu'au-delà, le relecteur survole et ne voit plus les défauts", "Parce que Git refuse les différences plus grandes", "Parce que la chaîne d'intégration serait trop lente", "Parce que les conflits deviendraient impossibles à résoudre"]
            bonnes: [1]
            explication: "La qualité d'une relecture s'effondre avec la taille du changement. Découper en demandes courtes et indépendantes est ce qui fait qu'une relecture trouve réellement quelque chose."
          - question: "Dans une architecture hexagonale, le domaine métier :"
            options: ["ne dépend pas de l'infrastructure", "dépend de la base de données", "contient l'interface web", "contient les tests"]
            bonnes: [1]
            explication: "Les dépendances pointent vers le domaine, ce qui le rend testable et durable."

portfolio:
  - titre: Carnet de contacts en ligne de commande
    apres_module: "02"
    duree_h: 10
    niveau: guide
    contexte: >-
      Un commerçant de Treichville gère ses clients et fournisseurs dans son téléphone et sur papier.
      On lui construit un carnet de contacts en ligne de commande, persistant et fiable.
    objectifs:
      - Manipuler les structures de données Python
      - Persister des données en JSON
      - Valider des saisies utilisateur
    fonctionnalites:
      - Ajouter, modifier, supprimer et rechercher un contact (nom, téléphone, commune, étiquettes)
      - Normalisation des numéros ivoiriens au format +225 XX XX XX XX XX
      - Recherche floue sur le nom et filtre par étiquette
      - Export CSV et import avec détection des doublons
      - Sauvegarde atomique du fichier JSON
    stack: [Python 3.12+, uv, Typer, pytest, ruff]
    criteres_acceptation:
      - "`uv run contacts --help` documente toutes les commandes"
      - Un numéro invalide est refusé avec un message explicite
      - Une coupure pendant l'écriture ne corrompt pas le carnet (test)
      - "`docker compose run contacts lister` fonctionne"
      - Tests et CI verts
    exigences_specifiques:
      - Aucune donnée personnelle réelle dans le dépôt
    livrables: [Dépôt Git, Démo vidéo ≤ 3 min, README]

  - titre: Convertisseur FCFA / EUR / USD modulaire
    apres_module: "03"
    duree_h: 10
    niveau: guide
    contexte: >-
      Les commerçants qui importent depuis l'Europe ou la Chine jonglent entre franc CFA, euro et dollar.
      Le FCFA a une parité fixe avec l'euro ; les autres taux viennent d'une API publique.
    objectifs:
      - Découper un programme en modules cohérents
      - Séparer la logique métier de l'accès réseau
      - Gérer les arrondis monétaires correctement
    fonctionnalites:
      - Conversion entre XOF, EUR, USD et CNY avec parité fixe XOF/EUR (655,957)
      - Récupération des autres taux via API avec cache local et date de fraîcheur
      - Mode hors ligne sur le dernier taux connu
      - Historique des conversions
      - Montants en Decimal, arrondis au franc
    stack: [Python, uv, httpx, Typer, pytest, ruff]
    criteres_acceptation:
      - La parité XOF/EUR est exacte (tests sur plusieurs montants)
      - Le mode hors ligne fonctionne sans réseau (test sans accès API)
      - Aucun flottant pour les montants
      - "`docker compose run convertir 10000 XOF EUR` répond"
      - Tests et CI verts
    exigences_specifiques:
      - Logique de conversion sans dépendance réseau (testable isolément)
    livrables: [Dépôt Git, README]

  - titre: Gestion de stock d'une boutique
    apres_module: "04"
    duree_h: 12
    niveau: guide
    contexte: >-
      Une boutique de quartier à Yopougon vend au détail et au carton. On modélise son stock en objets
      pour suivre entrées, ventes, ruptures et valeur du stock.
    objectifs:
      - Concevoir un modèle objet riche (entités, valeurs, règles)
      - Préférer la composition à l'héritage quand c'est pertinent
      - Protéger les invariants métier
    fonctionnalites:
      - Produits vendus à l'unité et au carton avec conversion automatique
      - Entrées de stock, ventes, retours et inventaires
      - Alerte de seuil de rupture
      - Valorisation du stock (coût moyen pondéré)
      - Rapport des meilleures ventes
    stack: [Python, uv, dataclasses, Typer, pytest, ruff, mypy]
    criteres_acceptation:
      - Impossible de vendre plus que le stock disponible (invariant testé)
      - La valorisation au coût moyen pondéré est vérifiée sur un cas chiffré
      - Le domaine n'importe aucune bibliothèque d'entrée/sortie
      - "`docker compose run stock rapport` fonctionne"
      - Tests et CI verts
    exigences_specifiques:
      - Diagramme de classes dans le README
    livrables: [Dépôt Git, README avec diagramme]

  - titre: Rapprochement de relevés Mobile Money
    apres_module: "05"
    duree_h: 12
    niveau: semi-guide
    contexte: >-
      Une PME reçoit ses paiements par Orange Money, MTN MoMo, Moov Money et Wave. Chaque opérateur fournit
      un relevé CSV différent ; il faut les rapprocher des factures émises.
    objectifs:
      - Lire des fichiers hétérogènes de façon robuste
      - Gérer les erreurs sans perdre de données
      - Produire un rapport exploitable par un comptable
    fonctionnalites:
      - Lecteurs dédiés par opérateur vers un format commun
      - Rapprochement par référence, montant et date avec tolérance
      - Liste des paiements orphelins et des factures impayées
      - Rejet des lignes illisibles dans un fichier d'anomalies
      - Rapport Excel de rapprochement
    stack: [Python, uv, pathlib, csv, openpyxl, pytest, ruff, mypy]
    criteres_acceptation:
      - Les 4 formats d'exemple sont lus correctement (tests)
      - Aucune ligne n'est perdue silencieusement (total lu = rapproché + orphelin + anomalie)
      - Un fichier corrompu ne fait pas planter l'outil
      - "`docker compose run rapprocher relevés/ factures.csv` produit le rapport"
      - Tests et CI verts
    exigences_specifiques:
      - Nouvel opérateur ajoutable sans modifier le code existant (principe ouvert/fermé)
    livrables: [Dépôt Git, Jeux de données d'exemple anonymisés, README]

  - titre: Bibliothèque de validation des identifiants ouest-africains
    apres_module: "06"
    duree_h: 12
    niveau: semi-guide
    contexte: >-
      Les formulaires en ligne ivoiriens valident mal les numéros de téléphone, les CNI ou les RIB UEMOA.
      On écrit une bibliothèque réutilisable, idiomatique et entièrement typée.
    objectifs:
      - Écrire du Python idiomatique et typé
      - Utiliser décorateurs et générateurs à bon escient
      - Concevoir une API de bibliothèque agréable
    fonctionnalites:
      - Validation et normalisation des numéros mobiles des pays UEMOA
      - Validation du format de la CNI ivoirienne et du RIB UEMOA (clé de contrôle)
      - Décorateur de validation des arguments de fonction
      - Validation en flux de gros fichiers (générateurs)
      - Messages d'erreur en français
    stack: [Python, uv, typing, pytest, Hypothesis, ruff, pyright]
    criteres_acceptation:
      - "Typage strict : pyright sans erreur"
      - Tests par propriétés (Hypothesis) sur la normalisation
      - Un fichier d'un million de lignes est validé en mémoire constante
      - Documentation d'usage avec exemples exécutés en test (doctest)
      - Tests et CI verts
    exigences_specifiques:
      - Aucune dépendance d'exécution externe
    livrables: [Dépôt Git, Documentation, README]

  - titre: Package publié « fcfa » — montants et formatage
    apres_module: "07"
    duree_h: 12
    niveau: semi-guide
    contexte: >-
      Factures, reçus et contrats ivoiriens exigent les montants en chiffres et en lettres. On publie un
      package Python installable qui formate les montants en francs CFA.
    objectifs:
      - Structurer et publier un package
      - Gérer versions et changelog
      - Automatiser la qualité avec pre-commit
    fonctionnalites:
      - Formatage « 1 250 000 FCFA » avec séparateurs configurables
      - Montant en toutes lettres en français (jusqu'aux milliards)
      - Ventilation d'un montant en billets et pièces
      - Interface en ligne de commande
      - Publication sur un index de test (TestPyPI) via la CI
    stack: [Python, uv, pyproject.toml, pre-commit, pytest, ruff, mypy, GitHub Actions]
    criteres_acceptation:
      - "`pip install` depuis l'index de test fonctionne dans un environnement vierge"
      - Les montants en lettres respectent l'orthographe (vingt, cent, mille au pluriel), tests
      - Version sémantique et changelog tenus à jour
      - Publication déclenchée par un tag Git
      - Tests et CI verts
    exigences_specifiques:
      - Hooks pre-commit actifs (ruff, mypy, tests rapides)
    livrables: [Dépôt Git, Package publié, README]

  - titre: Moteur de réservation de cars interurbains
    apres_module: "08"
    duree_h: 14
    niveau: semi-guide
    contexte: >-
      Les compagnies de cars reliant Abidjan, Bouaké et Yamoussoukro vendent encore beaucoup de billets au guichet.
