            options: ["Elle remplace la valeur", "Elle lève une erreur", "Elle ajoute une seconde clé", "Elle ne fait rien"]
            bonnes: [1]
            explication: "L'écriture crée la clé si elle manque, et remplace la valeur sinon."
      - num: "J08"
        title: "Un effectif : liste de dictionnaires"
        evaluations: livrable
        contenu: >-
          Parcourir une liste de fiches, filtrer selon un critère, regrouper par poste, écrire une
          compréhension de liste, et comprendre ce qu'est une copie superficielle.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez répondre à deux questions du gérant sans ouvrir de tableur : combien de
              personnes par poste, et qui gagne plus d'un certain montant.
          - titre: Le problème d'abord
            texte: >-
              L'effectif complet, c'est une liste de fiches : chaque élément est un dictionnaire comme celui
              d'hier. Le gérant veut un état par poste et une liste filtrée par salaire, et il veut surtout
              que son fichier d'origine reste intact après chaque état.
          - titre: La notion
            texte: >-
              Une liste de dictionnaires se parcourt comme toute liste ; à chaque tour, la variable de
              boucle contient une fiche entière, dont vous lisez les champs par leurs clés.

              Regrouper par poste revient à construire un dictionnaire dont les clés sont les postes et les
              valeurs des listes de noms. La méthode setdefault crée la liste vide la première fois qu'un
              poste apparaît.

              Une compréhension de liste écrit en une ligne une boucle qui construit une liste, avec un
              filtre facultatif. Employez-la quand elle tient sur une ligne lisible ; au-delà, écrivez une
              boucle ordinaire, qui se relit mieux et se corrige plus facilement.

              Dernier point, le plus important : une liste de fiches copiée avec une tranche donne une
              nouvelle liste, mais les fiches à l'intérieur sont les mêmes objets. Modifier une fiche de la
              copie modifie aussi celle de l'originale. C'est ce qu'on appelle une copie superficielle.
            figures:
              - nom: python-copie-liste.svg
                legende: "Une copie superficielle duplique la liste, pas les fiches qu'elle contient"
            code:
              - titre: Filtrer et regrouper un effectif
                langage: python
                source: |
                  effectif = [
                      {"nom": "Awa", "poste": "RH", "salaire_fcfa": 250000},
                      {"nom": "Bakary", "poste": "Atelier", "salaire_fcfa": 180000},
                      {"nom": "Céline", "poste": "RH", "salaire_fcfa": 420000},
                  ]

                  bien_payes = [f["nom"] for f in effectif if f["salaire_fcfa"] >= 250000]

                  par_poste = {}
                  for fiche in effectif:
                      par_poste.setdefault(fiche["poste"], []).append(fiche["nom"])

                  print(bien_payes)   # ['Awa', 'Céline']
                  print(par_poste)    # {'RH': ['Awa', 'Céline'], 'Atelier': ['Bakary']}
          - titre: À la main
            texte: >-
              Recopiez l'effectif ci-dessus dans un fichier. Créez une copie avec copie = effectif[:], puis
              modifiez le salaire de la première fiche de la copie et affichez la première fiche de
              l'effectif d'origine.

              Le salaire a changé des deux côtés. C'est la démonstration de la copie superficielle, et c'est
              la source de bugs la plus déroutante pour un débutant : une donnée se modifie à un endroit où
              vous n'avez rien écrit.

              La parade de ce parcours est simple et tient en une phrase : une fonction ne modifie jamais ce
              qu'on lui passe. Si elle doit changer quelque chose, elle construit et rend une nouvelle
              structure.
          - titre: L'astuce du jour
            texte: >-
              Une compréhension sur une ligne, une boucle sinon. Une compréhension avec deux filtres et une
              condition imbriquée est plus difficile à lire qu'une boucle de quatre lignes, et beaucoup plus
              difficile à corriger sous pression.

              Le but n'est pas d'écrire court, il est d'écrire clair. Le code de ce parcours sera relu par
              vous dans sept semaines, quand vous le brancherez sur Django.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la mutation partagée, que vous venez de provoquer. Il se manifeste
              toujours de la même façon : un état calculé modifie l'effectif d'origine, et l'état suivant
              est faux sans que rien n'ait l'air anormal.

              La règle de sécurité du parcours : construisez une nouvelle liste plutôt que de modifier
              celle que vous recevez. Vos tests le vérifieront explicitement, en comparant l'effectif avant
              et après l'appel.
          - titre: Challenge du jour
            texte: >-
              Écrivez par_poste(effectif), qui rend un dictionnaire des noms regroupés par poste, et
              filtrer_par_salaire(effectif, mini), qui rend la liste des fiches dont le salaire atteint le
              minimum.

              Les tests livrés vérifient le regroupement sur trois postes, le filtre à la borne exacte, et
              comparent l'effectif d'origine avant et après chaque appel : il ne doit pas avoir bougé.

              Critères d'acceptation : aucune des deux fonctions ne modifie l'effectif reçu ; le filtre
              inclut la valeur exacte du minimum ; les deux fonctions rendent une valeur.
        livrable: >-
          Écrire par_poste(effectif) et filtrer_par_salaire(effectif, mini) ; un test prouve que
          l'effectif d'origine n'a pas bougé.
