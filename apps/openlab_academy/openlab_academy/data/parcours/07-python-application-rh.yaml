      - num: "J28"
        title: "L'ORM : créer, filtrer, agréger"
        evaluations: livrable
        contenu: >-
          Les requêtes de Django, les filtres, les agrégations, et la raison pour laquelle on laisse l'ORM
          écrire le SQL.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez calculer la masse salariale par poste en une seule requête, sans écrire
              une ligne de SQL.
          - titre: Le problème d'abord
            texte: >-
              Votre état par poste, en semaine 2, parcourait une liste en mémoire. Avec dix mille fiches en
              base, charger tout l'effectif pour en faire la somme est absurde : la base sait sommer, et
              elle le fait mieux.
          - titre: La notion
            texte: >-
              Un gestionnaire de modèle donne accès aux enregistrements. La méthode de filtrage accepte des
              conditions écrites avec des doubles soulignés, par exemple un champ supérieur ou égal à une
              valeur. Le résultat est paresseux : rien n'est exécuté tant que vous ne parcourez pas.

              L'agrégation calcule sur l'ensemble, le regroupement annote chaque groupe. Masse salariale
              par poste s'écrit en une ligne : grouper par poste, sommer le salaire.

              L'ORM écrit le SQL à votre place, et surtout il paramètre les valeurs. C'est ce qui empêche
              l'injection SQL, la faille qui consiste à faire exécuter du SQL par une valeur venue de
              l'utilisateur. Écrire une requête brute en collant des valeurs rouvre cette porte.
            code:
              - titre: Une agrégation par poste, en une requête
                langage: python
                source: |
                  from django.db.models import Sum

                  from effectif.models import Salarie


                  def masse_salariale_par_poste():
                      """Rend les couples (poste, masse) calculés par la base."""
                      lignes = (Salarie.objects
                                .values("poste__libelle")
                                .annotate(masse=Sum("salaire_fcfa"))
                                .order_by("-masse"))
                      return [(ligne["poste__libelle"], ligne["masse"]) for ligne in lignes]
          - titre: À la main
            texte: >-
              Depuis le shell du projet, créez quelques salariés, puis écrivez la requête d'agrégation.
              Affichez la propriété qui montre le SQL produit : vous lisez la requête que la base exécute,
              avec ses paramètres séparés des valeurs.

              Comparez le temps et la mémoire avec la version qui charge tout en mémoire. Sur trois fiches,
              aucune différence ; l'intérêt est ailleurs : la base fait ce pour quoi elle est faite, et
              votre code dit ce qu'il veut, pas comment l'obtenir.

              Essayez enfin de filtrer avec une valeur contenant une apostrophe et un fragment de SQL.
              Observez que rien ne se passe : la valeur reste une valeur.
          - titre: L'astuce du jour
            texte: >-
              Laissez l'ORM écrire le SQL. Il connaît les particularités de chaque base, il paramètre les
              valeurs, et il produit une requête que vous pouvez lire quand vous en avez besoin.

              Quand une requête devient illisible en ORM, ce qui arrive, isolez-la dans une fonction au nom
              explicite plutôt que de la disperser dans une vue. Elle restera lisible et testable.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la requête brute construite par concaténation avec une valeur venue de
              l'utilisateur. C'est l'injection SQL, et c'est la faille la plus ancienne et la plus répandue
              du métier : une valeur bien choisie fait exécuter ce que l'attaquant veut.

              Les tests du jour lisent votre code et échouent s'ils trouvent une requête brute ou un
              formatage de chaîne dans une requête. Ce n'est pas une question de style : c'est la
              différence entre une application tenable et une fuite de données.
            tableaux:
              - titre: Trois façons d'obtenir la masse par poste
                entetes: [Écriture, Travail fait par, Risque]
                lignes:
                  - ["ORM avec agrégation", "la base", "aucun"]
                  - ["Chargement puis somme en Python", "votre programme", "mémoire et lenteur"]
                  - ["SQL brut avec valeurs collées", "la base", "injection SQL"]
          - titre: Challenge du jour
            texte: >-
              Écrivez masse_salariale_par_poste() en une seule requête, et l'effectif par poste de la même
              façon.

              Les tests livrés vérifient les totaux et l'ordre, et comparent le résultat à celui du cœur
              Python pur de la semaine 2 sur le même jeu de données. Un test lit le code de l'application
              et échoue s'il y trouve une requête brute ou un formatage de chaîne dans une requête.

              Critères d'acceptation : une seule requête par état ; aucun SQL brut ; les résultats
              coïncident avec ceux du cœur.
        livrable: >-
          Écrire masse_salariale_par_poste() en une requête ; un test refuse toute requête brute ou
          valeur collée dans une requête.
