      - num: "J06"
        title: "Les listes : indexer, trancher, trier"
        evaluations: livrable
        archive: depot-python-j06.zip
        contenu: >-
          Créer une liste, atteindre un élément par son index, en extraire une tranche, ajouter, trier en
          place ou obtenir une copie triée.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez manipuler la liste des noms de l'effectif : la trier par ordre
              alphabétique, en extraire les derniers arrivés, et ajouter une recrue sans tout réécrire.
          - titre: Le problème d'abord
            texte: >-
              Le gérant veut afficher l'effectif par ordre alphabétique, puis montrer les trois dernières
              embauches. Vous savez parcourir une liste depuis la journée 04, mais pas la trier, ni en
              prendre un morceau.
          - titre: La notion
            texte: >-
              Une liste est une suite ordonnée et modifiable, écrite entre crochets. Chaque élément porte un
              index, qui commence à zéro : le premier élément est à l'index 0, le deuxième à l'index 1. Un
              index négatif compte depuis la fin : -1 désigne le dernier.

              Une tranche extrait une partie de la liste : la notation à deux points prend de la première
              borne incluse à la seconde exclue. Omettre une borne signifie « depuis le début » ou « jusqu'à
              la fin ». Une tranche rend une nouvelle liste ; elle ne modifie pas l'originale.

              La méthode append ajoute un élément à la fin. La méthode sort trie la liste en place et ne
              rend rien ; la fonction sorted rend une nouvelle liste triée sans toucher à l'originale. La
              fonction len donne le nombre d'éléments.
            figures:
              - nom: python-tranches-liste.svg
                legende: "Index et bornes d'une tranche : la première est incluse, la seconde exclue"
            code:
              - titre: Les gestes de base sur une liste
                langage: python
                source: |
                  noms = ["Awa", "Bakary", "Céline", "Daouda"]

                  print(noms[0])      # Awa
                  print(noms[-1])     # Daouda
                  print(noms[1:3])    # ['Bakary', 'Céline']
                  print(noms[-2:])    # ['Céline', 'Daouda']

                  noms.append("Eric")
                  print(len(noms))    # 5
                  print(sorted(noms)) # une nouvelle liste triée, noms n'a pas bougé
          - titre: À la main
            texte: >-
              Dans l'interpréteur, créez la liste des quatre noms ci-dessus. Demandez noms[4] : Python
              répond IndexError, parce que le dernier index d'une liste de quatre éléments est 3. Relisez
              cette erreur attentivement, elle reviendra.

              Appelez ensuite resultat = noms.sort() puis affichez resultat. Python affiche None : sort trie
              la liste mais ne rend rien. Comparez avec resultat = sorted(noms), qui rend bien une liste.

              Terminez en triant une liste contenant des prénoms accentués, par exemple Céline et Cédric :
              observez l'ordre obtenu. Le tri compare les caractères selon leur code, pas selon les règles
              d'un dictionnaire français.
          - titre: L'astuce du jour
            texte: >-
              Utilisez sorted quand vous voulez une copie triée, et sort seulement quand vous voulez
              vraiment modifier la liste d'origine. Dans un programme de gestion, la liste d'origine vient
              souvent d'ailleurs : la trier en place surprend celui qui vous l'a passée.

              C'est le premier contact avec une idée qui gouverne tout le parcours : une fonction qui
              modifie ce qu'on lui donne est beaucoup plus difficile à utiliser qu'une fonction qui rend
              quelque chose de neuf.
          - titre: Le piège du jour
            texte: >-
              Deux pièges aujourd'hui. Le premier est l'index hors bornes, qui lève IndexError : il vient
              presque toujours d'un index calculé avec la longueur, en oubliant que le dernier index vaut
              len moins un.

              Le second est la méthode sort qui rend None. Écrire noms = noms.sort() détruit votre liste :
              la variable ne contient plus rien d'exploitable. Le symptôme est reconnaissable, c'est le même
              que celui de la journée 05.
            tableaux:
              - titre: Trier, dans les deux cas
                entetes: [Écriture, Effet sur la liste d'origine, Valeur rendue]
                lignes:
                  - ["noms.sort()", "triée en place", "None"]
                  - ["sorted(noms)", "inchangée", "une nouvelle liste triée"]
                  - ["noms.append(x)", "un élément de plus", "None"]
                  - ["noms + [x]", "inchangée", "une nouvelle liste"]
          - titre: Challenge du jour
            texte: >-
              Écrivez effectif_trie(noms), qui rend une nouvelle liste triée par ordre alphabétique sans
              modifier celle qu'on lui passe, et trois_derniers(noms), qui rend les trois derniers éléments,
              ou tous s'il y en a moins de trois.

              Les tests livrés vérifient le comportement sur des prénoms accentués, sur une liste vide et
              sur une liste de deux éléments. Un test compare la liste d'origine avant et après l'appel :
              elle ne doit pas avoir bougé.

              Critères d'acceptation : les deux fonctions rendent une liste ; la liste reçue n'est jamais
              modifiée ; aucun plantage sur la liste vide.
        livrable: >-
          Écrire effectif_trie(noms) et trois_derniers(noms) ; les tests couvrent les accents, la liste
          vide et la liste d'origine laissée intacte.
