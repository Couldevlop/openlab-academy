        contenu: >-
          Recevoir des paramètres après le point d'interrogation, et traduire chaque erreur métier en un
          code HTTP précis plutôt qu'en panne générale.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez exposer un état mensuel paramétré, et répondre correctement quand le
              paramètre est absurde ou quand le mois demandé est vide.
          - titre: Le problème d'abord
            texte: >-
              Le gérant veut la masse salariale d'un mois donné. Le mois arrive dans l'adresse, après un
              point d'interrogation. Trois situations sont à distinguer : un mois valide avec des données,
              un mois valide sans données, et un mois mal écrit.

              Les confondre produit soit un 500 qui alarme, soit un 200 qui ment.
          - titre: La notion
            texte: >-
              Un paramètre de requête se déclare comme un argument de la fonction qui ne figure pas dans le
              chemin. Son type guide la conversion ; une valeur du mauvais type donne 422 sans que vous
              écriviez quoi que ce soit.

              Les contraintes de forme, comme un mois écrit en année et mois séparés par un tiret, se
              déclarent avec Query et un motif, ou se vérifient dans le cœur, qui lève alors une erreur
              métier que la route traduit.

              La règle de traduction est simple et vaut pour toute l'application : une erreur métier connue
              donne un 4, une panne inattendue donne un 5. Un mois sans données n'est ni l'un ni l'autre :
              c'est un succès dont le résultat est zéro.
            figures:
              - nom: python-codes-http.svg
                legende: "Chaque situation a son code : réussite, faute de l'appelant, panne du serveur"
            code:
              - titre: Un état mensuel, et ses trois issues
                langage: python
                source: |
                  from fastapi import FastAPI, HTTPException, Query

                  from rh.calculs import MoisInvalide, masse_du_mois

                  app = FastAPI(title="API RH")


                  @app.get("/etats/masse-salariale")
                  def masse_salariale(mois: str = Query(pattern=r"^\d{4}-\d{2}$")):
                      try:
                          return {"mois": mois, "total_fcfa": masse_du_mois(mois)}
                      except MoisInvalide as erreur:
                          raise HTTPException(status_code=422, detail=str(erreur)) from erreur
          - titre: À la main
            texte: >-
              Appelez la route avec un mois correct, puis avec un mois écrit à l'envers, puis avec un mois
              valide mais sans aucune donnée. Comparez les trois réponses : 200 avec un total, 422 avec un
              détail, 200 avec un total nul.

              Retirez ensuite le motif de la déclaration et relancez avec un mois mal écrit : la requête
              atteint votre cœur, qui lève MoisInvalide, que la route traduit en 422. Les deux chemins
              arrivent au même code : le premier le fait plus tôt, le second le fait dans le cœur, où la
              règle est écrite une fois pour tous les habillages.

              Essayez enfin de supprimer le bloc try : une erreur métier non traduite devient une panne 500.
              C'est exactement ce qu'il faut éviter.
          - titre: L'astuce du jour
            texte: >-
              Une erreur métier, un code, un message. Écrivez cette correspondance quelque part dans votre
              projet, et tenez-la à jour : c'est le contrat que lisent ceux qui appellent votre API.

              Les erreurs métier du cœur portent des noms qui disent le problème, comme MoisInvalide. La
              route n'a plus qu'à les associer à un code.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le 500 fourre-tout : laisser toute erreur remonter sans traduction. Celui
              qui appelle votre API ne peut rien en faire, et vos journaux se remplissent d'alertes qui ne
              signalent aucune panne réelle.

              Le piège symétrique est pire : attraper l'erreur et répondre 200 avec un résultat vide. La
              réponse semble normale et la donnée est fausse. Un mois sans données rend bien 200, mais parce
              que c'est un vrai succès dont le total vaut zéro, pas parce qu'une erreur a été étouffée.
            tableaux:
              - titre: Trois situations, trois réponses
                entetes: [Situation, Code, Contenu]
                lignes:
                  - ["Mois valide avec données", "200", "le total du mois"]
                  - ["Mois valide sans données", "200", "un total nul"]
                  - ["Mois mal écrit", "422", "le détail du champ fautif"]
                  - ["Panne inattendue", "500", "rien d'exploitable, et une alerte pour vous"]
          - titre: Challenge du jour
            texte: >-
              Écrivez GET /etats/masse-salariale avec un paramètre mois. Un mois mal écrit donne 422 ; un
              mois sans données donne 200 et un total nul.

              Les tests livrés couvrent les trois cas. Un test vérifie qu'aucune réponse 500 n'est produite
              par une donnée d'entrée, quelle qu'elle soit.

              Critères d'acceptation : la règle du mois est écrite dans le cœur ; chaque erreur métier a son
              code ; un mois vide n'est pas traité comme une erreur.
        livrable: >-
          Écrire GET /etats/masse-salariale avec un paramètre mois ; les tests couvrent le mois invalide
          et le mois sans données.
