      - num: "J24"
        title: "Deux graphiques utiles"
        evaluations: livrable
        archive: depot-python-j24.zip
        contenu: >-
          La masse salariale par poste et les absences du mois, avec une mesure par axe et une série de
          données préparée par une fonction testable.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez produire deux graphiques que le gérant comprend en trois secondes, à
              partir de séries calculées et testées.
          - titre: Le problème d'abord
            texte: >-
              Le tableau donne tout, donc rien : trente lignes ne répondent pas à la question « où part
              l'argent ». Deux graphiques y répondent, à condition de choisir la bonne forme et de les
              nourrir avec des séries propres.
          - titre: La notion
            texte: >-
              Streamlit affiche un graphique à partir de données préparées : une liste de couples, un
              dictionnaire ou un tableau de données. Le travail intéressant est la préparation, pas
              l'appel d'affichage.

              Préparer une série, c'est agréger, trier et nommer : masse par poste, du plus élevé au plus
              faible, avec le poste en clé et le montant en valeur. Cette fonction se teste exactement comme
              un calcul de paie.

              Le choix de la forme suit la question. Comparer des quantités entre catégories appelle des
              barres. Suivre une évolution dans le temps appelle une ligne. Montrer une part d'un tout
              peut appeler un camembert, mais seulement avec très peu de parts.
            figures:
              - nom: python-graphique-lisible.svg
                legende: "La même donnée en barres triées et en camembert à douze parts : une seule se lit"
            code:
              - titre: La série se prépare, puis s'affiche
                langage: python
                source: |
                  def serie_masse_par_poste(effectif):
                      """Rend les couples (poste, masse) triés du plus élevé au plus faible."""
                      masses = {}
                      for fiche in effectif:
                          masses[fiche["poste"]] = masses.get(fiche["poste"], 0) + fiche["salaire_fcfa"]
                      return sorted(masses.items(), key=lambda couple: couple[1], reverse=True)
          - titre: À la main
            texte: >-
              Écrivez serie_masse_par_poste, testez-la sur un effectif de six fiches réparties sur trois
              postes, puis affichez le résultat en barres dans votre écran.

              Fabriquez ensuite la même donnée en camembert, avec douze postes fictifs. Regardez les deux
              figures côte à côte et posez-vous la question du gérant : quel poste coûte le plus cher ? La
              réponse est immédiate sur les barres triées, impossible sur le camembert.

              Ajoutez enfin le second graphique, les absences du mois, et vérifiez que chaque axe porte une
              seule mesure.
          - titre: L'astuce du jour
            texte: >-
              Une mesure par axe, et des barres triées. Trier par valeur transforme un graphique en réponse :
              le poste le plus coûteux est à gauche, et la lecture prend une seconde.

              Nommez l'unité sur l'axe, comme vous nommez l'unité dans vos variables depuis la journée 02.
              Un montant sans unité se lit faux une fois sur deux.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le camembert à douze parts, illisible par construction : l'œil compare
              mal des angles proches, et la légende oblige à faire des allers-retours.

              Le second piège est le graphique à deux échelles, qui superpose un effectif et des francs CFA
              sur la même figure. Il donne une impression de corrélation que les données ne portent pas.
              Deux graphiques côte à côte disent la même chose sans tromper personne.
            tableaux:
              - titre: Choisir la forme selon la question
                entetes: [Question du gérant, Forme, Piège à éviter]
                lignes:
                  - ["Quel poste coûte le plus cher ?", "barres triées", "ordre alphabétique inutile"]
                  - ["Comment évoluent les absences ?", "ligne dans le temps", "points sans ordre"]
                  - ["Quelle part pour l'atelier ?", "camembert à trois parts au plus", "douze parts"]
                  - ["Deux mesures d'un coup ?", "deux graphiques", "deux échelles sur une figure"]
          - titre: Challenge du jour
            texte: >-
              Écrivez serie_masse_par_poste(effectif) et affichez-la en barres triées. Ajoutez le graphique
              des absences du mois.

              Les tests livrés vérifient l'ordre des couples rendus, le total par poste, et le
              comportement sur un effectif vide. Un test vérifie que la préparation ne dépend pas de
              Streamlit.

              Critères d'acceptation : la série est triée du plus élevé au plus faible ; les totaux sont
              justes ; les deux graphiques portent une seule mesure chacun.
        livrable: >-
          Écrire serie_masse_par_poste(effectif) qui rend des couples triés ; le test porte sur l'ordre et
          les totaux.
