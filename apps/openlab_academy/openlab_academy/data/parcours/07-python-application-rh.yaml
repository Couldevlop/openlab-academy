                entetes: [Point, Ce que vous devez savoir refaire]
                lignes:
                  - [Commande de gestion, "Lancer un traitement par manage.py avec ses arguments"]
                  - [Réutilisation, "Appeler le cœur au lieu de recoder les règles"]
                  - [Rejouable, "Relancer un import sans créer de doublon"]
                  - [Une seule vérité, "Refuser d'écrire la même règle à deux endroits"]
                  - [Compte rendu, "Dire ce que la commande a fait"]
        quiz:
          - question: "Que fait la commande d'import avec le fichier ?"
            options: ["Elle appelle le cœur écrit en semaine 3", "Elle le relit à sa façon", "Elle le copie dans la base", "Elle le convertit en JSON"]
            bonnes: [1]
            explication: "Recoder les règles dans Django donnerait deux vérités, et c'est une de trop."
          - question: "Que doit-il se passer à la seconde exécution d'un import ?"
            options: ["Rien ne change dans la base", "Les fiches sont dupliquées", "Une erreur est levée", "La base est vidée"]
            bonnes: [1]
            explication: "Une commande qu'on peut rejouer sans dégât est une commande utilisable."
          - question: "Combien d'habillages le cœur a-t-il traversés ?"
            options: ["Trois", "Un", "Deux", "Quatre"]
            bonnes: [1]
            explication: "FastAPI, Streamlit et Django, sans que le cœur change d'une ligne."
          - question: "Que devient une erreur métier pendant un import ?"
            options: ["Elle remonte avec son message utile", "Elle est ignorée", "Elle devient une erreur 500", "Elle arrête la base"]
            bonnes: [1]
            explication: "C'est l'erreur écrite en journée 13, inchangée depuis."
          - question: "Pourquoi une commande doit-elle dire ce qu'elle a fait ?"
            options: ["Parce que personne ne regarde la base après coup", "Pour remplir les journaux", "Parce que Django l'exige", "Pour ralentir l'exécution"]
            bonnes: [1]
            explication: "Un compte rendu d'une ligne suffit : le nombre de fiches traitées."
      - num: "J35"
        title: "Finir et montrer"
        evaluations: livrable
        contenu: >-
          Les états de l'application, la suite de tests complète, la vérification de déploiement, le mode
          de débogage désactivé et la clé secrète hors du dépôt.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez livrer une application complète, testée, configurée pour être montrée, et
              vous saurez la présenter en cinq minutes.
          - titre: Le problème d'abord
            texte: >-
              Votre application marche sur votre machine. Entre « ça marche chez moi » et « je peux le
              montrer à quelqu'un », il reste une liste de vérifications que personne ne fait de mémoire.
          - titre: La notion
            texte: >-
              Django fournit une vérification spécifique au déploiement, qui contrôle la configuration de
              sécurité : mode de débogage, clé secrète, hôtes autorisés, cookies. Elle se lance comme la
              vérification ordinaire, avec une option supplémentaire.

              Le mode de débogage affiche la trace complète en cas d'erreur, avec les valeurs des
              variables et des extraits de configuration. C'est précieux en développement et c'est une
              fuite d'informations en production.

              La clé secrète signe les sessions et les jetons de formulaire. Publiée, elle permet de
              fabriquer de fausses sessions. Elle se lit dans l'environnement, comme en journée 20, et ne
              figure jamais dans le dépôt.

              Les tests de Django s'écrivent avec sa propre classe de test, qui prépare une base de test
              jetable. Vos tests de cœur, eux, restent du pytest ordinaire : ils n'ont pas besoin de base.
            tableaux:
              - titre: La liste de contrôle avant de montrer
                entetes: [Point, Attendu]
                lignes:
                  - ["Mode de débogage", "désactivé"]
                  - ["Clé secrète", "lue dans l'environnement, absente du dépôt"]
                  - ["Hôtes autorisés", "renseignés explicitement"]
                  - ["Comptes de démonstration", "listés, et supprimés avant toute mise en ligne"]
                  - ["Suite de tests", "verte, en une commande"]
                  - ["Vérification de déploiement", "sans alerte critique"]
          - titre: À la main
            texte: >-
              Lancez la vérification de déploiement avec le mode de débogage encore activé : elle signale
              plusieurs problèmes. Corrigez-les un par un, en lisant chaque message.

              Désactivez le débogage et provoquez une erreur : vous obtenez une page d'erreur sobre au lieu
              de la trace. Vérifiez au passage que votre fichier de configuration lit bien la clé secrète
              depuis l'environnement.

              Lancez enfin la suite complète, cœur et application, en une commande, et vérifiez qu'elle est
              verte. Une suite qui demande trois commandes différentes ne sera pas lancée par la personne
              qui récupère votre dépôt.
          - titre: L'astuce du jour
            texte: >-
              Relisez la liste de contrôle avant de montrer, à chaque fois. Un professionnel ne se fie pas
              à sa mémoire pour six points qui décident de la sécurité d'une application.

              Et préparez votre démonstration dans l'ordre inverse de votre développement : vérifiez
              d'abord que l'installation depuis zéro fonctionne, ensuite seulement soignez le contenu.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le mode de débogage laissé actif, parfois pendant des années. Il affiche
              à n'importe quel visiteur le chemin de vos fichiers, vos variables et une partie de votre
              configuration.

              Le second piège est la clé secrète versionnée, généralement présente dès la création du
              projet, puisque Django en écrit une dans le fichier de configuration. La sortir est l'un des
              tout premiers gestes à faire, et c'est l'objet du challenge d'aujourd'hui.
          - titre: Challenge du jour
            texte: >-
              Livrez l'application complète : les états, les pages, les rôles, la commande d'import, la
              suite de tests verte et la configuration prête à être montrée.

              Les tests livrés vérifient que le mode de débogage est désactivé dans la configuration de
              démonstration, que la clé secrète n'est pas en dur, et que la vérification de déploiement ne
              signale aucune alerte critique.

              Critères d'acceptation : la liste de contrôle est entièrement satisfaite ; la suite passe en
              une commande ; le fichier demo.md décrit la démonstration de cinq minutes.
        livrable: >-
          Livrer l'application complète avec sa suite verte et une vérification de déploiement sans alerte
          critique.

capstone:
  titre: Votre application RH, montrée à quelqu'un
  duree_h: 3
  niveau: autonome
  contexte: >-
    Le projet final ne demande aucune nouvelle notion : il demande de montrer ce que les trente-cinq journées
    ont construit. Vous rendez le dépôt de votre application RH, son fichier demo.md, sa suite de tests verte,
    et vous la présentez en cinq minutes à quelqu'un qui n'a pas suivi le parcours. La présentation compte
    autant que le code : un travail que personne ne comprend ne se vend pas.
  objectifs:
    - Montrer une application qui démarre sur une machine vierge en suivant votre seul fichier LISEZ-MOI.
    - Expliquer en une minute pourquoi le cœur métier ne connaît ni FastAPI, ni Streamlit, ni Django.
    - Faire tourner la suite de tests devant votre interlocuteur et commenter ce qu'elle prouve.
  fonctionnalites:
    - L'effectif, la fiche d'un salarié et l'embauche, écran et API.
    - "Les trois états de la direction : effectif par poste, masse salariale, absences du mois."
    - L'import d'un fichier CSV d'effectif par la commande de gestion.
  stack:
    - Python, pytest
    - FastAPI, Streamlit, Django, SQLite
  criteres_acceptation:
    - La suite de tests passe en une commande, sur un dépôt fraîchement récupéré.
    - Aucun secret dans le dépôt ; le fichier .env.exemple est suivi, le fichier .env ne l'est pas.
    - Le cœur métier n'importe ni framework, ni fichier, ni réseau.
    - DEBUG vaut False dans la configuration de démonstration et check --deploy ne lève aucune alerte critique.
  exigences_specifiques:
    - Les données livrées sont fictives et le dépôt le dit.
    - Les montants s'affichent en francs CFA, sans décimale.
  livrables:
    - Le dépôt complet de l'application, tests inclus.
    - "Le fichier demo.md : le scénario de la démonstration, minute par minute."
    - Une capture de la suite de tests au vert.
