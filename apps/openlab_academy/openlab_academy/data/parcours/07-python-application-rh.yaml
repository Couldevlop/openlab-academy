      - num: "J26"
        title: "Pourquoi Django, et un projet qui démarre"
        evaluations: livrable
        contenu: >-
          Ce que Django apporte par rapport à ce que vous avez écrit, la commande de création de projet,
          l'arborescence, SQLite et le serveur de développement.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez créer un projet Django qui démarre et passe sa vérification intégrée,
              et vous saurez nommer chaque fichier qu'il a créé.
          - titre: Le problème d'abord
            texte: >-
              Votre application tient dans un fichier CSV. Deux personnes ne peuvent pas saisir en même
              temps, rien n'est protégé par un mot de passe, et une suppression est définitive.

              Django apporte trois choses que vous n'avez pas : une base de données avec son schéma, des
              utilisateurs avec des droits, et un back-office prêt à l'emploi.
          - titre: La notion
            texte: >-
              Django est un cadre complet : il impose une organisation et fournit beaucoup. Un projet
              contient des applications, chacune responsable d'un domaine. Votre projet s'appellera rh_web
              et contiendra une application effectif.

              La base de données du développement est SQLite : un simple fichier, aucun service à
              installer. C'est suffisant jusqu'à la journée 35, et le passage à une autre base ne change
              que la configuration.

              Les commandes passent par manage.py : créer une application, appliquer les migrations,
              lancer le serveur, vérifier le projet. La commande de vérification lit votre configuration et
              signale les problèmes avant qu'ils ne se manifestent à l'exécution.
            tableaux:
              - titre: Ce que Django apporte par rapport à votre application
                entetes: [Besoin, Votre application, Django]
                lignes:
                  - ["Stocker", "un fichier CSV", "une base avec son schéma"]
                  - ["Modifier à plusieurs", "impossible", "transactions de la base"]
                  - ["Identifier les personnes", "absent", "utilisateurs et mots de passe"]
                  - ["Back-office", "à écrire", "fourni, à déclarer"]
          - titre: À la main
            texte: >-
              Installez django, puis créez le projet avec la commande de création, et l'application
              effectif avec manage.py. Lancez le serveur de développement et ouvrez l'adresse locale : la
              page d'accueil de Django s'affiche.

              Ouvrez le dossier créé et nommez chaque fichier à voix haute : le fichier de configuration,
              celui des adresses, celui qui sert de point d'entrée au serveur. Ne modifiez rien encore.

              Lancez enfin la commande de vérification. Elle doit se terminer sans aucun avertissement.
              Notez le message concernant les migrations non appliquées : c'est le sujet de demain.
          - titre: L'astuce du jour
            texte: >-
              Lisez l'arborescence avant d'écrire la moindre ligne. Django crée une dizaine de fichiers, et
              ceux qui les ignorent passent les semaines suivantes à chercher où mettre leur code.

              Prenez cinq minutes, aujourd'hui, pour écrire sur une feuille le rôle de chaque fichier. Vous
              gagnerez ces cinq minutes dès demain.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est de lancer le serveur sans appliquer les migrations initiales. Django
              affiche un avertissement rouge, l'application semble fonctionner, puis échoue à la première
              opération sur la base.

              Le second piège est le mélange des noms : le projet et l'application ne portent pas le même
              nom, et les confondre produit des imports qui ne résolvent pas. Choisissez rh_web pour le
              projet et effectif pour l'application, et tenez-vous-y.
          - titre: Challenge du jour
            texte: >-
              Livrez un projet qui démarre, avec son application effectif déclarée dans la configuration.
              La commande de vérification passe sans avertissement.

              Les tests livrés lancent la vérification et échouent si elle signale quoi que ce soit. Un test
              vérifie que l'application effectif figure bien dans la liste des applications installées.

              Critères d'acceptation : le serveur démarre ; la vérification est muette ; le paquet rh des
              semaines précédentes est présent dans le dépôt, intact.
        livrable: >-
          Livrer un projet Django qui démarre et passe sa vérification sans avertissement, avec
          l'application effectif déclarée.
