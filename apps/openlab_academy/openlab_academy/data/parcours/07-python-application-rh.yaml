        quiz:
          - question: "Qu'est-ce que l'injection SQL ?"
            options: ["Faire exécuter du SQL par une valeur venue de l'utilisateur", "Insérer des lignes en masse", "Importer un fichier SQL", "Optimiser une requête"]
            bonnes: [1]
            explication: "L'ORM paramètre les valeurs : une valeur reste une valeur, jamais du code."
          - question: "Où se calcule une somme par poste ?"
            options: ["Dans la base, par agrégation", "En mémoire après chargement", "Dans le gabarit", "Dans le navigateur"]
            bonnes: [1]
            explication: "Charger dix mille fiches pour les additionner est absurde quand la base sait le faire."
          - question: "Quand la requête part-elle vers la base ?"
            options: ["Au moment du parcours du résultat", "À l'écriture de la ligne", "Au démarrage du serveur", "Jamais"]
            bonnes: [1]
            explication: "La paresse permet d'enchaîner filtres et tris avant un seul aller-retour."
          - question: "Que faire d'une requête ORM devenue illisible ?"
            options: ["L'isoler dans une fonction au nom explicite", "La réécrire en SQL brut", "La couper en trois requêtes", "L'écrire dans le gabarit"]
            bonnes: [1]
            explication: "Elle reste alors lisible, testable, et à un seul endroit."
          - question: "Que vérifient les tests du jour dans votre code ?"
            options: ["L'absence de requête brute et de valeur collée", "Le nombre de lignes", "Le temps d'exécution", "Le nom des variables"]
            bonnes: [1]
            explication: "Ce n'est pas une question de style : c'est la différence entre une application tenable et une fuite."
      - num: "J29"
        title: "L'administration comme back-office"
        evaluations: livrable
        contenu: >-
          Enregistrer les modèles dans l'administration, déclarer les colonnes et les filtres utiles, et
          décider ce qu'on n'expose pas.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez offrir au gérant un back-office complet pour saisir et corriger
              l'effectif, sans écrire une page.
          - titre: Le problème d'abord
            texte: >-
              Le gérant doit pouvoir corriger une fiche, ajouter un poste, saisir une absence. Écrire ces
              écrans prendrait une semaine. Django les fournit, à condition de déclarer ce que vous voulez
              montrer.
          - titre: La notion
            texte: >-
              L'administration se peuple en enregistrant chaque modèle. Une classe d'administration
              configure l'affichage : les colonnes de la liste, les filtres latéraux, les champs de
              recherche, l'ordre par défaut.

              Un compte d'administration se crée en ligne de commande, avec un mot de passe que vous
              saisissez vous-même. Ce compte n'est pas un compte de démonstration : il donne tous les
              droits.

              Tout ce qui est enregistré est visible par les personnes qui ont accès à l'administration.
              C'est une décision, pas un détail : le salaire figure parmi les données les plus sensibles
              d'une entreprise.
            code:
              - titre: Une administration déclarée, pas improvisée
                langage: python
                source: |
                  from django.contrib import admin

                  from effectif.models import Absence, Poste, Salarie


                  @admin.register(Salarie)
                  class SalarieAdmin(admin.ModelAdmin):
                      list_display = ("matricule", "nom", "poste", "date_embauche")
                      list_filter = ("poste",)
                      search_fields = ("matricule", "nom")
                      ordering = ("nom",)


                  admin.site.register(Poste)
                  admin.site.register(Absence)
          - titre: À la main
            texte: >-
              Créez un compte d'administration, lancez le serveur et connectez-vous. Ajoutez deux postes,
              trois salariés et une absence.

              Essayez la recherche et le filtre latéral. Puis retirez le salaire de la liste des colonnes
              affichées et observez : il reste visible dans le formulaire de modification. Masquer une
              colonne n'est pas protéger une donnée, et c'est la leçon qui prépare la journée 33.

              Vérifiez enfin que la contrainte d'unicité d'hier remonte bien à l'écran : saisissez un
              matricule déjà pris et lisez le message affiché par le formulaire.
          - titre: L'astuce du jour
            texte: >-
              Déclarez les colonnes et les filtres dont le gérant a besoin, et rien d'autre. Une liste de
              quinze colonnes est illisible sur un écran d'ordinateur portable et inutilisable sur un
              téléphone.

              Trois à cinq colonnes, un ou deux filtres, un champ de recherche : c'est ce qui rend un
              back-office utilisable au quotidien.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est d'exposer tout à tout le monde. L'administration donne par défaut un
              accès complet aux personnes qui y entrent. Le salaire, la date de naissance et l'adresse
              appartiennent aux données que seule la fonction RH doit voir.

              Ce n'est pas qu'une question de confiance : c'est une exigence de protection des données
              personnelles. La journée 33 posera les rôles ; aujourd'hui, prenez simplement conscience de
              ce que vous ouvrez.
          - titre: Challenge du jour
            texte: >-
              Enregistrez les trois modèles avec une configuration d'affichage utile : colonnes, filtre et
              recherche sur les salariés.

              Les tests livrés vérifient que les trois modèles sont enregistrés et que la configuration des
              salariés déclare bien ses colonnes. Un test vérifie qu'aucun compte d'administration n'est
              créé par une migration : un compte se crée à la main, jamais par du code versionné.

              Critères d'acceptation : les trois modèles sont administrables ; la liste des salariés tient
              en cinq colonnes au plus ; aucun mot de passe dans le dépôt.
        livrable: >-
          Livrer une administration utilisable ; le test vérifie l'enregistrement des trois modèles et
          l'absence de compte créé par migration.
      - num: "J30R"
        title: Rappel de la veille
        evaluations: quiz
        contenu: >-
          Cinq points de la journée 29, à revoir avant d'ouvrir la leçon du jour. Aucune notion nouvelle
          ici. Le quiz se retente jusqu'à dix fois ; si vous les épuisez, votre formateur rouvre la
          tentative.
        cours:
          - titre: Ce qu'il faut avoir retenu d'hier
            texte: >-
              Relisez ces cinq points, puis lancez le quiz. Un back-office bien déclaré remplace une
              semaine de développement.
            tableaux:
              - titre: Les cinq points de la journée 29
                entetes: [Point, Ce que vous devez savoir refaire]
                lignes:
                  - [Enregistrement, "Rendre un modèle administrable"]
                  - [Colonnes, "Choisir les colonnes utiles de la liste"]
                  - [Filtres et recherche, "Rendre une liste exploitable au quotidien"]
                  - [Compte d'administration, "Créer un compte à la main, jamais par du code"]
                  - [Exposition, "Décider ce que l'administration montre, et à qui"]
        quiz:
          - question: "Masquer une colonne de la liste protège-t-il la donnée ?"
            options: ["Non, elle reste visible dans le formulaire", "Oui, complètement", "Oui, si le modèle est privé", "Seulement pour les administrateurs"]
            bonnes: [1]
            explication: "C'est précisément la leçon qui prépare les rôles de la journée 33."
          - question: "Combien de colonnes dans une liste utilisable ?"
            options: ["Trois à cinq", "Quinze", "Toutes", "Une seule"]
            bonnes: [1]
            explication: "Au-delà, la liste devient illisible sur un portable et inutilisable sur un téléphone."
          - question: "Comment créer un compte d'administration ?"
            options: ["En ligne de commande, avec un mot de passe saisi", "Par une migration", "Dans le fichier de configuration", "Automatiquement au démarrage"]
            bonnes: [1]
            explication: "Un compte créé par du code versionné met son mot de passe dans le dépôt."
          - question: "Qui doit voir les salaires ?"
            options: ["La fonction RH seulement", "Tout le monde", "Les managers", "Les salariés concernés et personne d'autre"]
            bonnes: [1]
            explication: "C'est une exigence de protection des données personnelles, pas une question de confiance."
          - question: "D'où vient le message d'erreur sur un matricule déjà pris ?"
            options: ["De la contrainte d'unicité posée en journée 27", "Du gabarit", "Du navigateur", "De l'administration elle-même"]
            bonnes: [1]
            explication: "La règle est dans la base ; le formulaire ne fait que la présenter."
      - num: "J30"
        title: "Vues et gabarits"
        evaluations: livrable
        contenu: >-
          Le découpage modèle, vue, gabarit, l'écriture d'une liste et d'une fiche, et la règle qui garde
          toute logique métier hors du gabarit.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez publier deux pages publiques de votre application : la liste de
              l'effectif et la fiche d'un salarié.
          - titre: Le problème d'abord
            texte: >-
              L'administration sert au gérant, pas aux autres. Il faut des pages à vous, qui affichent ce
              que vous décidez, avec votre mise en forme, et qui pourront être protégées par un mot de
              passe en journée 32.
          - titre: La notion
            texte: >-
              Django achemine une requête par les adresses : un motif d'URL désigne une vue. La vue reçoit
              la requête, prépare un contexte, et rend un gabarit. Le gabarit est un fichier HTML avec des
              marques qui affichent les valeurs du contexte.

              Le découpage porte un nom chez Django : modèle, vue, gabarit. Le modèle sait ce qu'est une
              donnée, la vue sait quoi afficher, le gabarit sait comment le présenter.

              Le gabarit ne contient pas de logique métier. Il peut parcourir une liste et afficher une
              valeur ; il ne calcule pas une masse salariale, il ne décide pas d'un droit. Ce qui demande
              une règle se calcule dans la vue ou, mieux, dans le cœur.
            figures:
              - nom: python-django-mvt.svg
                legende: "D'une adresse à une page : l'adresse, la vue, le modèle, le gabarit"
            code:
              - titre: Une vue qui prépare, un gabarit qui présente
                langage: python
                source: |
                  from django.shortcuts import get_object_or_404, render

                  from effectif.models import Salarie


                  def liste_salaries(requete):
                      salaries = Salarie.objects.select_related("poste").order_by("nom")
                      return render(requete, "effectif/liste.html", {"salaries": salaries})


                  def fiche_salarie(requete, matricule):
                      salarie = get_object_or_404(Salarie, matricule=matricule)
                      return render(requete, "effectif/fiche.html", {"salarie": salarie})
          - titre: À la main
            texte: >-
              Écrivez les deux vues, leurs adresses et leurs gabarits. Ouvrez la liste, cliquez sur un nom,
              atterrissez sur la fiche. Demandez un matricule inexistant : la page 404 s'affiche, parce que
              la fonction d'accès l'a décidé.

              Ajoutez temporairement un calcul dans le gabarit, par exemple une somme, et constatez à quel
              point l'écriture devient pénible. Les gabarits sont volontairement limités : c'est une
              protection, pas une lacune.

              Observez enfin le nombre de requêtes exécutées pour afficher la liste, avec et sans la
              sélection liée. Sans elle, Django interroge la base une fois par ligne pour obtenir le
              poste : c'est le problème des requêtes en cascade.
          - titre: L'astuce du jour
            texte: >-
              Une vue, une responsabilité. Une vue qui prépare deux pages à la fois, ou qui décide d'un
              droit tout en calculant un état, devient illisible en quelques semaines.

              Gardez les vues courtes : lire les paramètres, appeler ce qui calcule, rendre le gabarit.
              C'est exactement la discipline de la journée 17 avec FastAPI, et c'est pourquoi elle vous
              paraît familière.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la logique métier dans le gabarit. Une règle écrite là n'est ni testable,
              ni réutilisable, et personne ne la cherche à cet endroit.

              Le second piège est la requête en cascade : une liste de cent salariés qui déclenche cent une
              requêtes parce que chaque ligne va chercher son poste. La sélection liée corrige cela en une
              ligne, et c'est le premier réflexe de performance à acquérir.
          - titre: Challenge du jour
            texte: >-
              Livrez la liste de l'effectif et la fiche d'un salarié, avec leurs adresses et leurs
              gabarits.

              Les tests livrés vérifient le code de réponse des deux pages, le contenu du contexte, et le
              404 sur un matricule inconnu. Un test compte les requêtes exécutées par la liste et échoue
              au-delà de trois.

              Critères d'acceptation : deux pages fonctionnelles ; aucun calcul dans les gabarits ; pas de
              requête en cascade.
        livrable: >-
          Livrer la liste et la fiche d'un salarié ; les tests portent sur le code de réponse, le contexte
          et le nombre de requêtes.
      - num: "J31R"
        title: Rappel de la veille
        evaluations: quiz
        contenu: >-
          Cinq points de la journée 30, à revoir avant d'ouvrir la leçon du jour. Aucune notion nouvelle
          ici. Le quiz se retente jusqu'à dix fois ; si vous les épuisez, votre formateur rouvre la
          tentative.
        cours:
          - titre: Ce qu'il faut avoir retenu d'hier
            texte: >-
              Relisez ces cinq points, puis lancez le quiz. Le découpage de Django reprend la discipline de
              la journée 17.
            tableaux:
              - titre: Les cinq points de la journée 30
                entetes: [Point, Ce que vous devez savoir refaire]
                lignes:
                  - [Adresse et vue, "Relier un motif d'URL à une fonction de vue"]
                  - [Contexte, "Préparer les valeurs que le gabarit affichera"]
                  - [Gabarit, "Présenter sans calculer"]
                  - [404, "Rendre une page absente avec le bon code"]
                  - [Requêtes en cascade, "Charger les objets liés en une seule fois"]
        quiz:
          - question: "Que fait une vue ?"
            options: ["Elle prépare un contexte et rend un gabarit", "Elle écrit le HTML", "Elle crée les tables", "Elle valide les formulaires seulement"]
            bonnes: [1]
            explication: "Lire, appeler ce qui calcule, rendre : la même discipline qu'une route d'API."
          - question: "Que ne doit pas contenir un gabarit ?"
            options: ["De la logique métier", "Une boucle d'affichage", "Une condition d'affichage", "Du texte"]
            bonnes: [1]
            explication: "Une règle écrite là n'est ni testable, ni réutilisable, et personne ne l'y cherche."
          - question: "Qu'est-ce qu'une requête en cascade ?"
            options: ["Une requête par ligne affichée, au lieu d'une seule", "Une requête trop longue", "Une transaction imbriquée", "Un filtre à plusieurs critères"]
            bonnes: [1]
            explication: "La sélection des objets liés corrige cela en une ligne."
          - question: "Comment rendre une page 404 proprement ?"
            options: ["Avec la fonction d'accès qui lève l'absence", "Avec un return None", "Avec une exception générique", "En affichant un message vide"]
            bonnes: [1]
            explication: "Le code de réponse fait partie du contrat de la page."
          - question: "Que signifie le découpage modèle, vue, gabarit ?"
            options: ["La donnée, la décision d'affichage, la présentation", "Trois fichiers obligatoires", "Trois bases de données", "Trois serveurs"]
            bonnes: [1]
            explication: "Chaque couche a une responsabilité, et une seule."
      - num: "J31"
        title: "Formulaires et validation côté serveur"
        evaluations: livrable
        contenu: >-
          Le formulaire de Django, la validation au serveur, l'affichage des erreurs, et la raison pour
          laquelle la validation du navigateur ne protège rien.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez offrir une page d'embauche qui refuse proprement les saisies fausses, et
              qui ne crée rien tant que tout n'est pas valide.
          - titre: Le problème d'abord
            texte: >-
              Le gérant veut embaucher depuis une page publique de l'application, pas depuis
              l'administration. Les données arrivent donc du monde extérieur, et tout ce que la semaine 4
              vous a appris sur la frontière s'applique ici.
          - titre: La notion
            texte: >-
              Un formulaire de modèle décrit les champs à saisir à partir d'un modèle. La vue construit le
              formulaire avec les données reçues, demande s'il est valide, et n'enregistre que dans ce cas.

              La validation s'exécute au serveur. Les attributs du HTML produit font une première
              vérification dans le navigateur, qui améliore le confort et ne protège rien : n'importe qui
              peut envoyer une requête sans passer par la page.

              Les erreurs sont attachées au formulaire, champ par champ, et le gabarit les affiche à côté
              de chaque saisie. L'utilisateur retrouve ses valeurs, ce qui lui évite de tout retaper.
            code:
              - titre: Une vue d'embauche qui ne crée rien de faux
                langage: python
                source: |
                  from django.shortcuts import redirect, render

                  from effectif.forms import SalarieForm


                  def embaucher(requete):
                      if requete.method == "POST":
                          formulaire = SalarieForm(requete.POST)
                          if formulaire.is_valid():
                              salarie = formulaire.save()
                              return redirect("fiche", matricule=salarie.matricule)
                      else:
                          formulaire = SalarieForm()
                      return render(requete, "effectif/embauche.html", {"formulaire": formulaire})
          - titre: À la main
            texte: >-
              Écrivez le formulaire, la vue et le gabarit. Saisissez une embauche correcte : vous êtes
              redirigé vers la fiche. Saisissez un matricule déjà pris : la page revient avec l'erreur et
              vos valeurs.

              Envoyez maintenant la même requête sans passer par la page, avec un outil en ligne de
              commande qui poste des données. Les contrôles du navigateur n'ont jamais été exécutés, et
              pourtant la création est refusée : c'est la démonstration que seule la validation du serveur
              compte.

              Vérifiez enfin qu'aucun enregistrement n'a été créé après un refus. La règle est simple :
              rien n'est écrit tant que tout n'est pas valide.
          - titre: L'astuce du jour
            texte: >-
              Validez au serveur, et considérez l'écran comme un confort. Cette phrase résume la sécurité
              des applications web : tout ce qui vient du navigateur est modifiable par celui qui l'envoie.

              La redirection après une création réussie est une autre habitude utile : elle évite qu'un
              rafraîchissement de page ne crée une seconde fois la même fiche.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est de se fier à la validation du navigateur. Les attributs du HTML sont une
              aide à la saisie, rien de plus ; une requête directe les ignore totalement.

              Le second piège est l'enregistrement partiel : créer le salarié, puis échouer sur l'absence
              associée, et laisser la base dans un état incohérent. Tant que vos écritures restent simples,
              la validation suffit ; dès qu'elles touchent deux tables, il faut une transaction, que Django
              fournit.
            tableaux:
              - titre: Qui protège quoi
                entetes: [Niveau, Rôle, Contournable]
                lignes:
                  - ["Navigateur", "confort de saisie", "oui, trivialement"]
                  - ["Formulaire du serveur", "refus des données fausses", "non"]
                  - ["Contraintes de la base", "dernier rempart d'intégrité", "non"]
          - titre: Challenge du jour
            texte: >-
              Livrez la page d'embauche avec son formulaire. Une saisie invalide revient avec ses erreurs
              et ne crée rien.

              Les tests livrés envoient un POST invalide et vérifient qu'aucun salarié n'a été créé, puis un
              POST valide et vérifient la redirection. Un test envoie une requête sans passer par la page
              et vérifie qu'elle est refusée de la même façon.

              Critères d'acceptation : aucune création sur saisie invalide ; les valeurs saisies sont
              conservées ; une redirection suit la création.
        livrable: >-
          Livrer le formulaire d'embauche ; un test prouve qu'un POST invalide ne crée rien.
      - num: "J32R"
        title: Rappel de la veille
        evaluations: quiz
        contenu: >-
          Cinq points de la journée 31, à revoir avant d'ouvrir la leçon du jour. Aucune notion nouvelle
          ici. Le quiz se retente jusqu'à dix fois ; si vous les épuisez, votre formateur rouvre la
          tentative.
        cours:
          - titre: Ce qu'il faut avoir retenu d'hier
            texte: >-
              Relisez ces cinq points, puis lancez le quiz. La validation au serveur est le premier
              principe de sécurité du web.
            tableaux:
              - titre: Les cinq points de la journée 31
                entetes: [Point, Ce que vous devez savoir refaire]
                lignes:
                  - [Formulaire de modèle, "Déclarer les champs à saisir depuis un modèle"]
                  - [Validation serveur, "Refuser au serveur, quoi qu'ait fait le navigateur"]
                  - [Erreurs affichées, "Rendre la page avec les erreurs et les valeurs saisies"]
                  - [Rien n'est écrit, "Ne créer qu'après validation complète"]
                  - [Redirection, "Rediriger après une création réussie"]
        quiz:
          - question: "La validation du navigateur protège-t-elle l'application ?"
            options: ["Non, elle est contournable", "Oui, totalement", "Oui, si elle est bien écrite", "Seulement en production"]
            bonnes: [1]
            explication: "Une requête envoyée directement ignore tous les attributs du HTML."
          - question: "Que fait la vue si le formulaire est invalide ?"
            options: ["Elle rend la page avec les erreurs et les valeurs saisies", "Elle crée quand même", "Elle redirige", "Elle lève une exception"]
            bonnes: [1]
            explication: "L'utilisateur ne doit pas retaper ce qu'il a déjà saisi."
          - question: "Pourquoi rediriger après une création ?"
            options: ["Pour qu'un rafraîchissement ne recrée pas la fiche", "Pour aller plus vite", "Parce que Django l'exige", "Pour vider le cache"]
            bonnes: [1]
            explication: "Sans redirection, le navigateur peut renvoyer le même POST."
          - question: "Qui est le dernier rempart d'intégrité ?"
            options: ["Les contraintes de la base", "Le navigateur", "Le gabarit", "Le formulaire seul"]
            bonnes: [1]
            explication: "C'est pourquoi les contraintes de la journée 27 comptent autant que les formulaires."
          - question: "Quand faut-il une transaction ?"
            options: ["Dès qu'une opération touche plusieurs tables", "À chaque lecture", "Jamais avec SQLite", "Seulement en production"]
            bonnes: [1]
            explication: "Sans elle, un échec à mi-parcours laisse la base dans un état incohérent."
      - num: "J32"
        title: "Authentification"
        evaluations: livrable
        contenu: >-
          Connexion, déconnexion, protection d'une page, utilisateur de démonstration, et la page sensible
          oubliée.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez exiger une connexion pour accéder aux pages de l'effectif, et vérifier
              par un test qu'un visiteur anonyme est bien redirigé.
          - titre: Le problème d'abord
            texte: >-
              Vos deux pages sont publiques. N'importe qui connaissant l'adresse lit les salaires de toute
              l'entreprise. Aucune démonstration ne peut être faite dans cet état.
          - titre: La notion
            texte: >-
              Django fournit un modèle d'utilisateur, des vues de connexion et de déconnexion, et un
              décorateur qui exige une session authentifiée sur une vue. Un visiteur non connecté est
              redirigé vers la page de connexion, puis ramené à la page demandée.

              Les mots de passe ne sont jamais stockés en clair : Django les transforme par une fonction à
              sens unique. Vous ne verrez jamais le mot de passe d'un utilisateur, et c'est voulu.

              Un utilisateur de démonstration est utile pendant le développement. Il se crée à la main, il
              porte un mot de passe que vous choisissez, et il ne doit jamais exister en production.
            code:
              - titre: Une page qui exige une session
                langage: python
                source: |
                  from django.contrib.auth.decorators import login_required
                  from django.shortcuts import render

                  from effectif.models import Salarie


                  @login_required
                  def liste_salaries(requete):
                      salaries = Salarie.objects.select_related("poste").order_by("nom")
                      return render(requete, "effectif/liste.html", {"salaries": salaries})
          - titre: À la main
            texte: >-
              Ajoutez les adresses de connexion et de déconnexion, protégez vos deux vues, puis ouvrez la
              liste dans une fenêtre de navigation privée : vous êtes redirigé vers la connexion.

              Connectez-vous avec un utilisateur créé pour l'occasion, et vérifiez que vous revenez bien sur
              la page demandée. Déconnectez-vous et constatez le retour à la redirection.

              Faites enfin l'inventaire : listez toutes vos adresses et vérifiez que chacune est soit
              volontairement publique, soit protégée. C'est cette liste qui fait la différence entre une
              application protégée et une application qui a l'air protégée.
          - titre: L'astuce du jour
            texte: >-
              Un utilisateur de démonstration, jamais en production. Les comptes de démonstration créés
              pendant un développement et oubliés sont une cause classique d'intrusion.

              Notez-les quelque part, et prévoyez leur suppression dans votre liste de contrôle de la
              journée 35.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la page sensible laissée ouverte. On protège la liste, on oublie la
              fiche ; on protège les deux, on oublie l'export. L'oubli ne se voit pas, puisque tout
              fonctionne.

              Le second piège est le mot de passe de démonstration écrit dans le dépôt, souvent dans un
              fichier de données initiales. Les tests du jour vérifient qu'aucun mot de passe en clair ne
              figure dans le code versionné.
            tableaux:
              - titre: L'inventaire des adresses
                entetes: [Adresse, Accès attendu]
                lignes:
                  - ["la liste de l'effectif", "connecté"]
                  - ["la fiche d'un salarié", "connecté"]
                  - ["la page d'embauche", "connecté"]
                  - ["la page de connexion", "public, par nécessité"]
          - titre: Challenge du jour
            texte: >-
              Protégez toutes les pages de l'effectif, ajoutez la connexion et la déconnexion.

              Les tests livrés appellent chaque page en anonyme et vérifient la redirection, puis les
              appellent connecté et vérifient le code 200. Un test parcourt la liste des adresses du projet
              et échoue si l'une d'elles n'est ni déclarée publique, ni protégée.

              Critères d'acceptation : aucune page sensible accessible en anonyme ; aucun mot de passe dans
              le dépôt ; la redirection ramène à la page demandée après connexion.
        livrable: >-
          Protéger les pages sensibles ; un test vérifie qu'un accès anonyme est redirigé.
