      - num: "J13"
        title: "Les erreurs : try, except et erreur métier"
        evaluations: livrable
        archive: depot-python-j13.zip
        contenu: >-
          Attraper une exception, définir une erreur métier propre à l'application, écrire un message qui
          dit quoi faire, et comprendre pourquoi un except nu est dangereux.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez transformer une panne technique en message compréhensible par le gérant,
              sans masquer les vraies erreurs de programmation.
          - titre: Le problème d'abord
            texte: >-
              Le fichier du gérant arrive parfois avec une colonne manquante, un salaire écrit « 250 000 »
              avec un espace, ou simplement un nom de fichier erroné. Aujourd'hui, votre programme s'arrête
              sur une trace illisible pour lui.

              Il faut distinguer deux familles : les données fausses, que l'utilisateur peut corriger, et
              les erreurs de programmation, que vous seul pouvez corriger.
          - titre: La notion
            texte: >-
              Le bloc try contient le code qui peut échouer ; le bloc except attrape une exception précise
              et décide quoi en faire. On attrape toujours un type d'exception nommé, jamais toutes les
              exceptions sans distinction.

              Une erreur métier est une classe que vous définissez, qui hérite de Exception. Elle porte un
              message destiné à l'utilisateur. L'écriture raise DonneeInvalide("...") from erreur conserve
              la cause technique tout en présentant une erreur propre.

              Le message doit dire quoi faire, pas seulement ce qui ne va pas. « Colonne salaire_fcfa
              absente du fichier effectif.csv » vaut mieux que « erreur de format ».
            figures:
              - nom: python-erreur-metier.svg
                legende: "Une panne technique devient une erreur métier à la frontière, et un message utile"
            code:
              - titre: Une erreur métier qui remplace une panne technique
                langage: python
                source: |
                  class DonneeInvalide(Exception):
                      """Le fichier fourni ne peut pas être exploité tel quel."""


                  def lire_salaire(ligne, numero):
                      try:
                          return int(ligne["salaire_fcfa"])
                      except KeyError as erreur:
                          raise DonneeInvalide(
                              "Colonne salaire_fcfa absente du fichier.") from erreur
                      except ValueError as erreur:
                          raise DonneeInvalide(
                              f"Salaire illisible ligne {numero} : {ligne['salaire_fcfa']!r}") from erreur
          - titre: À la main
            texte: >-
              Provoquez les trois pannes, une à une. Donnez un nom de fichier inexistant à votre chargement
              et lisez FileNotFoundError. Retirez une colonne de votre CSV et lisez KeyError. Remplacez un
              salaire par « 250 000 » avec un espace et lisez ValueError.

              Écrivez ensuite un except qui attrape chacune d'elles et lève votre DonneeInvalide avec un
              message utile. Relancez et comparez la trace obtenue à celle du début : la dernière ligne dit
              maintenant quoi corriger dans le fichier.

              Essayez enfin un except nu, sans type, autour de tout votre chargement, puis introduisez une
              faute de frappe dans un nom de variable. Votre programme signale un fichier invalide alors que
              le fichier est parfait : c'est exactement le danger.
          - titre: L'astuce du jour
            texte: >-
              Échouez tôt, et dites quoi faire. Une donnée fausse doit être refusée au moment où elle entre,
              avec un message qui nomme le fichier, la ligne et la correction attendue.

              Une erreur détectée tard coûte beaucoup plus cher : elle se manifeste trois couches plus loin,
              sous une forme méconnaissable, souvent dans un état déjà affiché au gérant.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est l'except nu, qui attrape tout, y compris vos propres fautes de frappe, et
              les transforme en message rassurant. Un programme qui ne plante jamais n'est pas un programme
              robuste, c'est un programme qui ment.

              Deuxième piège : attraper une exception et ne rien en faire. Un except qui se contente de
              passer efface l'information sans rien régler ; la donnée fausse poursuit son chemin dans les
              calculs.
            tableaux:
              - titre: Qui corrige quoi
                entetes: [Situation, Famille, Traitement]
                lignes:
                  - ["Fichier absent", "donnée fausse", "DonneeInvalide avec le chemin cherché"]
                  - ["Colonne manquante", "donnée fausse", "DonneeInvalide avec le nom de la colonne"]
                  - ["Salaire illisible", "donnée fausse", "DonneeInvalide avec la ligne fautive"]
                  - ["Nom de variable mal tapé", "erreur de programmation", "laisser remonter la trace"]
          - titre: Challenge du jour
            texte: >-
              Faites lever DonneeInvalide par votre chargement dans les trois cas : fichier absent, colonne
              manquante, salaire illisible. Le message nomme le fichier et, le cas échéant, la colonne ou la
              ligne fautive.

              Les tests livrés vérifient le type de l'erreur levée et la présence des informations utiles
              dans le message. Un test vérifie qu'une faute de programmation volontairement introduite
              continue de remonter telle quelle, au lieu d'être déguisée en DonneeInvalide.

              Critères d'acceptation : aucun except nu dans le projet ; chaque except nomme son type ;
              chaque message dit quoi corriger.
        livrable: >-
          Lever DonneeInvalide au chargement ; les tests couvrent le fichier absent, la colonne manquante
          et un salaire illisible.
