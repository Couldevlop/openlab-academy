      - num: "J25"
        title: "Cache, mise en forme et démonstration"
        evaluations: livrable
        archive: depot-python-j25.zip
        contenu: >-
          Le cache des données, la mise en forme de l'écran, et le scénario de démonstration que vous
          jouerez en deux minutes.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez rendre votre écran réactif, le présenter proprement, et le montrer à
              quelqu'un en suivant un scénario écrit.
          - titre: Le problème d'abord
            texte: >-
              Votre écran recharge le fichier à chaque clic, comme vous l'avez constaté en journée 21. Et
              vous allez devoir le montrer : à un collègue, à un recruteur, au gérant. Une démonstration
              improvisée rate une fois sur deux.
          - titre: La notion
            texte: >-
              Le décorateur de cache de données mémorise le résultat d'une fonction pour des arguments
              donnés. Appliqué au chargement de l'effectif, il évite de relire le fichier à chaque
              exécution du script.

              Le cache a une contrepartie : tant qu'il n'est pas vidé, la donnée affichée est celle du
              premier chargement. Après une embauche, il faut donc le vider explicitement, sinon le gérant
              ne voit pas sa propre saisie apparaître.

              La mise en forme se fait avec des colonnes, des onglets et des en-têtes. Trois chiffres en
              haut, les filtres à gauche, le tableau et les graphiques au centre : la disposition suit
              l'ordre des questions, pas l'ordre dans lequel vous avez codé.
            code:
              - titre: Un chargement mis en cache, et vidé quand il le faut
                langage: python
                source: |
                  import streamlit as st

                  from rh.fichiers import charger_effectif


                  @st.cache_data
                  def effectif_du_fichier(chemin):
                      """Relit le fichier seulement si le chemin change ou si le cache est vidé."""
                      return charger_effectif(chemin)


                  def apres_embauche():
                      effectif_du_fichier.clear()   # sans cela, la nouvelle fiche reste invisible
          - titre: À la main
            texte: >-
              Ajoutez le cache à votre chargement, puis cliquez plusieurs fois sur un widget : la page
              répond plus vite. Ajoutez un affichage de l'heure dans la fonction mise en cache pour
              constater qu'elle n'est plus rappelée.

              Enregistrez ensuite une embauche sans vider le cache : la nouvelle fiche n'apparaît pas.
              Ajoutez l'appel qui vide le cache après une création, et recommencez.

              Terminez par la mise en forme : trois colonnes pour les chiffres clés, une barre latérale
              pour les filtres, et un titre qui dit de quoi parle la page.
          - titre: L'astuce du jour
            texte: >-
              Écrivez votre démonstration, et chronométrez-la. Deux minutes, cinq étapes, dans un ordre
              fixe : la page d'accueil, un filtre, une embauche refusée, une embauche acceptée, un
              graphique.

              Un scénario écrit vous évite de chercher vos mots et de cliquer au hasard. Il tient dans un
              fichier demo.md à la racine du dépôt, et il servira encore à la journée 35.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le cache qui garde des données périmées. Le symptôme est toujours le
              même : une modification enregistrée n'apparaît pas, et vous cherchez l'erreur dans le code
              d'écriture alors que le problème est à la lecture.

              Le second piège est la démonstration sans jeu de données préparé. Montrer une application
              vide ne prouve rien ; préparez un fichier d'effectif crédible, entièrement fictif, avec une
              dizaine de personnes réparties sur trois postes.
            tableaux:
