      - num: "J07"
        title: "Les dictionnaires : une fiche salarié"
        evaluations: livrable
        archive: depot-python-j07.zip
        contenu: >-
          Clés et valeurs, lecture sûre avec get, parcours d'un dictionnaire, et le choix de clés stables
          qui survivront aux sept semaines du parcours.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez représenter un salarié par une fiche complète, et lire n'importe lequel
              de ses champs sans faire planter le programme quand il manque.
          - titre: Le problème d'abord
            texte: >-
              Une liste de noms ne suffit plus. Chaque salarié porte un nom, un poste, une date d'embauche
              et un salaire. Avec des listes parallèles, une par information, la moindre insertion décale
              tout et mélange les salaires.

              Il faut une structure qui attache une valeur à un nom de champ, à l'intérieur d'une même
              fiche.
          - titre: La notion
            texte: >-
              Un dictionnaire associe des clés à des valeurs. Il s'écrit entre accolades, chaque paire
              séparée par deux points. La lecture par crochets lève KeyError si la clé n'existe pas ; la
              méthode get rend None, ou la valeur par défaut que vous indiquez en second argument.

              L'écriture crée la clé si elle n'existe pas encore. La méthode items parcourt les paires, keys
              les clés, values les valeurs. Le mot in teste la présence d'une clé.

              Les clés sont des chaînes dans tout ce parcours. Choisissez-les en minuscules, sans accent et
              sans espace : elles traverseront un fichier CSV, une API JSON et une base de données, où les
              accents et les majuscules posent des problèmes différents à chaque étape.
            code:
              - titre: Une fiche salarié et sa lecture sûre
                langage: python
                source: |
                  fiche = {
                      "nom": "Awa Kone",
                      "poste": "Assistante RH",
                      "date_embauche": "2024-03-01",
                      "salaire_fcfa": 250000,
                  }

                  print(fiche["poste"])                  # Assistante RH
                  print(fiche.get("telephone", "inconnu"))  # inconnu, sans erreur

                  for cle, valeur in fiche.items():
                      print(cle, ":", valeur)
          - titre: À la main
            texte: >-
              Dans l'interpréteur, créez la fiche ci-dessus. Demandez fiche["telephone"] : Python répond
              KeyError. Demandez maintenant fiche.get("telephone") : Python répond None, sans erreur.
              Demandez enfin fiche.get("telephone", "inconnu").

              Ces trois comportements sont trois décisions différentes. La première dit « ce champ est
              obligatoire, s'il manque le programme doit s'arrêter ». La troisième dit « ce champ est
              facultatif, voici quoi mettre à la place ». Choisir entre les deux est un acte de conception,
              pas un détail.

              Ajoutez ensuite fiche["poste"] = "Responsable RH" et affichez la fiche : l'écriture remplace
              la valeur existante.
          - titre: L'astuce du jour
            texte: >-
              Fixez vos clés une fois pour toutes, en minuscules et sans accent, et notez-les quelque part.
              Dans ce parcours, ce sont nom, poste, date_embauche et salaire_fcfa, et elles ne changeront
              plus jusqu'à la journée 35.

              Un nom de clé qui change en cours de route coûte très cher : il faut le corriger dans le
              calcul, dans le fichier CSV, dans l'API, dans l'écran et dans la base. Décider tôt et s'y
              tenir est un réflexe de professionnel.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le KeyError sur une clé absente, et plus encore sa variante sournoise :
              une clé mal orthographiée. Écrire fiche["salaire"] au lieu de fiche["salaire_fcfa"] produit la
              même erreur qu'une clé réellement absente.

              Ne corrigez pas ce genre d'erreur en remplaçant partout les crochets par get : vous
              transformeriez un plantage visible en valeur None qui se propage silencieusement dans vos
              calculs, jusqu'à produire une masse salariale fausse. Utilisez les crochets pour les champs
              obligatoires, et get avec une valeur par défaut explicite pour les champs facultatifs.
            tableaux:
              - titre: Lire un champ, selon ce qu'il représente
                entetes: [Écriture, Si la clé manque, Quand l'employer]
                lignes:
                  - ['fiche["salaire_fcfa"]', "KeyError, le programme s'arrête", "champ obligatoire"]
                  - ['fiche.get("telephone")', "None", "champ facultatif, absence acceptable"]
                  - ['fiche.get("prime", 0)', "0", "champ facultatif avec une valeur neutre"]
                  - ['"prime" in fiche', "False", "savoir si le champ est présent"]
          - titre: Challenge du jour
            texte: >-
              Écrivez salarie(nom, poste, date_embauche, salaire_fcfa), qui rend un dictionnaire avec
              exactement ces quatre clés, et lire_champ(salarie, champ, defaut), qui rend la valeur du champ
              ou la valeur par défaut si le champ est absent.

              Les tests livrés vérifient les quatre clés, la lecture d'un champ absent, et le fait que
              lire_champ ne modifie jamais la fiche reçue.

              Critères d'acceptation : les clés sont exactement nom, poste, date_embauche et salaire_fcfa ;
              aucune fonction n'affiche ; lire_champ ne lève jamais KeyError.
        livrable: >-
          Écrire salarie(nom, poste, date_embauche, salaire_fcfa) et lire_champ(salarie, champ, defaut) ;
          les tests couvrent une clé absente.
