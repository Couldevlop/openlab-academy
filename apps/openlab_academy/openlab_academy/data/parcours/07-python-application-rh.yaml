      - num: "J14"
        title: "Se tester avec pytest"
        evaluations: livrable
        archive: depot-python-j14.zip
        contenu: >-
          Installer et lancer pytest, nommer un test par une phrase, choisir les cas limites, et travailler
          en rouge puis vert.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez écrire vos propres tests, au lieu de seulement lancer ceux qu'on vous
              livre, et choisir les trois cas qui comptent plutôt que dix cas identiques.
          - titre: Le problème d'abord
            texte: >-
              Depuis treize journées, les tests arrivent avec le dépôt du jour. Vous savez les lancer, pas
              les écrire. Or la règle des congés de la journée 03 va changer : l'entreprise ajoute une
              condition. Comment savoir que votre modification ne casse pas ce qui marchait ?
          - titre: La notion
            texte: >-
              pytest découvre les fichiers dont le nom commence par test_, les fonctions dont le nom
              commence par test_, et exécute chacune. Une assertion s'écrit avec le mot assert suivi d'une
              expression qui doit être vraie.

              Le nom d'un test est une phrase qui dit ce qu'il prouve : test_le_droit_s_ouvre_a_douze_mois
              vaut mieux que test_conges_2. Quand un test échoue, son nom apparaît seul dans le compte
              rendu ; il doit suffire à comprendre.

              La méthode de travail est rouge puis vert : écrire d'abord le test qui échoue, vérifier qu'il
              échoue pour la bonne raison, puis écrire le code qui le fait passer. Un test qui n'a jamais
              échoué ne prouve rien, car rien ne dit qu'il vérifie quelque chose.

              Pour vérifier qu'une erreur est bien levée, pytest fournit pytest.raises, employé dans un
              bloc with.
            code:
              - titre: Trois tests qui disent ce qu'ils prouvent
                langage: python
                source: |
                  import pytest

                  from rh.calculs import droit_aux_conges


                  def test_le_droit_est_ferme_avant_douze_mois():
                      assert droit_aux_conges(11) is False


                  def test_le_droit_s_ouvre_a_douze_mois_exactement():
                      assert droit_aux_conges(12) is True


                  def test_une_anciennete_negative_est_refusee():
                      with pytest.raises(ValueError):
                          droit_aux_conges(-1)
          - titre: À la main
            texte: >-
              Installez pytest avec la commande d'installation de paquets de votre système, puis créez un
              dossier tests avec un fichier test_conges.py contenant les trois tests ci-dessus. Lancez
              pytest depuis la racine du projet.

              Modifiez volontairement votre règle, en remplaçant le supérieur ou égal par un supérieur
              strict. Relancez : un seul test échoue, celui des douze mois exactement, et son nom vous dit
              immédiatement ce qui ne va plus. Remettez la règle correcte.

              Faites l'expérience inverse : écrivez un test sans aucune assertion. pytest l'affiche en
              vert. Un test sans assertion ne prouve rien et donne une fausse confiance.
          - titre: L'astuce du jour
            texte: >-
              Un test, une phrase. Le nom du test est la spécification exécutable de votre règle métier : il
              se relit comme une phrase du cahier des charges, et c'est lui qu'on lit en premier quand la
              suite devient rouge.

              Trois tests bien choisis valent mieux que vingt tests qui vérifient la même chose. Pour une
              règle à seuil, les trois bons sont : juste avant, exactement sur la borne, juste après.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le test qui teste l'implémentation au lieu du comportement. Vérifier
              qu'une fonction utilise une boucle, ou compter le nombre de lignes, revient à interdire toute
              amélioration future sans casser la suite.

              Le second piège est le test sans assertion, que vous venez de voir : il passe toujours, et il
              rassure à tort. Relisez vos tests et comptez les assert ; aucun test ne doit en être dépourvu.
            tableaux:
              - titre: Choisir les cas d'un test
                entetes: [Famille de cas, Exemple sur les congés]
                lignes:
                  - ["Juste avant la borne", "11 mois, droit fermé"]
                  - ["Sur la borne", "12 mois, droit ouvert"]
                  - ["Juste après", "13 mois, droit ouvert"]
                  - ["Donnée fausse", "ancienneté négative, erreur levée"]
          - titre: Challenge du jour
            texte: >-
              Le dépôt du jour contient une implémentation volontairement fautive de la règle des congés, et
              un fichier de tests où trois tests manquent. Écrivez-les.

              Le harnais vérifie deux choses : vos trois tests échouent sur l'implémentation fautive, et ils
              passent sur l'implémentation correcte fournie à part. Un test qui passe dans les deux cas ne
              prouve rien et fait échouer le challenge.

              Critères d'acceptation : trois tests nommés par une phrase ; chacun contient au moins une
              assertion ; les trois cas couverts sont la borne, la valeur juste avant et une donnée fausse.
        livrable: >-
          Écrire vous-même les trois tests manquants sur les congés ; le harnais vérifie qu'ils échouent
          sur une implémentation fautive fournie.
