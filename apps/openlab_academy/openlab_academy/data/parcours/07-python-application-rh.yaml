      - num: "J10"
        title: "Les chaînes : normaliser et aligner"
        evaluations: livrable
        archive: depot-python-j10.zip
        contenu: >-
          Nettoyer une chaîne à l'entrée, découper, joindre, et aligner des colonnes pour produire un état
          lisible dans un terminal.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez produire l'état « effectif par poste » aligné en colonnes, que le gérant
              peut imprimer tel quel.
          - titre: Le problème d'abord
            texte: >-
              Les noms saisis à la main contiennent des espaces en trop, des majuscules fantaisistes et
              parfois un espace double. Deux fiches pour la même personne apparaissent alors comme deux
              salariés différents, et l'état par poste compte deux têtes au lieu d'une.
          - titre: La notion
            texte: >-
              La méthode strip retire les espaces en début et en fin de chaîne. La méthode lower met en
              minuscules, title met une majuscule à chaque mot. La méthode split découpe une chaîne en
              liste, la méthode join recolle une liste en chaîne avec un séparateur.

              L'alignement se fait avec une f-string et un format de largeur : un nombre après deux points
              réserve une largeur, un signe inférieur aligne à gauche, un signe supérieur aligne à droite.
              Les nombres s'alignent à droite, les textes à gauche.

              Une chaîne est immuable : aucune de ces méthodes ne modifie la chaîne d'origine, toutes en
              rendent une nouvelle. C'est la même logique que sorted par rapport à sort.
            code:
              - titre: Normaliser un nom, puis aligner une colonne
                langage: python
                source: |
                  brut = "   awa   kone  "
                  propre = " ".join(brut.split()).title()
                  print(propre)        # Awa Kone

                  lignes = [("RH", 2, 670000), ("Atelier", 1, 180000)]
                  for poste, effectif, masse in lignes:
                      print(f"{poste:<12}{effectif:>4}{masse:>12}")
          - titre: À la main
            texte: >-
              Dans l'interpréteur, comparez "  Awa  ".strip() et "  Awa  ". Puis comparez "AWA" == "awa" et
              "AWA".lower() == "awa".

              Essayez ensuite " ".join("   awa   kone  ".split()) : le découpage sans argument sépare sur
              les blancs et ignore les répétitions, le recollage remet un espace simple. C'est la façon la
              plus sûre de nettoyer les espaces d'un nom saisi à la main.

              Terminez en affichant deux lignes alignées avec la f-string ci-dessus, en changeant la largeur
              réservée pour observer l'effet.
          - titre: L'astuce du jour
            texte: >-
              Normalisez à l'entrée, une fois. Le nom est nettoyé au moment où il entre dans le programme,
              et plus jamais ensuite. Tous les calculs, comparaisons et regroupements travaillent alors sur
              des données propres.

              Normaliser au moment de comparer, au contraire, oblige à y penser à chaque comparaison, et
              vous oublierez un jour. C'est la même idée que la conversion des dates en journée 09 : les
              frontières nettoient, le cœur fait confiance.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est invisible à l'écran : un espace en fin de nom, un double espace au
              milieu, une majuscule différente. Les deux chaînes paraissent identiques et ne le sont pas.

              Quand une comparaison de textes échoue alors que tout semble correct, affichez la chaîne entre
              deux marques, par exemple entre crochets, ou demandez sa longueur. Les espaces invisibles
              deviennent alors visibles.
            tableaux:
              - titre: Nettoyer un texte saisi à la main
                entetes: [Problème, Écriture, Résultat]
                lignes:
                  - ["Espaces aux extrémités", 'nom.strip()', '"Awa"']
                  - ["Espaces multiples au milieu", '" ".join(nom.split())', '"Awa Kone"']
                  - ["Casse incohérente", 'nom.title()', '"Awa Kone"']
                  - ["Comparaison insensible à la casse", 'a.lower() == b.lower()', "True ou False"]
          - titre: Challenge du jour
            texte: >-
              Écrivez etat_par_poste(effectif), qui rend une chaîne de plusieurs lignes : une ligne
              d'en-tête, puis une ligne par poste avec le nombre de salariés et la masse salariale, le tout
              aligné en colonnes, montants en francs CFA.

              La fonction rend la chaîne, elle ne l'affiche pas. Les tests livrés comparent la chaîne
              exacte, espaces compris : c'est volontaire, l'alignement fait partie du résultat.

              Critères d'acceptation : les postes apparaissent dans l'ordre alphabétique ; les noms sont
              normalisés avant regroupement ; la fonction rend une chaîne et n'affiche rien.
        livrable: >-
          Écrire etat_par_poste(effectif) qui rend l'état aligné sous forme de chaîne ; le test compare la
          chaîne exacte.
