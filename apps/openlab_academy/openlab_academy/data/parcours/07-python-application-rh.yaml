      - num: "J11"
        title: "Modules et paquets : ranger le code"
        evaluations: livrable
        archive: depot-python-j11.zip
        contenu: >-
          L'import, la différence entre un module et un paquet, la garde du script principal, et la règle
          d'un module pour un sujet.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez organiser votre application en trois fichiers qui s'importent
              proprement, au lieu d'un seul fichier qui grossit.
          - titre: Le problème d'abord
            texte: >-
              Votre fichier de calculs contient maintenant les fonctions de cinq journées, et l'état par
              poste s'y est glissé. Dans trois semaines, l'API et l'écran voudront appeler les calculs sans
              rien savoir de l'affichage.

              Il faut séparer ce qui calcule de ce qui met en forme, et de ce qui lance le programme.
          - titre: La notion
            texte: >-
              Un module est un fichier Python. Un paquet est un dossier qui contient des modules. L'import
              rend disponible le contenu d'un module dans un autre : import rh.calculs donne accès aux
              fonctions par leur chemin complet, from rh.calculs import masse_salariale donne accès à une
              fonction par son nom seul.

              Le code écrit directement dans un module s'exécute au moment de l'import. C'est pourquoi le
              point d'entrée d'un programme se protège par la garde if __name__ == "__main__" : le bloc
              qu'elle contient ne s'exécute que si le fichier est lancé, pas s'il est importé.

              Un import circulaire se produit quand deux modules s'importent mutuellement : Python échoue
              avec une ImportError. C'est le signe qu'une responsabilité est mal placée, jamais une
              fatalité technique.
            figures:
              - nom: python-modules-arborescence.svg
                legende: "Trois fichiers, trois responsabilités, et le sens unique des imports"
            code:
              - titre: Un point d'entrée qui n'empêche pas l'import
                langage: python
                source: |
                  from rh.calculs import masse_salariale
                  from rh.etats import etat_par_poste


                  def main():
                      effectif = [{"nom": "Awa", "poste": "RH", "salaire_fcfa": 250000}]
                      print(etat_par_poste(effectif))
                      print(masse_salariale([f["salaire_fcfa"] for f in effectif]))


                  if __name__ == "__main__":
                      main()
          - titre: À la main
            texte: >-
              Créez le dossier rh s'il n'existe pas, avec calculs.py et etats.py à l'intérieur, et main.py à
              côté du dossier. Déplacez etat_par_poste dans etats.py, laissez les calculs dans calculs.py.

              Ajoutez temporairement un print en haut de calculs.py, hors de toute fonction, puis lancez
              main.py : le message s'affiche alors que vous n'avez rien appelé. C'est la preuve que le code
              d'un module s'exécute à l'import. Retirez ce print.

              Vérifiez enfin que etats.py peut importer calculs.py, mais que calculs.py n'importe jamais
              etats.py : les imports vont dans un seul sens, du plus habillé vers le plus central.
          - titre: L'astuce du jour
            texte: >-
              Un module, un sujet. Si vous hésitez sur le fichier où ranger une fonction, c'est souvent que
              le fichier manque, ou que la fonction fait deux choses.

              Le sens des imports est la vraie information d'architecture : les calculs n'importent rien de
              l'application ; les états importent les calculs ; le point d'entrée importe les deux. Cette
              direction unique est exactement ce qui permettra, en journée 17, de brancher FastAPI sans
              toucher au cœur.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le code exécuté à l'import. Un script qui lit un fichier ou affiche un
              état au niveau du module se déclenche dès qu'on l'importe, souvent au pire moment, par exemple
              pendant les tests.

              Le second piège est l'import circulaire. Quand il apparaît, résistez à la tentation de
              déplacer l'import à l'intérieur d'une fonction pour faire taire l'erreur : déplacez plutôt la
              fonction concernée dans le module qui la concerne vraiment.
            tableaux:
              - titre: Qui importe qui
                entetes: [Module, Importe, N'importe jamais]
                lignes:
                  - ["rh/calculs.py", "rien du projet", "rh/etats.py, main.py"]
                  - ["rh/etats.py", "rh/calculs.py", "main.py"]
                  - ["main.py", "rh/calculs.py et rh/etats.py", "rien de plus"]
          - titre: Challenge du jour
            texte: >-
              Rangez votre code en trois fichiers : rh/calculs.py pour les calculs, rh/etats.py pour la mise
              en forme, main.py pour le point d'entrée protégé par la garde.

              Les tests livrés importent chaque module isolément et vérifient qu'aucun n'affiche quoi que ce
              soit à l'import. Un test vérifie que rh/calculs.py n'importe aucun autre module du projet.

              Critères d'acceptation : les trois fichiers existent aux emplacements exacts ; l'import d'un
              module n'affiche rien ; main.py s'exécute et affiche l'état.
        livrable: >-
          Ranger le code en rh/calculs.py, rh/etats.py et main.py ; les tests importent chaque module
          isolément.
