      - num: "J22"
        title: "Tableaux et filtres"
        evaluations: livrable
        archive: depot-python-j22.zip
        contenu: >-
          Afficher un tableau, filtrer par poste et par ancienneté, et garder le filtre dans une fonction
          testable plutôt que dans l'affichage.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez offrir au gérant deux filtres combinables sur l'effectif, et prouver par
              un test qu'ils filtrent juste.
          - titre: Le problème d'abord
            texte: >-
              Le gérant veut voir « les gens de l'atelier qui ont plus de deux ans de maison ». Deux
              critères, combinables, et un tableau qui se met à jour. Écrire cela directement dans
              l'affichage paraît naturel et vous priverait de tout test.
          - titre: La notion
            texte: >-
              La fonction d'affichage de tableau reçoit une liste de dictionnaires et produit un tableau
              triable. Les widgets de choix et de curseur rendent les valeurs choisies par l'utilisateur.

              Le filtrage, lui, appartient au cœur : une fonction qui reçoit l'effectif et les critères, et
              rend une nouvelle liste. L'écran se contente de lire les widgets, d'appeler cette fonction, et
              d'afficher le résultat.

              Un filtre doit accepter l'absence de critère, car l'utilisateur commence toujours sans rien
              choisir. La convention de ce parcours : une valeur vide ou nulle signifie « ne filtre pas sur
              ce critère ».
            code:
              - titre: Un filtre testable, un écran sans règle
                langage: python
                source: |
                  def effectif_filtre(effectif, poste=None, anciennete_min=0):
                      """Rend les fiches qui satisfont les deux critères ; un critère absent n'exclut rien."""
                      resultat = []
                      for fiche in effectif:
                          if poste and fiche["poste"] != poste:
                              continue
                          if fiche["anciennete_mois"] < anciennete_min:
                              continue
                          resultat.append(fiche)
                      return resultat
          - titre: À la main
            texte: >-
              Ajoutez à votre écran une liste déroulante des postes et un curseur d'ancienneté minimale.
              Passez les deux valeurs à effectif_filtre et affichez le résultat dans un tableau.

              Essayez les quatre combinaisons : aucun critère, un seul, l'autre seul, les deux. Vérifiez que
              le cas sans critère affiche tout l'effectif : c'est l'état initial, celui que verra le gérant
              en ouvrant la page.

              Choisissez enfin des critères qui ne correspondent à personne. Le tableau est vide : ajoutez
              un message qui le dit en toutes lettres, car un tableau vide sans explication ressemble à une
              panne.
          - titre: L'astuce du jour
            texte: >-
              Filtrez dans une fonction, affichez le résultat. Une règle de filtrage est une règle métier
              comme une autre : elle mérite un nom, un test, et sa place dans le paquet rh.

              Autre bénéfice immédiat, qui se verra en semaine 6 : la même fonction servira à l'API, à
              l'écran et à Django. Un filtre écrit dans la page serait à réécrire trois fois.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le filtre appliqué à l'affichage seulement : masquer des lignes du
              tableau sans filtrer les données. Les totaux affichés plus haut continuent alors de compter
              tout le monde, et l'écran se contredit lui-même.

              Deuxième piège, plus discret : un critère absent traité comme une valeur. Un poste vide
              comparé avec l'égalité ne correspond à personne, et l'écran s'ouvre sur un tableau vide que
              le gérant prendra pour une panne.
            tableaux:
              - titre: Quatre combinaisons à vérifier
                entetes: [Poste, Ancienneté minimale, Attendu]
                lignes:
                  - ["aucun", "0", "tout l'effectif"]
                  - ["Atelier", "0", "les fiches de l'atelier"]
                  - ["aucun", "24", "les fiches de deux ans et plus"]
                  - ["Atelier", "24", "l'intersection des deux critères"]
          - titre: Challenge du jour
            texte: >-
              Écrivez effectif_filtre(effectif, poste, anciennete_min) dans le paquet rh, et branchez-la sur
              deux widgets.

              Les tests livrés couvrent les quatre combinaisons du tableau, le résultat vide, et vérifient
              que l'effectif d'origine n'est pas modifié. Un test vérifie que les totaux affichés
              correspondent à l'effectif filtré, et non à l'effectif complet.

              Critères d'acceptation : un critère absent n'exclut personne ; le tableau vide affiche un
              message ; aucun filtrage écrit dans le fichier d'écran.
        livrable: >-
          Écrire effectif_filtre(effectif, poste, anciennete_min) ; les tests couvrent les filtres cumulés
          et le résultat vide.
