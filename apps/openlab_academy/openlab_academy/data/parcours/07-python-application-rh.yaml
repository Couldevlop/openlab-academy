      - num: "J04"
        title: "Répéter : for, range et while"
        evaluations: livrable
        contenu: >-
          Parcourir une séquence avec for, compter avec range, répéter tant qu'une condition tient avec
          while, et accumuler un total sans afficher à chaque tour.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez parcourir une liste de salaires, en calculer le total et en trouver le
              plus élevé, sans recopier la même ligne dix fois.
          - titre: Le problème d'abord
            texte: >-
              Le gérant veut la masse salariale du mois : la somme de tous les salaires versés. L'entreprise
              compte douze personnes aujourd'hui, et trente l'an prochain. Recopier douze additions n'est
              pas une solution, ni trente.

              Il vous faut une instruction qui répète un traitement pour chaque élément d'une collection,
              quel que soit le nombre d'éléments.
          - titre: La notion
            texte: >-
              La boucle for parcourt les éléments d'une séquence, un par un. À chaque tour, la variable de
              boucle prend la valeur de l'élément courant. Une liste s'écrit entre crochets, ses éléments
              séparés par des virgules ; vous l'étudierez en détail en journée 06, aujourd'hui vous la
              parcourez.

              La fonction range produit une suite de nombres : range(5) donne 0, 1, 2, 3 et 4, soit cinq
              valeurs qui commencent à zéro et s'arrêtent avant la borne. C'est l'outil du « répéter n fois ».

              La boucle while répète tant qu'une condition reste vraie. Elle sert quand le nombre de tours
              n'est pas connu d'avance. Elle exige que quelque chose change à l'intérieur de la boucle,
              sinon elle tourne indéfiniment.

              Accumuler, c'est préparer une variable à zéro avant la boucle, puis l'augmenter à chaque tour.
              L'écriture total += salaire est un raccourci pour total = total + salaire.
            code:
              - titre: Accumuler un total, puis afficher une seule fois
                langage: python
                source: |
                  salaires = [250000, 180000, 420000]

                  total = 0
                  for salaire in salaires:
                      total += salaire

                  print(total)   # 850000, affiché une fois, après la boucle
          - titre: À la main
            texte: >-
              Tapez la boucle ci-dessus dans un fichier, exécutez-la, puis déplacez le print à l'intérieur
              de la boucle, en l'indentant au même niveau que l'addition. Exécutez de nouveau : vous voyez
              trois lignes au lieu d'une, parce que l'affichage a lieu à chaque tour.

              C'est la démonstration la plus parlante de ce que signifie l'indentation en Python : la place
              d'une ligne décide du moment où elle s'exécute. Remettez le print après la boucle avant de
              continuer.

              Essayez ensuite une boucle qui compte : for i in range(3), avec un print de i à l'intérieur.
              Observez que la suite commence à 0 et s'arrête à 2.
          - titre: L'astuce du jour
            texte: >-
              Accumulez dans la boucle, affichez après. Un programme qui affiche à chaque tour produit un
              écran illisible dès que les données grossissent, et surtout il ne sépare pas le calcul du
              résultat.

              Cette discipline prépare la journée 05 : une fonction qui calcule rend une valeur, elle
              n'affiche rien. Prenez l'habitude dès aujourd'hui.
          - titre: Le piège du jour
            texte: >-
              Deux pièges guettent aujourd'hui. Le premier est la boucle while qui ne s'arrête pas, parce
              que la condition ne change jamais à l'intérieur. Si votre programme semble figé, c'est
              probablement cela : arrêtez-le avec Ctrl+C dans le terminal.

              Le second est l'erreur d'un rang, en anglais off-by-one. range(3) produit trois valeurs qui
              s'arrêtent à 2, pas à 3. Compter de 1 à 12 s'écrit range(1, 13). Chaque fois que vous écrivez
              un range, relisez-le en vous demandant ce que vaut la dernière valeur produite.
            tableaux:
              - titre: Ce que produit range
                entetes: [Écriture, Valeurs produites, Nombre de tours]
                lignes:
                  - ["range(3)", "0, 1, 2", "3"]
                  - ["range(1, 4)", "1, 2, 3", "3"]
                  - ["range(1, 13)", "1 à 12", "12"]
                  - ["range(0)", "aucune", "0"]
          - titre: Challenge du jour
            texte: >-
              Écrivez masse_salariale(salaires) qui rend la somme d'une liste de salaires, et
              plus_haut_salaire(salaires) qui rend le plus élevé. Les deux rendent un nombre entier et
              n'affichent rien.

              Les tests livrés couvrent la liste vide, une liste d'un seul élément et une liste où deux
              salaires sont ex aequo. Sur une liste vide, masse_salariale rend 0 ; plus_haut_salaire doit
              lever une erreur, parce qu'un plus haut salaire n'existe pas dans un effectif vide, et rendre
              0 serait un mensonge.

              Critères d'acceptation : aucune fonction prédéfinie de somme ou de maximum, le but du jour
              étant d'écrire la boucle ; les trois cas limites passent.
        livrable: >-
          Écrire masse_salariale(salaires) et plus_haut_salaire(salaires) ; les tests couvrent la liste
          vide, un seul élément et deux salaires ex aequo.
