            bonnes: [1]
            explication: "Le but est la clarté : une compréhension trop chargée se relit mal et se corrige mal."
          - question: "Que rend [f['nom'] for f in effectif if f['salaire_fcfa'] >= 250000] ?"
            options: ["La liste des noms dont le salaire atteint 250000", "La liste des fiches", "Le nombre de salariés", "Un dictionnaire"]
            bonnes: [1]
