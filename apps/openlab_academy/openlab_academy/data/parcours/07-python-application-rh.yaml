      - num: "J21"
        title: "Premier écran Streamlit"
        evaluations: livrable
        archive: depot-python-j21.zip
        contenu: >-
          Un script qui s'exécute de haut en bas à chaque interaction, des widgets, et la règle qui gouverne
          la semaine : l'écran appelle le cœur et ne calcule pas.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez afficher dans un navigateur les trois chiffres que le gérant regarde
              chaque matin, sans écrire une ligne de HTML.
          - titre: Le problème d'abord
            texte: >-
              Votre API répond en JSON. C'est parfait pour un programme, illisible pour le gérant. Il veut
              trois chiffres, un tableau, et deux filtres, sans apprendre à lire du JSON ni à appeler une
              adresse.
          - titre: La notion
            texte: >-
              Streamlit transforme un script Python en page web. Il n'y a ni gabarit, ni route : vous
              écrivez des appels de fonctions qui affichent, et la page se construit dans l'ordre du script.

              Le modèle d'exécution est particulier et explique tout le reste : à chaque interaction, le
              script entier est réexécuté de haut en bas. Un bouton cliqué ne déclenche pas une fonction,
              il relance la page.

              Les widgets rendent une valeur : une case cochée rend un booléen, une liste déroulante rend
              l'élément choisi. Vous employez cette valeur comme n'importe quelle variable, plus bas dans le
              script.
            figures:
              - nom: python-streamlit-execution.svg
                legende: "À chaque clic, le script est rejoué de haut en bas : c'est le modèle de Streamlit"
            code:
              - titre: Un écran qui n'a aucune règle métier
                langage: python
                source: |
                  import streamlit as st

                  from rh.calculs import masse_salariale
                  from rh.fichiers import charger_effectif

                  effectif = charger_effectif("effectif.csv")

                  st.title("Tableau de bord RH")
                  st.metric("Effectif", len(effectif))
                  st.metric("Masse salariale",
                            f"{masse_salariale([f['salaire_fcfa'] for f in effectif]):,}".replace(",", " "))
                  st.dataframe(effectif)
          - titre: À la main
            texte: >-
              Installez streamlit, écrivez le fichier ci-dessus sous le nom ecran.py, puis lancez-le avec la
              commande streamlit run suivie du nom du fichier. Votre navigateur s'ouvre.

              Ajoutez temporairement un affichage de la date et de l'heure au début du script, puis cliquez
              sur n'importe quel widget : l'heure change. C'est la preuve que tout le script est rejoué.

              Vérifiez enfin que votre fichier d'écran ne contient aucun calcul : pas de boucle de somme,
              pas de filtre, pas de règle. Tout vient du paquet rh.
          - titre: L'astuce du jour
            texte: >-
              L'écran appelle le cœur, il ne calcule pas. C'est la même règle que pour l'API, et pour la
              même raison : ce qui est écrit dans l'écran ne sert qu'à l'écran.

              Conséquence pratique immédiate : tout ce qui mérite un test se range dans une fonction du
              paquet rh. Vous testerez les fonctions, jamais l'affichage, ce qui vous épargne une catégorie
              entière d'outils compliqués.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est de recalculer tout à chaque interaction. Comme le script est rejoué
              entièrement, un chargement de fichier placé en haut se refait à chaque clic. Sur un petit
              fichier, cela ne se voit pas ; sur un gros, l'écran devient lent.

              La parade s'appelle le cache et arrive en journée 25. En attendant, gardez conscience du coût
              de chaque ligne placée en haut du script.
          - titre: Challenge du jour
            texte: >-
              Affichez les trois chiffres de la direction : l'effectif total, la masse salariale du mois, et
              le nombre de postes distincts. Les trois viennent de fonctions du paquet rh.

              Les tests livrés portent sur les fonctions de préparation, pas sur l'affichage : ils appellent
              par exemple chiffres_cles(effectif) et vérifient le dictionnaire rendu. Un test vérifie que le
              fichier d'écran ne contient ni boucle ni calcul.

              Critères d'acceptation : trois chiffres affichés ; une fonction testable derrière chacun ;
              aucun calcul dans le fichier d'écran.
        livrable: >-
          Afficher les trois chiffres de la direction ; les tests portent sur les fonctions de préparation,
          pas sur l'affichage.
