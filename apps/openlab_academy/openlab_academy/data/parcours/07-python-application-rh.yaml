      - num: "J16"
        title: "HTTP en vingt minutes et première route"
        evaluations: livrable
        archive: depot-python-j16.zip
        contenu: >-
          Requête et réponse, méthode, code de retour, JSON, lancement du serveur avec uvicorn et
          documentation automatique.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez lancer un serveur sur votre machine et répondre à une requête faite par
              un navigateur ou par un test.
          - titre: Le problème d'abord
            texte: >-
              Votre application tourne dans un terminal, sur votre poste. Le gérant veut la consulter depuis
              son bureau, et plus tard depuis son téléphone. Il faut que votre programme réponde à des
              questions venues d'ailleurs.

              C'est le rôle d'une API : un programme qui attend des requêtes et renvoie des réponses, sans
              interface graphique.
          - titre: La notion
            texte: >-
              Un échange HTTP tient en deux messages. La requête porte une méthode, qui dit l'intention,
              et un chemin, qui dit quoi. La réponse porte un code, qui dit comment cela s'est passé, et
              un contenu, ici au format JSON.

              Les méthodes qui nous serviront sont GET, qui lit sans rien changer, et POST, qui crée. Les
              codes se lisent par leur premier chiffre : 2 pour un succès, 4 pour une faute de l'appelant,
              5 pour une panne de votre côté.

              JSON est un format de texte qui ressemble beaucoup aux dictionnaires et listes de Python.
              FastAPI convertit automatiquement ce que votre fonction rend en JSON.

              Le serveur se lance avec uvicorn, qui écoute un port de votre machine. FastAPI publie en plus
              une documentation interactive à l'adresse /docs, construite à partir de votre code.
            figures:
              - nom: python-requete-reponse.svg
                legende: "Une requête, une réponse : méthode, chemin, code et contenu"
            code:
              - titre: Votre première route
                langage: python
                source: |
                  from fastapi import FastAPI

                  app = FastAPI(title="API RH")


                  @app.get("/sante")
                  def sante():
                      """Dit que le service répond. Première route de toute application."""
                      return {"etat": "ok"}
          - titre: À la main
            texte: >-
              Installez fastapi et uvicorn, écrivez le fichier ci-dessus sous le nom api.py, puis lancez le
              serveur avec uvicorn en lui indiquant le module et l'objet app, avec l'option de rechargement
              automatique.

              Ouvrez votre navigateur sur l'adresse locale indiquée par uvicorn, suivie de /sante. Vous
              voyez le JSON. Ouvrez ensuite /docs : la documentation de votre route est déjà là, et vous
              pouvez l'essayer depuis la page.

              Arrêtez le serveur avec Ctrl+C. Relancez-le une seconde fois sans avoir arrêté le premier :
              le message indique que le port est déjà utilisé. C'est le piège du jour, vous le
              reconnaîtrez.
          - titre: L'astuce du jour
            texte: >-
              Lisez /docs avant d'écrire le moindre client. La page est produite à partir de votre code :
              elle montre exactement ce que votre API accepte et rend, y compris les champs que vous auriez
              oubliés.

              C'est aussi l'outil de dialogue avec les autres : au lieu d'expliquer votre API dans un
              document qui vieillira, vous donnez une adresse qui ne ment jamais.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le port déjà pris, qui survient quand un serveur tourne encore dans un
              terminal oublié. Le message le dit clairement ; fermez l'autre terminal, ou changez de port.

              Le second piège est le rechargement automatique qui masque une erreur. Quand le serveur
              recharge votre code après une modification fautive, il affiche la trace et continue de servir
              l'ancienne version. Lisez le terminal à chaque sauvegarde : c'est là que vos erreurs
              s'affichent, pas dans le navigateur.
          - titre: Challenge du jour
            texte: >-
              Écrivez la route GET /sante qui rend un objet contenant la clé etat avec la valeur ok, et
              écrivez le test qui la vérifie avec TestClient, l'outil de test fourni avec FastAPI.

              Le test n'a pas besoin que le serveur tourne : TestClient appelle votre application
              directement. C'est ce qui rend les tests d'API rapides et reproductibles.

              Critères d'acceptation : la route répond avec le code 200 ; le contenu est exactement l'objet
              attendu ; le test passe sans serveur lancé.
        livrable: >-
          Écrire GET /sante qui rend l'état ok, et son test avec TestClient, sans serveur lancé.
