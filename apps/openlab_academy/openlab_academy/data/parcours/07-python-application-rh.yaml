capstone:
  titre: Votre application RH, montrée à quelqu'un
  duree_h: 3
  niveau: autonome
  contexte: >-
    Le projet final ne demande aucune nouvelle notion : il demande de montrer ce que les trente-cinq journées
    ont construit. Vous rendez le dépôt de votre application RH, son fichier demo.md, sa suite de tests verte,
    et vous la présentez en cinq minutes à quelqu'un qui n'a pas suivi le parcours. La présentation compte
    autant que le code : un travail que personne ne comprend ne se vend pas.
  objectifs:
    - Montrer une application qui démarre sur une machine vierge en suivant votre seul fichier LISEZ-MOI.
    - Expliquer en une minute pourquoi le cœur métier ne connaît ni FastAPI, ni Streamlit, ni Django.
    - Faire tourner la suite de tests devant votre interlocuteur et commenter ce qu'elle prouve.
  fonctionnalites:
    - L'effectif, la fiche d'un salarié et l'embauche, écran et API.
    - "Les trois états de la direction : effectif par poste, masse salariale, absences du mois."
    - L'import d'un fichier CSV d'effectif par la commande de gestion.
  stack:
    - Python, pytest
    - FastAPI, Streamlit, Django, SQLite
  criteres_acceptation:
    - La suite de tests passe en une commande, sur un dépôt fraîchement récupéré.
    - Aucun secret dans le dépôt ; le fichier .env.exemple est suivi, le fichier .env ne l'est pas.
    - Le cœur métier n'importe ni framework, ni fichier, ni réseau.
    - DEBUG vaut False dans la configuration de démonstration et check --deploy ne lève aucune alerte critique.
  exigences_specifiques:
    - Les données livrées sont fictives et le dépôt le dit.
    - Les montants s'affichent en francs CFA, sans décimale.
  livrables:
    - Le dépôt complet de l'application, tests inclus.
    - "Le fichier demo.md : le scénario de la démonstration, minute par minute."
    - Une capture de la suite de tests au vert.
