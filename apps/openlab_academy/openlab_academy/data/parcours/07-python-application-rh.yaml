          - question: "Quand s'exécute le code écrit hors de toute fonction dans un module ?"
            options: ["À l'import du module", "Jamais", "À l'appel de la première fonction", "À la fin du programme"]
            bonnes: [1]
            explication: "C'est pourquoi un module ne doit ni lire de fichier ni afficher au niveau principal."
          - question: "Quel module peut importer rh/calculs.py ?"
            options: ["rh/etats.py et main.py", "aucun", "seulement main.py", "seulement rh/etats.py"]
            bonnes: [1]
            explication: "Les imports vont de l'habillage vers le cœur : les calculs n'importent rien du projet."
          - question: "Que signale une ImportError pour import circulaire ?"
            options: ["Une responsabilité mal placée", "Un défaut de Python", "Un fichier manquant", "Une faute de frappe obligatoire"]
            bonnes: [1]
            explication: "La bonne correction déplace la fonction concernée, elle ne cache pas l'import dans une fonction."
          - question: "Qu'est-ce qu'un paquet en Python ?"
            options: ["Un dossier qui contient des modules", "Une bibliothèque publiée", "Un fichier compressé", "Un module sans fonction"]
            bonnes: [1]
            explication: "Le dossier rh de votre projet est un paquet, et calculs.py l'un de ses modules."
      - num: "J12"
        title: "Lire un fichier CSV sans casser les accents"
        evaluations: livrable
        archive: depot-python-j12.zip
        contenu: >-
          Ouvrir un fichier avec with, choisir l'encodage UTF-8, lire un CSV avec DictReader, et construire
          un chemin sans jamais concaténer des bouts de texte.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez charger l'effectif depuis un vrai fichier CSV exporté par le gérant, avec
              les accents intacts et sans chemin codé en dur.
          - titre: Le problème d'abord
            texte: >-
              Jusqu'ici votre effectif est écrit dans le code. Le gérant, lui, tient son personnel dans un
              tableur, qu'il exporte en CSV. Les noms contiennent des accents, et le fichier n'est pas
              toujours au même endroit.
          - titre: La notion
            texte: >-
              L'instruction with ouvre un fichier et le referme quoi qu'il arrive, y compris si une erreur
              survient au milieu. C'est la seule façon d'ouvrir un fichier dans ce parcours.

              L'encodage doit être indiqué explicitement : utf-8 partout. Sans ce paramètre, Python prend
              l'encodage par défaut du système, qui diffère entre Windows et Linux, et les accents se
              transforment en caractères illisibles sur l'un des deux.

              Le module csv et sa classe DictReader lisent chaque ligne comme un dictionnaire dont les clés
              sont les en-têtes de colonnes. Les valeurs arrivent toujours en texte : un salaire doit être
              converti en entier, une date en objet date.

              Les chemins se construisent avec pathlib : l'opérateur barre oblique assemble les morceaux
              correctement sur tous les systèmes, là où une concaténation de chaînes produit un chemin
              valide sous Linux et faux sous Windows.
            code:
              - titre: Charger un effectif depuis un CSV
                langage: python
                source: |
                  import csv
                  from pathlib import Path


                  def charger_effectif(chemin):
                      """Rend la liste des fiches lues dans le fichier CSV."""
                      fiches = []
                      with Path(chemin).open(encoding="utf-8", newline="") as fichier:
                          for ligne in csv.DictReader(fichier):
                              fiches.append({
                                  "nom": ligne["nom"],
                                  "poste": ligne["poste"],
                                  "date_embauche": ligne["date_embauche"],
                                  "salaire_fcfa": int(ligne["salaire_fcfa"]),
                              })
                      return fiches
          - titre: À la main
            texte: >-
              Créez un fichier effectif.csv avec une ligne d'en-tête et trois salariés, dont un nom
              accentué. Si vous le fabriquez depuis un tableur, choisissez explicitement l'export en UTF-8.

              Chargez-le avec la fonction ci-dessus et affichez la première fiche. Puis retirez le
              paramètre encoding et relancez : selon votre système, vous verrez soit le même résultat, soit
              des caractères abîmés. C'est précisément parce que le comportement dépend de la machine qu'il
              faut l'écrire explicitement.

              Essayez enfin un chemin qui n'existe pas : Python lève FileNotFoundError. Retenez ce nom,
              c'est l'erreur que vous traiterez demain.
          - titre: L'astuce du jour
            texte: >-
              with toujours, encodage toujours, chemin construit toujours. Ces trois réflexes évitent trois
              classes entières de bugs : le fichier resté ouvert, les accents abîmés, et le programme qui ne
              marche que sur votre machine.

              Prenez l'habitude de recevoir le chemin en paramètre, comme la date du jour en journée 09. Un
              chemin écrit en dur dans une fonction la rend inutilisable ailleurs, et intestable.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est l'encodage. Il ne se voit pas sur votre machine, se voit chez le client,
              et produit des noms comme Cï¿½line que personne ne sait corriger ensuite.

              Le second piège est plus structurel : faire lire le fichier par le module de calculs. Les
              calculs ne doivent connaître ni fichier, ni chemin, ni CSV. La lecture appartient à un module
              dédié, rh/fichiers.py, et c'est lui qui rend des fiches propres au cœur.
            tableaux:
              - titre: Trois réflexes de lecture de fichier
                entetes: [Réflexe, Écriture, Ce qu'il évite]
                lignes:
                  - ["Fermeture garantie", "with ... as fichier", "le fichier resté ouvert après une erreur"]
                  - ["Encodage explicite", 'encoding="utf-8"', "les accents abîmés sur une autre machine"]
                  - ["Chemin construit", "Path(dossier) / nom", "le séparateur faux sous Windows"]
                  - ["Chemin reçu", "charger_effectif(chemin)", "la fonction inutilisable ailleurs"]
          - titre: Challenge du jour
            texte: >-
              Écrivez charger_effectif(chemin) dans rh/fichiers.py. La fonction rend une liste de fiches,
              avec le salaire converti en entier et les autres champs en texte.

              Les tests livrés fabriquent un fichier CSV temporaire avec un nom accentué, le chargent, et
              comparent les fiches obtenues. Un test lit le code source de rh/calculs.py et échoue s'il
              contient un import de csv ou de pathlib.

              Critères d'acceptation : le fichier est ouvert avec with et encoding ; le chemin est reçu en
              paramètre ; rh/calculs.py reste sans aucune connaissance des fichiers.
        livrable: >-
          Écrire charger_effectif(chemin) dans rh/fichiers.py ; les tests vérifient que rh/calculs.py
          n'importe ni csv ni pathlib.
