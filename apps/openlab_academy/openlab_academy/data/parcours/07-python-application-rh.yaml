      - num: "J23"
        title: "Un formulaire d'embauche branché sur le cœur"
        evaluations: livrable
        archive: depot-python-j23.zip
        contenu: >-
          Un formulaire, sa soumission, et la traduction d'une erreur métier en message lisible par un
          humain.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez offrir au gérant un formulaire d'embauche qui refuse proprement une
              saisie fausse, en lui disant quoi corriger.
          - titre: Le problème d'abord
            texte: >-
              Le gérant saisit une embauche. Il se trompe : il tape un salaire négatif, ou laisse le poste
              vide. Votre modèle d'entrée de la journée 15 sait refuser, mais son message parle de
              contraintes et de types, dans un vocabulaire de bibliothèque.
          - titre: La notion
            texte: >-
              Un formulaire regroupe plusieurs widgets et un bouton de soumission : le script n'agit qu'au
              moment où l'utilisateur valide, ce qui évite de réagir à chaque frappe.

              La soumission appelle le cœur, qui valide et lève une erreur métier le cas échéant. L'écran
              attrape cette erreur et affiche un message, en vert si tout va bien, en rouge sinon.

              La traduction de l'erreur en message appartient à une fonction testable, pas au corps de la
              page. Vous testez alors que telle erreur produit telle phrase, sans jamais ouvrir un
              navigateur.
            code:
              - titre: Un formulaire qui dit quoi corriger
                langage: python
                source: |
                  import streamlit as st

                  from rh.entrees import SalarieEntrant
                  from rh.messages import message_d_erreur

                  with st.form("embauche"):
                      nom = st.text_input("Nom")
                      poste = st.text_input("Poste")
                      salaire = st.number_input("Salaire mensuel en FCFA", step=1000)
                      valide = st.form_submit_button("Embaucher")

                  if valide:
                      try:
                          SalarieEntrant(nom=nom, poste=poste, salaire_fcfa=int(salaire),
                                         date_embauche="2026-01-05")
                          st.success("Embauche enregistrée.")
                      except Exception as erreur:
                          st.error(message_d_erreur(erreur))
          - titre: À la main
            texte: >-
              Construisez le formulaire, puis essayez une saisie correcte, un salaire négatif et un poste
              vide. Lisez les trois messages produits.

              Écrivez ensuite message_d_erreur dans le paquet rh : elle reçoit l'erreur de validation et
              rend une phrase simple, par exemple « Le salaire ne peut pas être négatif. » Testez-la
              directement, sans Streamlit.

              Observez enfin ce qui se passe quand la page est rejouée après la soumission : les champs se
              vident. C'est le piège du jour.
          - titre: L'astuce du jour
            texte: >-
              Un message d'erreur s'adresse à un humain pressé. Il dit ce qui ne va pas et ce qu'il faut
              faire, en une phrase, sans vocabulaire technique et sans nom de classe.

              Écrivez-le comme vous le diriez à voix haute au gérant debout à côté de vous. Puis testez
              cette phrase : un message est un comportement du logiciel, au même titre qu'un calcul.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la perte de la saisie au rechargement. Comme le script est rejoué, les
              champs reprennent leur valeur par défaut, et le gérant retape tout après chaque refus.

              La parade tient en une idée : conserver les valeurs saisies dans l'état de session, que
              Streamlit fournit, et les réutiliser comme valeurs initiales des champs. Rien de ce qui est
              conservé là ne doit cependant devenir une règle métier : l'état de session garde la saisie,
              pas la vérité de l'application.
            tableaux:
              - titre: Qui fait quoi dans un formulaire
                entetes: [Étape, Responsable]
                lignes:
                  - ["Afficher les champs", "l'écran"]
                  - ["Valider la saisie", "le modèle d'entrée"]
                  - ["Traduire l'erreur en phrase", "une fonction testable du cœur"]
                  - ["Afficher la phrase", "l'écran"]
          - titre: Challenge du jour
            texte: >-
              Branchez le formulaire sur le cœur. Un refus affiche la raison en une phrase compréhensible ;
              une réussite affiche une confirmation et le tableau se met à jour.

              Les tests livrés portent sur message_d_erreur : trois erreurs de validation, trois phrases
              attendues. Un test vérifie que la fonction ne dépend ni de Streamlit, ni de FastAPI.

              Critères d'acceptation : aucune phrase d'erreur écrite dans le fichier d'écran ; la saisie
              n'est pas perdue après un refus ; les trois messages sont testés.
        livrable: >-
          Afficher la raison d'un refus d'embauche ; le test porte sur la fonction qui traduit l'erreur
          métier en message.
