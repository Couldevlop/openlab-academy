        quiz:
          - question: "Masquer un bouton protège-t-il une page ?"
            options: ["Non, l'adresse reste accessible", "Oui", "Oui si l'utilisateur n'est pas administrateur", "Seulement en production"]
            bonnes: [1]
            explication: "Le droit se vérifie là où la donnée est servie, pas là où elle est affichée."
          - question: "Où filtrer les champs sensibles ?"
            options: ["Dans la requête", "Dans le gabarit", "Dans le navigateur", "Dans le fichier de configuration"]
            bonnes: [1]
            explication: "Une donnée absente de la réponse ne peut fuir par aucun canal."
          - question: "Qu'est-ce qu'un groupe ?"
            options: ["Un ensemble de permissions attribué à des utilisateurs", "Une équipe de l'entreprise", "Un modèle de données", "Un gabarit partagé"]
            bonnes: [1]
            explication: "Les droits se gèrent par rôle, pas utilisateur par utilisateur."
          - question: "Combien de portes vérifier pour une donnée sensible ?"
            options: ["Toutes : page, export, API", "Une seule, la principale", "Deux au maximum", "Aucune si l'utilisateur est connecté"]
            bonnes: [1]
            explication: "Une permission vérifiée à un seul endroit laisse les autres portes ouvertes."
          - question: "Que vérifie le test de rôles du jour ?"
            options: ["Chaque page pour chaque rôle, réponse comprise", "Le nombre de groupes", "La page de connexion", "Le temps de réponse"]
            bonnes: [1]
            explication: "Il échoue si un salaire figure dans une réponse envoyée à un manager, même masqué."
      - num: "J34"
        title: "Une commande de gestion qui réutilise le cœur"
        evaluations: livrable
        contenu: >-
          Écrire une commande manage.py qui importe un fichier CSV en appelant le cœur de la semaine 3,
          sans recoder la moindre règle.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez importer l'effectif du gérant dans la base par une commande, et prouver
              que le résultat est identique à celui du cœur Python pur.
          - titre: Le problème d'abord
            texte: >-
              Le gérant a toujours son tableur. Il veut charger son fichier dans l'application, sans saisir
              trente fiches à la main. Et vous avez déjà écrit, en semaine 3, tout ce qu'il faut pour lire
              et valider ce fichier.
          - titre: La notion
            texte: >-
              Une commande de gestion est une classe placée dans un dossier conventionnel de votre
              application. Elle déclare ses arguments et exécute son travail. Elle se lance par manage.py,
              et peut donc être programmée dans une tâche périodique.

              Le point de cette journée est ailleurs que dans la syntaxe : la commande appelle le cœur
              écrit en semaine 3, charger_effectif et le modèle d'entrée, puis crée les enregistrements.
              Elle ne relit pas le CSV à sa façon, elle ne revalide pas, elle n'invente aucune règle.

              C'est la preuve finale de la leçon d'architecture du parcours : le cœur a survécu à trois
              habillages, et il n'a pas changé d'une ligne.
            code:
              - titre: La commande appelle le cœur, elle ne le refait pas
                langage: python
                source: |
                  from django.core.management.base import BaseCommand

                  from effectif.models import Poste, Salarie
                  from rh.fichiers import charger_effectif


                  class Command(BaseCommand):
                      help = "Importe un effectif depuis un fichier CSV."

                      def add_arguments(self, parser):
                          parser.add_argument("chemin")

                      def handle(self, *args, **options):
                          fiches = charger_effectif(options["chemin"])
                          for fiche in fiches:
                              poste, _ = Poste.objects.get_or_create(libelle=fiche["poste"])
                              Salarie.objects.update_or_create(
                                  matricule=fiche["matricule"],
                                  defaults={"nom": fiche["nom"], "poste": poste,
                                            "date_embauche": fiche["date_embauche"],
                                            "salaire_fcfa": fiche["salaire_fcfa"]})
                          self.stdout.write(f"{len(fiches)} fiches importées.")
          - titre: À la main
            texte: >-
              Écrivez la commande, puis importez votre fichier d'effectif. Vérifiez le nombre de fiches
              créées dans l'administration.

              Relancez la commande sur le même fichier : aucun doublon n'apparaît, parce que l'écriture met
              à jour la fiche existante au lieu d'en créer une seconde. Une commande qu'on peut rejouer
              sans dégât est une commande utilisable.

              Modifiez enfin un salaire dans le fichier et relancez : la base suit. Essayez avec un fichier
              fautif, et constatez que l'erreur métier de la journée 13 remonte telle quelle, avec son
              message utile.
          - titre: L'astuce du jour
            texte: >-
              Le cœur survit au troisième habillage. Vous venez de le prouver : la même fonction de
              chargement sert au programme en ligne de commande de la semaine 3, à l'API de la semaine 4, à
              l'écran de la semaine 5 et à Django aujourd'hui.

              C'est ce que vous raconterez lors de votre démonstration, et c'est ce qui distingue un
              développeur d'un assembleur de tutoriels.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est de recoder les règles dans Django, parce que l'ORM offre ses propres
              validations. Vous auriez alors deux vérités, et c'est une de trop.

              Le second piège est la commande non rejouable, qui crée des doublons à chaque exécution. La
              règle pratique : une commande d'import se relance sans dégât, et dit ce qu'elle a fait.
            tableaux:
              - titre: Le même cœur, quatre appelants
                entetes: [Appelant, Semaine, Ce qu'il ajoute]
                lignes:
                  - ["Programme en ligne de commande", "3", "rien, c'est le cœur nu"]
                  - ["API FastAPI", "4", "HTTP et codes de retour"]
                  - ["Écran Streamlit", "5", "widgets et graphiques"]
                  - ["Commande Django", "6 et 7", "base de données et utilisateurs"]
          - titre: Challenge du jour
            texte: >-
              Écrivez la commande d'import et rendez-la rejouable sans doublon.

              Les tests livrés importent un fichier de six fiches, comparent le contenu de la base au
              résultat du cœur Python pur sur le même fichier, puis relancent la commande et vérifient que
              rien n'a changé. Un test vérifie que la commande n'ouvre aucun fichier elle-même.

              Critères d'acceptation : la commande appelle le cœur ; deux exécutions donnent le même
              résultat ; une erreur métier remonte avec son message.
        livrable: >-
          Écrire manage.py importer_effectif fichier.csv ; un test compare le résultat à celui du cœur
          Python pur et vérifie la relance sans doublon.
      - num: "J35R"
        title: Rappel de la veille
        evaluations: quiz
        contenu: >-
          Cinq points de la journée 34, à revoir avant d'ouvrir la dernière leçon. Aucune notion nouvelle
          ici. Le quiz se retente jusqu'à dix fois ; si vous les épuisez, votre formateur rouvre la
          tentative.
        cours:
          - titre: Ce qu'il faut avoir retenu d'hier
            texte: >-
              Relisez ces cinq points, puis lancez le quiz. Demain, vous finissez l'application et vous la
