      - num: "J18"
        title: "Écrire : POST, 201 et 422"
        evaluations: livrable
        archive: depot-python-j18.zip
        contenu: >-
          Recevoir un corps de requête, réutiliser le modèle d'entrée de la journée 15, répondre 201 à une
          création et laisser Pydantic répondre 422.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez accepter une embauche envoyée par le monde extérieur, et refuser une
              donnée fausse avec un message qui nomme le champ.
          - titre: Le problème d'abord
            texte: >-
              Jusqu'ici votre API ne fait que lire. Le gérant veut déclarer une embauche depuis son
              navigateur. La donnée vient de l'extérieur, donc elle est suspecte par défaut : un salaire
              négatif, un poste vide ou une date absurde arriveront un jour.
          - titre: La notion
            texte: >-
              Une route POST reçoit un corps de requête. Il suffit de déclarer un paramètre dont le type est
              votre modèle Pydantic : FastAPI lit le JSON, le valide, et vous donne un objet déjà sain.

              Si la validation échoue, FastAPI répond automatiquement 422 avec le détail des champs fautifs.
              Vous n'écrivez rien pour cela : c'est le modèle d'entrée de la journée 15 qui travaille.

              Une création réussie répond 201 plutôt que 200, ce qui s'indique dans le décorateur. Le code
              dit à l'appelant que quelque chose a été créé, information qu'aucun contenu ne remplace.
            code:
              - titre: Une création qui valide sans y penser
                langage: python
                source: |
                  from fastapi import FastAPI

                  from rh.entrees import SalarieEntrant
                  from rh.calculs import ajouter_salarie

                  app = FastAPI(title="API RH")
                  EFFECTIF = []


                  @app.post("/salaries", status_code=201)
                  def embaucher(entrant: SalarieEntrant):
                      fiche = entrant.model_dump()
                      return ajouter_salarie(EFFECTIF, fiche)
          - titre: À la main
            texte: >-
              Depuis /docs, essayez la route POST avec une fiche correcte : vous obtenez 201 et la fiche
              créée. Recommencez avec un salaire négatif : vous obtenez 422, et le détail nomme le champ
              salaire_fcfa et la règle violée.

              Ajoutez un champ inconnu dans le JSON envoyé et observez : par défaut, Pydantic l'ignore. Si
              vous voulez qu'il soit refusé, c'est une option de configuration du modèle, et c'est une
              décision de conception : tolérer l'inconnu facilite les évolutions, le refuser détecte les
              fautes de frappe des appelants.

              Vérifiez enfin que votre route ne contient aucun if de validation. Si vous en avez écrit un,
              retirez-le : il double une règle déjà portée par le modèle.
          - titre: L'astuce du jour
            texte: >-
              Réutilisez le modèle d'entrée écrit en journée 15. Il décrit déjà ce que le monde extérieur a
              le droit d'envoyer ; le CSV et l'API sont deux portes du même bâtiment, et la serrure est la
              même.

              Quand l'API devra accepter un champ que le fichier ne connaît pas, créez un second modèle
              plutôt que d'alourdir le premier. Deux modèles clairs valent mieux qu'un modèle à options.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la double validation : un contrôle écrit à la main dans la route, en plus
              du modèle. Le jour où la règle change, l'un des deux est oublié, et l'API accepte ce que le
              fichier refuse.

              Le second piège est le message d'erreur maison qui remplace celui de Pydantic : écrire « donnée
              invalide » à la place d'un détail qui nommait le champ fautif fait perdre de l'information à
              celui qui appelle votre API.
            tableaux:
              - titre: Les codes de cette journée
                entetes: [Situation, Code, Qui décide]
                lignes:
                  - ["Création réussie", "201", "votre décorateur"]
                  - ["Champ invalide", "422", "Pydantic, automatiquement"]
                  - ["Lecture réussie", "200", "FastAPI par défaut"]
                  - ["Ressource absente", "404", "votre route"]
          - titre: Challenge du jour
            texte: >-
              Écrivez POST /salaries qui crée une fiche et répond 201. Une fiche invalide reçoit 422 sans
              que vous écriviez de contrôle.

              Les tests livrés couvrent la création, le refus sur salaire négatif, et vérifient que le
              détail de la réponse 422 nomme le champ fautif. Un test vérifie qu'aucun if de validation
              n'existe dans le fichier de l'API.

              Critères d'acceptation : 201 à la création ; 422 automatique sur donnée fausse ; aucun
              contrôle manuel dans la route.
        livrable: >-
          Écrire POST /salaries ; la création est refusée sur salaire négatif avec un 422 qui nomme le
          champ fautif.
