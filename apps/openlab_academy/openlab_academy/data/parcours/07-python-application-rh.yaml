      - num: "J09"
        title: "Les dates et l'ancienneté"
        evaluations: livrable
        contenu: >-
          Le type date, l'écriture ISO, la différence entre deux dates, le calcul d'une ancienneté en mois
          et le traitement du mois incomplet.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez calculer l'ancienneté d'un salarié en mois révolus, ce qui alimente
              directement la règle des congés écrite en journée 03.
          - titre: Le problème d'abord
            texte: >-
              La fiche contient une date d'embauche écrite en texte. La règle des congés demande une
              ancienneté en mois. Entre les deux, il manque un calcul, et ce calcul est plus subtil qu'il
              n'y paraît : un salarié embauché le 31 janvier a-t-il un mois d'ancienneté le 28 février ?
          - titre: La notion
            texte: >-
              Le module datetime fournit le type date. La fonction date.fromisoformat lit une chaîne écrite
              en ISO, c'est-à-dire année, mois, jour séparés par des tirets. C'est l'écriture employée
              partout dans ce parcours, parce qu'elle se trie correctement en tant que texte et qu'elle ne
              laisse aucune ambiguïté entre le jour et le mois.

              Soustraire deux dates donne un timedelta, dont l'attribut days donne un nombre de jours. Il
              n'existe pas d'attribut months, parce qu'un mois n'a pas de durée fixe.

              L'ancienneté en mois révolus se calcule donc autrement : différence des années multipliée par
              douze, plus différence des mois, moins un si le jour du mois courant n'a pas encore atteint
              le jour d'embauche. C'est la définition que retient ce parcours, et elle est écrite dans le
              code une seule fois.
            figures:
              - nom: python-anciennete-mois.svg
                legende: "L'ancienneté en mois révolus, et le cas du mois commencé mais non terminé"
            code:
              - titre: De la date d'embauche à l'ancienneté en mois
                langage: python
                source: |
                  from datetime import date

                  embauche = date.fromisoformat("2024-03-15")
                  aujourdhui = date.fromisoformat("2025-03-14")

                  mois = (aujourdhui.year - embauche.year) * 12 + aujourdhui.month - embauche.month
                  if aujourdhui.day < embauche.day:
                      mois -= 1

                  print(mois)   # 11 : le douzième mois n'est pas révolu
          - titre: À la main
            texte: >-
              Calculez l'ancienneté pour trois couples de dates : embauche le 15 mars 2024 et date du jour
              au 14 mars 2025, puis au 15 mars 2025, puis au 16 mars 2025. Vous devez obtenir 11, 12 et 12.

              Ces trois valeurs sont exactement les bornes de la règle des congés de la journée 03. Vous
              venez de relier deux journées : c'est ainsi que l'application se construit.

              Essayez ensuite une date d'embauche au 29 février 2024, année bissextile, avec une date du
              jour au 28 février 2025. Observez le résultat et demandez-vous s'il correspond à ce qu'un
              gestionnaire de paie attendrait.
          - titre: L'astuce du jour
            texte: >-
              Tout en ISO, partout. Les dates circulent en chaînes de la forme année, mois, jour séparés
              par des tirets, du fichier CSV jusqu'à la base de données, en passant par l'API JSON.

              Convertissez en objet date à l'entrée du programme, travaillez avec des objets date à
              l'intérieur, et reconvertissez en chaîne ISO à la sortie. Cette discipline, appelée
              normalisation aux frontières, reviendra formalisée en journée 15.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est de croire qu'une différence de dates donne des mois. Elle donne des
              jours, et diviser par trente donne un résultat faux une fois sur deux.

              Le second piège est la date future. Une date d'embauche postérieure à aujourd'hui est une
              donnée fausse : votre fonction doit la refuser par une erreur, et non rendre une ancienneté
              négative qui traverserait ensuite toute la chaîne de calcul.
            tableaux:
              - titre: Les cas que votre fonction doit traiter
                entetes: [Situation, Attendu]
                lignes:
                  - ["Embauche le 15, jour courant le 14", "le mois en cours ne compte pas"]
                  - ["Embauche le 15, jour courant le 15", "le mois est révolu"]
                  - ["Embauche un 29 février", "le calcul reste cohérent les années non bissextiles"]
                  - ["Embauche dans le futur", "une erreur, jamais une valeur négative"]
          - titre: Challenge du jour
            texte: >-
              Écrivez anciennete_en_mois(embauche, aujourdhui), qui prend deux objets date et rend un nombre
              entier de mois révolus. Une embauche postérieure à la date du jour lève une erreur.

              Les tests livrés couvrent une embauche en cours de mois, le 29 février, et une date future
              refusée. La fonction reçoit la date du jour en paramètre plutôt que de la lire elle-même :
              c'est ce qui rend le test possible et reproductible.

              Critères d'acceptation : la fonction rend un entier ; les trois cas limites passent ; la date
              du jour n'est jamais lue à l'intérieur de la fonction.
        livrable: >-
          Écrire anciennete_en_mois(embauche, aujourdhui) ; les tests couvrent une embauche en cours de
          mois, le 29 février et une date future refusée.
      - num: "J10R"
        title: Rappel de la veille
        evaluations: quiz
        contenu: >-
          Cinq points de la journée 09, à revoir avant d'ouvrir la leçon du jour. Aucune notion nouvelle
          ici. Le quiz se retente jusqu'à dix fois ; si vous les épuisez, votre formateur rouvre la
          tentative.
        cours:
          - titre: Ce qu'il faut avoir retenu d'hier
            texte: >-
