      - num: "J05"
        title: "Écrire sa première fonction"
        evaluations: livrable
        contenu: >-
          Le mot def, les paramètres, la valeur rendue, la docstring, et la différence décisive entre
          afficher une valeur et la rendre.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez regrouper les calculs des quatre premières journées dans un fichier de
              fonctions réutilisables, que les journées suivantes importeront sans les réécrire.
          - titre: Le problème d'abord
            texte: >-
              Vos quatre programmes calculent chacun quelque chose d'utile, mais chacun dans son coin. Le
              calcul de la masse salariale servira à l'écran de la direction, à l'API et à l'application
              Django, dans trois semaines, cinq semaines et sept semaines.

              Recopier le calcul à chaque fois garantit trois versions qui finiront par diverger. Il faut
              l'écrire une fois, lui donner un nom, et l'appeler depuis partout.
          - titre: La notion
            texte: >-
              Une fonction se déclare avec def, suivi de son nom, de ses paramètres entre parenthèses, et de
              deux points. Son corps est indenté. L'instruction return rend une valeur à l'appelant et met
              fin à l'exécution de la fonction.

              Une fonction sans return rend None, une valeur spéciale qui signifie « rien ». C'est le piège
              du jour, nous y venons.

              La première ligne du corps peut être une docstring : une chaîne entre triples guillemets qui
              dit ce que fait la fonction. Elle s'adresse à la personne qui lira le code dans six mois,
              c'est-à-dire souvent vous.
            figures:
              - nom: python-fonction-entree-sortie.svg
                legende: Une fonction reçoit des paramètres et rend une valeur ; afficher n'est pas rendre
            code:
              - titre: Une fonction qui calcule et rend
                langage: python
                source: |
                  def masse_salariale(salaires):
                      """Rend la somme des salaires, en francs CFA."""
                      total = 0
                      for salaire in salaires:
                          total += salaire
                      return total


                  print(masse_salariale([250000, 180000]))   # l'appelant affiche, la fonction calcule
          - titre: À la main
            texte: >-
              Créez le dossier rh et, à l'intérieur, le fichier calculs.py. Déplacez-y vos quatre calculs de
              la semaine, chacun dans une fonction : salaire_annuel, formater_fcfa, droit_aux_conges,
              masse_salariale et plus_haut_salaire.

              Retirez tous les print de ces fonctions. Chacune doit se terminer par un return. Dans un
              fichier séparé, importez le module et appelez vos fonctions pour vérifier qu'elles répondent
              comme avant.
          - titre: L'astuce du jour
            texte: >-
              Une fonction, un verbe. calculer, formater, trouver : le nom dit l'action. Si vous ne trouvez
              pas de verbe unique pour nommer votre fonction, c'est qu'elle en fait deux, et il faut la
              couper en deux.

              Corollaire utile pour la suite du parcours : une fonction qui tient dans un écran se relit ;
              une fonction de cent lignes ne se relit plus, elle se subit.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la fonction qui affiche au lieu de rendre. Elle semble marcher :
              l'exécution montre le bon nombre à l'écran. Mais son résultat n'existe nulle part, donc
              personne ne peut le réutiliser, et un test ne peut rien vérifier.

              Essayez : écrivez une fonction qui termine par un print au lieu d'un return, puis affichez ce
              qu'elle rend. Python affiche None. Retenez ce symptôme, vous le rencontrerez plus d'une fois.

              Les tests du challenge d'aujourd'hui refusent explicitement tout print dans le module de
              calculs : ils capturent la sortie et échouent si quelque chose s'y affiche.
          - titre: Challenge du jour
            texte: >-
              Regroupez les cinq fonctions de la semaine dans rh/calculs.py. Chacune porte une docstring
              d'une ligne. Aucune n'affiche quoi que ce soit.

              Les tests livrés importent le module, appellent les cinq fonctions et comparent les résultats
              à ceux des journées précédentes. Un test supplémentaire capture la sortie standard pendant
              l'appel et échoue si le module affiche quelque chose.

              Critères d'acceptation : les cinq fonctions existent avec les noms exacts ; aucun print dans
              le module ; les tests des journées 02, 03 et 04 passent toujours en appelant le nouveau
              module.
        livrable: >-
          Regrouper les quatre premières journées dans rh/calculs.py ; les tests refusent tout print dans
          le module.
