          - question: "Pourquoi une boucle while peut-elle ne jamais s'arrêter ?"
            options: ["Parce que rien ne change la condition à l'intérieur", "Parce que range est absent", "Parce que la liste est vide", "Parce qu'il manque un print"]
            bonnes: [1]
