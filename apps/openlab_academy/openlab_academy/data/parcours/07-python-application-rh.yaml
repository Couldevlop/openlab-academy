      - num: "J17"
        title: "Exposer le cœur sans le modifier"
        evaluations: livrable
        archive: depot-python-j17.zip
        contenu: >-
          Séparer le métier de l'habillage, orienter les dépendances vers le cœur, et comprendre
          concrètement pourquoi le cœur ignore FastAPI.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez exposer l'effectif et la fiche d'un salarié par deux routes, sans écrire
              une seule ligne de calcul dans l'API.
          - titre: Le problème d'abord
            texte: >-
              La tentation est immense : écrire le filtre et le total directement dans la route, parce que
              c'est plus rapide à taper. Trois semaines plus tard, Django aura besoin des mêmes règles, et
              elles seront prisonnières de FastAPI.

              Le cœur que vous avez écrit en semaine 3 doit rester le seul endroit où vivent les règles.
          - titre: La notion
            texte: >-
              Une route est une fonction décorée par la méthode et le chemin. Son rôle tient en trois
              gestes : lire ce qui arrive, appeler le cœur, rendre le résultat. Rien d'autre.

              Un paramètre de chemin s'écrit entre accolades dans le chemin et devient un paramètre de la
              fonction, typé. FastAPI convertit et refuse automatiquement une valeur du mauvais type.

              Quand une ressource n'existe pas, la réponse doit porter le code 404 et un message. FastAPI
              fournit HTTPException pour cela. C'est la traduction d'un fait métier, l'absence, en langage
              HTTP : cette traduction appartient à l'API, jamais au cœur.
            figures:
              - nom: python-api-autour-du-coeur.svg
                legende: "L'API entoure le cœur et en dépend ; le cœur ne sait pas qu'elle existe"
            code:
              - titre: Deux routes qui ne calculent rien
                langage: python
                source: |
                  from fastapi import FastAPI, HTTPException

                  from rh.calculs import trouver_salarie
                  from rh.fichiers import charger_effectif

                  app = FastAPI(title="API RH")
                  EFFECTIF = charger_effectif("effectif.csv")


                  @app.get("/salaries")
                  def lister_salaries():
                      return EFFECTIF


                  @app.get("/salaries/{matricule}")
                  def lire_salarie(matricule: str):
                      fiche = trouver_salarie(EFFECTIF, matricule)
                      if fiche is None:
                          raise HTTPException(status_code=404, detail="Salarié inconnu")
                      return fiche
          - titre: À la main
            texte: >-
              Ajoutez les deux routes, lancez le serveur, et appelez-les depuis /docs. Demandez un matricule
              qui n'existe pas et observez la réponse : code 404, et le message que vous avez écrit.

              Ouvrez ensuite rh/calculs.py et cherchez le mot fastapi : il ne doit apparaître nulle part. Le
              cœur ne connaît ni les routes, ni les codes HTTP, ni les exceptions de la bibliothèque.

              Faites l'expérience inverse pour comprendre l'enjeu : imaginez que trouver_salarie lève
              directement une HTTPException. Votre code marcherait aujourd'hui, et serait inutilisable en
              journée 30, quand Django appellera la même fonction.
          - titre: L'astuce du jour
            texte: >-
              Le cœur ne connaît pas FastAPI. C'est la phrase à retenir de la semaine, et c'est ce que vos
              tests vérifieront automatiquement, en lisant les imports de vos modules.

              Cette discipline porte un nom dans le métier, l'architecture hexagonale, mais le nom importe
              moins que le réflexe : les règles au centre, les technologies autour, et des dépendances qui
              pointent toujours vers le centre.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la logique métier recopiée dans la route. Elle commence toujours petit :
              un filtre de trois lignes, puis un calcul, puis une règle. Un mois plus tard, personne ne sait
              plus quelle version fait foi.

              Le second piège est le chargement de l'effectif au moment de l'import, comme dans l'extrait
              ci-dessus. C'est acceptable aujourd'hui, pour rester simple ; retenez que la donnée est alors
              figée au démarrage, et que les journées Django y mettront bon ordre.
            tableaux:
              - titre: Ce que fait une route, et ce qu'elle ne fait pas
                entetes: [La route, Le cœur]
                lignes:
                  - ["lit les paramètres", "applique les règles"]
                  - ["appelle le cœur", "calcule"]
                  - ["traduit en code HTTP", "ignore HTTP"]
                  - ["rend du JSON", "rend des données Python"]
          - titre: Challenge du jour
            texte: >-
              Écrivez GET /salaries, qui rend l'effectif, et GET /salaries/{matricule}, qui rend une fiche
              ou répond 404 avec un message.

              Les tests livrés couvrent les deux routes et le cas inconnu. Un test lit le code source du
              paquet rh et échoue si le mot fastapi y apparaît, à quelque endroit que ce soit.

              Critères d'acceptation : aucun calcul dans les routes ; le 404 porte un message lisible ; le
              paquet rh n'importe pas fastapi.
        livrable: >-
          Écrire GET /salaries et GET /salaries/{matricule} avec un 404 propre ; un test vérifie que le
          paquet rh n'importe pas fastapi.
