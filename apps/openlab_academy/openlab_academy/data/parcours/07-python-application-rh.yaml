      - num: "J15"
        title: "Valider aux frontières avec Pydantic"
        evaluations: livrable
        archive: depot-python-j15.zip
        contenu: >-
          Un modèle d'entrée distinct du modèle métier, la validation à la frontière et nulle part ailleurs,
          et des messages d'erreur exploitables par l'appelant.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez refuser une donnée fausse dès son entrée dans l'application, avec un
              message précis, sans parsemer vos calculs de contrôles.
          - titre: Le problème d'abord
            texte: >-
              Votre chargement de fichier refuse déjà les salaires illisibles. Mais rien n'empêche un
              salaire négatif, une date d'embauche en 2097 ou un poste vide. Ces valeurs traverseront vos
              calculs et produiront des états absurdes.

              La tentation est d'ajouter un contrôle dans chaque fonction. C'est exactement ce qu'il ne faut
              pas faire : les calculs deviendraient illisibles et les contrôles finiraient par diverger.
          - titre: La notion
            texte: >-
              Pydantic décrit une donnée attendue par une classe dont les attributs portent un type. À la
              construction, la bibliothèque vérifie les types, applique vos contraintes, et lève une
              ValidationError détaillée qui nomme le champ fautif.

              Ce modèle d'entrée est distinct de la fiche manipulée par le cœur. Le modèle d'entrée décrit
              ce que le monde extérieur a le droit d'envoyer ; la fiche décrit ce avec quoi vos calculs
              travaillent. Les deux se ressemblent aujourd'hui et divergeront en journée 18.

              La frontière est l'endroit unique où la validation a lieu : le chargement du fichier
              aujourd'hui, la route de l'API en journée 18, le formulaire en journée 31. Au-delà de la
              frontière, les données sont réputées saines et le cœur ne contrôle plus rien.
            figures:
              - nom: python-frontiere-validation.svg
                legende: "La validation a lieu à la frontière ; au-delà, le cœur fait confiance"
            code:
              - titre: Un modèle d'entrée qui refuse ce qui n'a pas de sens
                langage: python
                source: |
                  from datetime import date

                  from pydantic import BaseModel, Field, field_validator


                  class SalarieEntrant(BaseModel):
                      nom: str = Field(min_length=1)
                      poste: str = Field(min_length=1)
                      date_embauche: date
                      salaire_fcfa: int = Field(ge=0)

                      @field_validator("date_embauche")
                      @classmethod
                      def pas_dans_le_futur(cls, valeur: date) -> date:
                          if valeur > date.today():
                              raise ValueError("la date d'embauche ne peut pas être dans le futur")
                          return valeur
          - titre: À la main
            texte: >-
              Installez pydantic, puis construisez un SalarieEntrant valide et affichez-le. Construisez-en
              ensuite un avec un salaire négatif et lisez la ValidationError : elle nomme le champ, la règle
              violée et la valeur reçue.

              Essayez un poste vide, puis une date d'embauche dans le futur. Observez que le message reste
              exploitable dans les trois cas, sans que vous ayez écrit un seul message vous-même pour les
              deux premiers.

              Branchez enfin le modèle sur votre chargement : chaque ligne du CSV passe par SalarieEntrant
              avant de devenir une fiche. Une ValidationError se transforme alors en DonneeInvalide, avec le
              numéro de ligne.
          - titre: L'astuce du jour
            texte: >-
              Un modèle d'entrée distinct du modèle métier. Cette séparation paraît superflue aujourd'hui,
              où les deux se ressemblent. Elle devient indispensable dès que l'API accepte un champ que le
              cœur ignore, ou que le cœur calcule un champ que personne n'envoie.

              C'est la même idée que le sens des imports de la journée 11 : les détails du monde extérieur
              ne remontent pas jusqu'au cœur.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est de valider partout. Un contrôle répété dans chaque fonction coûte du
              temps, alourdit la lecture, et crée des divergences : un jour une fonction refusera ce qu'une
              autre accepte.

              Le second piège est d'exposer à l'utilisateur la ValidationError brute, qui parle de types et
              de contraintes dans un vocabulaire de bibliothèque. Traduisez-la en message métier, comme vous
              l'avez fait en journée 13.
            tableaux:
              - titre: Où se place chaque responsabilité
                entetes: [Couche, Rôle, Ce qu'elle ne fait pas]
                lignes:
                  - ["Modèle d'entrée", "refuser ce qui n'a pas de sens", "calculer"]
                  - ["Chargement", "traduire l'erreur en message métier", "valider une seconde fois"]
                  - ["Cœur de calcul", "calculer sur des données saines", "contrôler les types"]
          - titre: Challenge du jour
            texte: >-
              Écrivez SalarieEntrant et branchez-le sur le chargement. Un salaire négatif, une date future
              ou un poste vide font échouer la ligne avec une DonneeInvalide qui nomme la ligne et le
              champ.

              Les tests livrés couvrent les trois refus et vérifient en plus que rh/calculs.py ne contient
              aucun contrôle de type ni de borne : le cœur reste nu. L'état des trois rapports de la semaine
              doit rester au vert.

              Critères d'acceptation : la validation n'existe qu'au chargement ; les trois refus donnent un
              message nommant le champ ; les tests des journées 11 à 14 passent toujours.
        livrable: >-
          Écrire SalarieEntrant qui refuse salaire négatif, date future et poste vide ; le cœur reste sans
          validation et les trois états restent au vert.
