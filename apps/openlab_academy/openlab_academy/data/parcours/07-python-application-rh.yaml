      - num: "J27"
        title: "Modèles et migrations"
        evaluations: livrable
        contenu: >-
          Décrire les données par des classes, générer les migrations, les appliquer, et comprendre
          pourquoi une migration est un journal et non un script jetable.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez décrire l'effectif, les postes et les absences dans la base, avec les
              contraintes qui empêchent les données incohérentes.
          - titre: Le problème d'abord
            texte: >-
              Votre fichier CSV accepte deux salariés avec le même matricule, un poste écrit de trois
              façons, et une absence qui finit avant de commencer. Aucune de ces incohérences ne doit
              pouvoir entrer en base.
          - titre: La notion
            texte: >-
              Un modèle est une classe dont les attributs sont des champs typés. Django en déduit le schéma
              de la base. Une clé étrangère relie deux modèles ; une contrainte d'unicité interdit les
              doublons ; une contrainte de vérification refuse une valeur absurde.

              Une migration est un fichier Python généré qui décrit le passage d'un état du schéma au
              suivant. Elle est versionnée et rejouée à l'identique sur chaque environnement : c'est le
              journal des changements de votre base.

              La règle de travail : une migration par intention. Plusieurs modifications sans rapport dans
              une même migration deviennent impossibles à relire et à annuler.
            figures:
              - nom: python-migrations.svg
                legende: "Le modèle change, la migration enregistre le passage, la base suit partout pareil"
            code:
              - titre: Trois modèles et leurs contraintes
                langage: python
                source: |
                  from django.db import models


                  class Poste(models.Model):
                      libelle = models.CharField(max_length=60, unique=True)


                  class Salarie(models.Model):
                      matricule = models.CharField(max_length=20, unique=True)
                      nom = models.CharField(max_length=120)
                      poste = models.ForeignKey(Poste, on_delete=models.PROTECT)
                      date_embauche = models.DateField()
                      salaire_fcfa = models.PositiveIntegerField()


                  class Absence(models.Model):
                      salarie = models.ForeignKey(Salarie, on_delete=models.CASCADE)
                      debut = models.DateField()
                      fin = models.DateField()

                      class Meta:
                          constraints = [
                              models.CheckConstraint(condition=models.Q(fin__gte=models.F("debut")),
                                                     name="absence_fin_apres_debut"),
                          ]
          - titre: À la main
            texte: >-
              Écrivez les trois modèles, générez les migrations, puis ouvrez le fichier produit : vous y
              lisez la création des tables, champ par champ. Appliquez-les.

              Essayez ensuite de créer deux salariés avec le même matricule depuis le shell du projet : la
              base refuse. Essayez une absence qui finit avant de commencer : la contrainte refuse aussi.
              Les règles sont tenues par la base, pas seulement par votre code.

              Modifiez enfin un champ, régénérez une migration, et lisez-la : vous voyez l'opération de
              modification, et non une nouvelle création. C'est le journal qui s'écrit.
          - titre: L'astuce du jour
            texte: >-
              Une migration par intention. Ajouter un champ est une intention ; renommer une table en est
              une autre. Deux migrations séparées se relisent, s'annulent et se transportent sans douleur.

              Relisez toujours la migration générée avant de l'appliquer. Django devine bien, mais pas
              toujours : un renommage de champ est parfois interprété comme une suppression suivie d'une
              création, ce qui perd des données.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la modification de la base à la main. Ouvrir le fichier SQLite et
              ajouter une colonne fonctionne un soir et casse tout le reste : la base d'un collègue ne
              bouge pas, et la prochaine migration part d'un état faux.

              Le second piège est la migration oubliée dans le dépôt. Si le fichier n'est pas versionné,
              votre schéma n'existe que chez vous : personne d'autre ne peut reconstruire la base.
          - titre: Challenge du jour
            texte: >-
              Livrez les trois modèles avec leurs contraintes, et leurs migrations appliquées.

              Les tests livrés créent un salarié, puis en créent un second avec le même matricule et
              vérifient que la base refuse. Un autre test vérifie qu'une absence dont la fin précède le
              début est refusée.

              Critères d'acceptation : trois modèles, trois contraintes ; les migrations sont dans le
              dépôt ; la base refuse les deux incohérences.
        livrable: >-
          Écrire les modèles Salarie, Poste et Absence avec leurs contraintes ; les tests portent sur
          l'unicité du matricule.
