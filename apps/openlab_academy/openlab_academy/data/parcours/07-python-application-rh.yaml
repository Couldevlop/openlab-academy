      - num: "J33"
        title: "Rôles et permissions"
        evaluations: livrable
        contenu: >-
          Des groupes RH et manager, des permissions vérifiées au serveur, et la différence entre masquer
          un bouton et protéger une page.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez donner à chaque rôle ce qu'il doit voir, et prouver par un test qu'un
              manager ne peut pas lire un salaire.
          - titre: Le problème d'abord
            texte: >-
              Tous vos utilisateurs connectés voient la même chose. Or le chef d'atelier a besoin de
              l'effectif et des absences de son équipe, et n'a aucune raison de connaître les salaires.
          - titre: La notion
            texte: >-
              Un groupe rassemble des permissions, et un utilisateur appartient à des groupes. Django crée
              des permissions par modèle ; vous pouvez en déclarer d'autres, par exemple le droit de
              consulter les salaires.

              La vérification se fait au serveur, dans la vue : un décorateur exige une permission, ou un
              test explicite décide quoi afficher. Le gabarit peut masquer un bouton pour le confort, mais
              ce masquage ne protège rien.

              La règle, qui vaut au-delà de Django : chaque chemin d'accès à une donnée sensible se vérifie
              là où la donnée est servie, et non là où elle est affichée.
            figures:
              - nom: python-roles-permissions.svg
                legende: "Deux rôles, quatre pages : le droit se vérifie au serveur, page par page"
            code:
              - titre: Une permission vérifiée là où la donnée est servie
                langage: python
                source: |
                  from django.contrib.auth.decorators import login_required, permission_required
                  from django.shortcuts import render

                  from effectif.models import Salarie

                  CHAMPS_PUBLICS = ("matricule", "nom", "poste__libelle")


                  @login_required
                  def liste_salaries(requete):
                      champs = CHAMPS_PUBLICS
                      if requete.user.has_perm("effectif.voir_salaire"):
                          champs = champs + ("salaire_fcfa",)
                      salaries = Salarie.objects.values(*champs).order_by("nom")
                      return render(requete, "effectif/liste.html",
                                    {"salaries": salaries, "champs": champs})


                  @login_required
                  @permission_required("effectif.voir_salaire", raise_exception=True)
                  def etat_masse_salariale(requete):
                      return render(requete, "effectif/masse.html", {})
          - titre: À la main
            texte: >-
              Déclarez la permission de consultation des salaires sur le modèle, créez les groupes RH et
              manager, et attribuez la permission au seul groupe RH. Créez deux utilisateurs, un par
              groupe.

              Connectez-vous en manager : la colonne des salaires disparaît, et la page de masse salariale
              répond un refus. Connectez-vous en RH : tout apparaît.

              Faites enfin l'expérience du faux sentiment de sécurité : remettez la colonne dans le gabarit
              en la masquant par une condition d'affichage, et regardez le contexte envoyé à la page. La
              donnée est là, dans la réponse, même si elle ne s'affiche pas. C'est pourquoi la requête
              elle-même ne doit pas la ramener.
          - titre: L'astuce du jour
            texte: >-
              Les droits se vérifient au serveur, et la requête ne ramène que ce que l'utilisateur a le
              droit de voir. Filtrer les champs dans la requête, comme dans l'extrait du jour, est plus sûr
              que filtrer à l'affichage.

              Cette habitude vous protège aussi des fuites par les canaux auxquels vous ne pensez pas : une
              exportation, une réponse d'API, un message d'erreur trop bavard.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est le bouton masqué pris pour une protection. Masquer un lien n'empêche
              personne de taper l'adresse ; masquer une colonne n'empêche pas la donnée d'être envoyée.

              Le second piège est la permission vérifiée à un seul endroit alors que la donnée a plusieurs
              portes : la page, l'export, l'API. Chaque porte se vérifie, et c'est pourquoi le test du jour
              passe en revue chaque page pour chaque rôle.
            tableaux:
              - titre: Ce que chaque rôle voit
                entetes: [Page, RH, Manager]
                lignes:
                  - ["Liste de l'effectif", "avec les salaires", "sans les salaires"]
                  - ["Fiche d'un salarié", "complète", "sans le salaire"]
                  - ["Masse salariale", "oui", "refus"]
                  - ["Absences de l'équipe", "oui", "oui"]
          - titre: Challenge du jour
            texte: >-
              Déclarez la permission, créez les deux groupes, et appliquez la règle du tableau ci-dessus.

              Les tests livrés parcourent chaque page pour chaque rôle et vérifient le code de réponse et
              le contenu. Un test vérifie qu'aucun salaire ne figure dans la réponse envoyée à un manager,
              même masqué dans la page.

              Critères d'acceptation : deux groupes, une permission ; quatre pages vérifiées pour deux
              rôles ; aucune donnée sensible dans une réponse non autorisée.
        livrable: >-
          Cacher les salaires au manager ; un test par rôle couvre chaque page, et vérifie la réponse
          envoyée, pas seulement l'affichage.
