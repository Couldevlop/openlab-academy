      - num: "J20"
        title: "Tester l'API et sortir les secrets du code"
        evaluations: livrable
        archive: depot-python-j20.zip
        contenu: >-
          Une suite de tests d'API, la configuration par variables d'environnement, le fichier d'exemple
          suivi et le fichier réel jamais versionné.
        cours:
          - titre: Ce que vous saurez faire ce soir
            texte: >-
              Ce soir, vous saurez tester toutes vos routes sans lancer de serveur, et configurer votre
              application sans écrire la moindre valeur sensible dans le code.
          - titre: Le problème d'abord
            texte: >-
              Votre API lit un chemin de fichier écrit en dur et, bientôt, parlera à une base de données
              avec un mot de passe. Écrire ces valeurs dans le code les envoie dans le dépôt, donc chez
              tous ceux qui le récupèrent, et pour toujours dans l'historique.
          - titre: La notion
            texte: >-
              Une variable d'environnement est une valeur fournie par le système au programme qui démarre.
              La bibliothèque pydantic-settings décrit ces valeurs par une classe, avec leurs types et leurs
              valeurs par défaut, et lit en plus un fichier nommé .env pendant le développement.

              Le fichier .env n'est jamais versionné. Un fichier .env.exemple, lui, est versionné : il liste
              les variables attendues avec des valeurs d'exemple, pour que quiconque récupère le dépôt
              sache quoi remplir.

              TestClient, fourni avec FastAPI, appelle votre application sans serveur. Les tests d'API se
              lancent donc comme les autres, en une commande, et restent rapides.
            code:
              - titre: Une configuration sans secret dans le code
                langage: python
                source: |
                  from pydantic_settings import BaseSettings, SettingsConfigDict


                  class Configuration(BaseSettings):
                      model_config = SettingsConfigDict(env_file=".env")

                      chemin_effectif: str = "effectif.csv"
                      cle_api: str = ""   # vide par défaut : jamais de secret écrit ici


                  configuration = Configuration()
          - titre: À la main
            texte: >-
              Créez .env.exemple avec les deux variables et des valeurs d'exemple, puis .env avec vos
              vraies valeurs locales. Ajoutez .env au fichier .gitignore, et vérifiez que votre outil de
              version ne le propose plus.

              Lancez l'application et vérifiez qu'elle lit bien le chemin depuis la configuration. Changez
              la valeur dans .env, relancez, et observez l'effet sans avoir touché au code.

              Écrivez enfin un test qui parcourt les fichiers du dépôt et échoue si un motif de secret y
              apparaît, par exemple une clé écrite en clair. Faites-le échouer volontairement une fois, en
              ajoutant une fausse clé dans un fichier, pour vérifier qu'il détecte bien.
          - titre: L'astuce du jour
            texte: >-
              Le fichier d'exemple est suivi, le fichier réel ne l'est jamais. Cette règle simple évite
              l'accident le plus fréquent et le plus coûteux du métier : une clé publiée dans un dépôt.

              Un secret publié reste dans l'historique même après suppression. La seule réaction correcte
              est de le révoquer immédiatement, puis de nettoyer. Mieux vaut l'empêcher par un test.
          - titre: Le piège du jour
            texte: >-
              Le piège du jour est la clé écrite en dur « juste pour essayer ». Elle finit toujours dans un
              commit, parce que personne ne se souvient de la retirer.

              Le second piège est le fichier .env ajouté au dépôt par inadvertance, souvent par une commande
              qui ajoute tout. Vérifiez votre .gitignore avant le premier envoi, et faites confiance au
              test plutôt qu'à votre mémoire.
            tableaux:
              - titre: Où vit chaque valeur
                entetes: [Valeur, Où elle vit, Versionnée]
                lignes:
                  - ["Chemin du fichier d'effectif", ".env", "non"]
                  - ["Liste des variables attendues", ".env.exemple", "oui"]
                  - ["Valeur par défaut inoffensive", "la classe de configuration", "oui"]
                  - ["Clé d'API", ".env, et jamais ailleurs", "non"]
          - titre: Challenge du jour
            texte: >-
              Rendez la suite d'API complète et verte : les quatre routes de la semaine, leurs cas d'erreur,
              et la configuration lue depuis l'environnement.

              Ajoutez le test qui refuse tout secret en dur dans le dépôt. Le dépôt du jour contient un
              fichier piégé avec une fausse clé : votre test doit le détecter, puis vous le retirez.

              Critères d'acceptation : aucune valeur sensible dans le code ; .env absent du dépôt et
              .env.exemple présent ; la suite complète passe en une commande.
        livrable: >-
          Rendre la suite d'API verte et ajouter le test qui refuse tout secret en dur dans le dépôt.
