<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="La validation a lieu à la frontière, une seule fois">
<title>La validation a lieu à la frontière, une seule fois</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="320" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Un modèle d&#x27;entrée à la porte ; aucun contrôle au-delà.</text>
<rect x="40" y="95" width="190" height="120" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="135" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Monde extérieur</text>
<text x="135" y="148" text-anchor="middle" font-size="11" fill="var(--encre2)">fichier CSV</text>
<text x="135" y="163" text-anchor="middle" font-size="11" fill="var(--encre2)">requête d&#x27;API</text>
<text x="135" y="178" text-anchor="middle" font-size="11" fill="var(--encre2)">formulaire</text>
<rect x="285" y="95" width="190" height="120" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="380" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">SalarieEntrant</text>
<text x="380" y="148" text-anchor="middle" font-size="11" fill="var(--encre2)">types vérifiés</text>
<text x="380" y="163" text-anchor="middle" font-size="11" fill="var(--encre2)">salaire positif</text>
<text x="380" y="178" text-anchor="middle" font-size="11" fill="var(--encre2)">date pas future</text>
<rect x="530" y="95" width="190" height="120" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="625" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Cœur de calcul</text>
<text x="625" y="148" text-anchor="middle" font-size="11" fill="var(--encre2)">données saines</text>
<text x="625" y="163" text-anchor="middle" font-size="11" fill="var(--encre2)">aucun contrôle</text>
<text x="625" y="178" text-anchor="middle" font-size="11" fill="var(--encre2)">que du métier</text>
<path d="M 238 155 L 277 155" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<path d="M 483 155 L 522 155" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<text x="380" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="var(--s1)">Refusé ici, avec le champ nommé.</text>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="var(--encre2)">Valider dans chaque fonction coûte cher et finit par diverger.</text>
</svg>
