<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Le cœur au centre, les habillages autour">
<title>Le cœur au centre, les habillages autour</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="340" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Les trois habillages dépendent du cœur ; le cœur n&#x27;en connaît aucun.</text>
<rect x="290" y="140" width="180" height="90" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="380" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">rh/</text>
<text x="380" y="194" text-anchor="middle" font-size="11" fill="var(--encre2)">règles et calculs</text>
<text x="380" y="214" text-anchor="middle" font-size="11" fill="var(--attenue)">semaine 3</text>
<rect x="60" y="90" width="160" height="56" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="140" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">FastAPI</text>
<text x="140" y="133" text-anchor="middle" font-size="10" fill="var(--encre2)">semaine 4</text>
<rect x="540" y="90" width="160" height="56" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Streamlit</text>
<text x="620" y="133" text-anchor="middle" font-size="10" fill="var(--encre2)">semaine 5</text>
<rect x="300" y="276" width="160" height="56" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="380" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Django</text>
<text x="380" y="319" text-anchor="middle" font-size="10" fill="var(--encre2)">semaines 6 et 7</text>
<path d="M 190 132 L 286 164" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 570 132 L 474 164" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<path d="M 380 270 L 380 236" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<text x="380" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Une flèche qui partirait du cœur rendrait le cœur inutilisable ailleurs.</text>
</svg>
