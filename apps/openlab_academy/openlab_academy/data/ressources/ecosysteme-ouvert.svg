<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Ce qui entoure l&#x27;agent, et ce que chaque brique apporte">
<title>Ce qui entoure l&#x27;agent, et ce que chaque brique apporte</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="920" height="440" fill="var(--surface)"/>
<rect x="26" y="104" width="196" height="180" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="124" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Donnees metier</text>
<text x="124" y="166" text-anchor="middle" font-size="12" fill="var(--encre2)">Odoo</text>
<text x="124" y="192" text-anchor="middle" font-size="12" fill="var(--encre2)">Dolibarr</text>
<text x="124" y="218" text-anchor="middle" font-size="12" fill="var(--encre2)">ERPNext</text>
<text x="124" y="262" text-anchor="middle" font-size="10" fill="var(--encre2)">d&#x27;ou viennent les factures</text>
<rect x="248" y="104" width="196" height="180" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="346" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Documents</text>
<text x="346" y="166" text-anchor="middle" font-size="12" fill="var(--encre2)">Nextcloud</text>
<text x="346" y="262" text-anchor="middle" font-size="10" fill="var(--encre2)">les justificatifs, par WebDAV</text>
<rect x="470" y="104" width="196" height="180" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="568" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Identite</text>
<text x="568" y="166" text-anchor="middle" font-size="12" fill="var(--encre2)">Keycloak</text>
<text x="568" y="262" text-anchor="middle" font-size="10" fill="var(--encre2)">qui a valide, de maniere opposable</text>
<rect x="692" y="104" width="196" height="180" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="790" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Pilotage</text>
<text x="790" y="166" text-anchor="middle" font-size="12" fill="var(--encre2)">Metabase</text>
<text x="790" y="192" text-anchor="middle" font-size="12" fill="var(--encre2)">n8n</text>
<text x="790" y="218" text-anchor="middle" font-size="12" fill="var(--encre2)">Grafana</text>
<text x="790" y="262" text-anchor="middle" font-size="10" fill="var(--encre2)">mesurer, declencher, surveiller</text>
<text x="460" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Un agent utile vit dans un systeme d&#x27;information, pas tout seul.</text>
<text x="460" y="68" text-anchor="middle" font-size="12" fill="var(--encre2)">Chaque brique ajoute une dependance : on ne l&#x27;ajoute que contre un besoin nomme.</text>
<rect x="120" y="322" width="680" height="76" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="460" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">La question a poser avant chaque branchement</text>
<text x="460" y="372" text-anchor="middle" font-size="11" fill="var(--encre2)">que se passe-t-il quand ce service est indisponible, lent, ou renvoie faux ?</text>
<text x="460" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Pas de reponse ecrite a cette question : pas de branchement.</text>
</svg>
