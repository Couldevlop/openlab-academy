<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-label="Quatre prompts nets, quatre validations">
<title>Quatre prompts nets, quatre validations</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="940" height="420" fill="var(--surface)"/>
<rect x="30" y="96" width="200" height="104" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="130" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">1 Extraire</text>
<text x="130" y="148" text-anchor="middle" font-size="10" fill="var(--encre2)">lister les exigences,</text>
<text x="130" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">sans commentaire</text>
<rect x="30" y="240" width="200" height="50" rx="8" class="b-s3" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="130" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="var(--encre)">validation humaine</text>
<text x="130" y="280" text-anchor="middle" font-size="10" fill="var(--encre2)">une liste vérifiable</text>
<path d="M 130 200 L 130 236" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<path d="M 230 265 L 258 265" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 258 150 L 230 150" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="258" y="96" width="200" height="104" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="358" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">2 Analyser</text>
<text x="358" y="148" text-anchor="middle" font-size="10" fill="var(--encre2)">évaluer la couverture</text>
<text x="358" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">de chaque exigence</text>
<rect x="258" y="240" width="200" height="50" rx="8" class="b-s3" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="358" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="var(--encre)">validation humaine</text>
<text x="358" y="280" text-anchor="middle" font-size="10" fill="var(--encre2)">une matrice d&#x27;écarts</text>
<path d="M 358 200 L 358 236" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<path d="M 458 265 L 486 265" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 486 150 L 458 150" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="486" y="96" width="200" height="104" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="586" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">3 Rédiger</text>
<text x="586" y="148" text-anchor="middle" font-size="10" fill="var(--encre2)">produire le texte à partir</text>
<text x="586" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">de la matrice</text>
<rect x="486" y="240" width="200" height="50" rx="8" class="b-s3" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="586" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="var(--encre)">validation humaine</text>
<text x="586" y="280" text-anchor="middle" font-size="10" fill="var(--encre2)">un texte ancré</text>
<path d="M 586 200 L 586 236" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<path d="M 686 265 L 714 265" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 714 150 L 686 150" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="714" y="96" width="200" height="104" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="814" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">4 Réviser</text>
<text x="814" y="148" text-anchor="middle" font-size="10" fill="var(--encre2)">relire sous l&#x27;angle</text>
<text x="814" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">du destinataire</text>
<rect x="714" y="240" width="200" height="50" rx="8" class="b-s3" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="814" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="var(--encre)">validation humaine</text>
<text x="814" y="280" text-anchor="middle" font-size="10" fill="var(--encre2)">un livrable relu</text>
<path d="M 814 200 L 814 236" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="30" y="50" text-anchor="start" font-size="15" font-weight="600" fill="var(--encre)">Quand un prompt échoue, découpez : n&#x27;allongez pas</text>
<text x="30" y="72" text-anchor="start" font-size="11" fill="var(--encre2)">une tâche par prompt, un format de sortie par prompt, un point de validation par étape</text>
<text x="470" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Une erreur vue à l&#x27;étape 1 coûte une reformulation ; vue à l&#x27;étape 4, elle a contaminé le livrable.</text>
<text x="470" y="372" text-anchor="middle" font-size="11" fill="var(--encre2)">Une fois éprouvée, la chaîne s&#x27;écrit une fois, se rejoue, puis se code : c&#x27;est le graphe de la séance 11.</text>
</svg>
