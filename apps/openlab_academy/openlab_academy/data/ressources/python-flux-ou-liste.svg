<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Construire une liste entière, ou produire au fil de l&#x27;eau">
<title>Construire une liste entière, ou produire au fil de l&#x27;eau</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une liste occupe la mémoire ; un générateur la traverse.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Même résultat, même code ou presque, et une machine qui ne sature plus.</text>
<text x="40" y="100" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">Liste intermédiaire</text>
<rect x="230" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="286" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="342" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="398" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="454" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="510" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="566" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<rect x="622" y="86" width="48" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="690" y="108" text-anchor="start" font-size="11" fill="var(--encre2)">en mémoire</text>
<text x="40" y="128" text-anchor="start" font-size="11" fill="var(--encre2)">les 8 valeurs existent en même temps</text>
<text x="40" y="194" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">Générateur</text>
<rect x="230" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<rect x="286" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<rect x="342" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<rect x="398" y="180" width="48" height="34" rx="8" class="b-s1" fill="var(--surface)"/>
<rect x="454" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<rect x="510" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<rect x="566" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<rect x="622" y="180" width="48" height="34" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="690" y="202" text-anchor="start" font-size="11" fill="var(--encre2)">une à la fois</text>
<text x="40" y="222" text-anchor="start" font-size="11" fill="var(--encre2)">yield rend la valeur, puis reprend là</text>
<rect x="140" y="258" width="480" height="58" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="380" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Un générateur ne se parcourt qu&#x27;une fois</text>
<text x="380" y="302" text-anchor="middle" font-size="11" fill="var(--encre2)">pour le relire, convertissez-le en liste, en connaissance de cause</text>
</svg>
