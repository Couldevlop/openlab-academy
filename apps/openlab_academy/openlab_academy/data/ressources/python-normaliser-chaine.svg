<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Mettre deux noms dans la même forme avant de les comparer">
<title>Mettre deux noms dans la même forme avant de les comparer</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="310" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Deux noms identiques à l&#x27;oeil peuvent différer pour la machine.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Espaces en trop, majuscules, casse : on normalise avant de comparer.</text>
<rect x="40" y="104" width="134" height="64" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="107" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">&quot;  AWA kone &quot;</text>
<text x="107" y="154" text-anchor="middle" font-size="11" fill="var(--encre2)">saisi à la main</text>
<rect x="222" y="104" width="134" height="64" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="289" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">.strip()</text>
<text x="289" y="154" text-anchor="middle" font-size="11" fill="var(--encre2)">sans les espaces</text>
<rect x="404" y="104" width="134" height="64" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="471" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">.lower()</text>
<text x="471" y="154" text-anchor="middle" font-size="11" fill="var(--encre2)">tout en minuscules</text>
<rect x="586" y="104" width="134" height="64" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="653" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">&quot;awa kone&quot;</text>
<text x="653" y="154" text-anchor="middle" font-size="11" fill="var(--encre2)">comparable</text>
<path d="M 178 136 L 216 136" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 360 136 L 398 136" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 542 136 L 580 136" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="40" y="206" width="330" height="62" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="205" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">&quot;Awa Kone&quot; == &quot;awa kone&quot;</text>
<text x="205" y="250" text-anchor="middle" font-size="11" fill="var(--encre2)">faux : la machine compare caractère par caractère</text>
<rect x="400" y="206" width="320" height="62" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="560" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">normaliser puis comparer</text>
<text x="560" y="250" text-anchor="middle" font-size="11" fill="var(--encre2)">une seule fonction, appelée des deux côtés</text>
<text x="380" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Affichez le nom tel qu&#x27;il a été saisi ; comparez la forme normalisée.</text>
</svg>
