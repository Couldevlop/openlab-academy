<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="Trois topologies multi-agents">
<title>Trois topologies multi-agents</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="780" height="340" fill="var(--surface)"/>
<text x="130" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Superviseur</text>
<rect x="76" y="64" width="108" height="34" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="130" y="86" text-anchor="middle" font-size="11" fill="var(--encre)">superviseur</text>
<rect x="10" y="150" width="108" height="34" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="64" y="172" text-anchor="middle" font-size="11" fill="var(--encre)">analyste</text>
<path d="M 130 98 L 64 146" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<rect x="140" y="150" width="108" height="34" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="194" y="172" text-anchor="middle" font-size="11" fill="var(--encre)">rédacteur</text>
<path d="M 130 98 L 194 146" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<text x="130" y="212" text-anchor="middle" font-size="11" fill="var(--encre2)">un décideur, des exécutants</text>
<text x="130" y="227" text-anchor="middle" font-size="11" fill="var(--encre2)">coût : un tour de plus</text>
<text x="390" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Chaîne</text>
<rect x="336" y="64" width="108" height="34" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="390" y="86" text-anchor="middle" font-size="11" fill="var(--encre)">segmenter</text>
<rect x="336" y="120" width="108" height="34" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="390" y="142" text-anchor="middle" font-size="11" fill="var(--encre)">analyser</text>
<path d="M 390 110 L 390 116" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="336" y="176" width="108" height="34" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="390" y="198" text-anchor="middle" font-size="11" fill="var(--encre)">rédiger</text>
<path d="M 390 166 L 390 172" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="390" y="248" text-anchor="middle" font-size="11" fill="var(--encre2)">ordre connu d&#x27;avance</text>
<text x="390" y="263" text-anchor="middle" font-size="11" fill="var(--encre2)">coût : rigidité</text>
<text x="650" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Pairs</text>
<rect x="596" y="64" width="108" height="34" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="650" y="86" text-anchor="middle" font-size="11" fill="var(--encre)">agent A</text>
<rect x="596" y="160" width="108" height="34" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="650" y="182" text-anchor="middle" font-size="11" fill="var(--encre)">agent B</text>
<path d="M 716 82 q 34 48 0 96" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 584 178 q -34 -48 0 -96" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<text x="650" y="212" text-anchor="middle" font-size="11" fill="var(--encre2)">négociation directe</text>
<text x="650" y="227" text-anchor="middle" font-size="11" fill="var(--encre2)">coût : difficile à tracer</text>
<text x="390" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Un agent de plus, c&#x27;est un budget de plus : la topologie se justifie par le besoin.</text>
</svg>
