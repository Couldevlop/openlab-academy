<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Un formulaire branché sur le cœur métier">
<title>Un formulaire branché sur le cœur métier</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">L&#x27;écran recueille ; le cœur décide.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">La règle d&#x27;embauche ne se réécrit pas dans l&#x27;écran : elle s&#x27;appelle.</text>
<rect x="40" y="104" width="200" height="74" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="140" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Formulaire</text>
<text x="140" y="158" text-anchor="middle" font-size="11" fill="var(--encre2)">nom, poste, salaire</text>
<rect x="280" y="104" width="200" height="74" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="380" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Validation</text>
<text x="380" y="158" text-anchor="middle" font-size="11" fill="var(--encre2)">des champs bien formés</text>
<rect x="520" y="104" width="200" height="74" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="620" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Cœur métier</text>
<text x="620" y="158" text-anchor="middle" font-size="11" fill="var(--encre2)">la règle d&#x27;embauche</text>
<path d="M 248 140 L 272 140" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<path d="M 488 140 L 512 140" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="270" y="222" width="450" height="62" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="495" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Refus du cœur : le message revient dans l&#x27;écran</text>
<text x="495" y="268" text-anchor="middle" font-size="11" fill="var(--encre2)">le champ fautif est désigné, la saisie est conservée</text>
<path d="M 560 186 L 470 216" fill="none" stroke="var(--bon)" stroke-width="2" marker-end="url(#pointe-bon)"/>
<text x="150" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">Jamais deux règles</text>
<text x="150" y="268" text-anchor="middle" font-size="11" fill="var(--encre2)">une dans l&#x27;écran, une dans le cœur</text>
<text x="380" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">L&#x27;écran peut changer de technologie ; la règle, elle, reste au même endroit.</text>
</svg>
