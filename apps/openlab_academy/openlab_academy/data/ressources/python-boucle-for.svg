<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Les tours d&#x27;une boucle et l&#x27;accumulateur qui leur survit">
<title>Les tours d&#x27;une boucle et l&#x27;accumulateur qui leur survit</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une boucle fait un tour par élément.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Ce qui doit durer se déclare hors de la boucle, avant elle.</text>
<rect x="40" y="92" width="150" height="50" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="115" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">total = 0</text>
<rect x="226" y="92" width="160" height="112" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="306" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">tour 1</text>
<text x="306" y="144" text-anchor="middle" font-size="13" fill="var(--encre)">Awa</text>
<text x="306" y="168" text-anchor="middle" font-size="12" fill="var(--s1)">+ 250000</text>
<text x="306" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">total = 250000</text>
<rect x="406" y="92" width="160" height="112" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="486" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">tour 2</text>
<text x="486" y="144" text-anchor="middle" font-size="13" fill="var(--encre)">Bakary</text>
<text x="486" y="168" text-anchor="middle" font-size="12" fill="var(--s1)">+ 180000</text>
<text x="486" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">total = 430000</text>
<path d="M 382 148 L 398 148" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="586" y="92" width="160" height="112" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="666" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">tour 3</text>
<text x="666" y="144" text-anchor="middle" font-size="13" fill="var(--encre)">Céline</text>
<text x="666" y="168" text-anchor="middle" font-size="12" fill="var(--s1)">+ 320000</text>
<text x="666" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">total = 750000</text>
<path d="M 562 148 L 578 148" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 196 148 L 218 148" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="40" y="240" width="200" height="58" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="140" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">for : on sait combien</text>
<text x="140" y="284" text-anchor="middle" font-size="11" fill="var(--encre2)">une liste, une plage, un fichier</text>
<rect x="270" y="240" width="230" height="58" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="385" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">while : on attend une condition</text>
<text x="385" y="284" text-anchor="middle" font-size="11" fill="var(--encre2)">une saisie juste, un solde épuisé</text>
<rect x="530" y="240" width="190" height="58" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="625" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">total dans la boucle</text>
<text x="625" y="284" text-anchor="middle" font-size="11" fill="var(--encre2)">remis à zéro à chaque tour</text>
</svg>
