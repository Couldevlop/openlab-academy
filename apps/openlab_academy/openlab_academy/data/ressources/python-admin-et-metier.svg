<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Ce que l&#x27;administration couvre, et où elle s&#x27;arrête">
<title>Ce que l&#x27;administration couvre, et où elle s&#x27;arrête</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="320" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">L&#x27;administration est un back-office, pas votre application.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Elle sert l&#x27;équipe interne ; elle ne porte pas la règle métier.</text>
<rect x="40" y="92" width="330" height="170" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="205" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Ce qu&#x27;elle couvre très bien</text>
<text x="205" y="146" text-anchor="middle" font-size="12" fill="var(--encre2)">corriger une fiche à la main</text>
<text x="205" y="174" text-anchor="middle" font-size="12" fill="var(--encre2)">chercher, filtrer, trier</text>
<text x="205" y="202" text-anchor="middle" font-size="12" fill="var(--encre2)">voir qui a changé quoi</text>
<text x="205" y="230" text-anchor="middle" font-size="12" fill="var(--encre2)">ouvrir l&#x27;accès à un gestionnaire</text>
<rect x="394" y="92" width="326" height="170" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="557" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Ce qu&#x27;elle ne doit pas porter</text>
<text x="557" y="146" text-anchor="middle" font-size="12" fill="var(--encre2)">le calcul des congés</text>
<text x="557" y="174" text-anchor="middle" font-size="12" fill="var(--encre2)">les règles d&#x27;embauche</text>
<text x="557" y="202" text-anchor="middle" font-size="12" fill="var(--encre2)">un écran pour les managers</text>
<text x="557" y="230" text-anchor="middle" font-size="12" fill="var(--encre2)">les accès des salariés</text>
<text x="380" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Un compte d&#x27;administration ne se crée jamais dans une migration : chacun le sien.</text>
</svg>
