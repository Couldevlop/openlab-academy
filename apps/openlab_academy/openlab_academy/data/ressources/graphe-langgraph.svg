<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Le fil rouge écrit comme un graphe d&#x27;états">
<title>Le fil rouge écrit comme un graphe d&#x27;états</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="880" height="420" fill="var(--surface)"/>
<rect x="360" y="96" width="160" height="54" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="440" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">decider</text>
<rect x="170" y="214" width="160" height="54" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="250" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">agir</text>
<rect x="560" y="214" width="180" height="54" rx="8" class="b-s2" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="650" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">valider</text>
<text x="650" y="258" text-anchor="middle" font-size="10" fill="var(--encre2)">pause humaine</text>
<rect x="370" y="326" width="140" height="48" rx="8" class="b-attenue" fill="var(--surface)"/>
<text x="440" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">fin</text>
<path d="M 440 72 L 440 92" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<text x="440" y="64" text-anchor="middle" font-size="11" fill="var(--encre2)">entrée</text>
<path d="M 380 150 L 280 210" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="290" y="186" text-anchor="end" font-size="10" fill="var(--encre2)">appel d&#x27;outil demandé</text>
<path d="M 510 150 L 620 210" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<text x="600" y="186" text-anchor="start" font-size="10" fill="var(--encre2)">écriture demandée</text>
<path d="M 250 268 L 390 330" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 650 268 L 500 330" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 250 214 L 250 170 L 356 170" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="250" y="160" text-anchor="middle" font-size="10" fill="var(--encre2)">observation renvoyée</text>
<rect x="40" y="326" width="240" height="60" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="160" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Point de sauvegarde</text>
<text x="160" y="370" text-anchor="middle" font-size="10" fill="var(--encre2)">écrit après chaque nœud</text>
<text x="440" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Les nœuds sont vos fonctions ; les arêtes sont vos conditions d&#x27;enchaînement.</text>
<text x="440" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Le cadre fournit la reprise et la pause humaine ; la logique métier reste la vôtre.</text>
</svg>
