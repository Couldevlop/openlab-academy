<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Le sens devient de la geometrie">
<title>Le sens devient de la geometrie</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="920" height="440" fill="var(--surface)"/>
<rect x="30" y="70" width="440" height="300" rx="8" class="b-grille" fill="var(--surface)"/>
<text x="250" y="56" text-anchor="middle" font-size="11" fill="var(--encre2)">deux dimensions, des centaines en realite</text>
<circle cx="110" cy="130" r="5" fill="var(--s1)"/>
<text x="122" y="134" text-anchor="start" font-size="11" fill="var(--encre2)">chien</text>
<circle cx="158" cy="158" r="5" fill="var(--s1)"/>
<text x="170" y="162" text-anchor="start" font-size="11" fill="var(--encre2)">chat</text>
<circle cx="96" cy="182" r="5" fill="var(--s1)"/>
<text x="108" y="186" text-anchor="start" font-size="11" fill="var(--encre2)">cheval</text>
<circle cx="330" cy="120" r="5" fill="var(--s3)"/>
<text x="342" y="124" text-anchor="start" font-size="11" fill="var(--encre2)">Paris</text>
<circle cx="378" cy="150" r="5" fill="var(--s3)"/>
<text x="390" y="154" text-anchor="start" font-size="11" fill="var(--encre2)">Abidjan</text>
<circle cx="318" cy="176" r="5" fill="var(--s3)"/>
<text x="330" y="180" text-anchor="start" font-size="11" fill="var(--encre2)">Lyon</text>
<circle cx="110" cy="270" r="5" fill="var(--s2)"/>
<circle cx="230" cy="250" r="5" fill="var(--s2)"/>
<text x="100" y="274" text-anchor="end" font-size="11" fill="var(--encre2)">homme</text>
<text x="242" y="254" text-anchor="start" font-size="11" fill="var(--encre2)">femme</text>
<path d="M 118 268 L 222 252" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<circle cx="170" cy="340" r="5" fill="var(--s2)"/>
<circle cx="290" cy="320" r="5" fill="var(--s2)"/>
<text x="160" y="344" text-anchor="end" font-size="11" fill="var(--encre2)">roi</text>
<text x="302" y="324" text-anchor="start" font-size="11" fill="var(--encre2)">reine</text>
<path d="M 178 338 L 282 322" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<text x="250" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="var(--encre2)">meme direction = meme relation</text>
<rect x="500" y="70" width="390" height="66" rx="8" class="b-trait" fill="var(--surface)"/>
<text x="516" y="94" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">Une liste de nombres</text>
<text x="516" y="112" text-anchor="start" font-size="10" fill="var(--encre2)">chaque jeton devient un vecteur de</text>
<text x="516" y="127" text-anchor="start" font-size="10" fill="var(--encre2)">plusieurs centaines de dimensions</text>
<rect x="500" y="148" width="390" height="66" rx="8" class="b-trait" fill="var(--surface)"/>
<text x="516" y="172" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">Une distance mesurable</text>
<text x="516" y="190" text-anchor="start" font-size="10" fill="var(--encre2)">la similarite cosinus dit la proximite</text>
<text x="516" y="205" text-anchor="start" font-size="10" fill="var(--encre2)">sans aucun mot commun</text>
<rect x="500" y="226" width="390" height="66" rx="8" class="b-trait" fill="var(--surface)"/>
<text x="516" y="250" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">Le sens depend du contexte</text>
<text x="516" y="268" text-anchor="start" font-size="10" fill="var(--encre2)">le vecteur de &lt;&lt; avocat &gt;&gt; est recalcule</text>
<text x="516" y="283" text-anchor="start" font-size="10" fill="var(--encre2)">selon les mots qui l&#x27;entourent</text>
<rect x="500" y="304" width="390" height="66" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="516" y="328" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">Le socle de la recherche</text>
<text x="516" y="346" text-anchor="start" font-size="10" fill="var(--encre2)">retrouver &lt;&lt; conge de maternite &gt;&gt; a partir</text>
<text x="516" y="361" text-anchor="start" font-size="10" fill="var(--encre2)">de &lt;&lt; arret apres accouchement &gt;&gt;</text>
</svg>
