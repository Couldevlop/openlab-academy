<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Lire une trace d&#x27;erreur Python de bas en haut">
<title>Lire une trace d&#x27;erreur Python de bas en haut</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une trace se lit de bas en haut.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">La dernière ligne dit quoi ; la ligne au-dessus dit où.</text>
<rect x="40" y="90" width="430" height="40" rx="8" class="b-attenue" fill="var(--surface)"/>
<text x="54" y="115" text-anchor="start" font-size="12" fill="var(--encre)">Traceback (most recent call last):</text>
<text x="504" y="115" text-anchor="start" font-size="11" fill="var(--encre2)">l&#x27;annonce, sans information utile</text>
<rect x="40" y="142" width="430" height="40" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="54" y="167" text-anchor="start" font-size="12" fill="var(--encre)">  File &quot;fiche.py&quot;, line 7, in &lt;module&gt;</text>
<text x="504" y="167" text-anchor="start" font-size="11" fill="var(--encre2)">le fichier et la ligne : regardez là</text>
<rect x="40" y="194" width="430" height="40" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="54" y="219" text-anchor="start" font-size="12" fill="var(--encre)">    print(salaire_fcfa)</text>
<text x="504" y="219" text-anchor="start" font-size="11" fill="var(--encre2)">le code fautif, recopié</text>
<rect x="40" y="246" width="430" height="40" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="54" y="271" text-anchor="start" font-size="12" fill="var(--encre)">NameError: name &#x27;salaire_fcfa&#x27; is not defined</text>
<text x="504" y="271" text-anchor="start" font-size="11" fill="var(--encre2)">le problème, nommé : commencez ici</text>
<path d="M 486 290 L 486 120" fill="none" stroke="var(--critique)" stroke-width="2" marker-end="url(#pointe-critique)"/>
<text x="380" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Le nom de l&#x27;erreur et la ligne suffisent dans neuf cas sur dix.</text>
</svg>
