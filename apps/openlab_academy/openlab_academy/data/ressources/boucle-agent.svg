<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="La boucle d&#x27;un agent et ses conditions d&#x27;arrêt">
<title>La boucle d&#x27;un agent et ses conditions d&#x27;arrêt</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="360" fill="var(--surface)"/>
<rect x="70" y="110" width="150" height="72" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="145" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Percevoir</text>
<text x="145" y="161" text-anchor="middle" font-size="12" fill="var(--encre2)">lit le contexte</text>
<rect x="250" y="110" width="150" height="72" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="325" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Raisonner</text>
<text x="325" y="161" text-anchor="middle" font-size="12" fill="var(--encre2)">choisit l&#x27;action</text>
<rect x="430" y="110" width="150" height="72" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="505" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Agir</text>
<text x="505" y="161" text-anchor="middle" font-size="12" fill="var(--encre2)">appelle un outil</text>
<rect x="610" y="110" width="150" height="72" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="685" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Observer</text>
<text x="685" y="161" text-anchor="middle" font-size="12" fill="var(--encre2)">lit le résultat</text>
<path d="M 220 146 L 248 146" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 400 146 L 428 146" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 580 146 L 608 146" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 685 182 L 685 250 L 145 250 L 145 182" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<text x="415" y="270" text-anchor="middle" font-size="12" fill="var(--encre2)">tant qu&#x27;aucune condition d&#x27;arrêt n&#x27;est remplie</text>
<rect x="255" y="292" width="250" height="46" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="380" y="311" text-anchor="middle" font-size="12" font-weight="600" fill="var(--critique)">Conditions d&#x27;arrêt</text>
<text x="380" y="328" text-anchor="middle" font-size="11" fill="var(--encre2)">objectif atteint · plafond d&#x27;étapes · budget</text>
<text x="380" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Le modèle choisit l&#x27;étape suivante ; le code borne la boucle.</text>
<text x="380" y="62" text-anchor="middle" font-size="12" fill="var(--encre2)">Sans borne explicite, un agent répète les mêmes appels jusqu&#x27;à épuiser son budget.</text>
</svg>
