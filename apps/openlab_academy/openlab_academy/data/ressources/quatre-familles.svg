<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Quatre familles de systèmes sur un même besoin">
<title>Quatre familles de systèmes sur un même besoin</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="780" height="330" fill="var(--surface)"/>
<text x="110" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Chatbot</text>
<rect x="30" y="70" width="160" height="38" rx="8" class="b-attenue" fill="var(--surface)"/>
<text x="110" y="94" text-anchor="middle" font-size="12" fill="var(--encre)">message</text>
<path d="M 110 108 L 110 122" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="30" y="126" width="160" height="38" rx="8" class="b-attenue" fill="var(--surface)"/>
<text x="110" y="150" text-anchor="middle" font-size="12" fill="var(--encre)">réponse</text>
<text x="110" y="272" text-anchor="middle" font-size="11" fill="var(--encre2)">une réponse par</text>
<text x="110" y="287" text-anchor="middle" font-size="11" fill="var(--encre2)">message</text>
<text x="300" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">RAG</text>
<rect x="220" y="70" width="160" height="38" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="300" y="94" text-anchor="middle" font-size="12" fill="var(--encre)">question</text>
<path d="M 300 108 L 300 122" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="220" y="126" width="160" height="38" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="300" y="150" text-anchor="middle" font-size="12" fill="var(--encre)">recherche</text>
<path d="M 300 164 L 300 178" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="220" y="182" width="160" height="38" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="300" y="206" text-anchor="middle" font-size="12" fill="var(--encre)">réponse</text>
<text x="300" y="272" text-anchor="middle" font-size="11" fill="var(--encre2)">un seul passage</text>
<text x="490" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Workflow</text>
<rect x="410" y="70" width="160" height="38" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="490" y="94" text-anchor="middle" font-size="12" fill="var(--encre)">étape 1</text>
<path d="M 490 108 L 490 122" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<rect x="410" y="126" width="160" height="38" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="490" y="150" text-anchor="middle" font-size="12" fill="var(--encre)">étape 2</text>
<path d="M 490 164 L 490 178" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<rect x="410" y="182" width="160" height="38" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="490" y="206" text-anchor="middle" font-size="12" fill="var(--encre)">étape 3</text>
<text x="490" y="272" text-anchor="middle" font-size="11" fill="var(--encre2)">ordre fixé par le code</text>
<text x="680" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Agent</text>
<rect x="600" y="70" width="160" height="38" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="680" y="94" text-anchor="middle" font-size="12" fill="var(--encre)">décider</text>
<path d="M 680 108 L 680 122" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="600" y="126" width="160" height="38" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="680" y="150" text-anchor="middle" font-size="12" fill="var(--encre)">agir</text>
<path d="M 680 164 L 680 178" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="600" y="182" width="160" height="38" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="680" y="206" text-anchor="middle" font-size="12" fill="var(--encre)">observer</text>
<path d="M 760 234 q 26 -56 0 -112" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<text x="680" y="272" text-anchor="middle" font-size="11" fill="var(--encre2)">ordre choisi par le</text>
<text x="680" y="287" text-anchor="middle" font-size="11" fill="var(--encre2)">modèle</text>
<text x="390" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Si l&#x27;ordre des étapes est connu d&#x27;avance, un workflow fait mieux qu&#x27;un agent.</text>
</svg>
