<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="État persistant et reprise sans doublon">
<title>État persistant et reprise sans doublon</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<rect x="24" y="90" width="150" height="54" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="99" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Brouillon</text>
<rect x="210" y="90" width="180" height="54" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="300" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Validation demandée</text>
<rect x="426" y="90" width="140" height="54" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="496" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Approuvé</text>
<rect x="600" y="90" width="140" height="54" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="670" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Enregistré</text>
<path d="M 174 117 L 206 117" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 390 117 L 422 117" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 566 117 L 596 117" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 300 144 L 300 192 L 670 192 L 670 148" fill="none" stroke="var(--critique)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pointe-critique)"/>
<text x="485" y="210" text-anchor="middle" font-size="12" fill="var(--critique)">reprise après interruption : la clé d&#x27;idempotence mène à l&#x27;état déjà atteint</text>
<rect x="230" y="236" width="300" height="56" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="380" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Fichier d&#x27;état</text>
<text x="380" y="277" text-anchor="middle" font-size="11" fill="var(--encre2)">chaque transition est écrite avant d&#x27;être annoncée</text>
<text x="380" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Une reprise lit l&#x27;état, elle ne rejoue pas le passé.</text>
</svg>
