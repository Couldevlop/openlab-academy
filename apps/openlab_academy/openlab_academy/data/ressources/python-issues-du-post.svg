<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Les trois issues d&#x27;une création par POST">
<title>Les trois issues d&#x27;une création par POST</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une création a trois issues, et chacune a son code.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Le code dit à l&#x27;appelant quoi faire ensuite ; le corps lui dit pourquoi.</text>
<rect x="290" y="86" width="180" height="56" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="380" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">POST /salaries</text>
<text x="380" y="130" text-anchor="middle" font-size="11" fill="var(--encre2)">un salarié à créer</text>
<rect x="40" y="192" width="180" height="92" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="130" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">201 Created</text>
<text x="130" y="242" text-anchor="middle" font-size="11" fill="var(--encre2)">le salarié existe</text>
<text x="130" y="266" text-anchor="middle" font-size="11" fill="var(--encre2)">la fiche créée</text>
<rect x="290" y="192" width="180" height="92" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="380" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">422</text>
<text x="380" y="242" text-anchor="middle" font-size="11" fill="var(--encre2)">la saisie est mal formée</text>
<text x="380" y="266" text-anchor="middle" font-size="11" fill="var(--encre2)">le champ fautif, nommé</text>
<rect x="540" y="192" width="180" height="92" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="630" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">409</text>
<text x="630" y="242" text-anchor="middle" font-size="11" fill="var(--encre2)">le matricule existe déjà</text>
<text x="630" y="266" text-anchor="middle" font-size="11" fill="var(--encre2)">le conflit, expliqué</text>
<path d="M 340 146 L 170 186" fill="none" stroke="var(--bon)" stroke-width="2" marker-end="url(#pointe-bon)"/>
<path d="M 380 146 L 380 186" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<path d="M 420 146 L 610 186" fill="none" stroke="var(--critique)" stroke-width="2" marker-end="url(#pointe-critique)"/>
<text x="380" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Un message d&#x27;erreur nomme le champ fautif ; il ne recopie jamais la trace Python.</text>
</svg>
