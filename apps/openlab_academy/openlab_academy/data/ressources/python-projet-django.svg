<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Ce qu&#x27;un projet Django apporte dès le départ">
<title>Ce qu&#x27;un projet Django apporte dès le départ</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Django arrive avec ce qu&#x27;une application de gestion redemande toujours.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Vous écrivez les règles ; le reste est déjà là, et il est éprouvé.</text>
<rect x="40" y="100" width="162" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="121" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Comptes et sessions</text>
<text x="121" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">connexion, déconnexion</text>
<rect x="226" y="100" width="162" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="307" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Administration</text>
<text x="307" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">un back-office immédiat</text>
<rect x="412" y="100" width="162" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="493" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Migrations</text>
<text x="493" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">la base suit les modèles</text>
<rect x="598" y="100" width="162" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="679" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Sécurité</text>
<text x="679" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">CSRF, mots de passe hachés</text>
<rect x="40" y="206" width="330" height="80" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="205" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Ce que vous écrivez</text>
<text x="205" y="256" text-anchor="middle" font-size="11" fill="var(--encre2)">les modèles, les règles, les écrans</text>
<text x="205" y="276" text-anchor="middle" font-size="11" fill="var(--encre2)">autrement dit, votre métier</text>
<rect x="400" y="206" width="320" height="80" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="560" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">manage.py, config/, salaries/</text>
<text x="560" y="256" text-anchor="middle" font-size="11" fill="var(--encre2)">un projet, puis une application par domaine</text>
<text x="560" y="276" text-anchor="middle" font-size="11" fill="var(--encre2)">la même disposition dans toutes les équipes</text>
<text x="380" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Choisir Django, c&#x27;est accepter ses conventions et gagner le temps qu&#x27;elles font économiser.</text>
</svg>
