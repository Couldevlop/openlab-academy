<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="La frontière entre la consigne et la donnée">
<title>La frontière entre la consigne et la donnée</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="820" height="380" fill="var(--surface)"/>
<rect x="90" y="100" width="300" height="180" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="240" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="var(--s1)">Zone des consignes</text>
<text x="240" y="158" text-anchor="middle" font-size="11" fill="var(--encre2)">message système</text>
<text x="240" y="182" text-anchor="middle" font-size="11" fill="var(--encre2)">règles dures</text>
<text x="240" y="206" text-anchor="middle" font-size="11" fill="var(--encre2)">outils et formats</text>
<text x="240" y="230" text-anchor="middle" font-size="11" fill="var(--encre2)">écrit par vous</text>
<text x="240" y="254" text-anchor="middle" font-size="11" fill="var(--encre2)">stable entre deux exécutions</text>
<rect x="430" y="100" width="300" height="180" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="580" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="var(--critique)">Zone des données</text>
<text x="580" y="158" text-anchor="middle" font-size="11" fill="var(--encre2)">notes de factures</text>
<text x="580" y="182" text-anchor="middle" font-size="11" fill="var(--encre2)">documents lus</text>
<text x="580" y="206" text-anchor="middle" font-size="11" fill="var(--encre2)">résultats d&#x27;outils</text>
<text x="580" y="230" text-anchor="middle" font-size="11" fill="var(--encre2)">écrit par n&#x27;importe qui</text>
<text x="580" y="254" text-anchor="middle" font-size="11" fill="var(--encre2)">change à chaque exécution</text>
<line x1="410" y1="92" x2="410" y2="296" stroke="var(--s2)" stroke-width="3" stroke-dasharray="7 5"/>
<text x="410" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="var(--s2)">une donnée ne traverse jamais cette ligne</text>
<text x="410" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Tout ce qui vient du monde extérieur est une donnée, même si c&#x27;est écrit à l&#x27;impératif.</text>
<text x="410" y="64" text-anchor="middle" font-size="12" fill="var(--encre2)">Citez les données dans un bloc nommé, annoncez qu&#x27;elles ne sont pas fiables, et n&#x27;y obéissez jamais.</text>
<text x="410" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="var(--critique)">Si vous concaténez les deux zones dans une seule chaîne, la frontière n&#x27;existe plus.</text>
</svg>
