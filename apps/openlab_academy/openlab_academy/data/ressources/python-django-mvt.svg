<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="D&#x27;une adresse à une page dans Django">
<title>D&#x27;une adresse à une page dans Django</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="320" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Chaque couche a une responsabilité, et une seule.</text>
<rect x="40" y="110" width="150" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="115" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">L&#x27;adresse</text>
<text x="115" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">désigne une vue</text>
<rect x="220" y="110" width="150" height="76" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="295" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">La vue</text>
<text x="295" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">prépare le contexte</text>
<rect x="400" y="110" width="150" height="76" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="475" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Le modèle</text>
<text x="475" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">sert les données</text>
<rect x="580" y="110" width="150" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="655" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Le gabarit</text>
<text x="655" y="164" text-anchor="middle" font-size="10" fill="var(--encre2)">présente, sans calculer</text>
<path d="M 190 148 L 218 148" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 370 148 L 398 148" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 550 148 L 578 148" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="220" y="232" width="330" height="50" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="385" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="var(--critique)">Une règle métier écrite dans le gabarit</text>
<text x="385" y="271" text-anchor="middle" font-size="10" fill="var(--encre2)">n&#x27;est ni testable, ni réutilisable, et personne ne l&#x27;y cherche</text>
<text x="380" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Une liste qui interroge la base une fois par ligne : chargez les objets liés.</text>
</svg>
