<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="La température agit sur le tirage, pas sur le savoir du modèle">
<title>La température agit sur le tirage, pas sur le savoir du modèle</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="820" height="360" fill="var(--surface)"/>
<text x="215" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Température 0</text>
<rect x="60" y="135.2" width="44" height="124.8" rx="4" ry="4" fill="var(--s1)"/>
<rect x="60" y="254" width="44" height="6" fill="var(--s1)"/>
<text x="82" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">lister</text>
<text x="82" y="127.2" text-anchor="middle" font-size="10" fill="var(--encre2)">96 %</text>
<rect x="122" y="247" width="44" height="13" rx="4" ry="4" fill="var(--s1)"/>
<rect x="122" y="254" width="44" height="6" fill="var(--s1)"/>
<text x="144" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">calculer</text>
<text x="144" y="239" text-anchor="middle" font-size="10" fill="var(--encre2)">10 %</text>
<rect x="184" y="252.2" width="44" height="7.8" rx="4" ry="4" fill="var(--s1)"/>
<rect x="184" y="254" width="44" height="6" fill="var(--s1)"/>
<text x="206" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">rédiger</text>
<text x="206" y="244.2" text-anchor="middle" font-size="10" fill="var(--encre2)">6 %</text>
<rect x="246" y="254.8" width="44" height="5.2" rx="4" ry="4" fill="var(--s1)"/>
<rect x="246" y="254" width="44" height="6" fill="var(--s1)"/>
<text x="268" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">demander</text>
<text x="268" y="246.8" text-anchor="middle" font-size="10" fill="var(--encre2)">4 %</text>
<rect x="308" y="257.4" width="44" height="2.6" rx="4" ry="4" fill="var(--s1)"/>
<rect x="308" y="254" width="44" height="6" fill="var(--s1)"/>
<text x="330" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">arrêter</text>
<text x="330" y="249.4" text-anchor="middle" font-size="10" fill="var(--encre2)">2 %</text>
<line x1="50" y1="260" x2="360" y2="260" stroke="var(--trait)" stroke-width="1.5"/>
<text x="205" y="302" text-anchor="middle" font-size="11" fill="var(--encre2)">le jeton le plus probable gagne</text>
<text x="205" y="317" text-anchor="middle" font-size="11" fill="var(--encre2)">presque toujours</text>
<text x="605" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Température 1</text>
<rect x="450" y="200.2" width="44" height="59.8" rx="4" ry="4" fill="var(--s2)"/>
<rect x="450" y="254" width="44" height="6" fill="var(--s2)"/>
<text x="472" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">lister</text>
<text x="472" y="192.2" text-anchor="middle" font-size="10" fill="var(--encre2)">46 %</text>
<rect x="512" y="228.8" width="44" height="31.2" rx="4" ry="4" fill="var(--s2)"/>
<rect x="512" y="254" width="44" height="6" fill="var(--s2)"/>
<text x="534" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">calculer</text>
<text x="534" y="220.8" text-anchor="middle" font-size="10" fill="var(--encre2)">24 %</text>
<rect x="574" y="239.2" width="44" height="20.8" rx="4" ry="4" fill="var(--s2)"/>
<rect x="574" y="254" width="44" height="6" fill="var(--s2)"/>
<text x="596" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">rédiger</text>
<text x="596" y="231.2" text-anchor="middle" font-size="10" fill="var(--encre2)">16 %</text>
<rect x="636" y="248.3" width="44" height="11.7" rx="4" ry="4" fill="var(--s2)"/>
<rect x="636" y="254" width="44" height="6" fill="var(--s2)"/>
<text x="658" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">demander</text>
<text x="658" y="240.3" text-anchor="middle" font-size="10" fill="var(--encre2)">9 %</text>
<rect x="698" y="253.5" width="44" height="6.5" rx="4" ry="4" fill="var(--s2)"/>
<rect x="698" y="254" width="44" height="6" fill="var(--s2)"/>
<text x="720" y="278" text-anchor="middle" font-size="10" fill="var(--encre2)">arrêter</text>
<text x="720" y="245.5" text-anchor="middle" font-size="10" fill="var(--encre2)">5 %</text>
<line x1="440" y1="260" x2="750" y2="260" stroke="var(--trait)" stroke-width="1.5"/>
<text x="595" y="302" text-anchor="middle" font-size="11" fill="var(--encre2)">les jetons rares deviennent</text>
<text x="595" y="317" text-anchor="middle" font-size="11" fill="var(--encre2)">atteignables</text>
<text x="410" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Le modèle produit des scores ; la température décide de ce qu&#x27;on en fait.</text>
<text x="410" y="64" text-anchor="middle" font-size="12" fill="var(--encre2)">Pour décider d&#x27;un outil, on veut la colonne de gauche. Pour rédiger à un humain, celle de droite.</text>
<text x="410" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="var(--encre2)">Température 0 ne veut pas dire reproductible : le calcul flottant et les mises à jour font varier le résultat.</text>
</svg>
