<text x="625" y="233" text-anchor="middle" font-size="11" fill="var(--encre)">250000</text>
<text x="380" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Ajoutez une colonne au fichier : les positions se décalent, les clés tiennent.</text>
</svg>
