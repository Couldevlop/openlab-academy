<rect x="394" y="86" width="326" height="176" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="557" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Dictionnaire : lu par clé</text>
<text x="412" y="149" text-anchor="start" font-size="12" font-weight="600" fill="var(--encre)">nom</text>
<path d="M 516 144 L 538 144" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="548" y="128" width="154" height="32" rx="8" class="b-trait" fill="var(--surface)"/>
<text x="625" y="149" text-anchor="middle" font-size="11" fill="var(--encre)">Awa Kone</text>
<text x="412" y="191" text-anchor="start" font-size="12" font-weight="600" fill="var(--encre)">poste</text>
<path d="M 516 186 L 538 186" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
