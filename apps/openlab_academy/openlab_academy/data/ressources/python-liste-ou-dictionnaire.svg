<text x="625" y="191" text-anchor="middle" font-size="11" fill="var(--encre)">Assistante RH</text>
<text x="412" y="233" text-anchor="start" font-size="12" font-weight="600" fill="var(--encre)">salaire_fcfa</text>
<path d="M 516 228 L 538 228" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
