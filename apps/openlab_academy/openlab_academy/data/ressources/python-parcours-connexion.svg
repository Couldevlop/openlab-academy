<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Le chemin d&#x27;une connexion">
<title>Le chemin d&#x27;une connexion</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="320" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une page protégée renvoie vers la connexion, puis ramène au point de départ.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Le détour est transparent pour l&#x27;utilisateur ; il tient en un paramètre.</text>
<rect x="30" y="110" width="166" height="76" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="113" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">/effectif</text>
<text x="113" y="164" text-anchor="middle" font-size="11" fill="var(--encre2)">demandé sans compte</text>
<rect x="218" y="110" width="166" height="76" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="301" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">/connexion</text>
<text x="301" y="164" text-anchor="middle" font-size="11" fill="var(--encre2)">avec ?next=/effectif</text>
<rect x="406" y="110" width="166" height="76" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="489" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Session ouverte</text>
<text x="489" y="164" text-anchor="middle" font-size="11" fill="var(--encre2)">le compte est reconnu</text>
<rect x="594" y="110" width="166" height="76" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="677" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">/effectif</text>
<text x="677" y="164" text-anchor="middle" font-size="11" fill="var(--encre2)">servi, cette fois</text>
<path d="M 196 148 L 218 148" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 384 148 L 406 148" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<path d="M 572 148 L 594 148" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="140" y="222" width="480" height="62" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="380" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Un mot de passe ne se garde jamais en clair</text>
<text x="380" y="268" text-anchor="middle" font-size="11" fill="var(--encre2)">la base garde une empreinte ; même volée, elle ne rend pas le mot de passe</text>
<text x="380" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Déconnexion : la session est détruite côté serveur, pas seulement oubliée côté page.</text>
</svg>
