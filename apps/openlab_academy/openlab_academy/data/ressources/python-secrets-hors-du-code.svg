<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Où vit un secret, et où il ne vit jamais">
<title>Où vit un secret, et où il ne vit jamais</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Un secret écrit dans le code part avec le code.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Retiré plus tard, il reste dans l&#x27;historique du dépôt.</text>
<rect x="40" y="100" width="200" height="100" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="140" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">api.py</text>
<text x="140" y="152" text-anchor="middle" font-size="11" fill="var(--critique)">CLE = &quot;sk-vrai-secret&quot;</text>
<text x="140" y="176" text-anchor="middle" font-size="11" fill="var(--encre2)">versionné, donc public</text>
<rect x="280" y="100" width="200" height="100" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="380" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">.env</text>
<text x="380" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">CLE=sk-vrai-secret</text>
<text x="380" y="176" text-anchor="middle" font-size="11" fill="var(--encre2)">ignoré par git</text>
<rect x="520" y="100" width="200" height="100" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="620" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">.env.exemple</text>
<text x="620" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">CLE=a-remplir</text>
<text x="620" y="176" text-anchor="middle" font-size="11" fill="var(--encre2)">versionné, sans valeur</text>
<rect x="180" y="236" width="400" height="58" rx="8" class="b-trait" fill="var(--surface)"/>
<text x="380" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Le code lit la variable d&#x27;environnement, jamais le fichier en dur.</text>
<text x="380" y="282" text-anchor="middle" font-size="11" fill="var(--encre2)">os.environ[&quot;CLE&quot;] : absente, l&#x27;application refuse de démarrer.</text>
<text x="380" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Un secret publié par erreur se révoque : le retirer du code ne suffit pas.</text>
</svg>
