<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="D&#x27;une panne technique à un message utile">
<title>D&#x27;une panne technique à un message utile</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="310" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">La frontière traduit ; le cœur ne voit que des données saines.</text>
<rect x="40" y="90" width="200" height="110" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="140" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">Panne technique</text>
<text x="140" y="144" text-anchor="middle" font-size="11" fill="var(--encre2)">FileNotFoundError</text>
<text x="140" y="159" text-anchor="middle" font-size="11" fill="var(--encre2)">KeyError</text>
<text x="140" y="174" text-anchor="middle" font-size="11" fill="var(--encre2)">ValueError</text>
<rect x="280" y="90" width="200" height="110" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="380" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Frontière</text>
<text x="380" y="144" text-anchor="middle" font-size="11" fill="var(--encre2)">try / except nommé</text>
<text x="380" y="159" text-anchor="middle" font-size="11" fill="var(--encre2)">raise DonneeInvalide</text>
<text x="380" y="174" text-anchor="middle" font-size="11" fill="var(--encre2)">from erreur</text>
<rect x="520" y="90" width="200" height="110" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="620" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Message au gérant</text>
<text x="620" y="144" text-anchor="middle" font-size="11" fill="var(--encre2)">« Colonne salaire_fcfa</text>
<text x="620" y="159" text-anchor="middle" font-size="11" fill="var(--encre2)">absente du fichier</text>
<text x="620" y="174" text-anchor="middle" font-size="11" fill="var(--encre2)">effectif.csv »</text>
<path d="M 248 145 L 272 145" fill="none" stroke="var(--critique)" stroke-width="2" marker-end="url(#pointe-critique)"/>
<path d="M 488 145 L 512 145" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="230" y="232" width="300" height="50" rx="8" class="b-attenue" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="380" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Faute de frappe dans votre code</text>
<text x="380" y="271" text-anchor="middle" font-size="11" fill="var(--encre2)">la trace remonte telle quelle, sans déguisement</text>
</svg>
