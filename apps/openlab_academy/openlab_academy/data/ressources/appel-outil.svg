<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Le cycle d&#x27;un appel d&#x27;outil">
<title>Le cycle d&#x27;un appel d&#x27;outil</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="400" fill="var(--surface)"/>
<rect x="25" y="40" width="170" height="40" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="110" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Modèle</text>
<line x1="110" y1="80" x2="110" y2="360" stroke="var(--grille)" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="295" y="40" width="170" height="40" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="380" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Votre code</text>
<line x1="380" y1="80" x2="380" y2="360" stroke="var(--grille)" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="565" y="40" width="170" height="40" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="650" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Outil</text>
<line x1="650" y1="80" x2="650" y2="360" stroke="var(--grille)" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 118 120 L 372 120" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<text x="245" y="110" text-anchor="middle" font-size="11" fill="var(--encre2)">demande l&#x27;outil et ses arguments</text>
<path d="M 380 153 q 60 0 60 12 q 0 12 -60 12" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="460" y="169" text-anchor="start" font-size="11" fill="var(--encre2)">valide le contrat : types, bornes, chemins</text>
<path d="M 388 215 L 642 215" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="515" y="205" text-anchor="middle" font-size="11" fill="var(--encre2)">exécute si le contrat passe</text>
<path d="M 642 260 L 388 260" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<text x="515" y="250" text-anchor="middle" font-size="11" fill="var(--encre2)">résultat, ou erreur lisible</text>
<path d="M 372 305 L 118 305" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="245" y="295" text-anchor="middle" font-size="11" fill="var(--encre2)">observation renvoyée au modèle</text>
<text x="380" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Une erreur d&#x27;outil devient un résultat, jamais une exception qui arrête la boucle.</text>
</svg>
