<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Trois découpages du même document, trois qualités de réponse">
<title>Trois découpages du même document, trois qualités de réponse</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="880" height="380" fill="var(--surface)"/>
<text x="150" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="var(--critique)">Trop petit</text>
<rect x="40" y="118" width="220" height="20" rx="8" class="b-critique" fill="var(--surface)"/>
<rect x="40" y="144" width="220" height="20" rx="8" class="b-critique" fill="var(--surface)"/>
<rect x="40" y="170" width="220" height="20" rx="8" class="b-critique" fill="var(--surface)"/>
<rect x="40" y="196" width="220" height="20" rx="8" class="b-critique" fill="var(--surface)"/>
<rect x="40" y="222" width="220" height="20" rx="8" class="b-critique" fill="var(--surface)"/>
<rect x="40" y="248" width="220" height="20" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="150" y="324" text-anchor="middle" font-size="11" fill="var(--encre2)">la phrase trouvée a perdu</text>
<text x="150" y="339" text-anchor="middle" font-size="11" fill="var(--encre2)">son contexte</text>
<text x="440" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="var(--s3)">Par section</text>
<rect x="330" y="118" width="220" height="52" rx="8" class="b-s3" fill="var(--surface)"/>
<rect x="330" y="176" width="220" height="52" rx="8" class="b-s3" fill="var(--surface)"/>
<rect x="330" y="234" width="220" height="52" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="440" y="324" text-anchor="middle" font-size="11" fill="var(--encre2)">le passage se suffit à</text>
<text x="440" y="339" text-anchor="middle" font-size="11" fill="var(--encre2)">lui-même</text>
<text x="730" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="var(--attenue)">Document entier</text>
<rect x="620" y="118" width="220" height="178" rx="8" class="b-attenue" fill="var(--surface)"/>
<text x="730" y="324" text-anchor="middle" font-size="11" fill="var(--encre2)">le passage utile se noie</text>
<text x="730" y="339" text-anchor="middle" font-size="11" fill="var(--encre2)">dans le reste</text>
<text x="440" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Le découpage décide de ce que la recherche peut retrouver.</text>
<text x="440" y="64" text-anchor="middle" font-size="12" fill="var(--encre2)">Un passage doit être compréhensible seul, et porter le titre de sa section.</text>
<text x="440" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Règle de départ : une section, un passage ; puis mesurez avant de régler.</text>
</svg>
