<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="Les trois temps d&#x27;un entraînement">
<title>Les trois temps d&#x27;un entraînement</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="860" height="340" fill="var(--surface)"/>
<rect x="30" y="100" width="252" height="104" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="156" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Pré-entraînement</text>
<text x="156" y="156" text-anchor="middle" font-size="11" fill="var(--encre2)">prédire le jeton suivant</text>
<text x="156" y="171" text-anchor="middle" font-size="11" fill="var(--encre2)">sur un très grand corpus</text>
<text x="156" y="230" text-anchor="middle" font-size="11" fill="var(--encre2)">donne la langue et la culture, fixe</text>
<text x="156" y="245" text-anchor="middle" font-size="11" fill="var(--encre2)">la date de coupure</text>
<path d="M 282 152 L 296 152" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="302" y="100" width="252" height="104" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="428" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Instructions</text>
<text x="428" y="156" text-anchor="middle" font-size="11" fill="var(--encre2)">obéir plutôt que</text>
<text x="428" y="171" text-anchor="middle" font-size="11" fill="var(--encre2)">continuer le texte</text>
<text x="428" y="230" text-anchor="middle" font-size="11" fill="var(--encre2)">donne la variante instruite, la</text>
<text x="428" y="245" text-anchor="middle" font-size="11" fill="var(--encre2)">seule utile pour un agent</text>
<path d="M 554 152 L 568 152" fill="none" stroke="var(--attenue)" stroke-width="2" marker-end="url(#pointe-attenue)"/>
<rect x="574" y="100" width="252" height="104" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="700" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Alignement</text>
<text x="700" y="156" text-anchor="middle" font-size="11" fill="var(--encre2)">préférences humaines</text>
<text x="700" y="171" text-anchor="middle" font-size="11" fill="var(--encre2)">ou règles écrites</text>
<text x="700" y="230" text-anchor="middle" font-size="11" fill="var(--encre2)">donne la prudence, et explique une</text>
<text x="700" y="245" text-anchor="middle" font-size="11" fill="var(--encre2)">partie des refus</text>
<text x="430" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Trois étapes que vous ne referez pas, et dont vous héritez.</text>
<text x="430" y="64" text-anchor="middle" font-size="12" fill="var(--encre2)">Deux opérations légères complètent le tableau : la distillation vers un petit modèle, et la quantification.</text>
<rect x="180" y="276" width="500" height="52" rx="8" class="b-trait" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="430" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Le réglage fin n&#x27;est presque jamais la première réponse</text>
<text x="430" y="317" text-anchor="middle" font-size="11" fill="var(--encre2)">un meilleur prompt, de meilleurs outils et de meilleures données coûtent moins et se corrigent plus vite.</text>
</svg>
