<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Ce qu&#x27;une fonction reçoit, ce qu&#x27;elle rend, et ce qu&#x27;elle n&#x27;affiche pas">
<title>Ce qu&#x27;une fonction reçoit, ce qu&#x27;elle rend, et ce qu&#x27;elle n&#x27;affiche pas</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une fonction rend une valeur. Elle n&#x27;affiche rien.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Qui affiche ne peut plus être réutilisé ni testé.</text>
<rect x="50" y="110" width="170" height="70" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="135" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Paramètres</text>
<text x="135" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">mensuel, primes</text>
<rect x="295" y="100" width="180" height="90" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="385" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">salaire_annuel</text>
<text x="385" y="152" text-anchor="middle" font-size="11" fill="var(--encre2)">le calcul, et rien</text>
<text x="385" y="170" text-anchor="middle" font-size="11" fill="var(--encre2)">d&#x27;autre</text>
<rect x="550" y="110" width="170" height="70" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="635" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Valeur rendue</text>
<text x="635" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">return montant</text>
<path d="M 228 145 L 287 145" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<path d="M 483 145 L 542 145" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<rect x="240" y="232" width="290" height="56" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="385" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">print dans la fonction</text>
<text x="385" y="274" text-anchor="middle" font-size="11" fill="var(--encre2)">la valeur est perdue, le test ne voit rien</text>
<path d="M 385 198 L 385 228" fill="none" stroke="var(--critique)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pointe-critique)"/>
<text x="380" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">L&#x27;appelant décide d&#x27;afficher ; la fonction décide de calculer.</text>
</svg>
