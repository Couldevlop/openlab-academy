<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Le modèle, la migration et les bases qui suivent">
<title>Le modèle, la migration et les bases qui suivent</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="310" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">La migration est un journal versionné, pas un script jetable.</text>
<rect x="40" y="90" width="200" height="70" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="140" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Le modèle change</text>
<text x="140" y="140" text-anchor="middle" font-size="11" fill="var(--encre2)">un champ ajouté</text>
<rect x="280" y="90" width="200" height="70" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="380" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">La migration</text>
<text x="380" y="140" text-anchor="middle" font-size="10" fill="var(--encre2)">générée, relue, versionnée</text>
<path d="M 248 125 L 272 125" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="520" y="72" width="200" height="44" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="99" text-anchor="middle" font-size="12" fill="var(--encre)">votre base</text>
<path d="M 488 125 L 512 94" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="520" y="128" width="200" height="44" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="155" text-anchor="middle" font-size="12" fill="var(--encre)">celle d&#x27;un collègue</text>
<path d="M 488 125 L 512 150" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="520" y="184" width="200" height="44" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="211" text-anchor="middle" font-size="12" fill="var(--encre)">la production</text>
<path d="M 488 125 L 512 206" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<text x="380" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Une intention par migration : elle se relit, s&#x27;annule et se transporte.</text>
<text x="380" y="280" text-anchor="middle" font-size="12" fill="var(--encre2)">Modifier la base à la main fait partir la migration suivante d&#x27;un état faux.</text>
</svg>
