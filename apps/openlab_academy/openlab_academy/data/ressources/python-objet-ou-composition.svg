<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Une classe porte ses règles ; l&#x27;héritage se mérite">
<title>Une classe porte ses règles ; l&#x27;héritage se mérite</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="340" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Une classe réunit des données et les règles qui les concernent.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Si la règle vit ailleurs, la classe n&#x27;est qu&#x27;un dictionnaire déguisé.</text>
<rect x="40" y="92" width="320" height="136" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="200" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Lot</text>
<text x="200" y="148" text-anchor="middle" font-size="11" fill="var(--encre2)">poids_kg, qualite, humide</text>
<text x="200" y="174" text-anchor="middle" font-size="11" fill="var(--encre2)">prix_fcfa() applique la pénalité</text>
<text x="200" y="200" text-anchor="middle" font-size="11" fill="var(--encre2)">immuable : frozen=True</text>
<rect x="400" y="92" width="320" height="136" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="560" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Producteur</text>
<text x="560" y="148" text-anchor="middle" font-size="11" fill="var(--encre2)">nom, lots</text>
<text x="560" y="174" text-anchor="middle" font-size="11" fill="var(--encre2)">total_fcfa() somme ses lots</text>
<text x="560" y="200" text-anchor="middle" font-size="11" fill="var(--encre2)">contient des Lot : composition</text>
<path d="M 392 160 L 368 160" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="40" y="258" width="320" height="58" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="200" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">Composition : A contient B</text>
<text x="200" y="302" text-anchor="middle" font-size="11" fill="var(--encre2)">le cas courant, souple et sans surprise</text>
<rect x="400" y="258" width="320" height="58" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="560" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">Héritage : A est un B</text>
<text x="560" y="302" text-anchor="middle" font-size="11" fill="var(--encre2)">seulement si tout ce qui vaut de B vaut de A</text>
</svg>
