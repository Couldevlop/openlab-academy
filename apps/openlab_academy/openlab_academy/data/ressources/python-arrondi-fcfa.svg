<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="D&#x27;un calcul à virgule au montant payable en francs">
<title>D&#x27;un calcul à virgule au montant payable en francs</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="330" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Un calcul rend des décimales ; une paie se verse en francs entiers.</text>
<text x="380" y="56" text-anchor="middle" font-size="12" fill="var(--encre2)">Arrondissez une fois, à la fin, et jamais à chaque étape.</text>
<rect x="40" y="110" width="200" height="72" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="140" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">250000 / 30</text>
<text x="140" y="166" text-anchor="middle" font-size="11" fill="var(--encre2)">le calcul</text>
<rect x="260" y="110" width="200" height="72" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="360" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">8333.333333</text>
<text x="360" y="166" text-anchor="middle" font-size="11" fill="var(--encre2)">ce que Python rend</text>
<rect x="480" y="110" width="200" height="72" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="580" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">8333 FCFA</text>
<text x="580" y="166" text-anchor="middle" font-size="11" fill="var(--encre2)">ce que la caisse verse</text>
<path d="M 246 146 L 256 146" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<path d="M 466 146 L 476 146" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="40" y="222" width="320" height="62" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="200" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">0.1 + 0.2 ne vaut pas 0.3</text>
<text x="200" y="266" text-anchor="middle" font-size="11" fill="var(--encre2)">les flottants approchent, ils ne comptent pas</text>
<rect x="400" y="222" width="320" height="62" rx="8" class="b-bon" fill="var(--surface)"/>
<text x="560" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="var(--encre)">round(montant) au dernier moment</text>
<text x="560" y="266" text-anchor="middle" font-size="11" fill="var(--encre2)">un seul arrondi, sur le montant final</text>
<text x="380" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Arrondir à chaque ligne d&#x27;un bulletin fabrique un écart de plusieurs francs.</text>
</svg>
