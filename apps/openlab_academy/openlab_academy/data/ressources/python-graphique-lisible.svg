<text x="570" y="252" text-anchor="middle" font-size="11" fill="var(--encre2)">douze angles proches, une légende à décoder</text>
<text x="570" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="var(--critique)">lecture impossible</text>
<text x="380" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Une mesure par axe, et jamais deux échelles sur une même figure.</text>
