<text x="190" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="var(--s3)">lecture immédiate</text>
<text x="570" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--critique)">Camembert à douze parts</text>
