<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Deux rôles, quatre pages">
<title>Deux rôles, quatre pages</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="320" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Le droit se vérifie là où la donnée est servie.</text>
<text x="240" y="86" text-anchor="end" font-size="12" font-weight="600" fill="var(--encre)">Page</text>
<text x="420" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">RH</text>
<text x="620" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre)">Manager</text>
<text x="240" y="118" text-anchor="end" font-size="12" fill="var(--encre2)">Liste de l&#x27;effectif</text>
<rect x="330" y="100" width="180" height="26" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="420" y="118" text-anchor="middle" font-size="11" fill="var(--encre)">avec salaires</text>
<rect x="530" y="100" width="180" height="26" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="118" text-anchor="middle" font-size="11" fill="var(--encre)">sans salaires</text>
<text x="240" y="156" text-anchor="end" font-size="12" fill="var(--encre2)">Fiche d&#x27;un salarié</text>
<rect x="330" y="138" width="180" height="26" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="420" y="156" text-anchor="middle" font-size="11" fill="var(--encre)">complète</text>
<rect x="530" y="138" width="180" height="26" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="156" text-anchor="middle" font-size="11" fill="var(--encre)">sans salaire</text>
<text x="240" y="194" text-anchor="end" font-size="12" fill="var(--encre2)">Masse salariale</text>
<rect x="330" y="176" width="180" height="26" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="420" y="194" text-anchor="middle" font-size="11" fill="var(--encre)">oui</text>
<rect x="530" y="176" width="180" height="26" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="620" y="194" text-anchor="middle" font-size="11" fill="var(--encre)">refus</text>
<text x="240" y="232" text-anchor="end" font-size="12" fill="var(--encre2)">Absences de l&#x27;équipe</text>
<rect x="330" y="214" width="180" height="26" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="420" y="232" text-anchor="middle" font-size="11" fill="var(--encre)">oui</text>
<rect x="530" y="214" width="180" height="26" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="620" y="232" text-anchor="middle" font-size="11" fill="var(--encre)">oui</text>
<text x="380" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Masquer une colonne n&#x27;empêche pas la donnée d&#x27;être envoyée dans la réponse.</text>
</svg>
