<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Deux descriptions du même outil, deux comportements">
<title>Deux descriptions du même outil, deux comportements</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="860" height="400" fill="var(--surface)"/>
<text x="220" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="var(--critique)">Description pauvre</text>
<rect x="30" y="110" width="380" height="128" rx="8" class="b-critique" fill="var(--surface)"/>
<text x="46" y="136" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;name&quot;: &quot;lister&quot;</text>
<text x="46" y="157" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;description&quot;: &quot;liste les factures&quot;</text>
<text x="46" y="178" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;age_min_jours&quot;: {&quot;type&quot;: &quot;integer&quot;}</text>
<text x="220" y="270" text-anchor="middle" font-size="12" fill="var(--encre)">Appelé à contretemps</text>
<text x="220" y="294" text-anchor="middle" font-size="12" fill="var(--encre)">Arguments hors bornes acceptés</text>
<text x="220" y="318" text-anchor="middle" font-size="12" fill="var(--encre)">Confondu avec l&#x27;outil de calcul</text>
<text x="640" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="var(--s3)">Description utile</text>
<rect x="450" y="110" width="380" height="128" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="466" y="136" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;name&quot;: &quot;lister_factures_impayees&quot;</text>
<text x="466" y="157" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;description&quot;: &quot;Liste les factures dont le retard</text>
<text x="466" y="178" text-anchor="start" font-size="11" fill="var(--encre2)">atteint age_min_jours. Exclut les litiges.&quot;</text>
<text x="466" y="199" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;age_min_jours&quot;: {&quot;type&quot;:&quot;integer&quot;,&quot;minimum&quot;:0,</text>
<text x="466" y="220" text-anchor="start" font-size="11" fill="var(--encre2)">&quot;maximum&quot;:365}</text>
<text x="640" y="270" text-anchor="middle" font-size="12" fill="var(--encre)">Appelé au bon moment</text>
<text x="640" y="294" text-anchor="middle" font-size="12" fill="var(--encre)">Arguments refusés avant exécution</text>
<text x="640" y="318" text-anchor="middle" font-size="12" fill="var(--encre)">Jamais confondu avec un autre outil</text>
<text x="430" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Le modèle ne lit pas votre code : il lit la description de l&#x27;outil.</text>
<text x="430" y="64" text-anchor="middle" font-size="12" fill="var(--encre2)">C&#x27;est le texte le plus rentable de tout votre projet, et le plus souvent bâclé.</text>
<text x="430" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Une description dit quand utiliser l&#x27;outil, quand ne pas l&#x27;utiliser, et ce qu&#x27;il renvoie.</text>
</svg>
