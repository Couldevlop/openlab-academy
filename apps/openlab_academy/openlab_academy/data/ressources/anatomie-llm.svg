<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Ce qu&#x27;un modèle de langage fait d&#x27;un texte">
<title>Ce qu&#x27;un modèle de langage fait d&#x27;un texte</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="880" height="400" fill="var(--surface)"/>
<rect x="20" y="110" width="158" height="92" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="99" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Découpage</text>
<text x="99" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">le texte devient</text>
<text x="99" y="175" text-anchor="middle" font-size="11" fill="var(--encre2)">des jetons</text>
<text x="99" y="224" text-anchor="middle" font-size="11" fill="var(--encre2)">un mot rare coûte</text>
<text x="99" y="239" text-anchor="middle" font-size="11" fill="var(--encre2)">plusieurs jetons</text>
<path d="M 178 156 L 188 156" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="192" y="110" width="158" height="92" rx="8" class="b-s3" fill="var(--surface)"/>
<text x="271" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Plongement</text>
<text x="271" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">chaque jeton devient</text>
<text x="271" y="175" text-anchor="middle" font-size="11" fill="var(--encre2)">un vecteur</text>
<text x="271" y="224" text-anchor="middle" font-size="11" fill="var(--encre2)">le sens devient une</text>
<text x="271" y="239" text-anchor="middle" font-size="11" fill="var(--encre2)">position</text>
<path d="M 350 156 L 360 156" fill="none" stroke="var(--s3)" stroke-width="2" marker-end="url(#pointe-s3)"/>
<rect x="364" y="110" width="158" height="92" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="443" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Attention</text>
<text x="443" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">chaque jeton regarde</text>
<text x="443" y="175" text-anchor="middle" font-size="11" fill="var(--encre2)">les précédents</text>
<text x="443" y="224" text-anchor="middle" font-size="11" fill="var(--encre2)">coût quadratique du</text>
<text x="443" y="239" text-anchor="middle" font-size="11" fill="var(--encre2)">contexte</text>
<path d="M 522 156 L 532 156" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="536" y="110" width="158" height="92" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="615" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Distribution</text>
<text x="615" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">un score par jeton</text>
<text x="615" y="175" text-anchor="middle" font-size="11" fill="var(--encre2)">du vocabulaire</text>
<text x="615" y="224" text-anchor="middle" font-size="11" fill="var(--encre2)">le modèle ne choisit pas</text>
<text x="615" y="239" text-anchor="middle" font-size="11" fill="var(--encre2)">encore</text>
<path d="M 694 156 L 704 156" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="708" y="110" width="158" height="92" rx="8" class="b-s2" fill="var(--surface)"/>
<text x="787" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Échantillonnage</text>
<text x="787" y="160" text-anchor="middle" font-size="11" fill="var(--encre2)">un jeton est tiré,</text>
<text x="787" y="175" text-anchor="middle" font-size="11" fill="var(--encre2)">puis tout recommence</text>
<text x="787" y="224" text-anchor="middle" font-size="11" fill="var(--encre2)">température et top-p</text>
<text x="787" y="239" text-anchor="middle" font-size="11" fill="var(--encre2)">agissent ici</text>
<path d="M 790 202 L 790 274 L 99 274 L 99 206" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<text x="445" y="292" text-anchor="middle" font-size="12" fill="var(--s2)">un jeton à la fois : la réponse entière est cette boucle répétée</text>
<text x="440" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="var(--encre)">Un modèle prédit le jeton suivant. Tout le reste en découle.</text>
<text x="440" y="62" text-anchor="middle" font-size="12" fill="var(--encre2)">Il ne consulte rien, ne vérifie rien et ne sait pas qu&#x27;il ignore : d&#x27;où les outils.</text>
<rect x="120" y="316" width="640" height="64" rx="8" class="b-critique" fill="var(--surface)" stroke-dasharray="5 4"/>
<text x="440" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="var(--critique)">Conséquence pour un agent</text>
<text x="440" y="362" text-anchor="middle" font-size="11" fill="var(--encre2)">la fenêtre de contexte est une mémoire de travail payante, pas un disque dur.</text>
</svg>
