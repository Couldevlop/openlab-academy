<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Le script Streamlit est rejoué à chaque interaction">
<title>Le script Streamlit est rejoué à chaque interaction</title>
<defs><marker id="pointe-attenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--attenue)"/></marker><marker id="pointe-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker><marker id="pointe-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s2)"/></marker><marker id="pointe-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s3)"/></marker><marker id="pointe-critique" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--critique)"/></marker><marker id="pointe-bon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bon)"/></marker></defs>
<style>
svg{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;background:var(--surface)}
:root{
  --surface: #fcfcfb;
  --encre: #0b0b0b;
  --encre2: #52514e;
  --attenue: #898781;
  --trait: #c3c2b7;
  --grille: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}
@media (prefers-color-scheme: dark){:root{
  --surface: #1a1a19;
  --encre: #f0efec;
  --encre2: #c3c2b7;
  --attenue: #898781;
  --trait: #383835;
  --grille: #2c2c2a;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --bon: #0ca30c;
  --attention: #fab219;
  --serieux: #ec835a;
  --critique: #d03b3b;
}}
rect[class^='b-']{stroke-width:1.5}
.b-surface{stroke:var(--surface)}
.b-encre{stroke:var(--encre)}
.b-encre2{stroke:var(--encre2)}
.b-attenue{stroke:var(--attenue)}
.b-trait{stroke:var(--trait)}
.b-grille{stroke:var(--grille)}
.b-s1{stroke:var(--s1)}
.b-s2{stroke:var(--s2)}
.b-s3{stroke:var(--s3)}
.b-bon{stroke:var(--bon)}
.b-attention{stroke:var(--attention)}
.b-serieux{stroke:var(--serieux)}
.b-critique{stroke:var(--critique)}
</style>
<rect width="760" height="320" fill="var(--surface)"/>
<text x="380" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--encre)">Un clic ne déclenche pas une fonction : il rejoue la page.</text>
<rect x="170" y="80" width="420" height="44" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="240" y="107" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">charger l&#x27;effectif</text>
<text x="575" y="107" text-anchor="end" font-size="10" fill="var(--encre2)">refait à chaque fois, d&#x27;où le cache</text>
<path d="M 380 124 L 380 136" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="170" y="136" width="420" height="44" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="240" y="163" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">lire les widgets</text>
<text x="575" y="163" text-anchor="end" font-size="10" fill="var(--encre2)">les valeurs choisies par l&#x27;utilisateur</text>
<path d="M 380 180 L 380 192" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="170" y="192" width="420" height="44" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="240" y="219" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">appeler le cœur</text>
<text x="575" y="219" text-anchor="end" font-size="10" fill="var(--encre2)">filtrer, calculer, préparer les séries</text>
<path d="M 380 236 L 380 248" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#pointe-s1)"/>
<rect x="170" y="248" width="420" height="44" rx="8" class="b-s1" fill="var(--surface)"/>
<text x="240" y="275" text-anchor="start" font-size="13" font-weight="600" fill="var(--encre)">afficher</text>
<text x="575" y="275" text-anchor="end" font-size="10" fill="var(--encre2)">chiffres, tableau, graphiques</text>
<path d="M 150 290 L 90 290 L 90 102 L 162 102" fill="none" stroke="var(--s2)" stroke-width="2" marker-end="url(#pointe-s2)"/>
<text x="96" y="310" text-anchor="start" font-size="11" fill="var(--s2)">clic sur un widget</text>
<text x="520" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="var(--encre2)">Ce qui mérite un test vit dans le cœur, pas ici.</text>
</svg>
